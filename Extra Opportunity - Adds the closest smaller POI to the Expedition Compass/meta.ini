nexusDescription="[size=4][b]Description[/b][/size]\n<br />[color=#999999]Add the smaller Points of Interest to the compass in expeditions[/color]\n<br />\n<br />[size=4][b]Main features[/b][/size]\n<br />[color=#999999]Adds a star icon to the compass that indicates the closest smaller POI, which can hold tech scraps or just be something interesting[/color]\n<br />\n<br />The POI will be marked as complete when you spend 3 seconds within 10m of centre of the POI (the star glyph will lose the square frame when you're within range). The next closest small POI will then appear.\n<br />\n<br />This mod also injects into Compass Range Finder, and gives the POI a distance to counter. Make  sure this mod is before CRF in the mod load order"
