nexusDescription="[b][u][size=4]REMINDER: NOW AGGRESIVE WORKS THE BEST WAY. USE IT IF U HAVE GOOD PC.[/size]\n<br />\n<br /> [u][size=5][color=#ff0000]FIXED NEW DMF CRASH, WORKS WITH NEW AND OLD NOW!\n<br />[/color][/size][/u][/u][/b]\n<br />[b][u][color=#ff0000][size=5]FIXED FREEZE BUGS, READ CAREFULLY NEW OPTIONS PLEASE IN CHANGELOG! IF U STILL FREEZING, TRY PACER OR BALANCED!\n<br />ИСПРАВЛЕН БАГ С ФРИЗАМИ, ВНИМАТЕЛЬНО ЧИТАЙТЕ ЧЕЙНДЖЛОГ! ЕСЛИ ЕЩЕ ЛАГАЕТ СТАВЬТЕ ПЕЙСЕР ИЛИ БАЛАНС![/size][/color][/u][/b]\n<br />\n<br />\n<br />[b][size=6]Just install dat shit and sat ty to Rikara ingame[/size]\n<br />[/b] [url=https://www.nexusmods.com/warhammer40kdarktide/mods/993][/url]\n<br />[size=6][b][color=#ff0000]BIG UPDATE(15.08.2026 ADDED NEW INGAME FULLYY CUSTOMIZED TAB MENU Ui, FIXED MEMORY LEAK, MORE STATS!)[/color][/b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/993]Giant update dropped for online scoreboard. [b]ADDED NEW INGAME TAB MENU Ui, FIXED MEMORY LEAK, MORE STATS![/b][/url]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/993][b][color=#ff0000]БОЛЬШОЕ ОБНОВЛЕНИЕ (15.08.2026 ДОБАВЛЕН НОВЫЙ ИГРОВОЙ ИНТЕРФЕЙС ТАБ В ИГРЕ, ПОЛНОСТЬЮ НАСТРАИВАЕМЫЙ, ПОФИКШЕНА УТЕЧКА ПАМЯТИ)[/color][/b]. [/url][url=https://www.nexusmods.com/warhammer40kdarktide/mods/993][b]ДОБАВЛЕН НОВЫЙ ИГРОВОЙ ИНТЕРФЕЙС ТАБ В ИГРЕ, ПОЛНОСТЬЮ НАСТРАИВАЕМЫЙ, ПОФИКШЕНА УТЕЧКА ПАМЯТИ[/b][/url] [/size]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/948][/url]\n<br />[size=4][url=https://www.nexusmods.com/warhammer40kdarktide/mods/948]U also can check my new Skitarii UI FIX/Можете глянуть мой фикс интерфейса скитария. [/url][/size]\n<br />\n<br />[b][size=5]ENGLISH/RUSSIAN DESCRIPTION BELOW:[/size][/b]\n<br />\n<br />[b]FPS Doctor[/b]\n<br />See exactly what is happening to your performance in Darktide, and keep Lua memory growth under control.\n<br />FPS Doctor puts a lightweight, fully customizable panel on screen that tracks your framerate and your script memory in real time. It helps you understand a slowdown instead of guessing: you can see at a glance whether script memory is steadily climbing or your framerate is simply low on a heavy scene, and the built-in cleanup keeps the memory side in check.\n<br />[b]What the overlay shows[/b]\n<br />[list]\n<br />[*]FPS: current and average[/*]\n<br />[*]1% low: your framerate in the worst moments (the real stutter number that average FPS hides)[/*]\n<br />[*]Frame time[/*]\n<br />[*]Lua memory: current usage and how fast it is growing, color-coded (green = stable, yellow = drifting, red = climbing fast)[/*]\n<br />[*]Peak and per-mission growth: the highest memory this session and how much it grew this mission[/*]\n<br />[*]Stutter counter: how many noticeable hitches happened this mission[/*]\n<br />[*]Current cleanup mode[/*]\n<br />[/list]Every line can be toggled on or off individually, so you build exactly the panel you want.\n<br />[b]Per-mission verdict[/b]\n<br />At the end of each mission the mod reports the real retained memory growth in chat with a simple verdict (stable, watch, or likely leak), so you have evidence rather than a hunch.\n<br />[b]Memory cleanup, without the freeze[/b]\n<br />Cleanups are spread across several frames, so they avoid the classic half-second freeze on a large memory load. Prefer the old instant behaviour? One checkbox switches it back.\n<br />Cleanup modes:\n<br />[list]\n<br />[*]Off: diagnostics only[/*]\n<br />[*]On map change: clean once at the start of each mission[/*]\n<br />[*]Balanced (recommended): keep memory tidy during play, plus a cleanup each mission[/*]\n<br />[*]Aggressive: Balanced, plus extra cleanups on a timer and when memory grows large, with early adaptive triggering[/*]\n<br />[/list]A manual cleanup hotkey is available too, for whenever you want one.\n<br />[b]Fully customizable overlay[/b]\n<br />[list]\n<br />[*]Anchor to any screen corner, correct on any resolution and aspect ratio (1080p, 1440p, 4K, 16:10, ultrawide)[/*]\n<br />[*]Position (horizontal and vertical margins) and scale[/*]\n<br />[*]Separate opacity for text and for the background box[/*]\n<br />[*]Hotkey to show or hide the panel (default F6)[/*]\n<br />[*]Optional silent mode with no chat messages\n<br />\n<br />[b]Reset diagnostics[/b]\n<br />The peak, per-mission growth, stutter count and 1% low build up over a whole play session. You can clear them whenever you like and start measuring fresh from that moment:\n<br />[list]\n<br />[*]A reset hotkey clears them instantly (unbound by default, set your own key).[/*]\n<br />[*]Optional auto-reset clears them automatically every few minutes, so the panel always reflects your recent play instead of the whole session. Off by default, with an adjustable interval.[/*]\n<br />[/list][/*]\n<br />[/list][b]Good to know[/b]\n<br />The FPS shown is the game's real rate before Frame Generation (the Lua loop never sees generated frames).\n<br />[b]Requirements[/b]\n<br />[list]\n<br />[*]Darktide Mod Loader[/*]\n<br />[*]Darktide Mod Framework[/*]\n<br />[/list][heading]Русский[/heading]\n<br />[b]FPS Doctor[/b]\n<br />Смотри, что именно происходит с производительностью в Darktide, и держи рост Lua-памяти под контролем.\n<br />FPS Doctor выводит на экран лёгкую, полностью настраиваемую панель, которая в реальном времени отслеживает частоту кадров и скриптовую память. Она помогает понять причину просадки, а не гадать: сразу видно, растёт ли скриптовая память со временем или FPS просто низкий на тяжёлой сцене, а встроенная очистка держит сторону памяти в порядке.\n<br />[b]Что показывает оверлей[/b]\n<br />[list]\n<br />[*]FPS: текущий и средний[/*]\n<br />[*]1% low: частота кадров в худшие моменты (настоящее число дёрганости, которое средний FPS прячет)[/*]\n<br />[*]Время кадра[/*]\n<br />[*]Lua-память: текущий расход и скорость роста, с цветовой индикацией (зелёный = стабильно, жёлтый = дрейфует, красный = быстро растёт)[/*]\n<br />[*]Пик и рост за миссию: наибольший расход за сессию и насколько он вырос за текущую миссию[/*]\n<br />[*]Счётчик рывков: сколько заметных подвисаний было за миссию[/*]\n<br />[*]Текущий режим очистки[/*]\n<br />[/list]Каждую строку можно включить или выключить отдельно, так что ты собираешь панель ровно под себя.\n<br />[b]Вердикт за миссию[/b]\n<br />В конце каждой миссии мод пишет в чат реальный прирост удержанной памяти с простым вердиктом (стабильно, под наблюдением или вероятная утечка), чтобы у тебя были доказательства, а не ощущения.\n<br />[b]Очистка памяти без фриза[/b]\n<br />Очистки растягиваются на несколько кадров, поэтому избегают классического фриза на полсекунды при большой нагрузке на память. Хочешь старое мгновенное поведение? Одна галочка возвращает его.\n<br />Режимы очистки:\n<br />[list]\n<br />[*]Выкл: только диагностика[/*]\n<br />[*]На смене карты: очистка один раз в начале каждой миссии[/*]\n<br />[*]Сбалансированный (рекомендуется): поддержание памяти в порядке во время игры плюс очистка каждую миссию[/*]\n<br />[*]Агрессивный: Сбалансированный плюс дополнительные очистки по таймеру и при сильном росте памяти, с ранним адаптивным запуском[/*]\n<br />[/list]Также есть клавиша ручной очистки на любой момент.\n<br />[b]Полностью настраиваемый оверлей[/b]\n<br />[list]\n<br />[*]Привязка к любому углу экрана, корректно на любом разрешении и соотношении (1080p, 1440p, 4K, 16:10, ultrawide)[/*]\n<br />[*]Положение (отступы по горизонтали и вертикали) и масштаб[/*]\n<br />[*]Раздельная непрозрачность текста и фоновой подложки[/*]\n<br />[*]Клавиша показа или скрытия панели (по умолчанию F6)[/*]\n<br />[*]Опциональный тихий режим без сообщений в чат\n<br />\n<br />[b]Сброс показателей[/b]\n<br />Пик, рост за миссию, счётчик рывков и 1% low копятся за всю игровую сессию. Их можно сбросить в любой момент и начать измерять заново с этой точки:\n<br />[list]\n<br />[*]Клавиша сброса очищает их мгновенно (по умолчанию не назначена, задай свою).[/*]\n<br />[*]Опциональный авто-сброс очищает их автоматически каждые несколько минут, так что панель всегда отражает недавнюю игру, а не всю сессию. По умолчанию выключен, интервал настраивается.[/*]\n<br />[/list][/*]\n<br />[/list][b]Полезно знать[/b]\n<br />Показанный FPS это реальная частота игры до Frame Generation (Lua-цикл не видит сгенерированные кадры).\n<br />[b]Требования[/b]\n<br />[list]\n<br />[*]Darktide Mod Loader[/*]\n<br />[*]Darktide Mod Framework[/*]\n<br />[/list]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/931]ALSO U CAN CHECK MY PSYKER-EFFECTS DISABLER MOD[/url]\n<br />\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/913][/url] "
