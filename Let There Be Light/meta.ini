nexusDescription="[b][size=4]What does this mod do?[/size][/b]\n<br />\n<br />Let There Be Light is a client-side accessibility mod that replaces selected mission environments with the map's standard lighting and shading.\n<br />\n<br />[b]Supported conditions:[/b]\n<br />\n<br />- Power Interruption: choose between no changes, keeping the atmosphere with lights enabled, or using the standard mission environment.\n<br />- Dawn (Expeditions): optionally replace the Dawn environment with standard mission lighting. Disabled by default.\n<br />- Inferno: replace the Inferno environment, including its decorative map fires and ambient fire sounds.\n<br />- Ventilation Purge: replace the foggy environment.\n<br />\n<br />The mod only changes what you see and hear locally. It does [b]not [/b]change mission rules, enemy spawns, AI line of sight, damaging fire, fog hazards, or any server-side gameplay.\n<br />\n<br />[b]Who is it for?[/b]\n<br />\n<br />Useful for players who don't want to play in darkness, fog, intense colour grading, or visual clutter, and for anyone playing in a bright/sunny environment. Useful for visually impaired players.\n<br />\n<br />[b]Important:[/b]\n<br />\n<br />Environment changes are applied when a mission loads. Change the options before starting a mission; changes made during a mission apply to the next one."
