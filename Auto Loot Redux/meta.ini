nexusDescription="[size=5][b]QoL Changes &amp; Additions[/b] to [url=https://www.nexusmods.com/warhammer40kdarktide/mods/375]AutoLoot[/url] by user [url=https://www.nexusmods.com/warhammer40kdarktide/users/90133918]d3fallt[/url].[/size]\n<br />\n<br />[list]\n<br />[*]Pick which stimms to auto-loot. Turn off the types you do not want, and the mod leaves them on the floor.  Each stimm's toggle explains exactly what the stimm itself does, with numbers, since the game never tells you.  If your stimm slot is empty, the mod grabs any enabled stimm regardless of priority. If you are already holding one, it only swaps when the stimm on the ground has a better set priority than the one in your hand. [/*]\n<br />[*]Per class stimm settings. As an addition toggle, when on, makes the stimm settings belong to the class you are currently playing. Each class remembers its own stimm toggles and priorities, the menu always shows your current character's list, and switching character swaps the list automatically. A class you have never touched starts from the default order of Med, Combat, Celerity, Concentration.[/*]\n<br />[*]Distinguish between large and small ammo packs. So you can define at what threshold each should be picked up. Clips can now be set at a higher percent for convenience while bags can be set lower to leave them for teammates.[/*]\n<br />[*]Automatic ammo thresholds, off by default. When switched on, the mod ignores the two ammo sliders and instead takes an ammo pickup only when the full amount fits into your spare ammo, so not a single round is ever wasted. This also accounts for Havoc missions that reduce ammo pickups, with nothing to change when switching between Havoc and normal missions. Your slider values are untouched and come straight back if you turn it off. H/T [url=https://www.nexusmods.com/profile/alphago42]alphago[/url][/*]\n<br />[*]Added an option to pickup event items. Future event collectibles should be picked up automatically without needing a mod update, as long as the game files them under the same category it has used for recent events. [/*]\n<br />[*]The mod will now work with the HUD hidden. The original AutoLoot relied on the game's interaction popup to detect loot, so hiding the HUD switched the mod off. It now reads what you are looking at straight from the game itself, so it works whether the HUD is visible or not. [/*]\n<br />[*]The mod gets slightly more willing to take ammo. A full magazine used to pad the reading by a few percent, so pickups near the threshold got skipped. Now they're taken. [/*]\n<br />[*]I have also addressed a problem from the original mod wherein it could still loot items or at thresholds you had not set it to loot. A plethora of additional measures have been added to try address several issues that can cause this to happen. This description page would quickly balloon if I were to go into detail on all of them, but they can be found if you care to rummage the changelog.[/*]\n<br />[/list]\n<br />[b][size=4]Installation instructions[/size][/b]\n<br />\n<br />Delete the original AutoLoot and install this version instead. NOT as-well-as. ModManager compatible.\n<br />\n<br />In order that a transition from the original Auto Loot is as seamless as possible, my version will use any existing locally saved settings it finds from it (which never get deleted along with the mod, on an uninstallation). The only downside to that is; if you have used and toggled off the original mod for whatever reason; Redux will inherit it's saved 'Off' state. Worth checking that it is toggled on, in your mod options, if you cannot find \"Auto Loot\" in your mod list after installation.\n<br />\n<br />[b]Please be aware that my removal of this mod from the nexus may occur.[/b]\n<br />The original author may decide they want to implement changes into the original, which I would support.\n<br />\n<br />\n<br />[center][b][u][size=4]Shout Outs[/size][/u][/b]\n<br />\n<br />50% of all downloads for my Redux series of mods go back to their creators.\n<br />The [url=https://www.nexusmods.com/profile/d3fallt]original[/url] AutoLoot author deserves full credit for the mod itself.\n<br />I'm only adding on top of their existing work.\n<br />I would not be here doing this at all were it not for what they built.\n<br />\n<br />[size=5][b]If you like this you might like my new solo mod venture.[/b][/size]\n<br />\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/1115][img]https://staticdelivery.nexusmods.com/mods/4943/images/1115/1115-1785262311-32572087.png[/img][/url][/center]\n<br />\n<br />"
