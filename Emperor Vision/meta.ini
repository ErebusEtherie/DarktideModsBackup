nexusDescription="[b][size=5]Description[/size][/b]\n<br />Emperor Vision adds a clean, high-performance enemy ESP system to Darktide, so hostile targets stay clear and readable at a glance during combat.\n<br />\n<br />It is built for practical gameplay and stable long sessions, with per-enemy controls, real-time updates, lightweight outline-only rendering, flexible line-of-sight logic, and advanced tag compatibility for ally smart tags, Veteran smart tags, and companion command tags.\n<br />\n<br />[b][size=5]Included features[/size][/b]\n<br />- Per-enemy outline settings for color, visibility, and distance\n<br />- Dedicated settings entries for all supported enemy breeds\n<br />- Real-time setting updates without restarting the game\n<br />- Global override mode for one shared visibility and distance across all enemies\n<br />- Quick toggle keybind to enable or disable Emperor Vision in-game\n<br />- Force outline visibility option to prevent global outline disabling\n<br />- Global LOS toggle for default line-of-sight behavior\n<br />- Per-enemy LOS behavior mode with three options: Global, Enabled, Disabled\n<br />- Preserve custom color on ally smart tag (separate toggle)\n<br />- Preserve custom color on Veteran smart tag (separate toggle)\n<br />- Preserve custom color on companion command tag (separate toggle, for Arbites dog and Skitarii servo skull command marks)\n<br />- LOS plus ping behavior with Preserve disabled: active ping color is never overwritten by custom color until the ping expires\n<br />- LOS plus ping behavior with Preserve enabled and LOS active for that enemy: custom color in direct sight, ping color through walls, automatic return to custom color when the target is visible again\n<br />- LOS-disabled-per-enemy behavior: that enemy stays visible through walls while keeping consistent tag and color handling\n<br />\n<br />[b][size=5]Customization[/size][/b]\n<br />- Enable or disable each enemy type individually\n<br />- Set custom RGB outline color per enemy\n<br />- Set custom visibility and distance per enemy\n<br />- Set LOS behavior per enemy: Global, Enabled, or Disabled\n<br />- Enable or disable the global LOS default behavior\n<br />- Enable global visibility and distance override when needed\n<br />- Enable or disable ally smart-tag color preservation independently\n<br />- Enable or disable Veteran smart-tag color preservation independently\n<br />- Enable or disable companion command-tag color preservation independently\n<br />\n<br />[b][size=5]Performance and stability[/size][/b]\n<br />- Outline-only approach (no extra mesh pass)\n<br />- Cached distance checks and tracked-unit updates for lower overhead\n<br />- Faster tracked-unit refresh and full-scan cadence for snappier reaction\n<br />- Lightweight LOS caching for responsive behavior with low raycast overhead\n<br />- Cached effective LOS mode per enemy for minimal runtime overhead\n<br />- Safe hostile filtering and cleanup of stale units\n<br />- Designed to avoid unnecessary outline add/remove churn\n<br />- Selective tag handling (only specific tag outline types are intercepted)\n<br />- Ping-state tracking to keep color behavior consistent across LOS and visibility changes\n<br />\n<br />[b][size=5]Installation[/size][/b]\n<br />1. Extract the emperor_vision folder into your Darktide mods directory.\n<br />2. Add emperor_vision to mod_load_order.txt.\n<br />3. Launch the game and open Mod Options (F4 by default).\n<br />4. Configure per-enemy, LOS, tag-related, or global settings as desired.\n<br />\n<br />[b][size=5]Requirements[/size][/b]\n<br />- Darktide Mod Loader (DML)\n<br />- Darktide Mod Framework (DMF)\n<br />- Alf's DMF Mod Settings Extensions (required for per-enemy tabs and advanced per-enemy settings UI)"
