nexusDescription="It always annoyed me how you cannot hear any of the radio chatter within the menus whilst in the hub area, and when you can hear it - accessing any menu will instantly cut the dialogue off. Despite the radios containing a large portion of the lore within Darktide.\n<br />\n<br />Well, let me introduce you to Mourningstar Dialogue Improved - which addresses these exact issues.\n<br />\n<br />Quick rundown of the main features:\n<br />[list]\n<br />[*]Allows hearing radio chatter, lore, announcements and conversations within menus whilst in the Mourningstar Hub area.[/*]\n<br />[*]Prevents interruptions to dialogue whilst entering any menu whilst in the Mourningstar Hub area.[/*]\n<br />[*]Adds an option to completely disable the radio chatter within the Mourningstar (If it's getting on your nerves)[/*]\n<br />[/list]\n<br />\n<br />[img]https://europe1.discourse-cdn.com/flex013/uploads/fatshark/original/3X/1/d/1d61096b3cb70207ca288c8670d809f9e2afbfef.png[/img]﻿\n<br />\n<br />[size=3]If you would like more QoL improvements, check out some of my other mods:[/size]\n<br />\n<br />[size=4][b]\"Improved\" Series[/b][/size]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/344]How Did I Get That[/url]﻿\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/347]Character Cosmetics View Improved[/url]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/346]Weapon Cosmetics View Improved\n<br />[/url][url=https://www.nexusmods.com/warhammer40kdarktide/mods/348]Commodore's Vestures Improved\n<br />[/url][url=https://www.nexusmods.com/warhammer40kdarktide/mods/355]Penance View Improved\n<br />[/url][url=https://www.nexusmods.com/warhammer40kdarktide/mods/360/]Rolling Steel Timer Improved[/url][url=https://www.nexusmods.com/warhammer40kdarktide/mods/382]\n<br />Mourningstar Dialogue Improved[/url]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/809]Enemies Improved[/url]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/864]Alf's Mod Settings Extension[/url]\n<br />\n<br />[size=4][b]\"Markers\" Series\n<br />[/b][/size][i]All-in-One:[/i]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/447]Markers Improved All-in-One[/url]﻿\n<br />\n<br />[size=2]All of my mods are designed to fit seamlessly together, and improve each other.[/size]\n<br />\n<br />\n<br />\n<br />[url=https://ko-fi.com/alfthebigheaded][img]https://ko-fi.com/img/githubbutton_sm.svg[/img][/url]\n<br />"
