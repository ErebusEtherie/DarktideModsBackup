nexusDescription="[size=5][b]Respawn Rewind[/b][/size]\n<br />\n<br />When a teammate goes down, this marks where they will respawn and how far away it is. A second marker shows the point to stay behind if you want that respawn to move closer.\n<br />\n<br />Client-side. It only changes what you see.\n<br />\n<br />[size=4][b]Features[/b][/size]\n<br />[list]\n<br />[*]A respawn marker, light blue. On the spot where a dead teammate will come back, with the distance to it.[/*]\n<br />[*]A hold-back marker, green. Stay behind it and the respawn moves back to a closer spot. It is hidden when there is nothing closer to pull to.[/*]\n<br />[*]Both markers only show while somebody is down or waiting to respawn, and clear the moment they are back on their feet.[/*]\n<br />[*]The spot it marks is the one the game will actually use, based on the game's own rule for picking it.[/*]\n<br />[/list]\n<br />[size=4][b]Options[/b]:[/size]\n<br /> \n<br />[list]\n<br />[*]Show run-back point[/*]\n<br />[*]Marker size[/*]\n<br />[*]Show distance on markers[/*]\n<br />[/list]\n<br />[size=4][b]Requirements[/b][/size]\n<br />[list]\n<br />[*][i]Darktide Mod Loader[/i][/*]\n<br />[*]Darktide Mod Framework (DMF)[/*]\n<br />[/list]\n<br />[size=4][b]Installation[/b][/size]\n<br />[list]\n<br />[*]Vortex (recommended): use the \"Mod Manager Download\" button, or download and install the archive.[/*]\n<br />[*]Manual: extract the RespawnRewind folder into your Darktide mods folder, then add RespawnRewind to mods/mod_load_order.txt.[/*]\n<br />[/list]\n<br />[size=4][b]Credits[/b][/size]\n<br />[list]\n<br />[*][i][b]LAUR3HTE[/b], [url=https://www.nexusmods.com/warhammer40kdarktide/mods/687]https://www.nexusmods.com/warhammer40kdarktide/mods/687[/url], the respawn beacon model was understood by reading it. No RitualZones code or assets are included; the implementation here is original and built on the game's own systems.[/i][/*]\n<br />[/list]"
