nexusDescription="[center][color=#D4D4D8][size=4][b]DT Realms Ghost Host[/b][/size]\n<br />[i]v0.1.1 by Rikara[/i][/color][/center]\n<br />\n<br />\n<br />[center][color=#D4D4D8][size=4][b]English[/b][/size][/color][/center]\n<br />[color=#D4D4D8]The host of a Realms session (the LAN server) plays as an invisible spectator. The mod just keeps the host from spawning a body — for the game that is the regular \"player without a body\" state, so everything else is handled by the game itself.\n<br />\n<br />[size=4][b]Why[/b][/size]\n<br />Keep the Realms server on a second machine (a laptop, an old PC) and connect to it from your main PC as a regular client. The hosting machine spends its performance on simulating the mission, so playing on it is uncomfortable; this way your main PC gets the same FPS as any other player in the squad.\n<br />[b]Important:[/b] in static camera mode (the default) the host machine does not render the game world at all, only the simulation is left. So a fairly weak machine is enough for the server: a laptop or an old PC that is no longer comfortable to play on.\n<br />\n<br />[size=4][b]The host in a mission[/b][/size][/color]\n<br />\n<br />[list]\n<br />[*][color=#D4D4D8]No body is spawned; enemies do not see or attack the host.[/color][/*]\n<br />[*][color=#D4D4D8]The host is not counted as a squad member: elevators, doors and the extraction airlock trigger from the guests alone, nobody has to wait for the host.[/color][/*]\n<br />[*][color=#D4D4D8]The mission ends exactly when the real squad is wiped or extracts — the host does not keep it running.[/color][/*]\n<br />[*][color=#D4D4D8]No rescue cage appears for the host, so allies never have to rescue them.[/color][/*]\n<br />[*][color=#D4D4D8]The host can load into the map before the guests; there is no instant mission failure.[/color][/*]\n<br />[*][color=#D4D4D8]AFK auto-kick ignores the host.[/color][/*]\n<br />[/list][color=#D4D4D8]\n<br />[size=4][b]Requirements and installation[/b][/size]\n<br />Darktide Mod Framework, SoloPlay and Realms (the LAN hosting mod by deluxghost). Ghost Host loads AFTER them.\n<br />Only the host has to install it: the gameplay part is server-side and is replicated to clients on its own. Guests need the mod only for cosmetics: the HUD team panel has 4 slots, and in a session of five the ghost can push a live ally out of it; with the mod the ghost is hidden from the panel.[/color]\n<br />\n<br />[list]\n<br />[*]Unpack the DTRealmsGhostHost folder into &lt;game folder&gt;/mods/.[/*]\n<br />[*]Add the line DTRealmsGhostHost to mods/mod_load_order.txt after SoloPlay and Realms.[/*]\n<br />[*][color=#D4D4D8]In the Realms settings raise Max players to at least 5: the host occupies a player slot, otherwise there is no room for the fourth guest.[/color][/*]\n<br />[/list][color=#D4D4D8][size=4][b]Settings[/b][/size][/color]\n<br />\n<br />[list]\n<br />[*][color=#D4D4D8]Host camera: \"Static (cheapest)\" (default) — the world is not rendered on the host machine, the lightest mode; or \"Spectate the squad\" — watch the players like a dead player, the target is switched with the spectate key.[/color][/*]\n<br />[*][color=#D4D4D8]\"Escape opens the system menu on the blank screen\" (on by default): on the empty screen of static mode the game swallows Esc, so the mod opens the menu itself. Needed to stop the server without killing the game.[/color][/*]\n<br />[*][color=#D4D4D8]\"Disable the loading overlay (renders the world)\" (off by default) — a fallback: Esc works as usual, but the host renders the world again.[/color][/*]\n<br />[*][color=#D4D4D8]\"Hide the ghost from the team HUD\"; \"Do not count the ghost in Realms' bot target\"; \"Announce in chat when ghosting starts\".[/color][/*]\n<br />[*][color=#D4D4D8]\"Allow in Survival / Expedition (untested)\" — off by default: these modes wait for a mission buff pick from every player, and a host without a body cannot pick one.[/color][/*]\n<br />[/list][color=#D4D4D8]\n<br />[size=4][b]Chat commands[/b][/size][/color]\n<br />\n<br />[code]/ghosthost status\n<br />/ghosthost menu open the system menu\n<br />/ghosthost join leave ghost mode temporarily (you spawn as a regular dead player, in a cage)\n<br />/ghosthost ghost return to ghost mode[/code][color=#D4D4D8]\n<br />[size=4][b]Limitations[/b][/size][/color]\n<br />\n<br />[list]\n<br />[*][color=#D4D4D8]The mission simulation (AI, physics, spawns) still runs on the host machine — the mod only removes the client-side load.[/color][/*]\n<br />[*][color=#D4D4D8]The second machine needs its own copy of the game and its own account.[/color][/*]\n<br />[*][color=#D4D4D8]Regular missions and Havoc are tested, Survival/Expedition are not.[/color][/*]\n<br />[/list]\n<br />\n<br />\n<br />[center][color=#D4D4D8][size=4][b]Русский[/b][/size][/color][/center]\n<br />[color=#D4D4D8]Хост Realms-сессии (LAN-сервер) играет невидимым наблюдателем. Мод лишь не даёт хосту заспавнить тело — для игры это штатное состояние «игрок без тела», поэтому всё остальное она делает сама.\n<br />\n<br />[size=4][b]Зачем[/b][/size]\n<br />Держать сервер Realms на второй машине (ноутбук, старый ПК) и подключаться к нему с основного ПК обычным клиентом. Хостящая машина тратит производительность на симуляцию миссии, играть на ней некомфортно; так на основном ПК FPS такой же, как у любого другого игрока в отряде.\n<br />[b]Важно:[/b] в режиме статичной камеры (он по умолчанию) машина хоста вообще не рендерит игровой мир, ей остаётся только симуляция. Поэтому для сервера годится и относительно слабая машина — ноутбук или старый ПК, на котором играть уже некомфортно.\n<br />\n<br />[size=4][b]Хост в миссии[/b][/size][/color]\n<br />\n<br />[list]\n<br />[*][color=#D4D4D8]Тело не спавнится, враги хоста не видят и не атакуют.[/color][/*]\n<br />[*][color=#D4D4D8]Хост не считается членом отряда: лифты, двери и шлюз эвакуации срабатывают от одних гостей, ждать хоста не нужно.[/color][/*]\n<br />[*][color=#D4D4D8]Миссия заканчивается ровно тогда, когда полёг или эвакуировался реальный отряд — хост её не «удерживает».[/color][/*]\n<br />[*][color=#D4D4D8]Клетка для спасения у хоста не появляется, союзникам его спасать не нужно.[/color][/*]\n<br />[*][color=#D4D4D8]Хост может зайти на карту раньше гостей — мгновенного провала не будет.[/color][/*]\n<br />[*][color=#D4D4D8]Автокик за бездействие хоста не трогает.[/color][/*]\n<br />[/list][color=#D4D4D8]\n<br />[size=4][b]Требования и установка[/b][/size]\n<br />Darktide Mod Framework, SoloPlay и Realms (мод LAN-хостинга от deluxghost). Ghost Host грузится ПОСЛЕ них.\n<br />Ставить обязательно только хосту: геймплейная часть серверная и клиентам реплицируется сама. Гостям мод нужен лишь ради косметики: панель команды в HUD рассчитана на 4 слота, и в сессии из пяти участников призрак может занять место живого союзника; с модом он из панели исчезает.[/color]\n<br />\n<br />[list]\n<br />[*]Распаковать папку DTRealmsGhostHost в &lt;папка игры&gt;/mods/.[/*]\n<br />[*]Добавить строку DTRealmsGhostHost в mods/mod_load_order.txt после SoloPlay и Realms.[/*]\n<br />[*][color=#D4D4D8]В настройках Realms поднять Max players минимум до 5: хост занимает слот игрока, иначе четвёртому гостю не хватит места.[/color][/*]\n<br />[/list][color=#D4D4D8][size=4][b]Настройки[/b][/size][/color]\n<br />\n<br />[list]\n<br />[*][color=#D4D4D8]Камера хоста: «Статичная (дешевле всего)» (по умолчанию) — мир на машине хоста не рендерится, самый лёгкий режим; либо «Наблюдать за отрядом» — смотреть за игроками как мёртвый игрок, цель переключается клавишей наблюдения.[/color][/*]\n<br />[*][color=#D4D4D8]«Esc открывает системное меню на пустом экране» (по умолчанию включено): на пустом экране статичного режима игра проглатывает Esc, и мод открывает меню сам. Нужно, чтобы остановить сервер, не убивая игру.[/color][/*]\n<br />[*][color=#D4D4D8]«Отключить оверлей загрузки (мир рендерится)» (по умолчанию выключено) — запасной вариант: Esc работает как обычно, но хост снова рендерит мир.[/color][/*]\n<br />[*][color=#D4D4D8]«Скрывать призрака в HUD команды»; «Не учитывать призрака в цели по ботам Realms»; «Сообщать в чат о включении призрака».[/color][/*]\n<br />[*][color=#D4D4D8]«Разрешить в Survival / Expedition (не проверено)» — по умолчанию выключено: эти режимы ждут выбор mission buff от каждого игрока, а хост без тела выбрать не может.[/color][/*]\n<br />[/list][color=#D4D4D8]\n<br />[size=4][b]Команды чата[/b][/size][/color]\n<br />\n<br />[code]/ghosthost статус\n<br />/ghosthost menu открыть системное меню\n<br />/ghosthost join временно выйти из режима призрака (заспавнишься как обычный мёртвый игрок, в клетке)\n<br />/ghosthost ghost вернуться в режим призрака[/code][color=#D4D4D8]\n<br />[size=4][b]Ограничения[/b][/size][/color]\n<br />\n<br />[list]\n<br />[*][color=#D4D4D8]Симуляция миссии (ИИ, физика, спавны) всё равно считается на машине хоста — мод убирает только клиентскую нагрузку.[/color][/*]\n<br />[*][color=#D4D4D8]На второй машине нужна своя копия игры и свой аккаунт.[/color][/*]\n<br />[*][color=#D4D4D8]Обычные миссии и Havoc проверены, Survival/Expedition — нет.[/color][/*]\n<br />[/list]"
