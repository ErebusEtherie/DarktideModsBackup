nexusDescription="\n<br />[center][size=6][b]DTLogs[/b][/size]\n<br />\n<br />[size=4]Detailed combat and mission logging for Warhammer 40,000: Darktide[/size]\n<br />\n<br />[url=https://dtlogs.com]DTLogs Website[/url] | [url=https://discord.gg/zrfrJMuhc]Community Discord[/url]\n<br />[/center]\n<br />\n<br />[heading]Description[/heading]\n<br />\n<br />DTLogs is a combat and mission event logger for Warhammer 40,000: Darktide.\n<br />\n<br />The mod records a detailed timeline of mission events and saves it as a structured JSONL file. These files can be used for advanced combat analysis, debugging, statistics, and mission reports.\n<br />\n<br />DTLogs is designed to work with the companion website:\n<br />\n<br />[url=https://dtlogs.com]https://dtlogs.com[/url]\n<br />\n<br />\n<br />\n<br />The website can use DTLogs mission files to create detailed reports, player comparisons, damage charts, timelines, build information, and other combat statistics.\n<br />\n<br />DTLogs does not change weapon balance, enemy behavior, player abilities, mission difficulty, or gameplay mechanics. It only observes available game events and writes them to a local file.\n<br />[heading]Main features[/heading]\n<br />\n<br />[list]\n<br />[*]Records a complete chronological mission timeline in JSONL format[/*]\n<br />[*]Records player damage and attacks[/*]\n<br />[*]Records kills and enemy types[/*]\n<br />[*]Records melee, ranged, explosive, buff, burn, and other damage profiles[/*]\n<br />[*]Records critical hits and weakspot hits[/*]\n<br />[*]Records blocked, dodged, absorbed, and friendly-fire attack results[/*]\n<br />[*]Records damage received by players[/*]\n<br />[*]Tracks player health changes and health restoration[/*]\n<br />[*]Tracks toughness loss and recovery[/*]\n<br />[*]Records player dodges and suppression events[/*]\n<br />[*]Records player buffs and buff stacks[/*]\n<br />[*]Records coherency enter and exit events[/*]\n<br />[*]Records ability usage and ability charge changes[/*]\n<br />[*]Records player state changes, including incapacitation-related states[/*]\n<br />[*]Records interactions such as revives, rescues, pickups, and health stations[/*]\n<br />[*]Records weapon and equipment slot changes[/*]\n<br />[*]Records player profiles, archetypes, talents, weapons, perks, traits, and loadouts[/*]\n<br />[*]Records enemy deaths, hit zones, positions, and damage profiles[/*]\n<br />[*]Records attacker, target, and hit positions when available[/*]\n<br />[*]Creates one separate log file for each mission[/*]\n<br />[/list]==================================================\n<br />[b]AUTOMATIC ONLINE UPLOAD[/b]\n<br />==================================================\n<br />\n<br />\n<br />Automatic online upload is enabled by default.\n<br />\n<br />After a mission finishes, DTLogs can automatically send the completed log to DTLogs.com.\n<br />\n<br />By default:\n<br />\n<br />    Online Upload: Enabled\n<br />    Upload Mode: Successful missions only\n<br />\n<br />This means normal successful mission completions are automatically uploaded, while failed missions remain stored locally.\n<br />\n<br />You can change this behavior at any time in:\n<br />\n<br />    Mod Options → DTLogs\n<br />\n<br />\n<br />Available upload modes:\n<br />\n<br />• Successful missions only\n<br />  Only missions completed with a victory are uploaded automatically.\n<br />  This is the default setting.\n<br />\n<br />• All completed missions\n<br />  Both successful and failed completed missions are uploaded.\n<br />\n<br />• Automatic upload disabled\n<br />  Logs continue to be recorded and saved locally, but nothing is sent automatically to DTLogs.com.\n<br />\n<br />\n<br />IMPORTANT:\n<br />\n<br />Changing the online upload setting does NOT disable local logging.\n<br />\n<br />DTLogs will continue to create the local JSONL mission file regardless of the automatic upload policy.\n<br />\n<br />\n<br />[img]https://staticdelivery.nexusmods.com/mods/4943/images/1148/1148-1786889963-691934532.png[/img]\n<br />Suggested screenshot:\n<br />Show:\n<br />- Automatic Upload enabled\n<br />- Successful missions only selected\n<br />- Account status\n<br />\n<br />Suggested caption:\n<br />Automatic upload and upload policy can be configured directly from the DTLogs Mod Options menu.\n<br />\n<br />==================================================\n<br />[b]WHAT HAPPENS IF AN UPLOAD FAILS?[/b]\n<br />==================================================\n<br />\n<br />Your mission log is not lost if DTLogs.com cannot be reached.\n<br />\n<br />DTLogs always saves the mission locally first.\n<br />\n<br />If an automatic upload fails because of a temporary network or server problem:\n<br />\n<br />• The JSONL file remains safely stored on your computer.\n<br />• DTLogs keeps the log in its upload queue.\n<br />• The addon automatically retries the upload later.\n<br />• Repeated retries happen silently.\n<br />• DTLogs does not spam the chat every minute with the same error.\n<br />\n<br />The first failure is reported once so you know what happened.\n<br />\n<br />If a later retry succeeds, DTLogs will notify you that the upload completed.\n<br />\n<br />This allows online uploading to recover automatically from temporary connection problems without affecting the local mission log.\n<br />\n<br />==================================================\n<br />[b]LINKING DTLOGS TO YOUR ACCOUNT[/b]\n<br />==================================================\n<br />\n<br />A DTLogs.com account is NOT required for automatic uploads.\n<br />\n<br />There are two upload identities:\n<br />\n<br />\n<br />1. LINKED ACCOUNT\n<br />\n<br />If you link DTLogs to your DTLogs.com account, automatically uploaded logs are attributed to your account.\n<br />\n<br />They can then appear under:\n<br />\n<br />    My Logs\n<br />\n<br />on DTLogs.com.\n<br />\n<br />\n<br />2. ANONYMOUS\n<br />\n<br />If the addon is not linked to an account, automatic uploading still works.\n<br />\n<br />The report is uploaded anonymously and the uploader is shown as:\n<br />\n<br />    Anonymous\n<br />\n<br />\n<br />This means you can use DTLogs online immediately without creating an account.\n<br />\n<br />Account linking is only required if you want uploaded logs to be associated with your DTLogs identity and collected in My Logs.\n<br />\n<br />\n<br />[img]https://staticdelivery.nexusmods.com/mods/4943/images/1148/1148-1786890851-1268210103.png[/img]\n<br />\n<br />DTLogs.com account page with the Addon Upload Key section.\n<br />\n<br />IMPORTANT:\n<br />Do not expose the complete real key in the screenshot.\n<br />Blur or replace most of the key.\n<br />\n<br />Suggested caption:\n<br />Generate an Addon Upload Key from your DTLogs.com account.\n<br />\n<br />==================================================\n<br />[b]HOW TO LINK YOUR ACCOUNT[/b]\n<br />==================================================\n<br />\n<br />1. Sign in to:\n<br />\n<br />https://dtlogs.com\n<br />\n<br />2. Open your account page.\n<br />\n<br />3. Generate an Addon Upload Key.\n<br />\n<br />The key begins with:\n<br />\n<br />    dtl_up_\n<br />\n<br />4. Start Darktide.\n<br />\n<br />5. Enter:\n<br />\n<br />    /dtlogs_link &lt;your_upload_key&gt;\n<br />\n<br />Example:\n<br />\n<br />    /dtlogs_link dtl_up_...\n<br />\n<br />Do not share your complete upload key publicly.\n<br />\n<br />The key is used to associate uploads from your local addon with your DTLogs.com account.\n<br />\n<br />\n<br />You can also pass text or a link containing a valid DTLogs upload key to /dtlogs_link.\n<br />\n<br />\n<br />After linking, check the current status with:\n<br />\n<br />    /dtlogs_link_status\n<br />\n<br />\n<br />DTLogs will report whether the addon currently has a linked account key.\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />Link the addon once and future automatic uploads will be attributed to your DTLogs account.\n<br />\n<br />\n<br />==================================================\n<br />[b]ACCOUNT STATUS IN MOD OPTIONS[/b]\n<br />==================================================\n<br />\n<br />The DTLogs Mod Options menu also shows whether an account is currently linked.\n<br />\n<br />The status is displayed as:\n<br />\n<br />    Linked\n<br />\n<br />or:\n<br />\n<br />    Not linked\n<br />\n<br />\n<br />The menu also provides an account-linking instruction and an option to disconnect the currently stored account key.\n<br />\n<br />This makes it possible to manage the important online-upload settings without editing configuration files manually.\n<br />\n<br />\n<br />\n<br />The DTLogs settings menu shows the current account-link status and provides account management options.\n<br />\n<br />\n<br />==================================================\n<br />[b]DISCONNECTING YOUR ACCOUNT[/b]\n<br />==================================================\n<br />\n<br />You can disconnect DTLogs from your account either from the Mod Options menu or with:\n<br />\n<br />    /dtlogs_unlink\n<br />\n<br />\n<br />WARNING:\n<br />\n<br />Disconnecting removes the locally stored upload key.\n<br />\n<br />If you want to link the addon again later, you will need to enter an Upload Key again.\n<br />\n<br />\n<br />Disconnecting does NOT:\n<br />\n<br />• delete your DTLogs.com account;\n<br />• delete previously uploaded reports;\n<br />• delete local JSONL files;\n<br />• disable automatic uploading.\n<br />\n<br />\n<br />If automatic uploading remains enabled after disconnecting, future logs will be uploaded anonymously.\n<br />\n<br />\n<br />==================================================\n<br />[b]STARTUP STATUS[/b]\n<br />==================================================\n<br />\n<br />When DTLogs initializes, it reports the current online-upload configuration.\n<br />\n<br />For example:\n<br />\n<br />    DTLogs: Online log upload is enabled for successful missions only.\n<br />\n<br />It also reports whether an account is linked.\n<br />\n<br />If no account is linked, DTLogs explains that online uploads will be anonymous.\n<br />\n<br />This makes it easy to confirm your upload configuration before playing a mission.\n<br />\n<br />[heading]Output files[/heading]\n<br />If you want to upload files manually, you can do this using the files saved by the addon.\n<br />Mission logs are saved locally to:\n<br />\n<br />[code]\n<br />%APPDATA%&#92;Fatshark&#92;Darktide&#92;DTLogs&#92;[/code]Each mission creates a separate file similar to:\n<br />\n<br />[code]\n<br />mission_1785023845_fm_armoury_1785023845-434650.jsonl[/code]JSONL means that every line contains one JSON event. This format allows large mission logs to be processed without loading the entire file into memory.\n<br />\n<br />Long missions can produce files containing tens of thousands of events and may reach several dozen megabytes. Old files are not deleted automatically.\n<br />\n<br />[heading]DTLogs website[/heading]\n<br />\n<br />The generated JSONL files are intended for use with the DTLogs companion website:\n<br />\n<br />[url=https://dtlogs.com]https://dtlogs.com[/url]\n<br />\n<br />Upload a completed mission log to generate a readable combat report.\n<br />\n<br />Depending on the current website version, reports may include:\n<br />\n<br />[list]\n<br />[*]Team and individual damage[/*]\n<br />[*]Damage per second[/*]\n<br />[*]Kills and enemy breakdowns[/*]\n<br />[*]Critical-hit and weakspot statistics[/*]\n<br />[*]Damage by weapon or damage profile[/*]\n<br />[*]Player builds and equipment[/*]\n<br />[*]Health, toughness, and combat timelines[/*]\n<br />[*]Defensive actions and team statistics[/*]\n<br />[/list]The website is a separate companion project. Local JSONL logging works independently and does not require a DTLogs account.\n<br />\n<br />[heading]Installation instructions[/heading]\n<br />You can use several download options. \n<br />\n<br />[b]1). Automatic installation. [/b]\n<br />Use the Vortex application and install the add-on automatically, as well as automatically or manually update the add-on through the Vortex application.\n<br />\n<br />[b]2). Manual installation:[/b]\n<br />\n<br />[list=1]\n<br />[*]Close Darktide.[/*]\n<br />[*]Extract the [b]DTLogs[/b] folder into your Darktide mods directory.[/*]\n<br />[*]Open [b]mod_load_order.txt[/b].[/*]\n<br />[*]Add the following line:[/*]\n<br />[/list][code]\n<br />DTLogs[/code][list=1]\n<br />[*]Save the file.[/*]\n<br />[*]Start Darktide.[/*]\n<br />[*]Check the Darktide Mod Framework menu and confirm that DTLogs is listed.[/*]\n<br />[*]Start a real mission. The Mourningstar is intentionally ignored.[/*]\n<br />[/list]After the mission starts, DTLogs should create a new JSONL file in:\n<br />\n<br />[code]\n<br />%APPDATA%&#92;Fatshark&#92;Darktide&#92;DTLogs&#92;[/code][heading]Requirements[/heading]\n<br />\n<br />[list]\n<br />[*][url=LINK_TO_DARKTIDE_MOD_LOADER]Darktide Mod Loader[/url][/*]\n<br />[*][url=LINK_TO_DARKTIDE_MOD_FRAMEWORK]Darktide Mod Framework[/url][/*]\n<br />[*]Permission for Darktide to write files to the user AppData directory[/*]\n<br />[*]Sufficient free storage space for mission logs[/*]\n<br />[/list]An account on the DTLogs website is not required to record local log files.\n<br />\n<br />[heading]Commands[/heading]\n<br />\n<br />DTLogs includes the following diagnostic commands:\n<br />\n<br />[code]\n<br />/dtlogs_status[/code][b]/dtlogs_status[/b] displays the current logger status.\n<br />\n<br />\n<br />\n<br />[heading]Privacy notice[/heading]\n<br />\n<br />Mission logs may contain:\n<br />\n<br />[list]\n<br />[*]Player character names[/*]\n<br />[*]Player identifiers used to associate events inside a mission[/*]\n<br />[*]Player builds and equipment[/*]\n<br />[*]Combat actions and performance statistics[/*]\n<br />[/list]Review your log before sharing it publicly. Uploading or distributing a log may also expose information about other players who participated in the mission.\n<br />\n<br />DTLogs does not intentionally record chat messages, passwords, payment information, or unrelated personal files.\n<br />\n<br />[heading]Known limitations[/heading]\n<br />\n<br />[list]\n<br />[*]Some events depend on information exposed by the game and Darktide Mod Framework.[/*]\n<br />[*]Not every healing or damage source can always be identified precisely.[/*]\n<br />[*]Some values may need to be inferred by matching timestamps, positions, units, or related events.[/*]\n<br />[*]Game updates may change internal functions and temporarily affect event capture.[/*]\n<br />[*]Large or long missions may generate large JSONL files.[/*]\n<br />[/list][heading]Support and community[/heading]\n<br />\n<br />Website:\n<br />\n<br />[url=https://dtlogs.com]https://dtlogs.com[/url]\n<br />\n<br />Community Discord:\n<br />\n<br />[url=YOUR_DISCORD_INVITE][/url][url=https://discord.gg/zrfrJMuhc]Join the DTLogs Discord[/url]\n<br />\n<br />When reporting an issue, please include:\n<br />\n<br />[list]\n<br />[*]DTLogs version[/*]\n<br />[*]Darktide Mod Framework version[/*]\n<br />[*]A description of what happened[/*]\n<br />[*]Whether a JSONL file was created[/*]\n<br />[*]Relevant errors from the Darktide console log[/*]\n<br />[/list]Do not publicly attach an unedited mission log unless you are comfortable sharing the player names and identifiers contained in it.\n<br />\n<br />[heading]Shout outs[/heading]\n<br />\n<br />Thanks to the Darktide Modding community and to the maintainers and contributors of the Darktide Mod Loader and Darktide Mod Framework.\n<br />\n<br />\n<br />Special thanks to everyone who tested DTLogs, shared mission logs, reported problems, and helped improve event coverage and performance.\n<br />\n<br />DTLogs is an independent community project and is not affiliated with or endorsed by Fatshark."
