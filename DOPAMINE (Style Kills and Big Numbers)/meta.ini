nexusDescription="[b][i][size=5][font=Arial]DOPAMINE[/font][/size][/i][/b]\n<br />This mod overlays a few HUD elements, inspired by ULTRAKILL and my sleep deprived brain, that I thought made my Zealot experience more \"fun\" (our definitions of fun might differ):\n<br />\n<br />[img width=735]https://staticdelivery.nexusmods.com/mods/4943/images/1064/1064-1784306006-813646077.gif[/img]\n<br />[img width=736]https://staticdelivery.nexusmods.com/mods/4943/images/1064/1064-1784306771-256990118.gif[/img]\n<br />\n<br />[color=#ff7700][size=5][b][i][u]1.8 (beta) MISSION TRACKING UPDATE[/u][/i][/b][/size][/color]\n<br />The latest update introduces a custom mod menu with a mission tracking system and a custom settings menu.\n<br />\n<br />[b][i][size=4][u]MISSION/RUN TRACKING[/u] AND [u]POST-MISSION SUMMARY[/u][/size][/i][/b]\n<br />A new system, tracked via the mod's custom mod menu. Track high scores for Style Points and run ranks, and a ranking system based on your performance during the match. Receive a nicely animated post-mission screen which shows a full breakdown (toggleable)\n<br />[list]\n<br />[*]VIOLENCE:\n<br />- Tracks your damage dealt to hordes, elites, specials, and bosses, and scores you based on your contribution to total damage %- Last hits don't matter, it's all about whether you did enough damage to help your team tear through heretics[/*]\n<br />[*]FINESSE:\n<br />- Tracks how much health damage you received, and how many times you were downed[/*]\n<br />[*]UNITY:\n<br />- Tracks how many objectives you completed, how many times you rescued downed/hogtied/netted teammates, your % time spent in coherency, with bonuses for stimming teammates.[/*]\n<br />[*]STYLE:\n<br />- Uses the current style scoring system which contributes to your mission progression, and your overall run score [/*]\n<br />[/list][img]https://staticdelivery.nexusmods.com/mods/4943/images/1064/1064-1786396838-1877832556.png[/img]\n<br />\n<br />[b][i][size=4]CUSTOM MOD SETTINGS PAGE[/size][/i][/b]\n<br />I wrote my own settings page because I wasn't happy with DMFs approach, which uses the game's native settings widgets. The settings should be far easier to configure now (though feedback and bug reports are welcome!)\n<br />\n<br />[img]https://staticdelivery.nexusmods.com/mods/4943/images/1064/1064-1786397545-324081206.png[/img]\n<br />\n<br />[size=5][b][i]POINTS SYSTEM[/i][/b][/size]\n<br />Receive 'style' points for killing enemies with multipliers for maintaining long combos. The points are weighted towards killing priority targets, but they aren't a performance metric. It's purely for fun.\n<br />[list]\n<br />[*]Stylised feedback for killing enemies[/*]\n<br />[*]14 different 'style kills' (I'm open to suggestions to add more)[/*]\n<br />[/list][img width=379]https://staticdelivery.nexusmods.com/mods/4943/images/1064/1064-1784309231-119070407.png[/img]\n<br />[size=5][b][i]FURY, RANK[/i][/b][/size]\n<br />As you fill the bar by killing and damaging enemies, you receive higher ranks. The longer the bar is filled, the harder it is to maintain it.\n<br />[list]\n<br />[*]Every class has their own flavor of 'ranks'[/*]\n<br />[*]As long as the bar is filled, you are considered as being 'in a combo'[/*]\n<br />[*]When the bar empties, you will receive a multiplier on all the points you gained during the combo[/*]\n<br />[/list]Customisable:\n<br />[list]\n<br />[*]Rank can optionally be hidden, so you just see the bar [/*]\n<br />[*]The bar has two themes: UI and 'gritty' (textured)[/*]\n<br />[/list][img width=380]https://staticdelivery.nexusmods.com/mods/4943/images/1064/1064-1784309122-829761893.png[/img]\n<br />[img width=378]https://staticdelivery.nexusmods.com/mods/4943/images/1064/1064-1784309153-2043273583.png[/img]\n<br />[b][i][size=5]KILL MARKERS[/size][/i][/b]\n<br />[size=3]When you kill an enemy, you'll see the amount of points you scored appear as a green floating marker (pop-up) for a second. Might be satisfying for some, might be annoying for others - you can toggle and customise this feature.[/size]\n<br />\n<br />[img width=720]https://staticdelivery.nexusmods.com/mods/4943/images/1064/1064-1784313214-806299129.gif[/img]\n<br />[size=5][b][i]KILL LIST[/i][/b][/size]\n<br />As your match progresses, you'll receive kill orders, which reward points on completion. They will sometimes come with a timer.\n<br />[img]https://staticdelivery.nexusmods.com/mods/4943/images/1064/1064-1784309950-1895036611.png[/img]\n<br />\n<br />[size=5][b][i]TEAM CHART[/i][/b][/size]\n<br />[size=3]A last minute addition: a small panel with a bar chart showing you where you stack up in your team in terms of [b]damage [/b]or [b]kill count[/b]. The figures can be cycled with a keybind.[/size]\n<br />[img]https://staticdelivery.nexusmods.com/mods/4943/images/1064/1064-1784310245-1696395055.png[/img]\n<br />\n<br />[size=5][b][i]CUSTOMISATION[/i][/b][/size]\n<br />[size=3]The HUD is slot based, so it's entirely customisable:[/size]\n<br />[img]https://staticdelivery.nexusmods.com/mods/4943/images/1064/1064-1784310917-23751550.gif[/img]\n<br />\n<br />You have Y offsets for left, right and center columns, so with that you should align it how you wish.\n<br />\n<br />[b][color=#980000][size=4]NOTE for CustomHUD players[/size][/color]: [/b]This mod will replace the kill feed with whatever you put in the left column slots, and will push the chat down to make room, but if you have custom HUD installed this is disabled by default.\n<br />\n<br />You can fine tune the values for yourself, the 'balancing' for how hard it is to maintain combos is under the 'Fine Tuning' menu in the settings. The main one, if you feel it's too hard/too easy to fill the bar is 'damage reference': lower = bar fills quicker, higher = bar fills slower.\n<br />\n<br />There's quite a few settings, but I won't bloat this description with more images than I already have...\n<br />\n<br />[b][i]AUTHOR'S NOTE[/i][/b]\n<br />[list]\n<br />[*]I do not play psyker. I have no idea how the balancing I tried to put in for the classes I enjoy work with psyker abilities and weapons. I likely won't playtest this with psyker either, but if you suggest better settings than what I'm releasing then feel free to drop a comment[/*]\n<br />[*]This is still kind of a work-in-progress, suggestions, bug reports, etc. all welcome[/*]\n<br />[/list]"
