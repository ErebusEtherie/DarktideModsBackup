nexusDescription="[b]Features[/b]\n<br />\n<br />[list]\n<br />[*]Sort your mod list alphabetically, in ascending or descending order[/*]\n<br />[*][s]Pin up to 10 mods on the top of the list, with the option to add icons to them[/s] (Removed, DMF now has this functionality!)[/*]\n<br />[*][s]Adds a search bar to filter mods[/s] (Removed, DMF now has this functionality!)[/*]\n<br />[*]Hide up to 10 mods from the list (the mods are still enabled, just not visible on the mod options page)[/*]\n<br />[*]Optionally remove colors, glyphs from mod names[/*]\n<br />[*][s]Mods listed under \"Toggle Mods\" are also sorted[/s][/*]\n<br />[*]Translations for ﻿﻿Spanish, Russian, Simplified Chinese, Korean, and Japanese[/*]\n<br />[/list]\n<br />[b]How it works[/b]\n<br />\n<br />This mod patches the code DMF (Darktide Mod Framework) runs to create the Mod Options menu - by default DMF lists mods in the order of your mod_load_order.txt. This mod changes that to sort the list of mods before it displays them. It does not affect the actual loading of mods, ONLY the GUI.\n<br />\n<br />It works even if the mod's name is colored or has special characters in the menu.\n<br />\n<br />[b]Acknowledgements[/b]\n<br />\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/users/1992757]GideonAriphael[/url][b] [/b](creator of Simple Buff Filter) provided code so this mod doesn't need special install instructions (like placing it on the bottom of the mod_load_order.txt). This contribution also made it compatible with Auto Mod Loading and Ordering, so big thanks to him"
