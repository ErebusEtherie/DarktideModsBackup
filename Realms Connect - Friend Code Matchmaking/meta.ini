nexusDescription="[center][size=6][b]Realms Connect[/b][/size]\n<br />[size=3]Friend-code matchmaking and NAT traversal for Realms servers[/size][/center]\n<br />\n<br />[line]\n<br />\n<br />[size=5][b]What it does[/b][/size]\n<br />\n<br />Realms Connect lets two players find and join each other's [url=https://www.nexusmods.com/warhammer40kdarktide/mods/1223]Realms[/url] server using a Darktide friend code instead of an IP address and port.\n<br />\n<br />[list]\n<br />[*]Join a friend's Realm by typing their Darktide friend code.[/*]\n<br />[*]Browse friends who are currently hosting and join from a list.[/*]\n<br />[*]Let friends in automatically, or accept and refuse each join request from the mission preparation screen or an on-screen prompt.[/*]\n<br />[*]Opens a port on your router automatically while you host, where your router allows it.[/*]\n<br />[*]Connects players who are both behind a home router, without either of them forwarding a port.[/*]\n<br />[*]Lets friends join a mission already in progress, if the host allows it.[/*]\n<br />[*]Optionally hides your public IP address and friend code on screen, for streaming.[/*]\n<br />[/list]\n<br />[line]\n<br />\n<br />[size=5][b]Requirements[/b][/size]\n<br />\n<br />[list]\n<br />[*][b]Darktide Mod Framework (DMF)[/b][/*]\n<br />[*][b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1223]Realms[/url][/b] 0.7.0 or newer, by deluxghost. Realms itself requires [b]SoloPlay[/b].[/*]\n<br />[*][b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1117]Vox Manifold[/url][/b] 2.2 or newer[/*]\n<br />[/list]\n<br />[b]Both the host and the joiner need all of the above installed.[/b]\n<br />\n<br />The host and the joiner must use the same Realms version. Check it in Esc &gt; Mods before connecting.\n<br />\n<br />[line]\n<br />\n<br />[size=5][b]Installation[/b][/size]\n<br />\n<br />[list=1]\n<br />[*]Install the requirements above.[/*]\n<br />[*]Copy the [b]Realms Connect[/b] folder into your Darktide [b]mods[/b] folder.[/*]\n<br />[*]Open [b]mods&#92;mod_load_order.txt[/b] and add these lines at the bottom, in this order:\n<br />[code]Vox Manifold\n<br />Realms Connect[/code][b]Realms[/b] must appear above both of them.[/*]\n<br />[*]Start the game.[/*]\n<br />[/list]\n<br />[line]\n<br />\n<br />[size=5][b]How to use[/b][/size]\n<br />\n<br />[size=4][b]Friend codes[/b][/size]\n<br />Realms Connect uses your normal Darktide friend code. It is also shown at the top of the lobby's Requests tab while hosting; click it to copy it.\n<br />\n<br />[list]\n<br />[*][b]The joiner[/b] needs the host's friend code.[/*]\n<br />[*][b]The host[/b] needs the joiner's friend code saved in Esc &gt; Mods &gt; Realms Connect &gt; [i]Saved friend codes[/i]. This is not needed if the joiner is already on the host's Darktide friends list or in the host's party.[/*]\n<br />[/list]\n<br />[size=4][b]Hosting[/b][/size]\n<br />Start a Realms server as normal. Friends (saved friend codes, Darktide friends and party members) are let in automatically while [i]Auto-accept friends[/i] is on, which is the default.\n<br />\n<br />A join request appears in the [b]Requests[/b] tab on the mission preparation screen, or as a notification on the right of the screen anywhere else, when:\n<br />[list]\n<br />[*][i]Auto-accept friends[/i] is off, or[/*]\n<br />[*]someone who is not a friend knocks while [i]Advertise mode[/i] is Open or [i]Open this lobby[/i] is broadcasting.[/*]\n<br />[/list]\n<br />[list]\n<br />[*][b]F9[/b] (D-pad right + LT on a controller) lets them in.[/*]\n<br />[*][b]F10[/b] (D-pad right + RT) refuses them.[/*]\n<br />[*]Ignoring the request refuses it when the timer runs out.[/*]\n<br />[/list]\n<br />[b]Open this lobby[/b] (in the Requests tab, or Esc &gt; Mods &gt; Realms Connect) lets players who are not your friends, such as those in the same Mourningstar, ask to join with your friend code for two minutes. You are asked about each one. With [i]Advertise mode[/i] Off, it also lets friends find your Realm with [i]Check friends for open lobbies[/i] for those two minutes.\n<br />\n<br />[size=4][b]Joining[/b][/size]\n<br />Open Realms' Join screen. In the [b]Realms Connect[/b] section, either:\n<br />[list]\n<br />[*]type the host's friend code, press [b]Look Up[/b], then [b]Connect[/b]; or[/*]\n<br />[*]press [b]Check friends for open lobbies[/b] and pick a friend who is hosting.[/*]\n<br />[/list]\n<br />You must be past the title screen and in the Mourningstar. Connecting can take a minute or more; the join screen counts down each stage. Let it run until it reports a result.\n<br />\n<br />An [b]ip:port[/b] can also be typed into the friend code box; press [b]Look Up[/b] to connect to it directly.\n<br />\n<br />[size=4][b]Joining a mission in progress[/b][/size]\n<br />The host controls this with [i]Let friends join mid-mission[/i], on by default. With it on, friends (saved friend codes, Darktide friends and party members) join straight away; with it off, they are refused. Anyone who is not a friend is refused during a mission.\n<br />\n<br />[size=4][b]Streaming[/b][/size]\n<br />Turn on [i]Hide my address and code on screen[/i] in Esc &gt; Mods &gt; Realms Connect. Your public IP address then shows as [b]x.x.x.x[/b] and your friend code as [b]xxxx-xxxx[/b] in chat, the join screen and the hosting panel. Click either one to copy the real value to your clipboard. Log files are not affected.\n<br />\n<br />[line]\n<br />\n<br />[size=5][b]Network access and privacy[/b][/size]\n<br />\n<br />Realms Connect makes the following network connections:\n<br />\n<br />[list]\n<br />[*][b]STUN queries[/b] to public STUN servers, to find your public IP address and port: [i]stun.l.google.com, stun1.l.google.com, stun.cloudflare.com, global.stun.twilio.com, stun.voipgate.com[/i].[/*]\n<br />[*][b]Your own router only[/b], over UPnP or NAT-PMP, to open a port while you are hosting. Turn this off with [i]Router port mapping[/i] in the mod options.[/*]\n<br />[*][b]Join requests and replies[/b] are sent through Darktide's own presence service, using Vox Manifold.[/*]\n<br />[*][b]The NAT punch and the connection between players[/b] go directly between the two players' addresses, over Realms and the game's own networking.[/*]\n<br />[/list]\n<br />The mod includes [b]darktide-realms-connect.dll[/b], which performs the STUN queries and the router port mapping. It is unsigned. Deleting it stops friend codes from working, but typing an ip:port still connects.\n<br />\n<br />[url=https://github.com/Wobin/Realms-Connect]Source code on GitHub[/url]\n<br />\n<br />[line]\n<br />\n<br />You can adjust how often the host queries the friend list in the settings. Note that the mod only runs the checks when hosting, and when the party is not full. Reduce the size of your party to gate the check if you're not looking for a full four man. There will be jitters every time if you have a large friends list.\n<br />\n<br />[line]\n<br />\n<br />[size=5][b]Reporting a problem[/b][/size]\n<br />\n<br />Detailed connection logging is off by default. To capture it, turn on [i]Debug logging[/i] in Esc &gt; Mods &gt; Realms Connect before trying again.\n<br />\n<br />As soon as a connection fails, before closing the game:\n<br />[list=1]\n<br />[*]Type [b]/rc_report[/b] in chat.[/*]\n<br />[*]Type [b]/rc_diag[/b] in chat and wait a few seconds.[/*]\n<br />[*]Quit the game.[/*]\n<br />[*]Take the newest log file from [b]%APPDATA%&#92;Fatshark&#92;Darktide&#92;console_logs[/b].[/*]\n<br />[/list]\n<br />Include a log from [b]both[/b] the host and the joiner, and note roughly when the attempt was made. If the game crashed, also include the matching file from [b]%APPDATA%&#92;Fatshark&#92;Darktide&#92;crash_dumps[/b].\n<br />\n<br />A log contains the Darktide friend code, local network addresses and public IP address of the machine that wrote it. [b]/rc_diag[/b] masks the public IP address by default.\n<br />"
