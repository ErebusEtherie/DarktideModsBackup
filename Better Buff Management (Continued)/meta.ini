nexusDescription="[center][size=4][size=6][b][color=#e0a030]BETTER BUFF MANAGEMENT[/color][/b][/size]\n<br />[size=3][i]Take control of your buff bar. Split it, sort it, hide it, move it.[/i][/size][/size][/center]\n<br />\n<br />\n<br />[line]\n<br />[size=4]\n<br />[size=5][b][color=#e0a030]What is this?[/color][/b][/size]\n<br />\n<br />Darktide throws every buff, debuff, and proc onto a single cramped bar in the corner of your screen. In a hot fight that bar becomes a wall of icons you can't read at a glance.\n<br />\n<br />[b]Better Buff Management[/b] breaks that wall apart. Build your own buff bars, decide exactly which buffs live on each one, hide the noise you never look at, and place every bar wherever you want on the HUD. Configure it all live, in-mission, through an in-game window — no config files, no restarts.\n<br />\n<br />[i]This is a performance-optimized build. Same features as the original, lighter on the frame time — the buff observer is opt-in, recent-buff writes are batched, and per-bar layout is baked at HUD creation instead of recomputed every frame.[/i][/size]\n<br />\n<br />\n<br />[line]\n<br />[size=4]\n<br />[size=5][b][color=#e0a030]Core Features[/color][/b][/size][/size]\n<br />\n<br />\n<br />[list]\n<br />[*][size=4][b]Multiple custom buff bars[/b] — create as many bars as you like, each with its own name, position, and behaviour.[/size][/*]\n<br />[*][size=4][b]Assign buffs to bars[/b] — pick exactly which buffs show on which bar. Keep your key uptimes (ability, class buffs, weapon procs) on one clean bar and dump everything else elsewhere.[/size][/*]\n<br />[*][size=4][b]Hide buffs[/b] — buffs you never care about simply don't render. Cut the clutter completely.[/size][/*]\n<br />[*][size=4][b]Groupings[/b] — save named sets of buffs and drop them onto a bar in one click, instead of hunting for each icon individually.[/size][/*]\n<br />[*][size=4][b]Search &amp; filter[/b] — search the full buff catalog by name, or show only the buffs that aren't assigned to any bar yet so nothing slips through.[/size][/*]\n<br />[*][size=4][b]Recently seen buffs[/b] — an optional live list of buffs the game just applied to you, so you can grab the exact buff you want without knowing its internal name. Click to select, then add to a bar.[/size][/*]\n<br />[/list]\n<br />\n<br />[line]\n<br />[size=4]\n<br />[size=5][b][color=#e0a030]Per-Bar Options[/color][/b][/size]\n<br />\n<br />Every bar you create can be tuned independently:[/size]\n<br />\n<br />\n<br />[list]\n<br />[*][size=4][b]Position (X / Y)[/b] — place the bar anywhere on screen.[/size][/*]\n<br />[*][size=4][b]Snap to default bar[/b] — one click drops the bar onto the vanilla buff-bar location as a starting point.[/size][/*]\n<br />[*][size=4][b]Growth direction[/b] — choose how the row of icons expands as buffs come in:[/size]\n<br />\n<br />[list]\n<br />[*][size=4]Left to right[/size][/*]\n<br />[*][size=4]Right to left[/size][/*]\n<br />[*][size=4]Top to bottom[/size][/*]\n<br />[*][size=4]Bottom to top[/size][/*]\n<br />[*][size=4]Centered (grows both ways from the anchor)[/size][/*]\n<br />[/list][/*]\n<br />[*][size=4][b]Order mode[/b]:[/size]\n<br />\n<br />[list]\n<br />[*][size=4][i]By activation[/i] (vanilla) — icons shuffle as buffs re-trigger.[/size][/*]\n<br />[*][size=4][i]Preserved[/i] — buffs hold a stable relative order and never jump around; active buffs just pack toward the origin. Far easier to track uptimes at a glance.[/size][/*]\n<br />[/list][/*]\n<br />[*][size=4][b]Opacity[/b] — dim a bar down for secondary info, or keep it fully solid.[/size][/*]\n<br />[*][size=4][b]Class filter[/b] — restrict a bar to specific classes so it only appears on the characters it's relevant to. Supports Veteran, Zealot, Psyker, Ogryn, Arbites, Hive Scum, Skitarius.[/size][/*]\n<br />[/list]\n<br />\n<br />[line]\n<br />[size=4]\n<br />[size=5][b][color=#e0a030]The Default Buff Bar[/color][/b][/size][/size]\n<br />\n<br />\n<br />[list]\n<br />[*][size=4][b]Toggle default buff bar[/b] — hide the game's original bar entirely once your custom bars replace it.[/size][/*]\n<br />[*][size=4][b]Leave default bar untouched[/b] — a hands-off mode: the mod never moves, hides, or reorders the vanilla bar. It stays exactly where the game puts it. (Overrides the toggle above.)[/size][/*]\n<br />[*][size=4][b]Group buffs by category on custom bars[/b] — sort buffs on your custom bars into the same category groups, with small gaps between groups, that the default bar uses.[/size][/*]\n<br />[/list]\n<br />\n<br />[line]\n<br />[size=4]\n<br />[size=5][b][color=#e0a030]How to Use It[/color][/b][/size][/size]\n<br />\n<br />\n<br />[list=1]\n<br />[*][size=4]Bind a key to [b]Open configure buffs window[/b] in the mod options.[/size][/*]\n<br />[*][size=4]Jump into the [b]Psykhanium[/b] (Meat Grinder) or any mission and press your key.[/size][/*]\n<br />[*][size=4]Create a bar, give it a name, and start assigning buffs — from the catalog, the search, your groupings, or the Recently seen list.[/size][/*]\n<br />[*][size=4]Set the bar's position, direction, order, opacity, and class filter.[/size][/*]\n<br />[*][size=4]Close the window. Your layout bakes in immediately.[/size][/*]\n<br />[/list][size=4]\n<br />[b]Tip:[/b] the configuration window itself is resizable and repositionable — set its width, height, and X/Y in the mod options if the defaults don't suit your resolution.[/size]\n<br />\n<br />[line]\n<br />[size=4][size=5][b][color=#e0a030]Buff Catalog &amp; Reindexing[/color][/b][/size]\n<br />\n<br />The mod builds a catalog of every buff in the game and [b]caches[/b] it, so the config window opens instantly instead of rescanning every time. The catch: after a [b]major game update[/b] (new classes, weapons, talents, or reworked buffs), the cache is stale and new buffs won't appear.\n<br />\n<br />When that happens, open the configure window and hit [b]Reindex buff catalog[/b]. It rebuilds the cache from the current game version and your new buffs show up. One click, done — only needed after big patches, not every session.[/size]\n<br />\n<br />[line]\n<br />[size=4]\n<br />[size=5][b][color=#e0a030]Mod Menu Settings[/color][/b][/size][/size]\n<br />\n<br />\n<br />[list]\n<br />[*][size=4]Open configure buffs window [i](keybind)[/i][/size][/*]\n<br />[*][size=4]Toggle default buff bar[/size][/*]\n<br />[*][size=4]Leave default buff bar untouched[/size][/*]\n<br />[*][size=4]Group buffs by category on custom bars[/size][/*]\n<br />[*][size=4]Observe all buffs for Recent list [i](opt-in — slightly higher CPU)[/i][/size][/*]\n<br />[*][size=4]Recent buff line length [i](5–50)[/i][/size][/*]\n<br />[*][size=4]Configure window width / height / X / Y[/size][/*]\n<br />[/list]\n<br />\n<br />[line]\n<br />[size=4]\n<br />[size=5][b][color=#e0a030]Recommended Companion[/color][/b][/size]\n<br />\n<br />Pairs best with [b]Custom HUD[/b] for pixel-perfect positioning of everything else on your screen, so your new buff bars slot cleanly into a full custom layout.[/size]\n<br />\n<br />\n<br />[line]\n<br />[size=4]\n<br />[size=5][b][color=#e0a030]Requirements[/color][/b][/size][/size]\n<br />\n<br />\n<br />[list]\n<br />[*][size=4]Darktide Mod Framework (DMF)[/size][/*]\n<br />[*][size=4]Darktide Mod Loader[/size][/*]\n<br />[/list][size=4]\n<br />[size=5][b][color=#e0a030]Installation[/color][/b][/size][/size]\n<br />\n<br />\n<br />[list=1]\n<br />[*][size=4]Install the Darktide Mod Loader and Darktide Mod Framework first.[/size][/*]\n<br />[*][size=4]Extract this mod into your [i]Warhammer 40,000 DARKTIDE/mods[/i] folder.[/size][/*]\n<br />[*][size=4]Add [b]better_buff_management[/b] to your [i]mods/mod_load_order.txt[/i].[/size][/*]\n<br />[*][size=4]Launch and configure in-game.[/size][/*]\n<br />[/list]\n<br />\n<br />[line]\n<br />[size=4]\n<br />[size=5][b][color=#e0a030]Credits[/color][/b][/size]\n<br />\n<br />Original [b]Better Buff Management[/b] by [color=#e0a030]FatNutt[/color].\n<br />Optimized build maintained by [b]Sungrief[/b].[/size]\n<br />\n<br />\n<br />[center][size=4][size=2][i]The Emperor protects.[/i][/size][/size][/center]\n<br />\n<br />[color=#D4D4D8]If you experience issues with the UI being unresponsive:\n<br />\n<br />1. Go to: C:&#92;Users&#92;YOUR.USERNAME&#92;AppData&#92;Roaming&#92;Fatshark&#92;Darktide&#92;user_settings.config\n<br />[b]2. Backup your user_settings.config file! [/b] [/color]\n<br />[color=#D4D4D8]3. Under the mods_settings node, find the 'better_buff_management' node and delete any prior config.\n<br />4. Save the file and relaunch the game.\n<br />\n<br />This will require recreating any previously configured bars though. [/color]"
