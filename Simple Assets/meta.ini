nexusDescription="Provides local asset (texture) loading helpers for other mods.\n<br />\n<br />[b][color=#f6b26b][size=4]Features[/size][/color][/b]\n<br />[list]\n<br />[*][color=#ffd966][b]Load local images as Darktide textures, individually or in batches[/b][/color][/*]\n<br />[*][color=#ffd966][b]Load .slug format fonts[/b][/color][/*]\n<br />[*][color=#ffd966][b]Load .png format mouse cursors[/b][/color][/*]\n<br />[*][color=#ffd966][b]Load VP8 .ivf format videos[/b][/color][/*]\n<br />[*][color=#ffd966][b]Load .slug album vector icons[/b][/color][/*]\n<br />[*][color=#ffd966][b]No developer console required[/b][/color][/*]\n<br />[*][color=#ffd966][b]No external program or other mod required[/b][/color][/*]\n<br />[*][color=#ffd966][b]Should support both Steam and GamePass version[/b][/color][/*]\n<br />[/list]Inspired by the [url=https://www.nexusmods.com/warhammer40kdarktide/mods/211]Darktide Local Server[/url]. Simple Assets is created for my own uses to avoid having to open the developer console.\n<br />\n<br />[b][color=#f6b26b][size=4]For Modders[/size][/color][/b]\n<br />\n<br />Documentation: [url=https://github.com/deluxghost/darktide-mods/blob/main/SimpleAssets/README.md]https://github.com/deluxghost/darktide-mods/blob/main/SimpleAssets/README.md[/url]\n<br />\n<br />For custom audio, see standalone [url=https://www.nexusmods.com/warhammer40kdarktide/mods/929]Simple Audio[/url].\n<br />\n<br />[url=https://ko-fi.com/deluxghost][img]https://ko-fi.com/img/githubbutton_sm.svg[/img][/url]\n<br />[url=https://space.bilibili.com/4712698][img]https://deluxghost.me/bilibili_sponsor.svg[/img][/url]"
