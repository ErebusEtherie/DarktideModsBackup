nexusDescription="Replaces generic downed icons with specific status icons (pounced by hound, netted by trapper, grabbed by mutant) and adds aggro borders.\n<br />\n<br />Thanks to [url=https://www.nexusmods.com/warhammer40kdarktide/users/1992757]GideonAriphael[/url] for his mod [url=https://www.nexusmods.com/warhammer40kdarktide/mods/520]Ring HUD[/url] for the ideas and hooks! Please check out his wonderful mods :)\n<br />\n<br />[b]Options:[/b]\n<br />\n<br />[b]Panel Indicators[/b]\n<br />- Icon Style [Glowing, Plain (Uses Status Colors), Plain (Teammate Color)]\n<br />- Enable Background Tint\n<br />- Enable Personal Panel Indicators (Offset X/Y)\n<br />- Enable Team Panel Indicators (Offset X/Y)\n<br />\n<br />[b]World Markers[/b]\n<br />- Enable Floating World Markers\n<br />- Floating Marker Icon Style [Glowing, Plain (Uses Status Colors), Plain (Teammate Color)]\n<br />- Floating Marker Icon Size\n<br />\n<br />[b]Status Colors[/b]\n<br />- Custom Status Colors (Pounced / Dogged, Netted / Trapped, Grabbed / Mutant, Consumed / Beast of Nurgle, Knocked Down, Hogtied / Awaiting Rescue)\n<br />\n<br />[b]Aggro Detection[/b]\n<br />- Enable Aggro on Personal Panel &amp; Team Panels\n<br />- Aggro Glow Threat Options (Pox Burster, Disabler, Sniper, Captain/Twins, Monstrosity, Daemonhost, Bomber, Crusher/Mauler, Flamer, Rager)\n<br />\n<br />[b]Links:[/b]\n<br />[url=https://github.com/MaddyMarv/Player-State-Indicators-aka-Better-Downed-Icons-]Source Code[/url] | [url=https://www.nexusmods.com/profile/indicabunny]Nexus Mods Profile[/url] | [url=https://ko-fi.com/indicabunny]Support Me on Ko-fi[/url]\n<br />"
