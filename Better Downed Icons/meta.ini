nexusDescription="Standalone mod that replaces the generic exclamation point when a teammate goes down with a specific icon showing if they got pounced by a hound, netted by a trapper, or grabbed by a mutant. You can customize the icon colors. You can also add a glowing border around teammate icons when they have aggro from bosses or specials so you know who the boss is targeting.\n<br />\n<br />Big thanks to [url=https://www.nexusmods.com/warhammer40kdarktide/mods/520]Ringhud[/url], made by [url=https://www.nexusmods.com/profile/GideonAriphael]Sigimund[/url], for the idea of this mod! He inspired me to make it :) \n<br />I used a lot of the same hooks/icons and some of the ideas from his mod, so you should go check him out.\n<br />\n<br />[b]Links:[/b]\n<br />[url=https://github.com/MaddyMarv/Player-State-Indicators-aka-Better-Downed-Icons-]Source Code[/url] | [url=https://www.nexusmods.com/profile/indicabunny]Nexus Mods Profile[/url] | [url=https://ko-fi.com/indicabunny]Support Me on Ko-fi[/url]\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />"
