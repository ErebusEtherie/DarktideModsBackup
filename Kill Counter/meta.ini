nexusDescription="[font=Tahoma][size=4]Kill Damage Counter adds a simple live stat tracker to your HUD so you can monitor both damage dealt and kills while you play.\n<br />\n<br />The counter updates in real time during missions and is designed to stay clean and unobtrusive in the top-right corner, giving you useful feedback without cluttering the screen. Whether you want to compare builds, get a better feel for weapon performance, or just enjoy seeing your mission stats as you fight, this mod gives you that information at a glance.\n<br />\n<br />[img]https://imgur.com/UOaWlnu.jpg[/img]\n<br />\n<br />[b]Features:[/b]\n<br />[/size][/font][list]\n<br />[*][font=Tahoma][size=4]Tracks total damage dealt during the mission[/size][/font]\n<br />[*][font=Tahoma][size=4]Tracks total kills during the mission[/size][/font]\n<br />[*][font=Tahoma][size=4]Real-time HUD updates[/size][/font]\n<br />[*][font=Tahoma][size=4]Clean, lightweight top-right display[/size][/font]\n<br />[*][font=Tahoma][size=4]Visual settings support to better fit your HUD layout[/size][/font]\n<br />[*][font=Tahoma][size=4]Manual reset command included[/size][/font]\n<br />[/list][font=Tahoma][size=4]\n<br />[/size][/font][font=Tahoma][size=4]If you want a straightforward stat tracker that adds useful feedback without overwhelming the interface, this mod is built for exactly that.\n<br />\n<br />You can enable/disable displaying Kills or Damage in the Mod Options Menu\n<br />\n<br />[img]https://staticdelivery.nexusmods.com/mods/4943/images/749/749-1773467042-1522815374.png[/img]\n<br />\n<br />[b]Reset command:[/b]\n<br />/kill_damage_counter_reset[/size][/font]"
