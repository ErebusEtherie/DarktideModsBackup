nexusDescription="[b][size=4][color=#cc4125]Current in BETA![/color] [color=#ffd966]Expect crashes, errors, and mod incompatibilities[/color][/size][/b]\n<br />\n<br />[b][size=4][color=#ffd966]You can't get any rewards or progression in local game.[/color] [color=#cc4125]NOT POSSIBLE EVER[/color][/size][/b]\n<br />\n<br />[b][size=4][color=#cc4125][url=https://www.nexusmods.com/warhammer40kdarktide/mods/176]Solo Play[/url] [/color][color=#ffd966]is required to select missions and provide common fixes[/color][/size][/b]\n<br />[color=#ffd966][size=3](You can select mission from other solo mods, but the common fixes from Solo Play are still required)[/size][/color]\n<br />\n<br />[b][color=#93c47d][size=4]Features[/size][/color][/b]\n<br />[list]\n<br />[*]Local (LAN) listen servers[/*]\n<br />[*]IPv4 and IPv6[/*]\n<br />[*]Server-side mod support[/*]\n<br />[*]Up to 12 players (more than 4 players in total may extremely affect performance)[/*]\n<br />[*]Server password and private mode[/*]\n<br />[*]Text chat[/*]\n<br />[/list][b][color=#93c47d][size=4]Usage[/size][/color][/b]\n<br />\n<br />When starting a local single-player game through [b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/176]Solo Play[/url][/b], Realms automatically listens on a UDP port. Clients on the same LAN can then join the game from the mod options page.\n<br />To allow clients outside your LAN to join, configure [url=https://en.wikipedia.org/wiki/Port_forwarding]port forwarding[/url] and allow [b][color=#6d9eeb]Darktide.exe[/color][/b] through Windows Firewall.\n<br />\n<br />[b][color=#f1c232][size=4]Not Supported[/size][/color][/b]\n<br />\n<br />The following features are not currently supported.\n<br />[list]\n<br />[*]Built-in port forwarding, UDP hole punching, server lists, or similar services. You have to configure port forwarding yourself at the moment[/*]\n<br />[*]Reconnect popups. Players can join the server again manually[/*]\n<br />[*]Voice chat (may never be supported)[/*]\n<br />[/list][b][color=#93c47d][size=4]Featured Mods[/size][/color][/b]\n<br />[list]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/841][b]Stratagems[/b][/url]: Gives you a super way to acquire stratagems in local server.[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1163][b]Chaos Wastes at Home[/b][/url]: Selectable buffs. Randomly generated chained missions. Buffs carry over to chained missions.[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1167][b]PILGRIMAGE[/b][/url]: A solo/multiplayer gameplay mode, with its own buffs and curses, new weapons, achievements, custom bots, meta progression and more.[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1208][b]Vox Populi[/b][/url]: Twitch mode at home. Twitch chat votes on boons or banes in your solo lobbies.[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1273][b]Twitch Versus[/b][/url]: Twitch versus with fully customize spawns and rewards[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1272][b]RealmsLoadout[/b][/url]: A standalone local loadout editor for Realms LAN sessions.[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1269][b]MortisBuffManager[/b][/url]: Bring native Mortis Buffs into SoloPlay and Realms missions.[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1268][b]HavocEnemyDirector[/b][/url]: Build grouped generators from selected conditions, edit unit pools, weights and caps, and toggle extra spawns while preserving condition-required spawning.[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1267][b]HavocConditionManager[/b][/url]: Combine Havoc, Auric/Maelstrom and event conditions, choose a compatible environment, and adjust enemy spawn quantity or frequency from 1x to 5x.[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1258][b]SoloPlayMoreHavoc[/b][/url]: An extension for Solo Play that lets you select up to 12 Havoc circumstances at once in local Solo Play Havoc missions.[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1297][b]Realms Connect[/b][/url]: Join a friend's Realms server with their Darktide friend code instead of an IP and port.[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1264][b]Realms - Artificial Latency[/b][/url]: A Realms version of the older Artificial Latency mod.[/*]\n<br />[/list][b][color=#a4c2f4][size=4]Mod Developers[/size][/color][/b]\n<br />\n<br />See [url=https://github.com/deluxghost/darktide-mods/tree/main/Realms/docs]Documentation[/url]\n<br />\n<br />[url=https://ko-fi.com/deluxghost][img]https://ko-fi.com/img/githubbutton_sm.svg[/img][/url]\n<br />[url=https://space.bilibili.com/4712698][img]https://deluxghost.me/bilibili_sponsor.svg[/img][/url]\n<br />\n<br />[youtube]mJoFeACMNqM[/youtube]"
