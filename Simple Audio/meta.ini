nexusDescription="Provides simple local audio playback for other mods.\n<br />\n<br />[b][color=#f6b26b][size=4]Features[/size][/color][/b]\n<br />[list]\n<br />[*][color=#ffd966][b]Includes core Audio Plugin-style features such as local playback, event hooks, etc.[/b][/color][/*]\n<br />[*][color=#ffd966][b]Powered by a custom in-process FFmpeg/XAudio2 runtime[/b][/color][/*]\n<br />[*][color=#ffd966][b]No developer console required[/b][/color][/*]\n<br />[*][color=#ffd966][b]No external program or other mod required[/b][/color][/*]\n<br />[*][color=#ffd966][b]Ultra-low latency audio playback[/b][/color][/*]\n<br />[*][color=#ffd966][b]Opt-in dynamic spatial audio[/b][/color][/*]\n<br />[*][color=#ffd966][b]Supports both Steam and GamePass version[/b][/color][/*]\n<br />[/list]Inspired by the [url=https://www.nexusmods.com/warhammer40kdarktide/mods/196]Audio Plugin[/url]. Simple Audio was originally created for my own mods to avoid having to open the developer console. It has since grown to support most of the same functionality, along with additional features of its own.\n<br />\n<br />It exposes similar interfaces, but is not intended to be compatible with, or serve as a drop-in replacement for, the Audio Plugin.\n<br />\n<br />Uses FFmpeg libraries from BtbN:  [url=https://github.com/btbn/ffmpeg-builds]https://github.com/btbn/ffmpeg-builds[/url]\n<br />\n<br />[b][color=#f6b26b][size=4]For Modders[/size][/color][/b]\n<br />\n<br />Documentation: [url=https://github.com/deluxghost/darktide-mods/blob/main/SimpleAudio/README.md]https://github.com/deluxghost/darktide-mods/blob/main/SimpleAudio/README.md[/url]\n<br />\n<br />For custom texture, see standalone [url=https://www.nexusmods.com/warhammer40kdarktide/mods/1008]Simple Assets[/url].\n<br />\n<br />[url=https://ko-fi.com/deluxghost][img]https://ko-fi.com/img/githubbutton_sm.svg[/img][/url]\n<br />[url=https://space.bilibili.com/4712698][img]https://deluxghost.me/bilibili_sponsor.svg[/img][/url]"
