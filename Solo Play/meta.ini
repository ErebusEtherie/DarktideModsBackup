nexusDescription="[b][color=#ffd966]Play offline solo mission by /solo command.[/color][/b]\n<br />\n<br />[color=#f6b26b][size=4][b]==&gt;  READ FIRST  &lt;==[/b][/size][/color]\n<br />[b][color=#ffd966]Same questions will not be replied[/color][/b]\n<br />[list]\n<br />[*][b][color=#ffd966]You can't get any rewards or progression in offline game.[/color] [color=#cc4125]NOT POSSIBLE EVER[/color][/b][/*]\n<br />[*][b][color=#ffd966]You can't play with other human players. I would do if it's even possible.[/color][/b][/*]\n<br />[*][b][color=#ffd966]You can't bypass the internet and login requirement. It's too complicated.[/color][/b][/*]\n<br />[/list]\n<br />[size=5][b]Features[/b][/size]\n<br />\n<br />[list]\n<br />[*][b]Supported modes: Normal, Psykhanium, (Auric) Maelstrom, Campaign, Mortis Trials, Havoc, Expedition[/b][/*]\n<br />[*]Fully customizable missions, difficulty, side missions, special conditions, mission givers, Havoc enemy faction, Havoc hidden mutators and specific trials in Mortis Trials[/*]\n<br />[*]All hidden special conditions unlocked[/*]\n<br />[*]Randomizable Havoc settings[/*]\n<br />[*]Special option: mission brief (with bots!)[/*]\n<br />[*]Special option: friendly fire (not all weapons work) [/*]\n<br />[*]Special option: random side mission location[/*]\n<br />[/list]\n<br />[size=5][b]Usage\n<br />[/b][/size]Type [b][color=#ffe599]/solo[/color][/b] in the Mourning Star, or use customizable keybind, to open the Solo Play UI.\n<br />\n<br />[b][size=4]Other Notes[/size]\n<br />[/b]\n<br />[list=1]\n<br />[*]Normal gameplay should work well.[/*]\n<br />[*]Some options may not be supported, have no effect, or cause crashes.[/*]\n<br />[*]Mod conflicts are expected, please report any issue.[/*]\n<br />[/list]\n<br />[b][size=5]Companion Mods[/size][/b]\n<br />[color=#6aa84f][size=4]Actually there are even more compatible mods nowadays. This list might be outdated.[/size][/color]\n<br />\n<br />[b][color=#6d9eeb][size=4]Featured[/size][/color][/b]\n<br />[list]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/841][b]Stratagems DLC[/b][/url]: Gives you a super way to acquire stratagems in Solo Play missions.[/*]\n<br />[/list][b][color=#93c47d]Designed for Solo Play[/color][/b]\n<br />[list]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/177]True Solo QoL[/url]﻿﻿: Designed for TS players, Disable bot, auto-restart, etc. [/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/179]Will of The Emperor[/url]﻿: A lot of exciting testing/debugging features.[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/183]Tertium 5[/url]﻿ or [url=https://www.nexusmods.com/warhammer40kdarktide/mods/725]Tertium 6[/url]: Use your own characters as bots.[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/199]SpawnTweaks[/url]﻿: Disable enemies spawns by type.[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/200]Combat Evolved[/url]﻿: Reworks Darktide's combat to behave more like Vermintide 2.[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/745]BetterBots[/url]: Makes Solo Play bots act like real teammates.[/*]\n<br />[*][url=https://github.com/regzo2/DT-Loadout-Config]Loadout Config[/url]: Configure weapon stats, blessings, and perks.[/*]\n<br />[/list][b][color=#ffe599]Compatible[/color][/b]\n<br />[list]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/27]Bot Spawner[/url]﻿: Add/remove bots. Useful and kinda works. Some features crash the game randomly, the same would happen even in vanilla Psykhanium. [/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/25]Creature Spawner[/url]﻿: Adding enemies works, but seems not to be able to remove them.﻿[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/32]Camera Freeflight[/url]﻿: Just the ﻿freeflight camera, quite useful.[/*]\n<br />[/list]\n<br />[url=https://ko-fi.com/deluxghost][im