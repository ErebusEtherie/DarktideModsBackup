nexusDescription="[color=#e69138][size=4][b]Description[/b][/size][/color]\n<br />[size=3]Gear Clear safely bulk-removes unwanted melee weapons, ranged weapons and curios by adding a [color=#e69138][Ctrl+G] Gear Clear[/color] option to your Loadout and Inventory pages, then uses the game’s normal discard after a confirmation. Optionally, protect items with likely high-value stats.[/size]\n<br />\n<br />[color=#e69138][size=4][b]Main features[/b][/size][/color]\n<br />[list]\n<br />[*][size=3]Clears unwanted gear from all gear slots when used from the Loadout screen, or only the current gear slot when used from the Melee Weapon, Ranged Weapon or Curio inventory pages.[/size][/*]\n<br />[*][size=3]Never deletes Favourite items. [/size][/*]\n<br />[*][size=3]Option to  \"Keep high-value items\" to protect likely valuable gear.[/size][/*]\n<br />[*][size=3]Shows confirmation pop-up before clearing.[/size][/*]\n<br />[/list][color=#e69138][size=4][b]High value definition[/b][/size][/color]\n<br />[size=3]Protects weapons with a good 80/80/80/80/60-style stat-cap spread, including valid 61% cap cases. Does not protect weapons where the low cap is on essential stats Damage, Penetration, Ammo or melee Finesse. Protects useful curios: +21% Max Health, +17% Toughness, and +3 Max Stamina. Does not protect Wounds curios (unless favourited).[/size]\n<br />\n<br />[color=#e69138][size=4][b]Suggested use[/b][/size][/color]\n<br />[size=3]1. Run Gear Clear with \"Keep high value items\" turned ON to clear the trash. [/size]\n<br />[size=3]2. From what it retains, [i]favourite [/i]the items you want to keep.[/size]\n<br />[size=3]3. Run it again with high value turned OFF to clear anything remaining.[/size]\n<br />\n<br />"
