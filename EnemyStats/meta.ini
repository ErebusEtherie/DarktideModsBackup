nexusDescription="Enemy Stats shows detailed stats for every enemy breed in Darktide, drawn directly from the game's breed data so the numbers match what you encounter in missions.\n<br />\n<br />Shows in ESC menu and with optional configurable trigger key.\n<br />\n<br />If you have any issues, please use the [url=https://github.com/deathbeam/darktide-mods]GitHub\n<br />issue tracker[/url], but posting here is fine too. You can also view the full source there and\n<br />submit pull requests with changes.\n<br />\n<br />[b]Features:[/b]\n<br />[list]\n<br />[*]Comprehensive breed list covering all enemies, elites, specials, monstrosities, and even companions and props[/*]\n<br />[*]Size class classification (human-sized, ogryn, monster) relevant for damage talents and buffs[/*]\n<br />[*]Combat role and faction tagging (Dregs, Scabs, Moebians, Imperium)[/*]\n<br />[*]Health and hit-mass tables across all difficulty tiers including Havoc ranks[/*]\n<br />[*]Hit zone breakdown with per-zone armor type and weakspot indicators[/*]\n<br />[*]Stagger resistance, stagger reduction, and movement speed for each breed[/*]\n<br />[*]Armor and weakspot color-coded summaries matching the game's UI conventions[/*]\n<br />[/list]\n<br />[b]All stats mods by me:[/b]\n<br />[list]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1093]CharacterStats[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/661]CombatStats[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1054]EnemyStats[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/999]WeaponStats[/url][/*]\n<br />[/list]"
