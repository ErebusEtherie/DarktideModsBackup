nexusDescription="[b]Updated and published with the generous permission of [/b][url=https://www.nexusmods.com/warhammer40kdarktide/users/194284775][b]DerGrimnir[/b][/url][b] who is the author of the origi[/b][b]nal [url=https://www.nexusmods.com/warhammer40kdarktide/mods/573]Uptime[/url] mo[/b][b]d.[/b]\n<br />\n<br />This mod measures how long your buffs are active during combat, and how many stacks you have. \n<br />It's a great tool to see if your talents &amp; blessings are worth it, or if you want to switch up your build.\n<br />\n<br />[b]Bind a hotkey to open Uptime[/b]\n<br />\n<br />How is uptime calculated? \n<br />It's the time a buff is active (any number of stacks) during combat (combat begins when you attack/get attacked, and ends if you haven't attacked/been attacked for 5 seconds).\n<br />The average stacks and duration at max stacks is relative to your buff uptime.\n<br />E.g. if during a 10 minute combat your buff is active for 2 minutes, it has 20% uptime. If you're at maximum stacks for 1 of those 2 minutes, you have 50% max stacks time.\n<br />\n<br />[u][b]Features added in version 2.0[/b][/u]\n<br />* Scoreboard in logs\n<br />* Team loadout in logs\n<br />* Havoc logs will show that they are havoc and the rank\n<br />* Compatible with Simple Buff Filter (and probably others)\n<br />* Can add freetext note to saved logs (supports alt alphabets)\n<br />\n<br />* Consolidated settings\n<br />* Added scroll bar to Uptime view\n<br />* Moved tracking to buff extension\n<br />* Filters buff extension to only buffs that have a hud_icon\n<br />\n<br />* Crash protection with invalid logs\n<br />* No longer breaks game when accessing history from a view (aka Psych Ward compatibility)\n<br />\n<br />Proud member of the Darktide Modders discord https://discord.gg/GFyCGNpJb8 "
