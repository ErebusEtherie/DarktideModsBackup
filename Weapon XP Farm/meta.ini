nexusDescription="[color=#3c78d8][size=4][b]Description[/b][/size][/color]\n<br />[color=#D4D4D8]Buy any weapon from Brunt's Armoury in large amounts and automatically upgrade its rarity, selects all new weapons — all in a few clicks.[/color]\n<br />Currently there are 2 ways of getting weapon XP for mastery points: \n<br />[list=1]\n<br />[*]If you [b][u]DON'T[/u][/b] have resources - just play with random stats weapon. [/*]\n<br />[*]If you [b][u]DO[/u] [/b]have resources - Buy a lot of copies of the same weapon from Brunt's Armoury, upgrade all copies to Redeemed rarity and Sacrifice it.[/*]\n<br />[/list][size=4]If you [u]DO[/u] have resources and want to get weapon XP for Mastery points fast - this mod is for you.[/size]\n<br />\n<br />\n<br />\n<br />[color=#ffff00][size=4][b]Installation instructions\n<br />[/b][/size][/color]For [b][u]fast auto[/u][/b] installing I [b][u]recommend[/u] [/b]using [b]Vortex [/b]app:\n<br />[list=1]\n<br />[*]Download Vortex app [url=https://www.nexusmods.com/vortex]LINK[/url].[/*]\n<br />[*]For detailed usage you can watch video here [url=https://www.youtube.com/watch?v=AjQ3oPjhUiE&amp;list=PL3DTBbz0DCs8k1mBr5VoVFjVw6N3s6rtQ]LINK[/url][/*]\n<br />[*]Basically login to this website, find this mod and press Vortex button on top right side (near Manual button).[/*]\n<br />[*]Promt will appear once downloading is finished to open zip via Vortex - do it.[/*]\n<br />[*]All done :)[/*]\n<br />[/list]For [b][u]manual [/u][/b]installation only:\n<br />P.S. This mod supports [u]Auto Mod Loading and Ordering[/u] (  [url=https://www.nexusmods.com/warhammer40kdarktide/mods/246?tab=description]AML [/url]) — if you have [url=https://www.nexusmods.com/warhammer40kdarktide/mods/246?tab=description]AML [/url]installed, this mod is detected and loaded automatically in the correct order, [color=#f9cb9c]step 4 can be skipped![/color]\n<br />[list=1]\n<br />[*]Install [u]Darktide Mod Framework[/u][b] ([/b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/8]DMF[/url][b])[/b] and [u]Darktide Mod Loader[/u] ([url=https://www.nexusmods.com/warhammer40kdarktide/mods/19]DML[/url]) if you haven't already.[/*]\n<br />[*]Extract the [color=#6d9eeb]Weapon_XP_Farm[/color] folder from the archive.[/*]\n<br />[*]Place [color=#6d9eeb]Weapon_XP_Farm[/color] folder in your [u][color=#00ffff]Warhammer 40,000 DARKTIDE&#92;mods[/color][/u] folder.[/*]\n<br />[*]Add '[color=#6d9eeb]Weapon_XP_Farm[/color]' text to the bottom of the '[color=#00ffff]mod_load_order.txt[/color]' file (located in mods folder).\n<br />By default you will see some text in  '[color=#00ffff]mod_load_order.txt[/color]' file, like -- ##### sumbols at the top and bottom.\n<br />You need to go to the new line after bottom \" -- ##### \" line (just press Enter) and paste [color=#6d9eeb]Weapon_XP_Farm [/color]there, save .txt file.\n<br />[color=#ffe599]Should be like this if you did not install any mod yet[/color]. P.s. you can add any other mod you want before or after [color=#6d9eeb]Weapon_XP_Farm [/color]as well as [color=#ffe599]just delete all lines that starts with [/color][color=#00ffff]'--'[/color][color=#ffe599] (it's just comment lines):[/color] \n<br />[img]https://i.imgur.com/h6jWtKb.png[/img]\n<br />[/*]\n<br />[/list]   5.You can open menu by pressing \"L\" by default. You can change it anytime in mod settings.\n<br />\n<br />[b][color=#00ff00][size=4]HOW TO USE[/size][/color][/b]\n<br />[list=1]\n<br />[*]Go to the [b]hub[/b] and open the menu with your bound key. By default it's \"[b]L[/b]\". [i](set in Mod Options → Upgrade &amp; Sacrifice).[/i][/*]\n<br />[*]Select [b]MELEE[/b] or [b]RANGED[/b] tab and click a weapon from the list you want to buy and upgrade for sacrifice.[/*]\n<br />[*]Press [b]NEXT.[/b][/*]\n<br />[*]Choose [b]Store Mode[/b] if you [b]don't have[/b] selected weapon in your inventory - mod will buy weapon for you from the store.\n<br />Choose [b]Inventory Mode[/b] if you [b]have [/b]selected weapon in you inventory - mod will scan for selected rarity weapons from inventory only. [/*]\n<br />[*]Tick [b]Auto Max Mastery[/b] or [b]Manual amount[/b] option ( [b]Auto Max Mastery[/b] is ticked by default).[/*]\n<br />[*]If [b][u]Auto Max Mastery[/u] [/b]is ticked, mod will [b][u]try[/u] [/b]to calculate [b][u]approximate[/u] [/b]amount of needed weapons to buy automatically.\n<br />[color=#ff0000][b]Attention! [/b][/color][color=#ffffff]It can buy +/- 2 items more or less then needed! (can't fix it for now).[/color][/*]\n<br />[*]If [b][u]Manual amount[/u][/b] - set the [b]amount[/b] to purchase using the buttons -1,+1 etc. Or just click +37— [color=#ff0000][b]36 or 37 is usually enough for Mastery 20[/b][/color] (max LVL).[/*]\n<br />[*]In both cases choose a [b]consecration level[/b] from the dropdown[i]. [/i]Please choose [b][color=#00ff00]Redeemed [/color][/b]if[b] [/b]using [color=#ffffff][b][u]Manual[/u], [/b]with amount [/color][color=#ff0000][b]36 or 37[/b][/color][color=#ffffff].[/color][/*]\n<br />[*][u]Check the [b]estimated cost[/b] — make sure you have enough resources[/u].[/*]\n<br />[*]Tick [b]\"Everything is correct?\"[/b] and press [b]BUY.[/b][/*]\n<br />[*]Once the purchase is complete, click [b]OPEN &amp; SELECT[/b]. [/*]\n<br />[*]The mod will [b]automatically[/b]:\n<br /> A) Open the Crafting Station.\n<br /> B) Navigate to the Sacrifice Weapons tab.\n<br /> C) Select the matching weapon category, and mark all just-purchased weapons for sacrifice. [/*]\n<br />[*]Press [b]Continue [/b][i]→[/i] [b]SACRIFICE WEAPONS [/b]to finish — [u]this step is left to you intentionally[/u].[/*]\n<br />[*][color=#ff00ff]Spend All[/color] button added to the in-game Masteries menu (it spends all available points to all Blessings [b][color=#ff0000]RANDOMLY[/color][/b]).\n<br />\n<br />Credits for that idea / reference goes to Prowo with his mod [url=https://www.nexusmods.com/warhammer40kdarktide/mods/681?tab=description]Claim All Masteries[/url] ![/*]\n<br />[/list][b][size=4]Now you have about 37 copies of the selected weapon and all have same [color=#00ff00]Redeemed [/color][/size][/b][color=#ffffff][b][size=4]rarity.[/size][/b][/color]\n<br />[size=4]All just bought weapons are already selected. [/size]\n<br />[size=4]Press Continue [i]→[/i] [b]SACRIFICE WEAPONS[/b] to get weapon XP / Mastery points.[/size]\n<br />[size=4]Spend all Blessings points in a single click![/size]\n<br />\n<br />\n<br />[size=4][b]Main features[/b][/size]\n<br />[list]\n<br />[*][color=#d4d4d8]Mod can [b]automatically [/b]calculate how many weapons is needed for buying.[/color][/*]\n<br />[*][color=#D4D4D8]It can also [b]manualy [/b]buy [b]1 to 38 copies[/b] of any weapon using quick-step buttons (+1, +5, +37) in 2 clicks.[/color][/*]\n<br />[*][color=#d4d4d8]Auto upgrade weapons from inventory only - [b]Inventory Mode[/b].[/color][/*]\n<br />[*][color=#d4d4d8]Auto buy and upgradefrom the store (vendor) - [b]Store Mode[/b].[/color][/*]\n<br />[*][color=#D4D4D8][b]Auto-consecrate[/b] every purchased copy up to your chosen rarity (Redeemed → Transcendent).[/color][/*]\n<br />[*][color=#D4D4D8][b]Cost preview[/b] shows exact Credits, Plasteel and Diamantine before you commit.[/color][/*]\n<br />[*][color=#D4D4D8]Confirmation checkbox prevents accidental purchases.[/color][/*]\n<br />[*][color=#D4D4D8]One-click auto-select — opens the Crafting Station, navigates to Sacrifice Weapons, and marks all just-purchased weapons ready for sacrifice. [/color][/*]\n<br />[*][color=#D4D4D8]Spend all Blessing points in a single click.[/color][/*]\n<br />[*][color=#D4D4D8]Only the [b]Continue [/b][i]→[/i] [b]SACRIFICE WEAPONS[/b] buttons are left to you.[/color][/*]\n<br />[/list][color=#ff0000][size=4]FOR BUG REPOT PLEASE READ:[/size][/color]\n<br />[b][u]Please fill the template with your information to speed up fix process and post it:[/u][/b]\n<br />[list]\n<br />[*]Please provide provide a full list of your currently active mods.[/*]\n<br />[*]Provide exact steps you are doing to reproduce the issue, and what exactly happens as detailed as possible.[/*]\n<br />[*]Please provide your [b]NEWEST .txt [/b]log file, sort it by newest \"Date modified\" [b]after [/b]reproducing the issue and closing game.\n<br />[b]We need 2 .txt files![/b]\n<br />Files can be located at:\n<br />[i]1.[/i]\n<br />[code]Warhammer 40,000 DARKTIDE&#92;mods&#92;Weapon_XP_Farm&#92;logs[/code][i]folder.\n<br />\n<br />2. [/i]\n<br />[code]C:&#92;Users&#92;USERNAME&#92;AppData&#92;Roaming&#92;Fatshark&#92;Darktide&#92;console_logs[/code][i] folder.[/i]\n<br />Or for quick find that path press WIN + R and paste %appdata%, next go to \n<br />[code]Fatshark&#92;Darktide&#92;console_logs[/code] folder.[/*]\n<br />[/list]\n<br />[b][color=#ff0000][size=4]IMPORTANT NOTE:[/size][/color]\n<br />[/b][size=4]This mod can spend [b][u]A LOT[/u][/b] of your resources in few clicks. [u]Pay attention what [b][color=#ff7700]Consecrate to Rarity[/color][/b] you are choosing.[/u][/size]\n<br />[b][size=4]Usually [color=#ffd966]36-37[/color] copies of a weapon with [color=#00ff00]Redeemed [/color]rarity is enough to get max weapon XP.[/size][/b]\n<br />\n<br />\n<br />\n<br />[size=4][b]Requirements[/b][/size]\n<br />[color=#D4D4D8]Install [u]Darktide Mod Framework[/u][b] ([/b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/8]DMF[/url][b])[/b] and [u]Darktide Mod Loader[/u] ([url=https://www.nexusmods.com/warhammer40kdarktide/mods/19]DML[/url]) if you haven't already. [/color]\n<br />"
