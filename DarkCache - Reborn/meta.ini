nexusDescription="This mod is inspired by Dark Cache, an abandonned mod. It was not written from the files of the original mod, but totally done from scratch.\n<br />Be advised that the mod is coded with an AI, Claude Code.\n<br />\n<br />[b][size=4][u]Item icons[/u][/size][/b]\n<br />\n<br />Darktide rebuilds the same things over and over. Open a vendor, scroll, walk away, come back — every icon is a spinner again, even though nothing about those items changed. DarkCache keeps them for your session. It means it will load them and keep them in the VRAM of your GPU card. \n<br />\n<br />Cosmetics, weapons, gadgets, weapon skins, trinkets, companion gear and player portraits are kept once rendered, so re-opening a screen shows them at once instead of drawing them again one at a time. The cache is bounded by a video memory allowance you set, and drops the icon you looked at longest ago when it is full.\n<br />\n<br />[b][size=4][u]The Mourningstar and the Psykhanium[/u][/size][/b]\n<br />\n<br />The game releases these levels the moment you leave and reads the identical set back off the disk every time you return. DarkCache holds a reference of its own so they stay in memory.\n<br />\n<br />It does not interfere with the game's loading. It never suppresses anything — it only holds on to what the game already loaded, so the loaders keep running exactly as they do without the mod.\n<br />\n<br />No guessing about what this costs you. The mod takes readings around each level load and states them in the options menu, for your machine: video memory, system memory, and how long that level takes to load with and without the cache. Until a level has been loaded once, it says so rather than quoting a number from someone else's PC.\n<br />I cannot stress enough to think twice before activating options if you have a GPU card with a limited VRAM capacity and if you are running a system with a limited RAM capacity. \n<br />\n<br />[size=4][b][u]Options[/u][/b][/size]\n<br />\n<br />[list]\n<br />[*]One video memory allowance for the icon cache — 32 MB to 2 GB, 256 MB by default[/*]\n<br />[*]A toggle per icon family: cosmetics / weapons, skins and companion gear / player portraits[/*]\n<br />[*]A toggle per level: Mourningstar / Psykhanium, each stating what it measured[/*]\n<br />[*]Frames before capture, for those who want the first pass over a screen faster[/*]\n<br />[*]Developer report, which enables the `/debugdarkcache` command[/*]\n<br />[/list]\n<br />[b][size=4][u]Chat commands[/u][/size][/b]\n<br />\n<br />[i]/darkcache[/i] — what each thing is currently costing\n<br />[i]/darkcache_clear[/i] — empty the icon cache (also available as a keybind)\n<br />[i]/debugdarkcache[/i] — memory and load times per level and per icon family; needs Developer report switched on\n<br />\n<br />[u][size=4][b]Limitations[/b][/size][/u]\n<br />\n<br />[list]\n<br />[*]The icon cache lasts one stay in a place. Every loading screen empties it, including a return to the Mourningstar after changing character, since the icons may no longer be the right ones. Nothing survives closing the game either.[/*]\n<br />[*]An icon captured before its textures finished streaming can stay blurry** until the cache is emptied. Lowering \"Frames before capture\" makes that more likely, which is why it is left at the game's own value by default.[/*]\n<br />[/list]"
