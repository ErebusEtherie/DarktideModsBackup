nexusDescription="[size=3][img]https://steamuserimages-a.akamaihd.net/ugc/2028353600788151662/BDF513AC19E0903BB034F020CE64699887BBDEEF/[/img][/size]\n<br />[size=4][color=#f1f1f1][font=Inter, sans-serif][b]+++ [/b][/font][/color][b]Features[/b][/size]\n<br />[size=3]This mod lets you assign hotkeys for the various menus:[/size]\n<br />[b][size=3] - Barber shop.[/size][/b]\n<br />[b][size=3] - Commissary.[/size][/b]\n<br />[b][size=3] - Contracts.[/size][/b]\n<br />[b][size=3] - Crafting menu.[/size][/b]\n<br />[b][size=3] - Credits vendor.[/size][/b]\n<br />[b][size=3] - Expedition Mode.[/size][/b]\n<br />[b][size=3] - Havoc Mode.[/size][/b]\n<br />[b][size=3] - Mission Board.[/size][/b]\n<br />[b][size=3] - Premium Store.[/size][/b]\n<br />[b][size=3] - Shrine Penitentax.[/size][/b]\n<br />[b][size=3] - Social menu.[/size][/b]\n<br />[b][size=3] - Training Grounds.[/size][/b]\n<br />[b] - Inventory.[/b]\n<br />\n<br />[size=3]Use hotkeys in the Mourningstar, Psykhanium, Hub, and even during Solo Play missions [i](requires SoloPlay mod)[/i].[/size]\n<br />\n<br />[img]https://images.steamusercontent.com/ugc/2028353600788244604/F7F901141085ADEF920CE9FF2F24EB4AFFDC5C16/[/img]\n<br />[size=4][color=#f1f1f1][font=Inter, sans-serif][b]+++ [/b][/font][/color][b]Notes[/b][/size]\n<br />[size=3]- All hotkeys are configurable in the mod options (F4 by default).[/size]\n<br />[size=3][img]https://steamuserimages-a.akamaihd.net/ugc/2028353404259516040/8513EF823472650B70486E6E7664D0E5A68C4E7C/[/img][/size]\n<br />[color=#f1f1f1][font=Inter, sans-serif][b][size=4]+++ Manual Installation[/size][/b][/font][/color]\n<br />[size=3]1. Unzip and place the folder named \"[/size]menu_hotkeys[size=3]\" into your \"mods/\" directory.[/size]\n<br />[size=3]2. Add \"[/size]menu_hotkeys[size=3]\" to \"mod_load_order.txt\".[/size]\n<br />[img]https://steamuserimages-a.akamaihd.net/ugc/2028353404259516034/AFBC824426A0BE9A3E83555D41CE5AF8703DA25D/[/img]\n<br />[color=#f1f1f1][size=4][font=Inter, sans-serif][b]+++ [/b][/font][/size][/color][color=#f1f1f1][font=Inter, sans-serif][size=4][b]Incompatibilities[/b][/size][/font][/color]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/775]Expeditions Hotkey[/url] -- The function of opening the Expeditions view will be duplicated.\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/18]Hub Hotkeys[/url] -- The function of opening views of different menus will be duplicated.\n<br />[img]https://images.steamusercontent.com/ugc/2028353600788244604/F7F901141085ADEF920CE9FF2F24EB4AFFDC5C16/[/img]\n<br />[img]https://steamuserimages-a.akamaihd.net/ugc/2028353404259516040/8513EF823472650B70486E6E7664D0E5A68C4E7C/[/img]\n<br />[size=4][color=#f1f1f1][font=Inter, sans-serif][b]+++ [/b][/font][/color][b]Main author[/b][/size]\n<br />[size=3][b]- [/b][url=https://www.nexusmods.com/profile/dalokraff][b]dalokraff[/b][/url][b] [/b]-- [url=https://github.com/dalokraff/hub_hotkey_menus][b]Github[/b][/url][/size]\n<br />\n<br />[b][size=4]Improved by community:[/size][/b]\n<br />[size=3]- [b][url=https://github.com/Bzly]Bzly[/url][/b] -- added Penances view support.[/size]\n<br />[size=3]- [b][url=https://github.com/deluxghost]deluxghost[/url][/b] -- [/size]added Simplified Chinese localization.\n<br />[size=3]- [b][url=https://next.nexusmods.com/profile/Evildeathpro]Evildeathpro[/url] [/b]-- added Expeditions support.[/size]\n<br />[size=3]- [b][url=https://github.com/Macabre0001]Macabre0001[/url][/b] -- added Havoc support.[/size]\n<br />[size=3]- [b][url=https://github.com/xsSplater]xsSplater[/url][/b] -- refactoring, added all other localizations, added Solo Mode support, and other stuff.[/size]\n<br />[img]https://steamuserimages-a.akamaihd.net/ugc/2028353404259516034/AFBC824426A0BE9A3E83555D41CE5AF8703DA25D/[/img]\n<br />[url=https://github.com/xsSplater/Darktide-Menu-Hotkeys][b][size=4]GITHUB[/size][/b][/url]\n<br />[img]https://steamuserimages-a.akamaihd.net/ugc/2028353600788151662/BDF513AC19E0903BB034F020CE64699887BBDEEF/[/img]"
