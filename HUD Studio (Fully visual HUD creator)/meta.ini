nexusDescription="[size=4][b][font=Arial Black]Discord channel (for bugs or discussion): [/font][/b][font=Arial]https://discord.com/channels/1048312349867646996/1545816384578003099[/font][/size]\n<br />\n<br />[size=4][font=Arial Black]Update 1.2[/font][/size]\n<br />API support is here. See this github repo for a quick-start guide and an API reference:\n<br />https://github.com/matt-sr/HUD-Studio-Docs\n<br />\n<br />Sample mod showing how to register is here:\n<br />https://www.nexusmods.com/warhammer40kdarktide/mods/1294\n<br />\n<br />[size=4][img]https://staticdelivery.nexusmods.com/mods/4943/images/1263/1263-1788616406-725808515.png[/img][/size]\n<br />\n<br />[center][size=4]Ever wanted to create your own HUD in Darktide without having to code? This mod is for you![/size]\n<br />[size=3]No, I don't mean 'place existing elements around in different places', I mean make it look exactly how you want.[/size]\n<br />\n<br />[left]The UI of this mod is similar to popular image editing tools like Photoshop. The core concepts are the same: place elements on your canvas and style them as you wish.\n<br />\n<br />This mod gives you tools to change how things appear and what appears based on defined data sources. Elements can be given extensive (or basic) rules for when they should be visible.\n<br />\n<br />[img width=556]https://staticdelivery.nexusmods.com/mods/4943/images/1263/1263-1788617573-429940662.png[/img][/left]\n<br />[/center]\n<br />[size=4][b]Anyone[/b][/size]\n<br />I imagine it's useful for anyone who likes tweaking with the HUD, or likes customisation.\n<br />\n<br />Since no coding is required, it should be pretty accessible to all, as long as you have a look at the mod images, which give you a visual guide of how things work. I did my best to keep it intuitive, but after weeks of staring at it, it's hard to know what isn't entirely obvious.\n<br />\n<br />Working on proper documentation right now!\n<br />\n<br />[size=4][b]Mod Authors[/b][/size]\n<br />Modders can build their HUDs visually with this mod and export into a new or existing mod. From your mod, you register via HUD Studio (about 20 lines of code) and users who install your mod + HUD Studio will find your elements in their library. The API is particularly useful for introducing new and complete HUD elements, whether driven by the vanilla game or by your mod logic.\n<br />\n<br />[b]Making mods with HUD Studio as a dependency[/b]\n<br />Since HUD Studio has a built-in code editor, you can write the core of your HUD logic inside your mod lua files in your dev environment of choice, and expose functions or state to HUD Studio elements. DPS mod example:\n<br />\n<br />Inside your DPS mod:\n<br />[list]\n<br />[*]Hook the game for attack results and calculate DPS[/*]\n<br />[*]Add settings to your mod as usual [/*]\n<br />[*]Expose DPS value, styling, layout (with settings applied) to your mod handle[/*]\n<br />[/list]Inside this mod's script editor:\n<br />[list]\n<br />[*]Retrieve your mod handle with get_mod()[/*]\n<br />[*]Apply value, styling, layout from your mod handle[/*]\n<br />[/list]In the end, you don't have to bother with scenegraph code, have a cleaner split between layout and HUD, and can build your HUD visually.\n<br />\n<br />https://github.com/matt-sr/HUD-Studio-Docs\n<br />\n<br />[b]Prototyping[/b]\n<br />If you have ideas and want to see if they transfer to the game well, make some mockups with a visual editor (and a browser for all the game's UI textures/materials) rather than commit to scenegraph straight away.\n<br />\n<br />[b]Debugging[/b]\n<br />I don't like crawling through echo messages in the chat, especially if you want to echo more than one thing at a time. Create a few text elements that read your intended values, one each, and see them update in real-time. If anything breaks, the game won't crash, either.\n<br />\n<br />[size=4][img width=544]https://staticdelivery.nexusmods.com/mods/4943/images/1263/1263-1788617869-307509215.png[/img][/size]\n<br />\n<br />Anything, really. Here's an example of a fancy panel I made with the mod (Is included with mod in the library):\n<br />\n<br />[img width=889]https://staticdelivery.nexusmods.com/mods/4943/images/1263/1263-1788618049-1007673622.png[/img]\n<br />\n<br />No code was written to make the above player panel. It's all data sources, dynamic coloring, and textures (with a provided texture browser)\n<br />\n<br />Everything is drag and drop, with corner resize handles. Click and drag baby.\n<br />\n<br />There's a built in code editor which lets you write quick scripts to change almost anything about how an element looks or what data is pulls. Might be a fun place to learn lua.\n<br />\n<br />If you want it to do something really basic, you can do that too. Make an ammo readout, a bar showing ammo remaining for teammates, a dodge counter with a refresh timer bar... etc.\n<br />\n<br />[img width=556]https://staticdelivery.nexusmods.com/mods/4943/images/1263/1263-1788618894-374480062.png[/img]\n<br />The images explain this better, but in summary:\n<br />[list]\n<br />[*]Create folders to group blocks[/*]\n<br />[*]Create blocks to group nodes, and define rules for displaying/hiding all of it's nodes[/*]\n<br />[*]Add nodes to blocks to display textures, text, progress bars, timers... etc.[/*]\n<br />[/list]Everything is visual. Drag and drop, click to resize, double click to rename, right click for context menu, dropdowns for data...\n<br />\n<br />Here are the 3 node types:\n<br />[list]\n<br />[*]Rectangle\n<br />Mainly used for visuals rather function, but can be bound to display dynamic icons, like a player's equipped weapons. In short, this is a simple 'box' to which you can assign a color, or an in-game texture. [/*]\n<br />[*]Text\n<br />The way to display any text, whether static or dynamic. You can set between 1-10 values (dynamic or static) which the engine will glue together and form a single piece of text. For example, you might want to have an ammo counter that says \"Ammo: \" and then the actual ammo remaining. This would look like this:[/*]\n<br />[/list][img width=655]https://staticdelivery.nexusmods.com/mods/4943/images/1263/1263-1788619200-65910002.png[/img]\n<br />[list]\n<br />[*]Progress bar\n<br />This is a rectangle or curve that fills from 0-100 based on the current value and the max.\n<br />\n<br />This can be used for anything from health bars to timers.\n<br />\n<br />Don't think of this as 'progress' strictly. It's simply a bar that will fill as current progresses to max.\n<br />\n<br />The bar (or curve) segments can represent fixed values like 25% increments - or they can be dynamically updated, for example, the stamina of the current weapon you have in hand. A basic example of data source segments would be displaying a player's wounds in a health bar.[/*]\n<br />[/list][img width=660]https://staticdelivery.nexusmods.com/mods/4943/images/1263/1263-1788619357-28912504.png[/img]\n<br />Yes! That's why there's a way to disable/move the vanilla HUD elements:\n<br />\n<br />[img width=497]https://staticdelivery.nexusmods.com/mods/4943/images/1263/1263-1788619667-1211060399.png[/img]\n<br />\n<br />I am planning to extend this to allow disabling by class and/or gamemode\n<br />\n<br />[center][img width=649]https://staticdelivery.nexusmods.com/mods/4943/images/1263/1263-1788620020-1640088746.png[/img][/center]\n<br />\n<br />Install as you would any other mod. No dependencies. Place at top of load order.\n<br />\n<br />[size=4][b]NOTE: You may experience a small freeze-up or two on first load of the mod/opening the editor/making changes. [/b][/size]\n<br />\n<br />[size=4][b]This is [i]normal[/i]. It's the motive force inside the mod making its way through your cogitator. (It will only happen once)[/b][/size]\n<br />\n<br />Once installed, assign a bind to open the editor while in a match (Does not work outside of Mourningstar, Missions and Meatgrinder, by design)\n<br />\n<br />Follow the mod images for instructions- proper documentation coming soon!\n<br />[center][/center]\n<br />[center][b]Show a token of appreciation on kofi :) [/b][/center]\n<br />[center][/center]\n<br />[center][b][b][img width=91]https://staticdelivery.nexusmods.com/mods/4943/images/1064/1064-1789110687-1255152112.png[/img][/b][/b][/center]\n<br />[center][b][url=https://ko-fi.com/matt_sr][/url][b][color=#e4e4e7][url=https://ko-fi.com/matt_sr]https://ko-fi.com/matt_sr[/url][/color][/b][/b][/center]\n<br />\n<br />[center][img width=651]https://staticdelivery.nexusmods.com/mods/4943/images/1263/1263-1788620262-381895274.png[/img][/center]\n<br />\n<br />Massive thanks to [url=https://www.nexusmods.com/profile/GeoffFromAccounting]Geoff From Accounting![/url] He has been invaluable in testing this mod to release. Their mods:\n<br />[list]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1238]Tools of the Omnissiah - Extended Weapon Customisation Plugin[/url][/*]\n<br />[/list][left]Also thanks to [url=https://www.nexusmods.com/profile/fviuff?gameId=4943]Fviuff[/url] for his work on [url=https://github.com/fviuff/ResourceLoader]ResourceLoader[/url] from which I've built the material browser and other features. Their mods:[/left]\n<br />[list]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1094]NPC Look[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1244]NoBrainer[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/875]Curio Hunter[/url][/*]\n<br />[/list]"
