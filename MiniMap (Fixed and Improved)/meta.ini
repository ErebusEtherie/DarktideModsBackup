nexusDescription="Standalone mod that gives you an actual working minimap on your screen. It is fully customisable, so you can tweak the size, zoom level, and opacity. It tracks teammates and objectives so it makes it a lot easier to stay grouped up during fights and not get lost.\n<br />\n<br />NOW SHOWS STRIKEMAP. If you install [url=https://www.nexusmods.com/warhammer40kdarktide/mods/1022]Strike Map[/url] mod, you can see the real mission map live! Please when you install it, disable their minimap in settings!\n<br />\n<br />Credit to [url=https://github.com/igromanru]igromanru[/url] as I used his [url=https://github.com/igromanru/DarkTide-minimap-Fork/commits?author=igromanru]version[/url] and my put fixes on top of it! And thanks to @ItsAlxl for helping me with the code for the broken class icons!\n<br />Also, big thanks to the creator of the [url=https://www.nexusmods.com/warhammer40kdarktide/mods/520]Ring hud [/url]mod as I used some of the icons he uses for the downed teammates. ALSO also thanks to @Tdopz\n<br />for the help with improving the logic for tracking enemies without the use of healthbars!\n<br />\n<br />[b]Links:[/b]\n<br />[url=https://github.com/MaddyMarv/MiniMap-Fixed-and-Improved-]Source Code[/url] | [url=https://www.nexusmods.com/profile/indicabunny]Nexus Mods Profile[/url] | [url=https://ko-fi.com/indicabunny]Support Me on Ko-fi[/url]\n<br />[url=https://ko-fi.com/indicabunny][/url]\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />"
