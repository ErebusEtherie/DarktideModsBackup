nexusDescription="[b][size=3]Github:\n<br />[url=https://github.com/Vansinnet/BetterBrainer]https://github.com/Vansinnet/BetterBrainer[/url][/size] [/b]\n<br />\n<br />[size=4][b]What does this mod do?[/b][/size]\n<br />[size=3]This is a complete rewrite of the old NoBrainer mod (which was removed by a moderator for being too strong). This mod only does what other mods available on Nexus do. You just don't need to download 5-6 other mods here on Nexus to get the same functionality.[/size]\n<br />\n<br />[size=3]It can help with all minigames available in the Darktide code. It will NOT do hacky things like some of the things NoBrainer did (like sending a servo skull through walls, or doing rerolls of minigames to get a better seed). In return, I could write this mod to be very specific and streamlined (meaning less code and less taxing on system performance).[/size]\n<br />\n<br />[size=3]I myself prefer this version over the old NoBrainer, because it's not \"hacky\" or \"cheaty\", and does its job super well. [/size]\n<br />\n<br />Down below are other mods that does the same thing as this mod (but not as cleanly written, and you'd need to install most of them separately to get the same functionality as in BetterBrainer). Feel free to use them, but make sure not to use them at the same time with BetterBrainer.\n<br />\n<br />\n<br />Auspex Helper:\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/757]https://www.nexusmods.com/warhammer40kdarktide/mods/757[/url]\n<br />Auspex Helper – updated version:\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/1122]https://www.nexusmods.com/warhammer40kdarktide/mods/1122[/url]\n<br />Matching Minigame Helper:\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/764]https://www.nexusmods.com/warhammer40kdarktide/mods/764[/url]\n<br />Decode Symbols Minigame Helper:\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/252]https://www.nexusmods.com/warhammer40kdarktide/mods/252[/url]\n<br />Decode Symbols Minigame Solver:\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/426]https://www.nexusmods.com/warhammer40kdarktide/mods/426[/url]\n<br />Train Minigame Solver:\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/420]https://www.nexusmods.com/warhammer40kdarktide/mods/420[/url]\n<br />Tree Minigame Helper:\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/369]https://www.nexusmods.com/warhammer40kdarktide/mods/369[/url]\n<br />Scan Helper:\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/657]https://www.nexusmods.com/warhammer40kdarktide/mods/657[/url]\n<br />Scan Helper:\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/352]https://www.nexusmods.com/warhammer40kdarktide/mods/352[/url]\n<br />\n<br />Mod is also available here:\n<br />[url=https://github.com/Vansinnet/BetterBrainer]https://github.com/Vansinnet/BetterBrainer[/url]"
