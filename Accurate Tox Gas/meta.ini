nexusDescription="[size=4][b]Description[/b][/size]\n<br />[color=#D4D4D8]This mod makes tox gas visually match its effect duration. Without it, tox gas lingers a few seconds afterwards, making it difficult to see when it's truly safe to pass through.\n<br />\n<br />Optionally, the debuff indicator can be customized to show the remaining time of the gas cloud you're currently in.[/color]\n<br />\n<br />[size=4][b]Main features[/b][/size]\n<br />[list]\n<br />[*][size=2][color=#D4D4D8]Accurate tox gas visuals that match its internal danger window[/color][/size][/*]\n<br />[*][size=2][color=#D4D4D8]Customizable timed debuff icon while standing in tox gas[/color][/size][/*]\n<br />[*][color=#D4D4D8][size=2]Works only for Tox Bomber gas.[/size][/color][/*]\n<br />[/list]"
