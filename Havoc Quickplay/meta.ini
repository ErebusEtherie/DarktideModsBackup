nexusDescription="This mod adds Havoc as a new difficulty to the mission terminal, where you can adjust the minimum and maximum havoc rank. This works with either:\n<br />HOST MODE - Hosts a havoc lobby using the \"My Havoc Assignment\" setting. Rank range will auto-accept/decline the people that fall within your chosen range (if the option is enabled). For example, you set your minimum to 29, and the maximum to 38. It will accept any player who has an [b]assignment rank [/b]of 29 to 38. Keep in mind that this will read their [b]TRUE [/b]havoc rank, so someone who has beaten a high havoc mission once while having a low rank mission of say, like 18, will be declined because [u]18[/u] counts as their true rank. It is entirely up to the host to accept them, so I don't see an issue with this. \n<br />QUEUE MODE - The mod will search for havoc lobbies that have a range between the set numbers, requesting to join each one of them. If the player's request is accepted, a countdown of 8 seconds will start, and once it hits 0, the player will automatically join the lobby with the highest amount of players, regardless of how many lobbies accepted the join request. It's possible to queue for another party if you're already in one, and it will attempt to join only the ones that would have more players than yours (includes YOU, so for example if you're in a lobby with 3 players including yourself, it'll only join ones with 3 other players, making it 4 with you in there). [b]Oh, you can also be in a queue and start a match of auric, for example, while you wait[/b], either through the mission terminal or by typing /[b]hqp_q. [/b]However, this unfortunately [u]cannot[/u] work while hosting the lobby. \n<br />\n<br />Features include:\n<br />Auto-Accept/Decline Join Requests - As explained above, auto accepts/declines players based on the havoc rank range you picked.\n<br />Auto-Accept Havoc Mission - Accepts the mission when a player puts it up in a lobby.\n<br />Auto Start on Full Lobby - When YOU are the host and your lobby reaches 4 players, it will automatically put up your assigned havoc mission.\n<br />Refresh interval - How often the mod should refresh the party finder page. Minimum 10 seconds.\n<br />Lobby Blacklist - Applies only to the queue system. If you keep getting into a lobby that you really don't want to be in, press escape and click on \"Leave and Blacklist Lobby\". It'll temporarily prevent the mod from sending join requests to it. Alternatively type /hqp_bl\n<br />\n<br />[b]Got declined from a lobby while queuing? Change characters, or wait 5 minutes and the mod will be able to queue for those lobbies again. [/b]This is done so that you avoid spamming people and getting yourself blocked. But I find that it's okay to try your luck with a different class because people might just not have wanted the class you're playing in their lobby.\n<br />\n<br />While I'd have loved to create an actual matchmaking system that functions exactly like the one built into the game, I believe this is the closest that we can get with mods. "
