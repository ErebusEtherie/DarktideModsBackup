nexusDescription="[center][size=6][b][color=#E8B44F]CUSTOM HUD[/color][/b][/size]\n<br />[i]Drag, resize, and manage every HUD element — exactly where you want it.[/i][/center]\n<br />\n<br />[line]\n<br />\n<br />[size=5][b][color=#E8B44F]Overview[/color][/b][/size]\n<br />Custom HUD turns the entire in-game interface into a drag-and-drop editor. Enter edit mode, grab any HUD element — health, ammo, ability, portraits, buffs, boss bars, feeds, anything — and move it, scale it, resize it, restack it, hide it, or fine-tune it to the pixel. Your layout is saved per element and restored every session.\n<br />\n<br />No config files. No coordinates to guess. Press a key, drag, done.\n<br />\n<br />[line]\n<br />\n<br />[size=5][b][color=#E8B44F]Installation Tips[/color][/b][/size]\n<br />[list]\n<br />[*][b]Mod will automatically read any existing Custom HUD settings. [/b]Existing element placements will be read and used.[/*]\n<br />[*][i][size=2]Starting from scratch is recommended if you experience issues[/size][/i][i][size=2].[/size][/i][i][size=2] The mod option to reset the HUD to default is still valid and working. Backup your settings for reference and if you wish to restore later after any culprit is identified.[/size][/i][/*]\n<br />[/list]\n<br />[line]\n<br />\n<br />[size=5][b][color=#E8B44F]Core Features[/color][/b][/size]\n<br />[list]\n<br />[*][b]Move anything[/b] — reposition any HUD element by dragging.[/*]\n<br />[*][b]Resize &amp; scale[/b] — stretch element bounds or scale the whole widget.[/*]\n<br />[*][b]Depth control[/b] — change draw order (z-order) so elements layer the way you want.[/*]\n<br />[*][b]Multi-select[/b] — edit several elements at once.[/*]\n<br />[*][b]Pixel-perfect editing[/b] — a floating Info Panel lists every element with editable X / Y / Z / W / H fields.[/*]\n<br />[*][b]Snapping[/b] — snap to a configurable grid and to the edges/centres of other elements.[/*]\n<br />[*][b]Hide elements[/b] — remove any element from the HUD entirely, or just stash it out of the editor while you work.[/*]\n<br />[*][b]Ignore list[/b] — park elements you never want to touch.[/*]\n<br />[*][b]Hide the whole HUD[/b] — one key for clean screenshots.[/*]\n<br />[*][b]HUD opacity[/b] — dim the entire interface.[/*]\n<br />[*][b]Editor colours[/b] — fully recolour the edit-mode boxes and borders (see Options).[/*]\n<br />[*][b]Per-element persistence[/b] — layouts save and reload automatically.[/*]\n<br />[*][b]Lightweight[/b] — lazy hooks, cached settings and a single re-pin pass; zero cost when you're not editing.[/*]\n<br />[/list][line]\n<br />\n<br />[size=5][b][color=#E8B44F]Installation[/color][/b][/size]\n<br />[list]\n<br />[*]Install with [b]Darktide Mod Framework[/b] and enable it in the mod list.[/*]\n<br />[*][b][color=#E8B44F]Upgrading from an older version?[/color][/b] Strongly recommended: [b]delete the old saved settings and start from scratch.[/b] Stale layouts from a previous build can cause elements to sit in odd places or behave strangely. Use [color=#8CB4DC]/reset_hud[/color] (or the [b]Reset HUD[/b] option), then rebuild your layout — it only takes a minute and avoids weird behaviour.[/*]\n<br />[/list][line]\n<br />[size=5][b][color=#E8B44F]Getting Started[/color][/b][/size]\n<br />[list]\n<br />[*]Press [b][color=#8CB4DC]F3[/color][/b] to toggle [b]edit mode[/b]. Element boxes appear over the HUD and the Info Panel opens.[/*]\n<br />[*]Drag elements into place, tweak them, then press [b][color=#8CB4DC]F3[/color][/b] again to exit. Everything is saved.[/*]\n<br />[*]Press [b][color=#8CB4DC]F2[/color][/b] any time to hide/show the whole HUD.[/*]\n<br />[/list][i](Both keys are rebindable in the mod options.)[/i]\n<br />[line]\n<br />[size=5][b][color=#E8B44F]Controls (Edit Mode)[/color][/b][/size]\n<br />\n<br />[b][color=#E2C77E]Select &amp; Reset[/color][/b]\n<br />[list]\n<br />[*][color=#8CB4DC]Left-click[/color] — Select element[/*]\n<br />[*][color=#8CB4DC]Ctrl+Click[/color] — Add / remove from selection (multi-select)[/*]\n<br />[*][color=#8CB4DC]Double-click element[/color] — Reset that element to default[/*]\n<br />[*][color=#8CB4DC]Tab[/color] — Reset the selected element[/*]\n<br />[/list]\n<br />[b][color=#E2C77E]Move[/color][/b]\n<br />[list]\n<br />[*][color=#8CB4DC]Shift+Drag[/color] — Move selection[/*]\n<br />[*][color=#8CB4DC]Arrow keys[/color] — Nudge 1px (or fixed step)[/*]\n<br />[*][color=#8CB4DC]Ctrl+Shift while dragging[/color] — Invert snapping[/*]\n<br />[*][color=#8CB4DC]Ctrl+Shift+C[/color] — Centre on screen[/*]\n<br />[/list]\n<br />[b][color=#E2C77E]Size / Depth / Scale[/color][/b]\n<br />[list]\n<br />[*][color=#8CB4DC]Alt+Drag edge or corner[/color] — Resize[/*]\n<br />[*][color=#8CB4DC]Alt+Arrow keys[/color] — Resize 1px (or step)[/*]\n<br />[*][color=#8CB4DC]Shift+Up / Down[/color] — Change z-order / depth[/*]\n<br />[*][color=#8CB4DC]Scroll wheel on element[/color] — Scale[/*]\n<br />[/list]\n<br />[b][color=#E2C77E]Visibility[/color][/b]\n<br />[list]\n<br />[*][color=#8CB4DC]Right-click[/color] — Hide element from the HUD[/*]\n<br />[*][color=#8CB4DC]Click the row box (Info Panel)[/color] — Stash from editor (element stays in the HUD)[/*]\n<br />[*][color=#8CB4DC]Double-click a panel row[/color] — Send element to the Ignore list[/*]\n<br />[/list]\n<br />[b][color=#E2C77E]Info Panel[/color][/b]\n<br />[list]\n<br />[*][color=#8CB4DC]Drag header[/color] — Move the panel[/*]\n<br />[*][color=#8CB4DC]Scroll[/color] — Scroll the element list[/*]\n<br />[*][color=#8CB4DC]Click a value (X/Y/Z/W/H)[/color] — Edit it: type a number, press Enter[/*]\n<br />[/list][line]\n<br />[size=5][b][color=#E8B44F]The Customization Panel[/color][/b][/size]\n<br />The floating panel that opens in edit mode is your command centre. Its title shows the total element count.\n<br />\n<br />[b][color=#E2C77E]Header buttons[/color][/b]\n<br />[list]\n<br />[*][b]Legend[/b] — open/close the on-screen controls reference.[/*]\n<br />[*][b]Stash (N)[/b] — reveal the elements you've stashed so you can bring them back. N is how many are stashed.[/*]\n<br />[*][b]Ignore (N)[/b] — open the Ignore list. N is how many are ignored.[/*]\n<br />[/list]\n<br />[b][color=#E2C77E]The element list[/color][/b]\n<br />Every HUD element is a row. Row colour shows its state at a glance (see below). Controls:\n<br />[list]\n<br />[*][color=#8CB4DC]Hover a row[/color] — highlights that element on screen so you can find it.[/*]\n<br />[*][color=#8CB4DC]Click a row[/color] — selects the element (same as clicking it in the world).[/*]\n<br />[*][color=#8CB4DC]Right-click a row[/color] — hide the element from the HUD.[/*]\n<br />[*][color=#8CB4DC]Click the box at the end of a row[/color] — stash the element from the editor.[/*]\n<br />[*][color=#8CB4DC]Double-click a row[/color] — send the element to the Ignore list.[/*]\n<br />[*][color=#8CB4DC]Scroll[/color] — scroll the list. [color=#8CB4DC]Drag the header[/color] — move the panel.[/*]\n<br />[/list]\n<br />[b][color=#E2C77E]Precise editing[/color][/b]\n<br />With an element selected, the panel's detail area shows editable [b]X / Y / Z / W / H[/b] fields. Click a value, type a number, press [color=#8CB4DC]Enter[/color] — pixel-exact placement without dragging.\n<br />[line]\n<br />[size=5][b][color=#E8B44F]Stash, Ignore &amp; Hide — what's the difference?[/color][/b][/size]\n<br />Three separate ways to get an element out of your way:\n<br />[list]\n<br />[*][b][color=#EB962D]Stash [S][/color][/b] — removes the element's edit box from the [i]editor[/i] to reduce clutter while you work. [b]The element still shows in your live HUD.[/b] Toggle it back with the [b]Stash[/b] button.[/*]\n<br />[*][b][color=#E62D2D]Hidden [H][/color][/b] — removes the element from your [i]actual in-game HUD[/i]. Right-click the element (or its row) to toggle. This one sticks in real matches.[/*]\n<br />[*][b][color=#8C469B]Ignore[/color][/b] — fully excludes the element from Custom HUD: no edit box, not managed at all. It moves to the Ignore list; [b]double-click it there to restore[/b].[/*]\n<br />[/list]Rows are tinted by state — [color=#EB962D]orange = stashed[/color], [color=#E62D2D]red = hidden[/color], [color=#8C469B]purple = both[/color] — so you always know where an element stands.\n<br />[line]\n<br />[size=5][b][color=#E8B44F]Snapping &amp; the Grid[/color][/b][/size]\n<br />Two snapping systems help you line elements up cleanly while dragging. Both apply when moving a [b]single[/b] selected element.\n<br />\n<br />[b][color=#E2C77E]Display Grid[/color][/b]\n<br />Overlays an alignment grid in edit mode, sized by [b]Grid Columns[/b] (1–54) and [b]Grid Rows[/b] (1–27). Turning the grid on reveals the two snap toggles below it.\n<br />\n<br />[b][color=#E2C77E]Snap to Grid[/color][/b]\n<br />Dragged elements lock to the nearest grid line, so everything lines up to the same rows and columns. Adjust the grid density to make the snap finer or coarser.\n<br />\n<br />[b][color=#E2C77E]Snap to Elements[/color][/b]\n<br />Dragged elements magnetically align to [i]other[/i] HUD elements. It snaps on both axes to:\n<br />[list]\n<br />[*][b]Matching edges[/b] — left-to-left, right-to-right, top-to-top, bottom-to-bottom.[/*]\n<br />[*][b]Centres[/b] — centre-to-centre alignment.[/*]\n<br />[*][b]Adjacency[/b] — butt one element's edge right up against another's.[/*]\n<br />[/list]\n<br />[b][color=#E2C77E]Invert on the fly[/color][/b]\n<br />Hold [color=#8CB4DC]Ctrl[/color] while dragging to [b]invert[/b] snapping: if a snap is on it's momentarily off (free placement), and if it's off it's momentarily on. No need to open the menu to nudge something into or out of a snap.\n<br />\n<br />[i]All three can also be toggled with[/i][color=#8CB4DC]/snap_to_grid[/color], [color=#8CB4DC]/snap_to_elements[/color][i]and[/i][color=#8CB4DC]/grid &lt;cols&gt; &lt;rows&gt;[/color].\n<br />[line]\n<br />[size=5][b][color=#E8B44F]Options — General[/color][/b][/size]\n<br />[list]\n<br />[*][b]Toggle HUD Customization[/b] — edit-mode key (default [color=#8CB4DC]F3[/color]).[/*]\n<br />[*][b]Toggle HUD[/b] — hide/show the whole HUD (default [color=#8CB4DC]F2[/color]).[/*]\n<br />[*][b]Opacity[/b] — global HUD transparency (0.00–1.00).[/*]\n<br />[*][b]Show Info Panel[/b] — show the floating element list in edit mode.[/*]\n<br />[*][b]Panel Font[/b] — 7 choices: Proxima Nova Bold / Light / Medium, Machine Medium, ITC Novarese, Friz Quadrata, Rexlia.[/*]\n<br />[*][b]Panel Font Size[/b] — 10–28.[/*]\n<br />[*][b]Panel Scale[/b] — 0.75–2.0 (scales the panel, row spacing and detail area).[/*]\n<br />[*][b]Panel List Rows[/b] — 8–30 rows before the list scrolls.[/*]\n<br />[*][b]Panel Width[/b] — 220–700 px.[/*]\n<br />[*][b]Element Box Fill[/b] — [i]Fill[/i] (solid boxes) or [i]No Fill[/i] (outlines only).[/*]\n<br />[*][b]Fixed Arrow Move[/b] — make each arrow tap move a fixed number of pixels instead of ±1px. Reveals: [i]Arrow Move Step[/i], [i]Resize Step[/i], [i]Z Step[/i].[/*]\n<br />[*][b]Display Grid[/b] — show the alignment grid. Reveals: [i]Snap to Grid[/i], [i]Snap to Elements[/i], [i]Grid Columns[/i] (1–54), [i]Grid Rows[/i] (1–27).[/*]\n<br />[*][b]Reset HUD[/b] — restore the default layout.[/*]\n<br />[/list]\n<br />[size=5][b][color=#E8B44F]Options — Colors[/color][/b][/size]\n<br />Recolour the edit-mode boxes. Five sections — [b]Box Fill[/b] and the [b]Top / Bottom / Left / Right[/b] borders — each with four states and its own transparency:\n<br />[list]\n<br />[*][b]Default[/b] — resting colour + [i]Transparency[/i] (0–255)[/*]\n<br />[*][b]Hovered[/b] — colour + [i]Transparency[/i][/*]\n<br />[*][b]Hidden[/b] — colour + [i]Transparency[/i][/*]\n<br />[*][b]Hidden hovered[/b] — colour + [i]Transparency[/i][/*]\n<br />[/list]Colours are chosen from the full game palette, and [b]each name in the dropdown is drawn in its own colour[/b] so you can pick by sight. Purely cosmetic — it only affects the editor overlay, never your gameplay HUD.\n<br />\n<br />[line]\n<br />\n<br />[size=5][b][color=#E8B44F]Chat Commands[/color][/b][/size]\n<br />[list]\n<br />[*][color=#8CB4DC]/reset_hud[/color] — restore the default HUD[/*]\n<br />[*][color=#8CB4DC]/panel[/color] — toggle the Info Panel[/*]\n<br />[*][color=#8CB4DC]/grid &lt;cols&gt; &lt;rows&gt;[/color] — set the grid size[/*]\n<br />[*][color=#8CB4DC]/snap_to_grid &lt;on/off&gt;[/color] — toggle grid snapping[/*]\n<br />[*][color=#8CB4DC]/snap_to_elements &lt;on/off&gt;[/color] — toggle element snapping[/*]\n<br />[/list]\n<br />[line]\n<br />\n<br />[size=5][b][color=#E8B44F]Compatibility &amp; Notes[/color][/b][/size]\n<br />[list]\n<br />[*]Requires [b]Darktide Mod Framework[/b].[/*]\n<br />[*]Works with modded HUD elements too — if another mod adds a HUD element, you can move it.[/*]\n<br />[*][b]Alf's DMF Extensions[/b] is [i]optional[/i]; with it, the settings split into tidy [b]General[/b] and [b]Colors[/b] tabs. Everything works fully without it.[/*]\n<br />[*]Layouts are stored per element. If you disable a mod that added an element, that element is simply skipped.[/*]\n<br />[/list]\n<br />[line]\n<br />\n<br />[center][size=4][b][color=#E8B44F]Maintained by Sungrief[/color][/b][/size]\n<br />[color=#E2C77E]Original author: [/color][url=https://www.nexusmods.com/profile/Fracticality][color=#E2C77E]F[/color][/url][url=https://www.nexusmods.com/profile/Fracticality][color=#E2C77E]racticality[/color][/url]\n<br />[i]Continued from the original project. Feedback and bug reports welcome.[/i]\n<br />[/center]\n<br />"
