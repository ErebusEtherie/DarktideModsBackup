nexusDescription="[size=5][url=https://www.nexusmods.com/warhammer40kdarktide/mods/993]Giant update dropped for online scoreboard. Now support all diffs, havoc 40, auric and others. Shows detailed statisctics, players build, weapons, curios ETC. Check it now!\n<br />Вышло гигантское обновление онлайн скорборда, теперь показывает всю стату, билды, оружие и прочее, самая детализированая стата. Чекайте по ссылке. [/url] \n<br />[/size]\n<br />[size=5][b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/973]Wanna see enemy faction on the next havoc mission? Use this. Shows scabs/dregs/mixed in party finder.[/url]\n<br />\n<br />Party Finder Filter[/b][/size]\n<br />\n<br />If you host your own group in the Party Finder, you know the routine. You list the party, then you sit there declining the same requests again and again. This mod takes that part off your hands. You set up who you don't want once, and it quietly turns those requests away before they pile up.\n<br />\n<br />Out of the box it doesn't decline anyone. Nothing is turned on until you say so, so the mod only ever filters exactly what you pick.\n<br />\n<br />It only ever works on a party [b]you[/b] listed yourself, with the \"List own Party\" button. It never does anything in someone else's group, and it never accepts people for you. All it does is decline and hide the requests that don't match your rules, so the list stays clean and you only deal with people you'd actually take.\n<br />\n<br />[size=4][b]What you can filter[/b][/size]\n<br />\n<br />[b]Minimum Havoc rank[/b]\n<br />Putting together a serious Havoc run? Set a minimum rank and anyone below it gets turned away. Slide it to 30, for example, and players whose current Havoc assignment is below rank 30 are declined, whatever class they play. Leave it at 0 and this filter stays off. It only acts on players whose rank it can actually read, so if someone has no current Havoc assignment or their rank just hasn't loaded yet, they're left alone. Nobody gets declined over a slow lookup.\n<br />\n<br />[b]Decline a whole class[/b]\n<br />Sometimes a class just isn't wanted in your run, whether you're tired of it or you're putting together a specific comp. Switch the class off and you won't see another request from it. For example, if you'd rather not have Hive Scum or Arbitrator in your group, turn those two on and their requests get declined for you. Every class is its own toggle, so it's entirely up to you which ones (if any) you filter.\n<br />\n<br />[b]Only one of each class[/b]\n<br />Turn this on for a class, and once a player of that class is in your group (you count too), every other request from that class gets declined. Say you're playing Veteran and want a varied team: enable it for Veteran, and other Veterans get turned away while a Psyker, Zealot or Ogryn can still join. The moment a Psyker joins, further Psykers start getting declined as well, if you set it for them.\n<br />\n<br />[b]Require a certain ability[/b]\n<br />This one is about builds, not just classes. Under each class you'll see its combat abilities, and you tick the ones you'd be happy with. If a request comes from that class but their build doesn't have any of the abilities you ticked, it gets declined. Nothing is ticked by default. A few examples:\n<br />[list]\n<br />[*]You want a Psyker running Telekine Shield for a defensive run. Tick only Telekine Shield under Psyker, and Psykers without it won't get in.[/*]\n<br />[*]You're fine with either option: tick Telekine Shield and Scrier's Gaze, and a Psyker who brought either one is accepted.[/*]\n<br />[*]For Zealot you might want Chorus of Spiritual Fortitude for the team buff. Tick it, and Zealots without Chorus are declined.[/*]\n<br />[*]Same with the new Skitarii. Only want one bringing Voltaic Emitter or Chordclaw Strike? Tick those two.[/*]\n<br />[/list]If you don't tick anything for a class, this filter is simply off for it. The ability names are shown exactly as they appear in game, so you're not guessing.\n<br />\n<br />[b]No PlayStation players[/b]\n<br />One checkbox. If you'd rather not get crossplay requests from PS5, turn it on and those requests are declined automatically, whatever class they're playing.\n<br />\n<br />[b]Notifications[/b]\n<br />You can have a small popup let you know each time a request was turned away, so you can see it's doing its job. If you find it noisy, switch the popups off and it works just as quietly.\n<br />\n<br />Everything is set up in the mod options, class by class. All seven classes are supported, including Skitarii.\n<br />\n<br />[i]Requires the Darktide Mod Framework.\n<br />[/i]\n<br />\n<br />[size=5][b]Party Finder Filter (Фильтр Party Finder)[/b][/size]\n<br />\n<br />Если вы сами собираете группу через Party Finder, картина знакомая. Залистил пати и сидишь, вручную отклоняя одни и те же заявки по кругу. Этот мод берёт рутину на себя. Вы один раз настраиваете, кого видеть не хотите, а он сам тихо отклоняет такие заявки, не давая им копиться.\n<br />\n<br />Из коробки он не отклоняет никого. Пока вы сами что-то не включите, мод не трогает ни одной заявки, так что фильтруется ровно то, что вы выбрали.\n<br />\n<br />Работает только с группой, которую вы залистили [b]сами[/b], кнопкой \"List own Party\". В чужую группу мод не лезет и за вас никого не принимает. Он только отклоняет и убирает из списка заявки, которые не подходят под ваши правила, чтобы список оставался чистым, а вы общались только с теми, кого реально готовы взять.\n<br />\n<br />[size=4][b]Что можно фильтровать[/b][/size]\n<br />\n<br />[b]Минимальный ранг Havoc[/b]\n<br />Собираете серьёзный заход по Havoc? Задайте минимальный ранг, и всех ниже будет отсекать. Поставьте ползунок, скажем, на 30, и игроки, чьё текущее назначение Havoc ниже 30 ранга, отклоняются, каким бы классом ни играли. Оставите 0, фильтр выключен. Срабатывает только на тех, чей ранг удалось прочитать, так что если у игрока нет активного назначения Havoc или ранг ещё не подгрузился, его не трогает. Никого не отклонит просто из-за медленной загрузки.\n<br />\n<br />[b]Отклонять класс целиком[/b]\n<br />Бывает, что какой-то класс в забеге просто не нужен: то ли надоел, то ли вы собираете определённый состав. Выключаете класс, и заявки от него больше не появляются. Например, если не хотите видеть в группе Hive Scum или Arbitrator, включаете эти два, и их заявки отклоняются за вас. Каждый класс это отдельный переключатель, так что только вам решать, кого (и кого вообще) фильтровать.\n<br />\n<br />[b]Только один такого класса[/b]\n<br />Включите для класса, и как только игрок этого класса оказался в группе (вы тоже считаетесь), все остальные заявки от этого класса отклоняются. Например, вы играете за Ветерана и хотите разнообразный отряд: включаете настройку для Ветерана, и другие Ветераны отсекаются, а Псайкер, Зилот и Огрин спокойно заходят. Как только зашёл Псайкер, следующие Псайкеры тоже начнут отклоняться, если вы включили это и для них.\n<br />\n<br />[b]Требовать определённую способность[/b]\n<br />Это уже про билды, а не просто про классы. Под каждым классом показаны его боевые способности, и вы отмечаете те, что вас устроят. Если заявка от этого класса пришла, но в билде нет ни одной из отмеченных способностей, она отклоняется. По умолчанию ничего не отмечено. Пара примеров:\n<br />[list]\n<br />[*]Нужен Псайкер с Telekine Shield для защитного захода. Отмечаете у Псайкера только Telekine Shield, и Псайкеры без него не пройдут.[/*]\n<br />[*]Готовы на любой из вариантов: отметьте Telekine Shield и Scrier's Gaze, и Псайкер с любой из этих способностей будет принят.[/*]\n<br />[*]У Зилота можно захотеть Chorus of Spiritual Fortitude ради баффа команды. Отмечаете его, и Зилоты без Chorus отклоняются.[/*]\n<br />[*]То же и с новым Скитарием. Хотите только с Voltaic Emitter или Chordclaw Strike? Отметьте обе.[/*]\n<br />[/list]Если у класса не отмечено ничего, этот фильтр для него просто выключен. Названия способностей показаны так же, как в игре, гадать не придётся.\n<br />\n<br />[b]Без игроков PlayStation[/b]\n<br />Один чекбокс. Если не хотите получать кроссплей-заявки с PS5, включите его, и такие заявки отклоняются сами, каким бы классом ни играл человек.\n<br />\n<br />[b]Уведомления[/b]\n<br />Можно включить небольшое всплывающее сообщение при каждом отклонении, чтобы видеть, что мод работает. Если мешает, выключите уведомления, и он будет делать то же самое молча.\n<br />\n<br />Всё настраивается в опциях мода, по каждому классу отдельно. Поддерживаются все семь классов, включая Скитария.\n<br />\n<br />[i]Требуется Darktide Mod Framework.[/i]\n<br />\n<br />\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/913]YOU CAN ALSO CHECK MY ONLINE_LEADERBOARD MOD FOR HAVOC/AURIC[/url]\n<br />\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/931]ALSO U CAN CHECK MY PSYKER-EFFECTS DISABLER MOD[/url]\n<br />\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/932]ALSO U CAN CHECK MY MEMORY_LUA, MEMORY_FIX_REALTIME, FpsDoctor mod[/url]"
