nexusDescription="Here we go again, this time bringing improvements to the Penance view!\n<br />\n<br />Main features:\n<br />[list]\n<br />[*]A \"Recently Completed\" filter for penances (Press X on the penance screen)[/*]\n<br />[*]Expand sub-penance tasks to display description, progress, and even child penances. So you can actually see what you need to do directly from the penance screen![/*]\n<br />[*]Inspect all rewards with an easy hotkey (Including an all new inspect screen for trinkets, insignias and portraits)[/*]\n<br />[/list]\n<br />Designed to work alongside the fantastic mod [url=https://www.nexusmods.com/warhammer40kdarktide/mods/307]Archivum Messelina[/url]﻿ by Wobin.\n<br />\n<br />Pairs well with [url=https://www.nexusmods.com/warhammer40kdarktide/mods/348]Commodore's Vestures Improved[/url] for extra functionality.\n<br />\n<br />Install Penances Improved and Archivum Messelina to have the best penance experience possible.\n<br />\n<br />\n<br />[img]https://europe1.discourse-cdn.com/flex013/uploads/fatshark/original/3X/1/d/1d61096b3cb70207ca288c8670d809f9e2afbfef.png[/img]﻿\n<br />\n<br />[size=3]If you would like more QoL improvements, check out some of my other mods:[/size]\n<br />\n<br />[size=4][b]\"Improved\" Series[/b][/size]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/344]How Did I Get That[/url]﻿\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/347]Character Cosmetics View Improved[/url]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/346]Weapon Cosmetics View Improved\n<br />[/url][url=https://www.nexusmods.com/warhammer40kdarktide/mods/348]Commodore's Vestures Improved\n<br />[/url][url=https://www.nexusmods.com/warhammer40kdarktide/mods/355]Penance View Improved\n<br />[/url][url=https://www.nexusmods.com/warhammer40kdarktide/mods/360/]Rolling Steel Timer Improved[/url][url=https://www.nexusmods.com/warhammer40kdarktide/mods/382]\n<br />Mourningstar Dialogue Improved[/url]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/809]Enemies Improved[/url]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/864]Alf's Mod Settings Extension[/url]\n<br />\n<br />[size=4][b]\"Markers\" Series\n<br />[/b][/size][i]All-in-One:[/i]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/447]Markers Improved All-in-One[/url]﻿\n<br />\n<br />[size=2]All of my mods are designed to fit seamlessly together, and improve each other.[/size]\n<br />\n<br />\n<br />\n<br />[url=https://ko-fi.com/alfthebigheaded][img]https://ko-fi.com/img/githubbutton_sm.svg[/img][/url]\n<br />"
