nexusDescription="LATEST VERSION ALLOWS YOU TO SHARE STATS WITH OTHER USERS OF THE MOD. REQUIRES [url=www.nexusmods.com/warhammer40kdarktide/mods/1117www.nexusmods.com/warhammer40kdarktide/mods/1117]VOX MANIFOLD[/url]. Provided a screenshot of it how looks.\n<br />\n<br />Inspired by the mod with the same name for Vermintide 2, this mod counts your total kills on each weapon. While that is the simple part, the mod is equipped with advanced ways of deciding what weapon gets credit, while recording the types of enemies you kill, your accuracy, your total winrate with the weapon equipped and much more. Total kills are always visible in your inventory, but the details can be viewed by pressing the \"Stats\" button on the right side. The screenshots should explain it well.\n<br />\n<br />[b]NOTE[/b]: While this mod is translated for every language that the game can run in, they are done using machine translation, so I cannot confirm how accurate they are, but it's the best I could get.\n<br />\n<br />Compatible with just about everything, as far as the 128 mods that I use go, at least. May not play well with mods that adjust the inventory layout, but I included toggles specifically for this purpose."
