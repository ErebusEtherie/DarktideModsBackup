nexusDescription="Adds detailed per-action weapon data to Darktide’s weapon details UI, including damage, stagger, cleave, armour modifiers, crit info, stamina costs, timings, chained actions and special-action behaviour.\n<br />\n<br />Have you ever wondered what the activated mode on a power weapon [i]actually[/i] does? This mod will show the effects on damage and other stats. \n<br />\n<br />[b][color=#ffffff][size=4]This mod is in beta / early access so work is still planned on many aspects.[/size][/color][/b]\n<br />\n<br />Planned:\n<br />* Finish adding pretty names for all actions and flags\n<br />* Advanced features\n<br />* More information\n<br />* More cleanup\n<br />* Expanded UI\n<br />\n<br />Made in consultation with the author of a prominent Darktide guide.\n<br />\n<br />Is this based on the WeaponStats mod by thedeathbeam?  No.  I have discussed this mod with the author and it turns out both of us really did start working on separate weapon details mods a long time ago and decided to work on them more when Fatshark released Skitarii.  They are both good mods.\n<br />\n<br />Chinese localisations thanks to DingXiang233\n<br />\n<br />Proud member of the Darktide Modders discord https://discord.gg/GFyCGNpJb8\n<br />\n<br />"
