nexusDescription="[b]ModShrine automatically protects your Darktide mod settings with verified backups, a trusted Known Good restore point, protected archives for missing mods, and a guided recovery workflow built directly into DMF's Mod Options menu.[/b]\n<br />If you've ever spent hours configuring dozens of Darktide mods only to lose settings after an update, reinstall, corrupted config, or accidental reset, ModShrine is designed to make that much less painful.\n<br />Features\n<br />[list]\n<br />[*][b]Automatic verified backups[/b] of your Darktide/DMF settings [/*]\n<br />[*][b]Rolling backup history[/b] with a configurable backup limit [/*]\n<br />[*][b]Known Good restore point[/b] for a configuration you trust [/*]\n<br />[*][b]Preview before restore[/b] so you can see when settings differ [/*]\n<br />[*][b]Offline restore protection[/b] so ModShrine never replaces the live settings file while Darktide is running [/*]\n<br />[*][b]Next-launch verification[/b] to confirm a staged restore was successfully applied [/*]\n<br />[*][b]Protected per-mod archives[/b] for installed and missing mods [/*]\n<br />[*][b]Missing mod preservation[/b] so settings are not discarded just because a mod is temporarily removed [/*]\n<br />[*][b]Guided 1-2-3-4 recovery workflow[/b] inside Mod Options [/*]\n<br />[*][b]Automatic mission/loading protection[/b] that pauses secondary archive work during gameplay [/*]\n<br />[*][b]Advanced maintenance tools[/b] available when needed, but hidden by default [/*]\n<br />[*]No chat commands required [/*]\n<br />[/list]How It Works\n<br />ModShrine keeps the normal workflow intentionally simple:\n<br />[b]1. Protect Your Settings[/b]\n<br />ModShrine creates and verifies a protection snapshot of your current configuration.\n<br />\n<br />[b]2. Choose a Trusted Restore Point[/b]\n<br />When everything is configured the way you want, mark the latest verified backup as [b]Known Good[/b].\n<br />\n<br />[b]3. Check Before Restoring[/b]\n<br />If your current settings later differ from Known Good, ModShrine shows how many settings changed and lets you preview the restore.\n<br />\n<br />[b]4. Restore Known Good[/b]\n<br />After Preview validates the exact current configuration, you can stage the restore. The settings file is not replaced while Darktide is running. ModShrine waits until the game fully exits, applies the staged configuration offline, and verifies the result on your next launch.\n<br />\n<br />First-Time Setup\n<br />On first use, ModShrine will create your initial verified protection snapshot.\n<br />Once Step 1 shows:\n<br />[b]✓ PROTECTED[/b]\n<br />use [b]MARK KNOWN GOOD[/b] when your current mod settings are working exactly the way you want.\n<br />After Known Good is created, ModShrine will tell you to [b]exit Mod Options back to the Mourningstar and then reopen ModShrine[/b]. This refreshes DMF's Mod Options view and continues the guided workflow.\n<br />\n<br />When everything matches your trusted restore point, you should see:\n<br />[b]PROTECTED | KNOWN GOOD READY[/b]\n<br />[b]MATCHES KNOWN GOOD[/b]\n<br />[b]✓ PROTECTED[/b]\n<br />[b]✓ KNOWN GOOD READY[/b]\n<br />[b]✓ NO RESTORE NEEDED[/b]\n<br />\n<br />What Is \"Known Good\"?\n<br />Known Good is simply the configuration you trust.\n<br />Think of it as your recovery checkpoint. Set it when your mods are installed, configured, and behaving the way you want.\n<br />ModShrine does [b]not[/b] automatically replace Known Good every time a setting changes. This prevents a broken or unwanted configuration from silently becoming your trusted recovery point.\n<br />\n<br />Missing Mods\n<br />If a mod that ModShrine has previously seen is no longer installed, its protected archive is retained.\n<br />\n<br />You may see:\n<br />[b]Missing Mod Archived: mod_name[/b]\n<br />\n<br />You can leave it alone indefinitely. If the mod comes back later, ModShrine can recognize it again.\n<br />The optional [b]RETIRE[/b] action removes that mod from active missing-mod tracking. Retiring a mod does [b]not[/b] erase historical snapshots or its protected archive.\n<br />\n<br />Restore Safety\n<br />Restoring settings is deliberately conservative.\n<br />\n<br />ModShrine creates an emergency pre-restore backup, verifies the staged configuration, and does not overwrite Darktide's active settings file while the game is running.\n<br />A staged restore is applied only after Darktide fully exits.\n<br />\n<br />On the next launch, ModShrine verifies that the restored settings file matches the expected result.\n<br />If your configuration changes after Preview, restore authorization is invalidated and Preview must be completed again.\n<br />\n<br />Backup Location\n<br />Darktide's normal settings file:\n<br />[code]%APPDATA%&#92;Fatshark&#92;Darktide&#92;user_settings.config[/code]ModShrine's independent protection vault:\n<br />[code]%LOCALAPPDATA%&#92;ModShrine&#92;Darktide[/code]The vault is deliberately stored separately from Darktide's normal settings directory.\n<br />\n<br />Performance\n<br />Normal incremental backups are designed to be lightweight and are processed cooperatively.\n<br />The [b]very first protection pass[/b] must catalog the entire current DMF/mod configuration and create initial archives, so users with large mod lists may notice a brief one-time hitch during initial setup.\n<br />\n<br />Installation\n<br />Requires [b]Darktide Mod Framework (DMF)[/b].\n<br />Install the\n<br />[code]mod_shrine[/code]folder into your Darktide\n<br />[code]mods[/code]directory and add:\n<br />[code]mod_shrine[/code]to\n<br />[code]mod_load_order.txt[/code]using the normal DMF installation process.\n<br />\n<br />Then launch Darktide and open:\n<br />[b]ESC → Mod Options → ModShrine[/b]\n<br />Updating\n<br />Replace the existing\n<br />[code]mod_shrine[/code]mod folder with the newer version.\n<br />[b]Do not delete your ModShrine vault when updating[/b] unless you intentionally want to remove your backup history.\n<br />Uninstalling\n<br />Remove\n<br />[code]mod_shrine[/code]from your DMF load order and delete the mod folder.\n<br />Your backup vault will remain in:\n<br />[code]%LOCALAPPDATA%&#92;ModShrine&#92;Darktide[/code]This is intentional so uninstalling the mod does not automatically destroy your recovery data.\n<br />\n<br />If you encounter a problem, please include your Darktide console log when reporting it. It makes troubleshooting dramatically easier! Thank you and I hope you enjoy my mod!"
