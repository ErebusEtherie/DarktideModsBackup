nexusDescription="This is a continuation of the original \"[url=https://www.nexusmods.com/warhammer40kdarktide/mods/728]What Are You[/url]\" mod by [url=https://www.nexusmods.com/warhammer40kdarktide/mods/728]malevhf[/url]. \n<br />This continued version includes Skitarii and (hopefully) will include any future class releases and seeks to maintain bugfixes and updates in the events of changes to the game.\n<br />\n<br />-----\n<br />\n<br />The mod will replace character and/or platform account names with class names and the primary talent selected for each player.\n<br />\n<br />Choose to display...\n<br />\n<br />[list]\n<br />[*]Class name + Talent[/*]\n<br />[*]Talent + Class name[/*]\n<br />[*]Class name [/*]\n<br />[/list]\n<br />Format the class/talent name with prefix, suffixes, and choose text case...\n<br />\n<br />[list]\n<br />[*]Zealot - Dash[/*]\n<br />[*]Zealot (Dash)[/*]\n<br />[*]ZEALOT - (DASH)[/*]\n<br />[/list]You can also apply a color to the class/talent text, per-class.\n<br />\n<br />[b]Should be compatible with True Level and Who Are You. [/b]Note that if the mod is enabled, it will overwrite anything to do with Who Are You while [b]in a match. [/b]As far as I can tell from my testing, True Level formatting always appears correctly. "
