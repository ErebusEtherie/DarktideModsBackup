nexusDescription="[b][size=5]Description[/size][/b]\n<br />Realms Loadout is a standalone local loadout editor for Realms LAN sessions. Edit weapons, gadgets, weapon marks, cosmetics, talents and Stimm talents in an official-style UI, save multiple loadout presets, and forge full-rating local weapons with perks and blessings. Add up to 100 extra talent points, synchronized with the host, and optionally remove career or stat restrictions. Everything is stored locally and only applies in Realms LAN games. Your official profile stays untouched.\n<br />[b]Installation instructions[/b]\n<br />[list=1]\n<br />[*]Download the archive and extract it into \n<br />[code]Warhammer 40,000 DARKTIDE&#92;mods[/code].[/*]\n<br />[*]Make sure the extracted folder is named \n<br />[code]realms_loadout[/code].[/*]\n<br />[*]Enable these mods in the in-game mod manager:\n<br />[list]\n<br />[*]Darktide Mod Framework[/*]\n<br />[*]SoloPlay[/*]\n<br />[*]Realms[/*]\n<br />[*]Realms Loadout[/*]\n<br />[/list][/*]\n<br />[*]Set the load order so Realms loads before Realms Loadout.[/*]\n<br />[*]Reload mods or restart the game.[/*]\n<br />[*]Bind a key in Mod Options -&gt; Realms Loadout, or use \n<br />[code]/rl[/code] or \n<br />[code]/realms_loadout[/code] in chat.[/*]\n<br />[/list][b][size=5]Main features[/size][/b]\n<br />[list]\n<br />[*]Official-style loadout editor for weapons, gadgets, marks, skins, trinkets, cosmetics and talents.[/*]\n<br />[*]Multiple loadout presets with official preset copies.[/*]\n<br />[*]Realm Forge for full-rating local weapons, perks, blessings and gadgets.[/*]\n<br />[*]0-100 extra talent points with host/client synchronization.[/*]\n<br />[*]Optional removal of weapon career restrictions and weapon/gadget stat limits.[/*]\n<br />[*]Automatic loadout application before Realms missions.[/*]\n<br />[*]Local-only storage; official profile and inventory are not overwritten.[/*]\n<br />[*]Sync Official Weapon and Sync Official Talents recovery buttons.[/*]\n<br />[*]English, Simplified Chinese, Traditional Chinese and Russian localization.[/*]\n<br />[/list][b][size=5]Requirements[/size][/b]\n<br />[list]\n<br />[*]PC Steam version of Darktide.[/*]\n<br />[*]Darktide Mod Framework.[/*]\n<br />[*]SoloPlay, which is required by Realms.[/*]\n<br />[*]Realms 0.4.0 or a compatible version.[/*]\n<br />[*]Recommended load order: DMF / SoloPlay -&gt; Realms -&gt; Realms Loadout.[/*]\n<br />[*]Optional: BetterLoadouts and LoadoutNames for extra preset slots and renaming.[/*]\n<br />[*]The editor reads the official inventory to build its local catalog, so an online backend connection is required.[/*]\n<br />[/list][b][size=5]Shout outs[/size][/b]\n<br />[list]\n<br />[*]deluxghost for the LAN multiplayer framework.[/*]\n<br />[*]The Darktide Mod Framework team.[/*]\n<br />[*]Fatshark for the official UI and systems this mod is built around.[/*]\n<br />[*]Everyone who tested the mod and reported bugs during development.[/*]\n<br />[/list][b][size=5]Other[/size][/b]\n<br />If you encounter bugs or other issues, please provide a detailed description in the comments, preferably with a log file. Thank you.\n<br />"
