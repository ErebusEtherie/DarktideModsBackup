nexusDescription="[size=4][b]Description[/b][/size]\n<br />Gives the Transonic Blades a distinct crosshair for each mode - horizontal bar for slashing, vertical bar for anti-elite.\n<br />Bar size is adjustable in the mod options.\n<br />\n<br />[url=https://emojiterra.com/warning/]⚠️[/url]1.0.1 could hide the ranged crosshair without a crosshair mod installed - this is fixed in 1.0.2.\n<br />\n<br />[size=4][b]Installation[/b][/size]\n<br />Extract into your Darktide [i]mods[/i] folder ([i]...&#92;steamapps&#92;common&#92;Warhammer 40,000 DARKTIDE&#92;mods[/i]) and add [i]transonic_crosshair[/i] to [i]mods&#92;mod_load_order.txt[/i] (or just use [url=https://www.nexusmods.com/warhammer40kdarktide/mods/139]your mod manager[/url]).\n<br />\n<br />[size=4][b]Requirements[/b][/size]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/19]Darktide Mod Loader[/url] and [url=https://www.nexusmods.com/warhammer40kdarktide/mods/8]Darktide Mod Framework[/url].\n<br />\n<br />[size=4][b]Shout outs[/b][/size]\n<br />Inspired by [url=https://old.reddit.com/r/DarkTide/comments/1ug7ayd/simple_transonic_blades_stance_indicator/]this r/DarkTide post[/url].\n<br />\n<br />\n<br />[url=https://github.com/TheRealBarenziah/transonic-blades-crosshair]Repository.[/url]"
