nexusDescription="[size=5][color=#ff7700][font=Impact]Description[/font][/color][/size]\n<br />[color=#d4d4d8]A scoreboard that can display during levels, at the end of levels, and in a history tab. [/color]\n<br />\n<br />[color=#d4d4d8]Who did the damage? Now you know.[/color]\n<br />\n<br />[color=#ff0000][size=4][font=Impact]IMPORTANT NOTES[/font][/size][/color]\n<br />[list]\n<br />[*][color=#D4D4D8]MAJOR NEW RELEASE: [/color][color=#ffd966]Scoreboard II[/color][color=#D4D4D8] has become [/color][color=#ffd966]Scores[/color][color=#D4D4D8]. With various changes, improvements, and additions. History from Scoreboard II will not carry over to this one. If you want to view your Scoreboard II history, load up the older mod.[/color][/*]\n<br />[*][color=#D4D4D8]Awards have been removed, and put in a plugin, link[/color] [url=https://www.nexusmods.com/warhammer40kdarktide/mods/1088]here[/url].[/*]\n<br />[/list][color=#ff7700][size=5][font=Impact]Is this mod for me?[/font][/size][/color]\n<br />[list]\n<br />[*][color=#D4D4D8]General scoreboard, want to compare between how players did, yep, this scoreboard is for you[/color][/*]\n<br />[*][color=#D4D4D8]Refining your build -&gt; check either [url=https://www.nexusmods.com/warhammer40kdarktide/mods/661]Combatstats[/url] or [url=https://www.nexusmods.com/warhammer40kdarktide/mods/898]Uptime 2[/url][/color][/*]\n<br />[*][color=#D4D4D8]A super detailed and powerful scoreboard -&gt; check [url=https://www.nexusmods.com/warhammer40kdarktide/mods/281]Power DI[/url][/color][/*]\n<br />[*][color=#D4D4D8]A simpler scoreboard, with retro Vermintide feel -&gt; check [url=https://www.nexusmods.com/warhammer40kdarktide/mods/887]VT2 Scoreboard[/url][/color][/*]\n<br />[/list][size=5][color=#ff7700][font=Impact]Main features[/font][/color][/size]\n<br />[color=#d4d4d8]There are core stats which are on by default, and plenty more you can toggle:[/color]\n<br />\n<br />[color=#d4d4d8][b]Offense[/b][/color]\n<br />[list]\n<br />[*][color=#d4d4d8]Damage (core)[/color][/*]\n<br />[*][color=#d4d4d8]Weakspots hit[/color][/*]\n<br />[*][color=#d4d4d8]Weakspot hit %[/color][/*]\n<br />[*][color=#d4d4d8]Ranged accuracy %[/color][/*]\n<br />[*][color=#d4d4d8]Critical hit %[/color][/*]\n<br />[*][color=#d4d4d8]Kills (core) (can split to swarmers/elites/specials)[/color][/*]\n<br />[*][color=#d4d4d8]Melee kills[/color][/*]\n<br />[*][color=#d4d4d8]Ranged kills[/color][/*]\n<br />[*][color=#d4d4d8]Boss damage[/color][/*]\n<br />[/list][color=#d4d4d8][b]Defense[/b][/color]\n<br />[list]\n<br />[*][color=#d4d4d8]Damage taken (core)[/color][/*]\n<br />[*][color=#d4d4d8]Times downed[/color][/*]\n<br />[*][color=#d4d4d8]Deaths[/color][/*]\n<br />[*][color=#d4d4d8]Times disabled[/color][/*]\n<br />[*][color=#d4d4d8]Attacks blocked[/color][/*]\n<br />[*][color=#d4d4d8]Health station used[/color][/*]\n<br />[/list][color=#d4d4d8][b]Teamwork[/b][/color]\n<br />[list]\n<br />[*][color=#d4d4d8]Objectives (core)[/color][/*]\n<br />[*][color=#d4d4d8]Revives[/color][/*]\n<br />[*][color=#d4d4d8]Saves[/color][/*]\n<br />[*][color=#d4d4d8]Coherency[/color][/*]\n<br />[*][color=#d4d4d8]Ammo score[/color][/*]\n<br />[*][color=#d4d4d8]Resources collected (can split to each type)[/color][/*]\n<br />[/list][color=#ff7700][size=5][font=Impact]Additional features[/font][/size][/color]\n<br />[list]\n<br />[*][color=#D4D4D8]Stores history so you can compare past games[/color][/*]\n<br />[*][color=#D4D4D8]Click a player name to inspect their build (end of level, or [/color][i][color=#d4d4d8]recent [/color][/i][color=#D4D4D8]history)[/color][/*]\n<br />[*][color=#D4D4D8]Toggle opaque background, row colours, etc.[/color][/*]\n<br />[*][color=#D4D4D8]Toggle showing player first[/color][/*]\n<br />[/list][color=#ff7700][size=5][font=Impact]Plugins[/font][/size][/color]\n<br />[list]\n<br />[*]Scores [url=https://www.nexusmods.com/warhammer40kdarktide/mods/1088?published=1]Awards Plugin[/url] - A plugin that awards scores to players at the end of a mission via a chat message.[/*]\n<br />[*][url=https://www.hr.admin.cam.ac.uk/policies-procedures/dignity-work-policy-2023-ed/code-behaviour]Improve Yourself[/url] plugin by [url=https://www.nexusmods.com/profile/Artayos]Artayos[/url] - A plugin that replaces the numeric scores with a more graphical interface that focuses on personal achievement.[/*]\n<br />[/list][size=5][color=#ff7700][font=Impact]Installation instructions[/font][/color][/size]\n<br />[list]\n<br />[*]Install using vortex[/*]\n<br />[*]or put in your mods folder and add to launch order.[/*]\n<br />[*]Optional, but recommended, add Alf's [url=https://www.nexusmods.com/warhammer40kdarktide/mods/864]Mod Settings Extension[/url][/*]\n<br />[/list][color=#ff7700][size=5][font=Impact]Shout outs[/font][/size][/color]\n<br />[list]\n<br />[*][color=#D4D4D8]Inspired by Scoreboard mod by [url=https://www.nexusmods.com/warhammer40kdarktide/users/127805]Grasmann[/url], and Ovenproof's by [url=https://www.nexusmods.com/warhammer40kdarktide/users/4957600]OvenProofMars[/url][/color][/*]\n<br />[*][url=https://www.nexusmods.com/profile/Alfthebigheaded]Alfthebigheaded[/url] for inspirational mod design[/*]\n<br />[*][color=#D4D4D8]Spanish translations by [url=https://next.nexusmods.com/profile/MasterZiggy076]MasterZiggy076[/url][/color][/*]\n<br />[/list][color=#ff7700][size=5][font=Impact]Other mods[/font][/size][/color]\n<br />[list]\n<br />[*]Check out [url=https://www.nexusmods.com/warhammer40kdarktide/mods/965]Vox-caster[/url], if you want WH40k themed communications[/*]\n<br />[/list]"
