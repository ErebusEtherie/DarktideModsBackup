nexusDescription="Darn, did you forget to say Thank You again after being picked up from falling off that same damn ledge 9 times in a row? Well this is the mod for you! [b]Thank You[/b] does what it says, it says [b]Thank You [/b]to people when they do things for you! But hey, fuck em am i right?! If you want you can change it to say one of any lines from the voice comm wheel as well as a few additional lines.\n<br />\n<br />[b]You can trigger lines from these actions[/b]\n<br />[list]\n<br />[*]Being picked up when downed[/*]\n<br />[*]being saved from a disabler[/*]\n<br />[*]being picked up from a ledge[/*]\n<br />[*]Picking up a downed ally [/*]\n<br />[*]Getting to low health[/*]\n<br />[*]getting to low ammo[/*]\n<br />[*]and many more![/*]\n<br />[/list]\n<br />[u][b]Go and check out my other things [/b][/u]\n<br />[list]\n<br />[*]Blitz Augur: https://www.nexusmods.com/warhammer40kdarktide/mods/1074[/*]\n<br />[*]State Your Name: https://www.nexusmods.com/warhammer40kdarktide/mods/1068Objective Tracker: https://www.nexusmods.com/warhammer40kdarktide/mods/1035[/*]\n<br />[*]Strikemap: https://www.nexusmods.com/warhammer40kdarktide/mods/1022[/*]\n<br />[*]Thank You: https://www.nexusmods.com/warhammer40kdarktide/mods/1075[/*]\n<br />[/list]"
