nexusDescription="[b]Description[/b]\n<br />Adds a trajectory prediction arc to the Ogryn Grenadier Gauntlet. The arc accurately shows where the grenade will land — complete with an explosion radius circle at the landing point and an optional highlight on the enemy being aimed at.\n<br />\n<br />[b]Main features[/b]\n<br />[list]\n<br />[*][b]Trajectory arc[/b] – Shows a predictive arc while aiming down sights, helping you gauge grenade drop and impact points.[/*]\n<br />[*][b]Explosion radius circle[/b] – Draws a circle at the trajectory's landing point, sized to the grenade's actual explosion radius (weapon traits and buffs included). When the trajectory line ends on an enemy, the circle follows the spot on the enemy you are aiming at. Radius, color, and opacity are adjustable.[/*]\n<br />[*][b]Target enemy outline[/b] – Optionally highlights the enemy the trajectory line ends on, with a configurable color and stacking priority. Works alongside vanilla enemy tags and other outline mods. ([i]Disabled by default.[/i])[/*]\n<br />[*][b]Continuous aiming[/b] – While the aim button is held, the arc and circle stay visible between shots — including the fire interval when the game normally hides them — making continuous aimed fire easier to line up. The arc disappears the moment you release the aim button.[/*]\n<br />[*][b]Adjustable settings[/b] – Fine-tune the arc with options for display delay, sway/recoil influence, and start-point offsets (X/Y/Z). All features can be toggled and configured in the Mod Options menu.[/*]\n<br />[*]Supports [b]multiple languages[/b] (English, Japanese, Korean, Simplified Chinese, Traditional Chinese, Russian).[/*]\n<br />[/list]\n<br />[b]Requirements[/b]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/8]Darktide Mod Framework[/url]"
