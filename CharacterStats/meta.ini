nexusDescription="Character Stats shows detailed derived stats for your current character in Darktide, computed\n<br />directly from the game's stat buff, talent, curio, and Havoc data so the numbers match what you\n<br />encounter in missions.\n<br />\n<br />Shows in ESC menu and with optional configurable trigger key.\n<br />\n<br />If you have any issues, please use the [url=https://github.com/deathbeam/darktide-mods]GitHub issue tracker[/url], but posting here is fine too. You can also view the full source there and submit pull requests with changes.\n<br />\n<br />[b]Features:[/b]\n<br />\n<br />[list]\n<br />[*]Vitals: max health, wounds, and max toughness with per-source breakdown (talents, curios, blessings, Havoc)[/*]\n<br />[*]Coherency toughness regeneration split into its true components, the coherency-gated rate and the always-on regen[/*]\n<br />[*]Toughness recovery: melee-kill bounty, regen delay, and proc/over-time toughness from talents[/*]\n<br />[*]Damage dealt: total/melee/ranged bonuses, power level, rending, crit chance and crit damage, attack speed, impact[/*]\n<br />[*]Damage taken: generic/melee/ranged reduction, toughness damage reduction, and resistances by damage type and enemy type[/*]\n<br />[*]Resistances: corruption, grimoires, and enemy-type perks (Bombers, Flamers, Gunners, Mutants, Pox Hounds, Snipers)[/*]\n<br />[*]Mobility: max stamina, regen, sprint speed/duration, dodge count/distance/speed[/*]\n<br />[*]Havoc rank support: applies the hidden Havoc debuffs (reduced health, toughness, and regen)[/*]\n<br />[*]Assumed-active ceilings: folds every buff you're capable of at max proc stacks and max coherency allies[/*]\n<br />[*]Export to clipboard as markdown, with nested indentation for source breakdowns[/*]\n<br />[/list][b]All stats mods by me:[/b]\n<br />\n<br />[list]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1093]CharacterStats[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/661]CombatStats[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1054]EnemyStats[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/999]WeaponStats[/url][/*]\n<br />[/list]"
