nexusDescription="Many More Try has assisted in accessing a broader array of missions than those that are currently live. However, this has required the use of a external website to access the historical list of still live missions. Many Mission Terminal now integrates the details into the Mission Terminal with a filter list so you can find exactly what mission you want to play.\n<br />\n<br />\n<br />\n<br />Darktide's main Mission Terminal shows currently live missions that expire in a short amount of time, but the missions themselves are still accessible up to three hours past their displayed live time.\n<br />\n<br />Many Mission Terminal keeps a running storage of the missions passing through the mission board externally and accesses it through this mod to give you a wider set of options to play with.\n<br />\n<br />You'll be able to filter on the exact type of modifier you're after, and access all the currently accessible Maelstroms \n<br />\n<br />\n<br />Note:\n<br />This mod will not play well with other mods that affect the mission board, like  MissionGrid but it should offer similar functionality as a replacement"
