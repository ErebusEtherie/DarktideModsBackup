nexusDescription="Many More Try has assisted in accessing a broader array of missions than those that are currently live. However, this has required the use of a external website to access the historical list of still live missions. Many Mission Terminal now integrates the details into the Mission Terminal with a filter list so you can find exactly what mission you want to play.\n<br />\n<br />\n<br />\n<br />Darktide's main Mission Terminal shows currently live missions that expire in a short amount of time, but the missions themselves are still accessible up to three hours past their displayed live time.\n<br />\n<br />Many Mission Terminal keeps a running storage of the missions passing through the mission board externally and accesses it through this mod to give you a wider set of options to play with.\n<br />\n<br />You'll be able to filter on the exact type of modifier you're after, and access all the currently accessible Maelstroms \n<br />\n<br />There is also an Exclusions panel, where you can pick the maps or conditions you don't want to play. This will affect what missions appear on the board, and also Quickplay, where it will skip joining any quickplays that meet your exclusion criteria, putting you back in the queue\n<br />\n<br />I also added an option in the Mission Terminal Options to only join new missions in Quickplay (ie do not backfill missions)\n<br />\n<br />\n<br />Note:\n<br />This mod will not play well with other mods that affect the mission board, like  MissionGrid but it should offer similar functionality as a replacement\n<br />\n<br />Also, it uses the endpoint https://darktide.dpdns.org/ to retrieve historical data, if that domain is blocked by your DNS, it will not be able to get anything past the current session"
