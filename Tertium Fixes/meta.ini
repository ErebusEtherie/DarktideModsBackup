nexusDescription="[size=6][b]Tertium Fixes 0.5.1[/b][/size]\n<br />\n<br />Created and maintained by chronic.\n<br />\n<br />I put Tertium Fixes together to deal with the client-side problems that kept getting in the way: stuck menus, missed inputs, incorrect talent and buff information, stale HUD entries, looping audio, effects that are not released properly, and avoidable Lua memory pressure during long sessions. It keeps all of those repairs in one place and only touches problems that can be handled safely on the player's side.\n<br />\n<br />I've set the defaults up so it should work without any adjustment. Twenty-two of the twenty-four main repairs are enabled immediately. I left the remaining two disabled because they are optional workarounds with visible or control-related tradeoffs. Every repair can still be switched on or off separately.\n<br />\n<br />The mod does not change weapon statistics, talents, enemies, rewards, difficulty, damage, movement, cooldowns, progression, or mission rules. It does not lower texture quality, lighting, resolution, animation quality, normal particle quality, or audio quality.\n<br />\n<br />Version 0.5.1 also fixes the percentage signs used by the heap-meter position settings. Those labels could previously cause a localization error while the mod was loading.\n<br />\n<br />[size=5][b]Main fixes[/b][/size]\n<br />\n<br />[size=4][b]Input and menus[/b][/size]\n<br />\n<br />[b]Repair cursor reference stack[/b]\n<br />\n<br />Repairs the cursor state after menus request or release it. This addresses cases where the cursor remains visible during gameplay, disappears inside a menu, or becomes trapped after moving between overlapping screens. It does not change normal mouse movement or menu navigation.\n<br />\n<br />[b]Use newly pressed input devices immediately[/b]\n<br />\n<br />Updates the active input device as soon as a controller, keyboard, or mouse is used. This helps prevent the first press after changing devices from being ignored. It does not alter bindings, sensitivity, aim assistance, or input priority after the handoff has completed.\n<br />\n<br />[b]Apply controller-rumble setting immediately[/b]\n<br />\n<br />Refreshes controller vibration after its setting changes or after the game temporarily suppresses it. It does not increase vibration strength or add new vibration effects.\n<br />\n<br />[b]Correct Penances carousel wheel direction[/b]\n<br />\n<br />Corrects the mouse-wheel direction in the Penances overview so it matches the surrounding menus. Keyboard and controller navigation remain unchanged.\n<br />\n<br />[size=4][b]Talents, buffs, and HUD[/b][/size]\n<br />\n<br />[b]Correct Redirect Fire talent description[/b]\n<br />\n<br />Repairs the presentation link that can make Redirect Fire display Target Down's information. This affects the displayed Veteran talent text only. It does not change the talent's effect or balance.\n<br />\n<br />[b]Correct Prime Target tactical-overlay text[/b]\n<br />\n<br />Restores the correct name and description for the Prime Target effect where the tactical overlay would otherwise show only an icon. The Zealot talent itself is unchanged.\n<br />\n<br />[b]Show the Power Overload ally-buff icon[/b]\n<br />\n<br />Restores the intended icon and presentation information for the eight-second Power Overload ally buff. Buff strength, duration, stacking, and damage are not changed.\n<br />\n<br />[b]Deduplicate safe notifications[/b]\n<br />\n<br />Suppresses identical basic notifications repeated within a short period. Messages that contain actions, delays, or special behaviour are left alone. Mission notifications are excluded by default because a repeated objective update can be meaningful.\n<br />\n<br />[b]Guard invalid localization keys[/b]\n<br />\n<br />Prevents invalid or missing text values from entering the normal interface text path. A broken value can be replaced by a visible diagnostic placeholder or by blank text, depending on the selected fallback option.\n<br />\n<br />[b]Remove stale consecutive buff HUD entries[/b]\n<br />\n<br />Removes expired buff entries that can be skipped when several are cleared in sequence. Live buffs and their order are not changed.\n<br />\n<br />[b]Recover from the final Path of Trust black screen[/b]\n<br />\n<br />Releases the stranded full-screen black overlay after the final Path of Trust cinematic has genuinely finished. Ordinary fades and unrelated cinematics are ignored.\n<br />\n<br />[b]Restore outlines after dying in toxic gas[/b]\n<br />\n<br />Restores outlines when the relevant toxic-gas effect ends while the local player is dead. Living players, remote players, unrelated effects, and normal gas behaviour are not changed.\n<br />\n<br />[b]Repair invalid Psykhanium danger settings[/b]\n<br />\n<br />Validates the saved danger setting used by the Training Grounds shooting range. Valid choices are preserved. Missing, malformed, or out-of-range values fall back to a safe normal choice instead of breaking the selector.\n<br />\n<br />[b]Play a chime when the Hive Scum stimm is ready[/b]\n<br />\n<br />Plays Darktide's normal ability-ready sound once when the local Hive Scum personal stimm changes from empty to usable.\n<br />\n<br />The first ready state after joining, spawning, reconnecting, equipping the ability, or enabling the setting is deliberately silent. This prevents false alerts. Natural recharge, cooldown reduction, and direct charge restoration use the same ready check.\n<br />\n<br />[size=4][b]Audio and visual effects[/b][/size]\n<br />\n<br />[b]Stop leaked Campaign Data Transmission audio[/b]\n<br />\n<br />Stops the stored transmission-hover sound when leaving or closing the affected campaign screen. Only the sound owned by that screen is touched.\n<br />\n<br />[b]Repair player particle and moving-effect lifecycle[/b]\n<br />\n<br />Releases affected moving particles and sounds when the player effect that owns them is destroyed. It also supplies missing effect state where the game already has the correct value available. This reduces effects and sound handles remaining active after they should have ended.\n<br />\n<br />[b]Guard partially initialized client effects[/b]\n<br />\n<br />Stops affected Servo-Skull, flamer, empowered, charged, and arc-chain effects from continuing when startup did not create all the state they require. Any resources that did start are released safely.\n<br />\n<br />[b]Release leaked event listeners[/b]\n<br />\n<br />Unregisters affected controller-haptic, Survival objective, and Expedition rescue listeners when the related client object is destroyed. This prevents old listeners continuing to receive events after their owner has gone.\n<br />\n<br />[b]Release leaked manual audio sources[/b]\n<br />\n<br />Releases affected dialogue, relic, flamer, mutant, and bomber sound sources when the object that created them ends. Unrelated and automatically managed audio is not touched.\n<br />\n<br />[b]Guard client effect-handler state[/b]\n<br />\n<br />Adds safer cleanup around reused local effect slots. This prevents the shutdown of an older effect from clearing a newer effect that has reused the same position, and makes repeated cleanup harmless.\n<br />\n<br />[b]Discard destroyed Stimm Field cache rows[/b]\n<br />\n<br />Removes a Stimm Field entry from the local proximity cache only after its stored buff connection has already been destroyed. Valid field entries and normal Stimm Field behaviour remain unchanged.\n<br />\n<br />[size=5][b]Lua memory and long-session cleanup[/b][/size]\n<br />\n<br />Tertium Fixes includes a Lua heap controller intended to reduce avoidable memory pressure over longer sessions. The heap reading covers memory used by Darktide's Lua scripting. It is not total system RAM, video memory, or the complete game memory shown by Task Manager.\n<br />\n<br />The controller checks the heap once per second. It uses the Lua heap capacity supplied through Darktide's launch settings when available. If the game does not provide a usable value, it uses the fallback capacity selected in the mod options.\n<br />\n<br />Cleanup is gradual by design:\n<br />\n<br />[list]\n<br />[*]Heap use must remain at or above 80 percent for five seconds before pressure handling begins.[/*]\n<br />[*]Small, limited cleanup steps are attempted before a full cleanup.[/*]\n<br />[*]At 85 percent, a warning can be shown and the heap meter can be temporarily forced visible.[/*]\n<br />[*]At 90 percent, one full cleanup is allowed for that pressure episode.[/*]\n<br />[*]At 95 percent, one additional emergency cleanup is allowed.[/*]\n<br />[*]The pressure episode ends when heap use falls below 80 percent.[/*]\n<br />[*]A sharp increase over a short period can request an earlier cleanup.[/*]\n<br />[/list]\n<br />Cleanup can also run shortly after selected transitions between the Mourningstar, missions, and supported activities. These actions are delayed so loading allocations have time to settle.\n<br />\n<br />The optional ten-minute cleanup is disabled by default. A full Lua cleanup can produce a brief frame-time hitch, particularly when a large amount of memory has accumulated. The manual cleanup key can cause the same type of hitch.\n<br />\n<br />Only one active feature can safely control Lua cleanup at a time. Tertium Fixes automatically places its cleanup actions on standby if the collector is already being controlled elsewhere. Heap monitoring remains available, and cleanup permission can be disabled separately at any time. [size=4][b]Required compatibility step: disable other memory-cleaning mods[/b][/size] Before using Tertium Fixes' Lua cleanup controller, disable [b]SMOG[/b], [b]MemLeakFix[/b], [b]FPS Doctor[/b], and any other mod or option that performs automatic Lua memory cleaning, garbage collection, or collector tuning. Do not run two cleanup controllers together. Restart Darktide after disabling them so no old collector state remains in the session. Tertium Fixes has a standby check for those known controllers, but that is a last safety barrier rather than support for running them together. If you want to keep another memory-cleaning mod, turn off [b]Permit automatic and manual cleanup[/b] in Tertium Fixes and use only its monitoring/status features.\n<br />\n<br />[size=4][b]Heap meter[/b][/size]\n<br />\n<br />The meter shows current Lua heap use in megabytes, the detected or fallback capacity, the current percentage, and the pressure level. It can be positioned horizontally and vertically through the options menu.\n<br />\n<br />The default controls are:\n<br />\n<br />[list]\n<br />[*][b]F5:[/b] request one guarded full cleanup.[/*]\n<br />[*][b]F8:[/b] show or hide the heap meter for the current session.[/*]\n<br />[/list]\n<br />Both keys can be rebound or cleared. A successful manual cleanup reports the heap before and after cleaning and the amount reclaimed. Manual cleanup has a three-second cooldown.\n<br />\n<br />[size=5][b]Performance without reduced fidelity[/b][/size]\n<br />\n<br />With the default settings, the mod improves client housekeeping without lowering visual or audio quality. It removes expired HUD entries, abandoned listeners, finished audio handles, stranded particles, and stale effect state that would otherwise remain active longer than necessary. It also caches settings and active repair state so the same unchanged information is not looked up over and over again.\n<br />\n<br />The normal configuration does not reduce:\n<br />\n<br />[list]\n<br />[*]Texture quality[/*]\n<br />[*]Lighting[/*]\n<br />[*]Resolution or render scale[/*]\n<br />[*]Animation quality[/*]\n<br />[*]Audio quality[/*]\n<br />[*]Normal particle quality[/*]\n<br />[*]Visibility[/*]\n<br />[*]Simulation detail[/*]\n<br />[/list]\n<br />The optional chain-weapon smoke workaround is the single deliberate visual exception because its purpose is to remove a visible smoke tail. It is disabled by default.\n<br />\n<br />These changes are intended to improve consistency and reduce avoidable client work, particularly during longer sessions. Results still depend on hardware, drivers, graphics settings, mission conditions, and the current game version. The mod cannot remove online delay or guarantee a particular frame-rate increase.\n<br />\n<br />[size=5][b]Optional workarounds[/b][/size]\n<br />\n<br />I left the following two main repairs disabled by default because each has a noticeable tradeoff.\n<br />\n<br />[b]Aggressively stop chain-weapon smoke[/b]\n<br />\n<br />Stops the affected smoke effect during chain-weapon power-down. This can prevent smoke remaining far longer than intended, but it also removes the normal short smoke tail. The power-down sound is preserved.\n<br />\n<br />[b]Prevent Servo-Skull mouse-wheel toggles[/b]\n<br />\n<br />Removes mouse-wheel weapon switching only while the Servo-Skull is being held. This prevents wheel movement unintentionally switching away from the skull, but the wheel cannot cycle weapons until the skull is put away. Keyboard and controller selection remain available.\n<br />\n<br />[size=5][b]Complete options guide[/b][/size]\n<br />\n<br />Every main repair described above has its own checkbox. The following settings control timing, display, safety, and advanced behaviour.\n<br />\n<br />[size=4][b]Notification options[/b][/size]\n<br />\n<br />[b]Notification duplicate window[/b] \n<br />Default: 2 seconds. Range: 1 to 10 seconds.\n<br />\n<br />Sets how long an identical safe notification is treated as a duplicate. A longer window removes repeats that arrive further apart, while a shorter window allows the same message to appear again sooner.\n<br />\n<br />[b]Include mission notifications[/b] \n<br />Default: Disabled.\n<br />\n<br />Also applies duplicate suppression to matching mission and objective messages. This remains disabled by default so repeated objective updates are preserved.\n<br />\n<br />[size=4][b]Localization options[/b][/size]\n<br />\n<br />[b]Localization fallback[/b] \n<br />Default: Diagnostic placeholder.\n<br />\n<br />Diagnostic placeholder makes an invalid text value visible so the affected interface element can be identified. Blank text hides the invalid value and keeps the affected area less distracting. This option is used only while the invalid-localization guard is enabled.\n<br />\n<br />[size=4][b]Lua heap options[/b][/size]\n<br />\n<br />[b]Lua heap controller[/b] \n<br />Default: Enabled.\n<br />\n<br />Enables heap monitoring, pressure detection, and the related options. Disabling it turns off this complete section of the mod.\n<br />\n<br />[b]Permit automatic and manual cleanup[/b] \n<br />Default: Enabled.\n<br />\n<br />Allows Tertium Fixes to adjust or invoke Lua cleanup. Disabling it retains monitoring, status information, and the heap meter without allowing any cleanup action.\n<br />\n<br />[b]Fallback Lua heap capacity[/b] \n<br />Default: 1,024 MB. Range: 128 to 65,536 MB.\n<br />\n<br />Used only when a valid capacity cannot be read from Darktide's launch settings. This value should represent the configured Lua heap limit. It should not be set to total system RAM or video memory.\n<br />\n<br />[b]Clean at safe state transitions[/b] \n<br />Default: Enabled.\n<br />\n<br />Allows delayed cleanup after selected entries and exits. Mourningstar entry receives a longer delay than most supported transitions so loading activity can settle first.\n<br />\n<br />[b]Optional ten-minute cleanup[/b] \n<br />Default: Disabled.\n<br />\n<br />Requests a full cleanup every ten minutes while enabled. It remains disabled by default because a periodic full cleanup can create a visible hitch even when the heap is not under immediate pressure.\n<br />\n<br />[b]Heap-pressure notifications[/b] \n<br />Default: Enabled.\n<br />\n<br />Shows warnings when the heap reaches high pressure and reports emergency cleanup results. This setting does not control the meter or diagnostic log.\n<br />\n<br />[b]Show Lua heap meter[/b] \n<br />Default: Enabled.\n<br />\n<br />Displays current Lua heap use, capacity, percentage, and pressure state. High pressure can temporarily force the meter visible until use returns below 80 percent.\n<br />\n<br />[b]Heap meter horizontal position[/b] \n<br />Default: 5 percent. Range: 0 to 100 percent.\n<br />\n<br />Moves the meter across the active HUD area from left to right.\n<br />\n<br />[b]Heap meter vertical position[/b] \n<br />Default: 65 percent. Range: 0 to 100 percent.\n<br />\n<br />Moves the meter down the active HUD area from top to bottom.\n<br />\n<br />[b]Record abnormal-exit heap context[/b] \n<br />Default: Enabled.\n<br />\n<br />Stores only the previous session's broad pressure level and whether the mod recorded a clean shutdown. If the previous session ended unexpectedly while heap pressure was high, a warning can be shown on the next launch. This is context only and does not claim that memory caused the crash.\n<br />\n<br />[b]Manual full-cleanup key[/b] \n<br />Default: F5.\n<br />\n<br />Requests one immediate guarded cleanup. It has a three-second cooldown and can produce a brief frame-time spike. The action remains blocked when cleanup permission is disabled or Tertium Fixes does not currently own cleanup.\n<br />\n<br />[b]Show or hide heap meter key[/b] \n<br />Default: F8.\n<br />\n<br />Toggles the meter for the current session. A high-pressure warning can temporarily force it visible until pressure clears.\n<br />\n<br />[size=4][b]Advanced effect options[/b][/size]\n<br />\n<br />[b]Experimental local effect allocator[/b] \n<br />Default: Disabled.\n<br />\n<br />Replaces allocation and expiry handling for client-local effects. The normal effect-handler repair does not require it. This setting remains disabled until it has broader live-game coverage and should be used only when diagnosing a specific effect problem.\n<br />\n<br />[b]Experimental network effect containment[/b] \n<br />Default: Disabled.\n<br />\n<br />Rejects some malformed, repeated, or already-stopped client effect messages. Delayed messages cannot always be identified with certainty after a slot is reused, so this setting remains disabled unless it is needed for a specific problem.\n<br />\n<br />[size=4][b]Runtime safety options[/b][/size]\n<br />\n<br />[b]Auto-quarantine failing modules[/b] \n<br />Default: Enabled.\n<br />\n<br />Stops one individual repair after repeated unexpected errors while leaving the remaining repairs active. This prevents a changed game function from causing the whole package to fail.\n<br />\n<br />[b]Errors before quarantine[/b] \n<br />Default: 3. Range: 1 to 10.\n<br />\n<br />Sets how many caught errors one repair can produce before it is quarantined. Lower values stop a failing repair sooner. Higher values allow more repeated attempts before it is stopped.\n<br />\n<br />[b]Diagnostic log messages[/b] \n<br />Default: Enabled.\n<br />\n<br />Records useful feature state changes and caught errors in the Darktide Mod Framework log. It does not add an on-screen performance overlay or change gameplay.\n<br />\n<br />[size=5][b]Commands[/b][/size]\n<br />\n<br />[b]/tf_status[/b]\n<br />\n<br />Shows which repairs are available, active, disabled, or quarantined, together with their activity and error counters.\n<br />\n<br />[b]/tf_reset module_id[/b]\n<br />\n<br />Clears errors, quarantine, and temporary state for one repair. Use [font=monospace]/tf_status[/font] to find the required module ID.\n<br />\n<br />[b]/tf_reset all[/b]\n<br />\n<br />Resets every repair without requiring a game restart.\n<br />\n<br />[b]/tf_gc[/b] or [b]/tf_gc status[/b]\n<br />\n<br />Shows heap capacity, current pressure, cleanup availability, recent actions, and controller state.\n<br />\n<br />[b]/tf_gc clean[/b]\n<br />\n<br />Requests one guarded full cleanup and reports the result.\n<br />\n<br />[b]/tf_gc step[/b]\n<br />\n<br />Requests one small incremental cleanup step.\n<br />\n<br />Cleanup commands remain blocked when cleanup permission is disabled or the feature does not currently own cleanup.\n<br />\n<br />[size=5][b]Requirements[/b][/size]\n<br />\n<br />[list]\n<br />[*]Darktide Mod Loader[/*]\n<br />[*]Darktide Mod Framework[/*]\n<br />[/list]\n<br />[size=5][b]Installation[/b][/size]\n<br />\n<br />[list=1]\n<br />[*]Install Darktide Mod Loader and Darktide Mod Framework.[/*]\n<br />[*]Open Darktide's [font=monospace]mods[/font] folder.[/*]\n<br />[*]Copy the complete [font=monospace]TertiumFixes[/font] folder into it.[/*]\n<br />[*]Add [font=monospace]TertiumFixes[/font] on its own line in [font=monospace]mods/mod_load_order.txt[/font].[/*]\n<br />[*]Launch Darktide.[/*]\n<br />[*]Open the Darktide Mod Framework options menu if you want to change any settings.[/*]\n<br />[/list]\n<br />The finished folder should be:\n<br />\n<br />[font=monospace]Darktide/mods/TertiumFixes/[/font]\n<br />\n<br />Do not add an extra folder level between [font=monospace]mods[/font] and [font=monospace]TertiumFixes[/font].\n<br />\n<br />[size=5][b]Updating[/b][/size]\n<br />\n<br />Delete the existing [font=monospace]TertiumFixes[/font] folder and replace it with the complete folder from the new release. Do not merge releases together. Old files left behind can cause errors even when the current files are correct. Saved settings should remain available through Darktide Mod Framework.\n<br />\n<br />Version 0.3.0 was withdrawn because it could cause a startup script error. If that version was ever installed, completely remove the old folder before installing the current release.\n<br />\n<br />[size=5][b]Compatibility and limits[/b][/size]\n<br />\n<br />Tertium Fixes is client-side. The host and the rest of the team do not need it installed.\n<br />\n<br />Each repair is separated from the others. If a Darktide update changes an affected system, the repair is designed to leave the game's original behaviour in place instead of guessing. Automatic quarantine can stop one failing repair without disabling the rest of the package.\n<br />\n<br />There are still some things a client-side Lua mod simply cannot repair. Tertium Fixes cannot directly change:\n<br />\n<br />[list]\n<br />[*]Server-side combat results or hit validation[/*]\n<br />[*]Authoritative enemy or mission state[/*]\n<br />[*]Matchmaking or service outages[/*]\n<br />[*]Account, reward, inventory, or progression records[/*]\n<br />[*]Packet loss, routing problems, or unstable internet connections[/*]\n<br />[*]Native engine, renderer, graphics-driver, operating-system, or platform faults[/*]\n<br />[*]Missing game content that requires an official update[/*]\n<br />[/list]\n<br />The mod provides targeted local repairs and workarounds. It cannot guarantee a solution for every possible crash, disconnect, stutter, or black screen.\n<br />\n<br />[size=5][b]Troubleshooting[/b][/size]\n<br />\n<br />[b]The game reports a loop or previous error while loading a module[/b]\n<br />\n<br />Delete the existing [font=monospace]TertiumFixes[/font] folder completely and install the current release into a fresh folder. Do not merge the new release into an old copy.\n<br />\n<br />[b]Tertium Fixes does not appear in the options menu[/b]\n<br />\n<br />Confirm that the loader and framework are installed, the folder is exactly [font=monospace]Darktide/mods/TertiumFixes/[/font], [font=monospace]TertiumFixes[/font] is on its own line in [font=monospace]mods/mod_load_order.txt[/font], and there is no second nested [font=monospace]TertiumFixes[/font] folder inside the first one.\n<br />\n<br />[b]One repair has stopped working[/b]\n<br />\n<br />Run [font=monospace]/tf_status[/font]. If the repair was quarantined, use [font=monospace]/tf_reset module_id[/font] after the immediate problem has passed. If it repeatedly stops itself, leave only that setting disabled until a compatible update is available.\n<br />\n<br />[b]The heap percentage looks wrong[/b]\n<br />\n<br />Check the fallback Lua heap capacity. It should match the configured Lua heap limit when Darktide does not provide that value automatically. Do not enter total system RAM or video memory.\n<br />\n<br />[b]Manual cleanup is blocked[/b]\n<br />\n<br />Confirm that the Lua heap controller and cleanup permission are enabled. [font=monospace]/tf_gc status[/font] shows whether cleanup is currently available.\n<br />\n<br />[b]The Hive Scum stimm chime is silent after spawning[/b]\n<br />\n<br />This is intentional. The first ready state after joining, spawning, reconnecting, equipping, or enabling the setting is silent. The chime plays when the personal stimm later changes from empty to usable.\n<br />\n<br />[b]A setting causes an unwanted visual or control change[/b]\n<br />\n<br />Check the two optional workarounds first. Both are disabled by default. Turning off the affected setting restores normal behaviour.\n<br />\n<br />[size=5][b]Uninstalling[/b][/size]\n<br />\n<br />Remove [font=monospace]TertiumFixes[/font] from [font=monospace]mods/mod_load_order.txt[/font], then delete the [font=monospace]Darktide/mods/TertiumFixes[/font] folder.\n<br />\n<br />"
