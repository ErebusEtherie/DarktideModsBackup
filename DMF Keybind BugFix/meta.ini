nexusDescription="[size=6][font=Times New Roman]What This Fixes[/font][/size]\n<br />\n<br />If you have ever bound a mod keybind to a mouse button, you may have seen some of this:\n<br />\n<br />[list]\n<br />[*]The binding popup needs several clicks before it takes.[/*]\n<br />[*]Left mouse shows up in the menu as [] or [Left_Arrow], sometimes with a stray [Left_Double] key attached.[/*]\n<br />[*]The bind works fine until you close the game, then never fires again, while the menu still shows it bound.[/*]\n<br />[/list]\n<br />The cause lives in the Darktide Mod Framework's keybind handling, not in any individual mod. Mouse buttons are saved under names that clash with keyboard keys, so after a restart the left mouse button quietly turns into the left arrow key. A quick click can also capture the invisible double click flag as a required extra key, which makes the bind impossible to trigger at all.\n<br />\n<br />[size=4][b]What this mod does[/b][/size]\n<br />\n<br />        [img]https://staticdelivery.nexusmods.com/mods/4943/images/1166/1166-1786480836-385490271.png[/img]\n<br />[list]\n<br />[*]Restores the games original icons for LMB, MMB &amp; RMB where before DMF showed an empty bind [] [/*]\n<br />[*]Binding a mouse button takes on the first ordinary click, and the menu shows the correct button straight away.[/*]\n<br />[*]Mouse button binds survive restarting the game.[/*]\n<br />[*]Keybinds saved under a name no device recognises show as unbound instead of pretending to be bound.[/*]\n<br />[*]Once DMF has implemented its own fix, mine should detecte tht and implement an internal stand-off procedure. Then suggest in your chat on whether keeping the fix installed is still beneficiary or if it can be completely uninstalled as it has become redundant.[/*]\n<br />[/list]\n<br />The game's own keybinding screen is untouched. Only mod keybinds in the mod options menu are affected.\n<br />\n<br />[size=4][b]Good to know[/b][/size]\n<br />\n<br />[list]\n<br />[*]Mouse binds made before installing this were saved in the old ambiguous form. Rebind them once and they are fixed for good.[/*]\n<br />[*]Keyboard binds are stored exactly as before, so installing or removing this mod never touches them.[/*]\n<br />[*]If you remove this mod later, mouse left and right binds made while it was installed stop working until rebound. That is the same state they would be in without the fix.[/*]\n<br />[/list]\n<br />[size=4][b]Temporary by design[/b][/size]\n<br />\n<br />This mod exists only to bridge the gap until the framework carries its own fix.\n<br />Once a DMF update fixes keybind storage, my mod will detect it and state in your chat that it can be uninstalled. Or, if partially still helping, it will state that keeping it installed may still be beneficial. It'll instead then only stand down part of its framework to compensate.\n<br />Credit where it's due with much appreciation to the DMF  [url=https://www.nexusmods.com/profile/Aussiemon]author[/url] for the framework that every mod here depends on.\n<br />\n<br />[size=4]Installation[/size]\n<br />\n<br />Install like any other mod, anywhere in the load order. It corrects keybinds for every mod regardless of load order, adds no settings of its own, and has no options menu.\n<br />\n<br />[center][img]https://staticdelivery.nexusmods.com/mods/4943/images/1115/1115-1785417900-197857566.png[/img]\n<br />[img]https://staticdelivery.nexusmods.com/mods/4943/images/1115/1115-1786472846-578152597.png[/img]\n<br />[img]https://staticdelivery.nexusmods.com/mods/4943/images/1115/1115-1786472842-1660520464.png[/img]\n<br />[img]https://staticdelivery.nexusmods.com/mods/4943/images/1115/1115-1786472848-103029771.png[/img]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/1115][img]https://staticdelivery.nexusmods.com/mods/4943/images/1115/1115-1786473748-869135917.png[/img][/url][/center]\n<br />"
