nexusDescription="[size=6][font=Times New Roman][b][u]Updated for the new DMF (26.08.19).[/u][/b][/font][/size][size=4][font=Times New Roman] [i]19.Aug.2026[/i]\n<br />\n<br />The new DMF fixes mouse keybind storage itself. This mod has detected and confirmed it, and has stood its storage repair down. The repair stays in and rearms automatically if you are still on an older DMF.\n<br />\n<br />New: keybinds saved under the old DMF are rescued. The new DMF changed its storage format, so mouse binds you saved before updating come back dead. The bind is just silently gone. This mod now finds those at launch, rewrites them for the new format, and tells you how many it rescued. Without it you have to rebind everything by hand. You can then uninstall this mod. \n<br />\n<br />Fixed toggling this mod off removing Alf's DMF Extensions' keybind fix along with its own. It now only removes what it installed.[/font][/size]\n<br />[size=6][font=Times New Roman]\n<br />[s]What This Fixes[/s][/font][/size]\n<br />\n<br />[s]If you have ever bound a mod keybind to a mouse button, you may have seen some of this:[/s]\n<br />\n<br />[list]\n<br />[*][s]The binding popup needs several clicks before it takes.[/s][/*]\n<br />[*][s]Left mouse shows up in the menu as [] or [Left_Arrow], sometimes with a stray [Left_Double] key attached.[/s][/*]\n<br />[*][s]The bind works fine until you close the game, then never fires again, while the menu still shows it bound.[/s][/*]\n<br />[/list]\n<br />[s]The cause lives in the Darktide Mod Framework's keybind handling, not in any individual mod. Mouse buttons are saved under names that clash with keyboard keys, so after a restart the left mouse button quietly turns into the left arrow key. A quick click can also capture the invisible double click flag as a required extra key, which makes the bind impossible to trigger at all.[/s]\n<br />\n<br />[s][size=4][b]What this mod does[/b][/size][/s]\n<br />\n<br />[s]        [img]https://staticdelivery.nexusmods.com/mods/4943/images/1166/1166-1786480836-385490271.png[/img][/s]\n<br />[list]\n<br />[*][s]Restores the games original icons for LMB, MMB &amp; RMB where before DMF showed an empty bind [] [/s][/*]\n<br />[*][s]Binding a mouse button takes on the first ordinary click, and the menu shows the correct button straight away.[/s][/*]\n<br />[*][s]Mouse button binds survive restarting the game.[/s][/*]\n<br />[*][s]Keybinds saved under a name no device recognises show as unbound instead of pretending to be bound.[/s][/*]\n<br />[*][s]Once DMF has implemented its own fix, mine should detecte that and implement an internal stand-off procedure. Then suggest in your chat on whether keeping the fix installed is still beneficiary or if it can be completely uninstalled as it has become redundant.[/s][/*]\n<br />[/list]\n<br />[s]The game's own keybinding screen is untouched. Only mod keybinds in the mod options menu are affected.[/s]\n<br />\n<br />[s][size=4][b]Good to know[/b][/size][/s]\n<br />\n<br />[list]\n<br />[*][s]Mouse binds made before installing this were saved in the old ambiguous form. Rebind them once and they are fixed for good.[/s][/*]\n<br />[*][s]Keyboard binds are stored exactly as before, so installing or removing this mod never touches them.[/s][/*]\n<br />[*][s]If you remove this mod later, mouse left and right binds made while it was installed stop working until rebound. That is the same state they would be in without the fix.[/s][/*]\n<br />[/list]\n<br />[s][size=4][b]Temporary by design[/b][/size][/s]\n<br />\n<br />[s]This mod exists only to bridge the gap until the framework carries its own fix.[/s]\n<br />[s]Once a DMF update fixes keybind storage, my mod will detect it and state in your chat that it can be uninstalled. Or, if partially still helping, it will state that keeping it installed may still be beneficial. It'll instead then only stand down part of its framework to compensate.[/s]\n<br />[s]Credit where it's due with much appreciation to the DMF  [url=https://www.nexusmods.com/profile/Aussiemon]author[/url] for the framework that every mod here depends on.[/s]\n<br />\n<br />[s][size=4]Installation[/size][/s]\n<br />\n<br />[s]Install like any other mod, anywhere in the load order. It corrects keybinds for every mod regardless of load order, adds no settings of its own, and has no options menu.[/s]\n<br />\n<br />[center][s][img]https://staticdelivery.nexusmods.com/mods/4943/images/1115/1115-1785417900-197857566.png[/img][/s]\n<br />[img]https://staticdelivery.nexusmods.com/mods/4943/images/1115/1115-1786472846-578152597.png[/img]\n<br />[img]https://staticdelivery.nexusmods.com/mods/4943/images/1115/1115-1786472842-1660520464.png[/img]\n<br />[img]https://staticdelivery.nexusmods.com/mods/4943/images/1115/1115-1786472848-103029771.png[/img]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/1115][img]https://staticdelivery.nexusmods.com/mods/4943/images/1115/1115-1786473748-869135917.png[/img][/url][/center]\n<br />"
