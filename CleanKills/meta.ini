nexusDescription="[heading]Description[/heading]\n<br />CleanKills removes dead enemies as quickly as possible to reduce visual clutter and improve combat readability in Warhammer 40,000: Darktide.\n<br />[heading]Features[/heading]\n<br />[list]\n<br />[*]Removes enemy bodies quickly after death to keep fights visually clean[/*]\n<br />[*]Targets enemy minions only (does not intentionally remove allied/non-enemy units)[/*]\n<br />[*]EXCEPTION: [b]Beast of Nurgle[/b] corpse needs to be visible due to knockback[/*]\n<br />[*]EXCEPTION: [b]Karnak Twins[/b] corpses kept visible due to corner case killed/revived behavior[/*]\n<br />[*]Handles both ragdoll and no-ragdoll death paths[/*]\n<br />[*]Hides attached gear/gib/stump parts that can fly off of bodies[/*]\n<br />[*]Includes optional triage logging for troubleshooting[/*]\n<br />[/list][heading]Installation[/heading]\n<br />[list=1]\n<br />[*]Install DMF and verify it loads correctly.[/*]\n<br />[*]Place the CleanKills mod files in your Darktide mods setup.[/*]\n<br />[*]Enable CleanKills from the in-game DMF mod list.[/*]\n<br />[/list][heading]Permissions, Attribution, and Source Credit[/heading]\n<br />This mod is released with permission from the author of [b]NoCorpses[/b] ([url=https://www.nexusmods.com/profile/7878949696]7878949696[/url]).\n<br />CleanKills was developed/adapted from parts of the original [b]NoCorpses[/b] mod, with additional rework for current compatibility.\n<br />\n<br />Original source mod:\n<br />[list]\n<br />[*][b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/735]NoCorpses[/url][/b] - [url=https://www.nexusmods.com/warhammer40kdarktide/mods/735]https://www.nexusmods.com/warhammer40kdarktide/mods/735[/url][/*]\n<br />[/list]Permission statement:\n<br />[quote]\"我同意你发布这个基于 NoCorpses 部分代码制作的替代模组，也感谢你在发布前先来征求我的许可。不过我有一个明确要求：请你在模组发布页面、说明文件或描述中清楚标注相关情况，说明这个模组是在得到我允许的情况下发布的，并且它是基于我的 NoCorpses 模组部分代码开发/改写而来。同时也请注明原模组 NoCorpses 的名称，并提供原模组链接，方便玩家了解来源。只要这些说明标注清楚，我同意你按照你上面说的方式发布这个模组。\"[/quote]Customization note:\n<br />[code]If you are looking for broader customization options, consider using NoCorpses instead.\n<br />\n<br />CleanKills is intentionally kept stripped down to core corpse-cleanup behavior so it stays easier to maintain across game updates.[/code]"
