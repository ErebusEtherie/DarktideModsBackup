nexusDescription="[size=5][b]English[/b][/size]\n<br />\n<br />[size=5][b]Havoc Condition Manager[/b][/size]\n<br />\n<br />Choose SoloPlay mission conditions and adjust enemy pacing. HCM provides broad controls; the optional Havoc Enemy Director edits individual fields in the same game templates. Realms sessions use the local host's settings.\n<br />\n<br />Use HCM Overall tuning → Random seeds for condition-event probability streams. Use HED Director → Seeds for its scheduling streams and native roamer layout, with separate switches. Off follows the mission seed; HCM draws a fallback once per mission if that seed is unavailable. On enables integer input from 1 to 2147483646. Turning off retains the saved number. Changes apply next mission. These seeds do not choose the mission map or control all native horde, specialist, monster and scripted-event randomness. Lua authors using native math.random directly keep that separate random source.\n<br />\n<br />[size=4][b]DIY conditions[/b][/size]\n<br />\n<br />DIY conditions share the main Conditions list with native conditions. Filters appear in this order: Havoc, Maelstrom, Events, DIY, All, Enabled. Loaded DIY entries also appear in All and Enabled when selected. Hover to read targets, values and trigger details; scroll through long descriptions. HCM applies every enabled checked condition without a quantity quota.\n<br />\n<br />Conditions can select players or enemies by breed and tags, adjust initial enemy health, apply passive stats and keywords, react to native combat events, schedule temporary stacks, change supported resources and statuses, and emit named signals. Conditions can also pause supported native pacing categories or request bounded HED reinforcements. Timing, chance, cooldowns, per-owner/global scope and trigger limits are explicit fields.\n<br />\n<br />Havoc Enemy Director is optional for reinforcement actions. HED deployment and native-template rules can check active DIY condition IDs and named signals. Ordinary DIY reinforcements carry their source through the shared spawn path. Queue admission still follows native placement, capacity and pacing checks.\n<br />\n<br />Three-language guides, templates, the complete native identifier catalog and a row-by-row assessment of 120 supplied design rows are included in docs/diy. The assessment separates supported, partial, adapter-dependent and underspecified designs; the templates do not implement every proposed effect. Realms clients receive host-approved effects for their own player and clear stale effects when synchronization expires.\n<br />\n<br />[size=4][b]Conditions and mission setup[/b][/size]\n<br />\n<br />[list]\n<br />[*]Import the current SoloPlay condition list and group eligible entries as Havoc, Auric/Maelstrom, events and general conditions.[/*]\n<br />[*]Add or remove conditions without a fixed slot count. A shared native mutator loads once even when several selected conditions include it.[/*]\n<br />[*]Choose mission, faction, difficulty and environment in the mission page. An unsupported map/environment pair falls back to Default.[/*]\n<br />[*]Apply the selected native pickup, health-station and hazard settings. Native replacement rules still govern conflicting effects.[/*]\n<br />[/list]\n<br />Available entries depend on the installed game and SoloPlay. HCM supplies no separate Havoc or Maelstrom condition definitions.\n<br />\n<br />[size=4][b]Overall tuning[/b][/size]\n<br />\n<br />Open HCM in Mod Options and select Overall tuning. The main page shows the intensity slider and linked values. The 20 individual controls are in Advanced settings; hover titles for details.\n<br />\n<br />Level 1 preserves the native spawn configuration for the selected mission, difficulty and conditions when HED overrides are also at baseline. Levels 2–10 increase ordinary enemies gradually and increase elite, specialist and monster pressure more strongly. Intermediate levels interpolate between the following anchors; integer allowances may remain equal across adjacent levels. A level describes a preset, not a measured difficulty or kill-count multiplier.\n<br />\n<br />[list]\n<br />[*]Route population: 1× / 1.2× / 1.5× at levels 1 / 5 / 10. Camp count and event budget: 1× / 1.1× / 1.25×.[/*]\n<br />[*]Ordinary enemies per horde or trickle wave: 1× / 1.1× / 1.25×. Horde frequency: 1× / 1.08× / 1.2×; trickle frequency: 1× / 1.05× / 1.1×. Ordinary horde wave counts stay native.[/*]\n<br />[*]Existing elite members in horde compositions and patrol teams: 1× / 1.75× / 3×. Ordinary members keep their separate counts. A patrol with 8 elites and 8 ordinary troops requests 24 elites and 8 ordinary troops at 3× elite members. Roamer packs and point-budget events keep native selection ratios and grow through population and budget.[/*]\n<br />[*]Specialist capacity: 1× / 2× / 3×; refill frequency: 1× / 2× / 3.25×; surge allowance: 1× / 3× / 6×. Capacity and frequency together represent nominal scheduling capacity, subject to native pauses, player-dependent limits and spawn checks.[/*]\n<br />[*]Map monster encounter allowance: 1× / 4× / 8×. Elite patrol encounter allowance: 1× / 3× / 6×. These counts are separate from patrol team size.[/*]\n<br />[*]Coordinated tactic allowance: 1× / 2× / 3×. Supported tactics' upper combat-load limit rises from 35 to 70 to 105. The medium-load lower bound stays at 8; capable-player, pacing-stage and other native conditions still apply. HED can append requirements to the adjusted conditions or explicitly replace them.[/*]\n<br />[*]General combat capacity: 1× / 1.5× / 2×; recovery duration: 1× / 0.85× / 0.7×. At level 10, the living-plus-queued admission threshold is 290 and the difficulty-5 horde threshold is 190. Condition encounter counts, escalation, mission objectives and separate scripted-event limits retain their settings.[/*]\n<br />[/list]\n<br />Patrols and monsters first use unused authored encounter points. Overflow waits for valid hidden navigation positions. Both queues share a minimum 20-second interval and receive turns weighted by their starting overflow quotas. A ready queue gets a turn after at most three successful admissions of the other queue. If one class is blocked or fails to spawn, the other may try; only successful spawns consume allowance. Supplemental bosses wait while three ordinary map monsters are alive, and at most two supplemental patrol groups remain active. Native pauses, positions and mission length can still leave allowance unused.\n<br />\n<br />Route and supplemental elite patrols create one member at a time, at least 0.15 seconds apart, while retaining native breeds, group sounds and unit initialization. Route patrols keep native formation links and walk towards the verified player floor. Supplemental patrols use the current combat target. Ahead positions must remain hidden from every valid teammate, at least 35 metres from each teammate including bots, and 30–120 metres ahead along the main path. If these positions are unusable, a verified nearby hidden point may be used instead: at least 20 metres from every teammate and within 60 metres of the nearest teammate, including side or rear positions. Unavailable positions delay remaining members. Safe-zone restrictions and finite encounter quotas still apply; a patrol consumes its encounter allowance only after all members are created.\n<br />\n<br />Extra patrols, supplemental encounters and recycled enemies validate positions before any unit is created. A candidate needs a complete route from the enemy position to the current player's actual navigation floor. Terrain and door connections follow native pathfinding, without additional HCM door-state or opening-permission checks. Ordinary extra encounters prefer hidden points about 60 metres ahead; recovery requests prefer nearby candidates when a new point is needed, while reusing an already valid shared point. Nearby points remain hidden from every valid teammate, at least 20 metres from each and within 60 metres of the nearest. Unfinished or failed checks never spawn a test enemy. Each formation point must connect to its approved anchor, and actual creation rechecks path validity, player position, distance and visibility. Deferred replacement requests repeat validation when the native queue consumes them.\n<br />\n<br />Placement shares one asynchronous route search and one live path. New searches start at most once per second. Bounded candidates include up to two authored forward points, two authored nearby points and four local mesh points. Nearby authored points favor the player's floor. Local sampling checks at most eight offsets around the real player floor, alternating 28- and 40-metre radii, no more than once every four seconds; a projected point still needs the complete route check. Successful routes are reused across members, and short batches of at most eight replacement positions avoid oversized footprints. The game thread never waits for a search, and recovery decisions still do no pathfinding.\n<br />\n<br />Ordinary hordes and mission events use native position selection, authored door groups and the adjusted template pacing. This includes the Courtroom ascender event and its native rear entrances. HCM adds no navigation-route approval or waiting period to those spawns.\n<br />\n<br />Selecting a level replaces all 20 HCM values; individual edits show Custom. Exact saved presets from the previous curve migrate to the same level on the new curve. Other custom values and HED overrides remain. Changes save automatically and apply next mission.\n<br />\n<br />Due spawners run across successive updates while retaining queues, order and completion callbacks. Ordinary and coordinated hordes defer their next wave while the central queue is congested. Temporary pacing refusals preserve unspawned map encounters. Repeated Buff-capacity warnings are summarized; the Buff event pool remains 300.\n<br />\n<br />Known pacing patrol followers that lose their leader can rejoin native combat once, with recoveries spaced at least 0.15 seconds apart. This uses the existing perception updates and native alert/aggro methods. Mission ownership, player-owned units and traversal protections still apply, and a patrol being recycled is not woken by its own staged removal.\n<br />\n<br />[size=4][b]Automatic rear-enemy recovery[/b][/size]\n<br />\n<br />Recovery runs on the local mission host at every intensity level, including level 1. Common enemies and elites that have been observed in combat, or belong to a known pacing patrol, can retire after 30 seconds out of contact while at least 35 metres from every living teammate, including bots. Samples are five seconds apart; queueing can extend the delay. Actual damage restarts the same timer, and current distance and immediate native visibility are checked again before removal.\n<br />\n<br />Movement, loops, missing route data, patrol flags and the overall scripted-event state do not exempt committed enemies. Patrol members qualify individually. Native common enemies and elites are recognized at creation, including non-objective event waves; recovery does not depend on a spawn-source whitelist. Required mission targets, externally controlled or player-owned units, invulnerable enemies, specialists, bosses, captains and companions remain protected. A mark or persistent effect alone does not grant permanent immunity; ongoing damage resets the timer.\n<br />\n<br />Untouched native ambient roamers can also enter recovery when their authored position is at least 60 metres behind the native cached rear-player progress on a linear map and they remain within 12 metres of that position. They must meet the same 35-metre, visibility and 30-second quiet conditions. This reads existing progress without projecting enemy positions or searching a route. Ahead encounters, enemies between teammates, roamers that have moved too far from their recorded position, open maps and uncertain records retain native handling. Returning teammates cancel admission; a roamer already retired cannot reactivate while engine deletion is pending.\n<br />\n<br />The native perception schedule feeds a fixed ring of at most 64 ready unit references. There is no motion history, main-path projection, remaining-path query, separate pathfinding probe or whole-map scan in the recovery decision. Final attempts are at least 0.25 seconds apart, at most four per second and one per update, with native visibility checks against living teammates. Slow frames never trigger a catch-up burst. Known orphaned patrol followers can still rejoin native combat once through the existing alert/aggro methods.\n<br />\n<br />Recovery uses native removal and recreation. Each original provides at most one replacement of the same breed. Compatible allowances combine into batches of up to 64 members, with at most 32 records and 256 pending units. Accepted allowances remain available until mission end instead of expiring during a blocked encounter. Credits beyond the fixed limits are discarded. Ready batches take turns, so a paused class cannot block later ready classes. Replacement requests are at least 0.25 seconds apart, at most four per second and one per update, with one HCM replacement request in flight globally. There is no extra eight-second gap between batches. Native pacing, capacity, safe-zone, distance, visibility and pre-spawn reachability checks still apply. Failed requests retain their allowance; a replacement never earns another replacement. Health is initialized again and random modifiers may be rerolled; available original health multipliers are retained. Rotten-armour retirement preserves existing non-death cleanup handling.\n<br />\n<br />[size=4][b]Fine editing and saved settings[/b][/size]\n<br />\n<br />Havoc Enemy Director adds Detailed tuning. HCM first supplies broad changes; a HED field override then sets that field's exact value. Native difficulty and condition modifiers can still change the final result. Mission combat-node budgets are a specific case: HCM's event-budget multiplier scales the final budget and its native cap after the node's base values and native modifiers.\n<br />\n<br />Values save automatically and apply when the next mission starts. A running mission retains its starting configuration. DMF switches apply immediately in the hub and are deferred during a mission. Disabling HCM restores SoloPlay's menu and suspends HED for later missions.\n<br />\n<br />The first use imports valid native IDs from the previous HCM selection. Retired condition aliases are omitted; the original saved value is retained. Old category multipliers and custom-generator settings are not converted into native template edits. Start from the new defaults and configure the controls before your next mission.\n<br />\n<br />English, Simplified Chinese and Traditional Chinese follow the game language. Native identifiers remain visible where needed to distinguish exact templates.\n<br />\n<br />Package IDs, versions, dependencies, conflicts and capabilities are validated. Selected local Lua runs on the authority with separate module environments, resource snapshots and cleanup callbacks. Package updates apply next mission. JSON, Lua, resources and dependency fingerprints participate in Mortis room compatibility; network messages never carry executable Lua. Three-language API guides and complete examples are included.\n<br />\n<br />DIY manager provides refresh, description viewing, package toggles, import and export. The built-in collection contains only Frenzied assault and No healing, hidden until extraction. Extract DIY templates writes them to the DIY folder, replaces matching packages and immediately reloads them; previous folders are retained as backups. Templates include Frenzied assault and the revised medical-station restrictions. Extraction does not select gameplay conditions, and the current mission keeps its starting configuration.\n<br />\n<br />Frenzied assault increases ordinary enemy melee attack and animation speed by 20%, with matching hit, combo and sweep timings. It supports local solo/bot sessions and requires the included animation resources. Two unmatched captain combos retain native behavior. No healing preserves pre-powered medical stations with zero charges, removes stations needing a nearby battery together with that battery, and prevents medical stims and medical crates from spawning; other healing remains available.\n<br />\n<br />Bundled templates and extracted AppData DIY packages are separate files. Install-native-melee.cmd updates Frenzied assault in both the installed resources and the extracted package; Extract DIY templates also updates the extracted template copies. Later Lua-only changes can be refreshed in the hub and take effect next mission. Compiled animation resource changes require the game to be closed. Active missions retain their starting package snapshot.\n<br />\n<br />[size=4][b]Requirements[/b][/size]\n<br />\n<br />Darktide Mod Loader, Darktide Mod Framework and SoloPlay are required. Realms is optional for co-op. Havoc Enemy Director is optional. Other mods replacing the same native templates or scheduling methods may conflict.\n<br />\n<br />After deploying HCM through Vortex or manual extraction, close the game and double-click Install-native-melee.cmd in mods/HavocConditionManager to install Frenzied assault's animation resources and update its extracted package. The installer verifies the matching game files, preserves other resource registrations and keeps rollback backups. Vortex deployment alone does not perform this step. To remove the resources, run Uninstall-native-melee.cmd before removing HCM. See docs/Native-melee-installation.md. Other HCM features do not require this step.\n<br />\n<br />[size=4][b]Vortex installation[/b][/size]\n<br />\n<br />[list]\n<br />[*]Close the game and install the requirements. Import this ZIP with Install From File, enable it and select Deploy Mods.[/*]\n<br />[*]Enable HavocConditionManager in Load Order after SoloPlay. Place the optional HavocEnemyDirector after HavocConditionManager.[/*]\n<br />[*]Restart the game and open Havoc Condition Manager in Mod Options.[/*]\n<br />[/list]\n<br />[size=4][b]Manual installation[/b][/size]\n<br />\n<br />[list]\n<br />[*]Close the game. When upgrading, remove the previous HavocConditionManager installation folder before extracting the new ZIP; saved settings are stored separately.[/*]\n<br />[*]Extract the ZIP into Darktide/mods, producing mods/HavocConditionManager.[/*]\n<br />[*]Add HavocConditionManager on its own line after SoloPlay in mods/mod_load_order.txt. Place the optional HavocEnemyDirector after it.[/*]\n<br />[*]Restart the game and open HCM in Mod Options.[/*]\n<br />[/list]\n<br />[size=4][b]Credits[/b][/size]\n<br />\n<br />SoloPlay and the original UI foundation: deluxghost. Native game systems and assets: Fatshark. Game-source reference: Aussiemon/Darktide-Source-Code.\n<br />\n<br />Authored DIY entries can declare external textures, fonts, videos, cursors, icon albums and compiled engine resources. SimpleAssets is an optional resource-loading dependency and must load before this manager when those assets are used. Each entry keeps its own files; active missions retain a frozen copy. The included resource guide explains loading, local view cleanup and native format limits. Ordinary entries do not require SimpleAssets.\n<br />\n<br />[size=5][b]简体中文[/b][/size]\n<br />\n<br />[size=5][b]浩劫词条管理器[/b][/size]\n<br />\n<br />配置 SoloPlay 任务词条，并整体调整敌人调度。HCM 提供整体调节，可选的 Havoc Enemy Director 对同一套游戏模板逐项精调。Realms 房间使用本地主机的设置。\n<br />\n<br />词条事件的概率随机流在 HCM「整体调节 → 随机种子」设置；HED「导演 → 随机种子」分别设置自身编队调度与原生驻军布局。关闭固定种子时沿用任务种子；HCM 无法取得任务种子时，每局只随机生成一次后备用值。开启后可输入 1–2147483646 的整数，关闭会保留输入值，修改用于下一局。这些种子不选择任务地图，也不统一原生尸潮、特感、怪物和脚本事件的全部随机性；Lua 作者直接使用 math.random 时仍属于独立的原生随机来源。\n<br />\n<br />[size=4][b]DIY 词条[/b][/size]\n<br />\n<br />DIY 词条与原生词条共用主界面的「词条配置」列表。分类顺序为浩劫、金级、活动、DIY、全部、已启用；已加载的 DIY 条目也会进入全部和已启用筛选。悬停可阅读适用对象、效果数值和触发说明，长说明支持滚轮翻页。HCM 应用所有已启用且勾选的词条，不设数量配额。\n<br />\n<br />词条可按敌人类型和标签筛选玩家或敌人，修改敌人初始生命，叠加被动属性与关键词，响应原生战斗事件，调度临时叠层，改变已支持的资源和状态，并发出具名信号。还可暂停已接入的原生刷怪节奏类别，或向 HED 请求有限增援。时间、概率、冷却、逐单位／全局作用域和触发次数均有明确字段。\n<br />\n<br />增援动作需要可选的 Havoc Enemy Director。HED 的部署及原生模板规则可检查已生效的 DIY 词条 ID 和具名信号。普通 DIY 增援会通过共用刷怪路径保留来源标记；入队后仍遵守原生落点、容量与节奏检查。\n<br />\n<br />docs/diy 提供三语手册、模板、完整原生标识符目录，以及图片 120 行设计的逐行评估。评估明确区分已支持、部分支持、需要新增适配及规则不明确的方案，模板并未实现全部图片效果。Realms 客机接收房主核准的自身效果，同步失效后清除过期效果。\n<br />\n<br />[size=4][b]词条与任务设置[/b][/size]\n<br />\n<br />[list]\n<br />[*]导入当前 SoloPlay 词条列表，将可用条目分为浩劫、金标／漩涡、活动和通用。[/*]\n<br />[*]添加或删除词条，没有固定槽位上限。多个词条包含同一原版机制时只加载一次。[/*]\n<br />[*]在任务页选择地图、阵营、难度和环境。不支持的地图／环境组合回退为默认环境。[/*]\n<br />[*]应用所选词条的原版拾取物、医疗站和危险物设置。冲突效果仍遵循游戏自身的覆盖规则。[/*]\n<br />[/list]\n<br />可选内容取决于已安装的游戏和 SoloPlay。HCM 不另行定义浩劫或金标词条。\n<br />\n<br />[size=4][b]整体调节[/b][/size]\n<br />\n<br />从模组选项打开 HCM，进入“整体调节”。主界面显示强度滑条和联动数值，20 项单独控件收在“高级设置”中，详细说明放在标题悬停提示中。\n<br />\n<br />HED 也没有额外覆盖时，1 档保留所选地图、难度和词条下的原版刷怪配置。2～10 档让普通敌人缓慢增加，精英、特感和怪物的投入增长更快。中间档位按以下锚点插值；整数额度允许相邻档持平。档位表示组合预设，不代表实测难度或击杀数量的倍数。\n<br />\n<br />[list]\n<br />[*]沿途人数：1／5／10 档分别为 1×／1.2×／1.5×。营地数量和事件预算为 1×／1.1×／1.25×。[/*]\n<br />[*]尸潮与小股潮的单波普通人数：1×／1.1×／1.25×。尸潮频率为 1×／1.08×／1.2×，小股潮频率为 1×／1.05×／1.1×；普通尸潮波数保留原版。[/*]\n<br />[*]尸潮编成与巡逻队中已有的精英人数：1×／1.75×／3×，普通成员使用独立人数设置。原有 8 名精英和 8 名普通兵的巡逻队，在精英人数 3× 时请求 24 名精英和 8 名普通兵。沿途敌群和点数事件保留原版抽选比例，通过人数和预算增加投入。[/*]\n<br />[*]特感容量：1×／2×／3×，补充频率为 1×／2×／3.25×，爆发额度为 1×／3×／6×。容量与频率叠加形成名义投放能力，仍受原版暂停、按玩家人数计算的限制和出生检查影响。[/*]\n<br />[*]地图怪物遭遇额度：1×／4×／8×。精英巡逻遭遇额度：1×／3×／6×；巡逻次数与每队人数分别计算。[/*]\n<br />[*]协同战术额度：1×／2×／3×。受支持攻势的战斗负荷上限由 35 提高到 70、105；中等负荷下界保持 8，有效人数、战斗阶段和其他原版条件继续生效。HED 可以在调整后的条件上追加要求，或明确替换条件列表。[/*]\n<br />[*]常规战斗容量：1×／1.5×／2×，恢复阶段时长为 1×／0.85×／0.7×。10 档存活敌人加待生成请求的总容量门槛为 290，难度 5 的尸潮门槛为 190。词条遭遇数、持续加压、任务目标及独立脚本事件限制保留各自设置。[/*]\n<br />[/list]\n<br />巡逻与怪物先使用未占用的地图预设遭遇点，溢出额度等待后续有效遮挡位置。两个后补队列共用至少 20 秒的间隔，按各自初始溢出额度分配机会；另一类连续成功补入最多三次后，已就绪的队列会获得一次机会。一类受阻或生成失败时，另一类可以尝试，只有生成成功才扣额度。已有 3 只普通地图怪物存活时暂缓额外 Boss，同时最多保留 2 支额外巡逻队。原版暂停、可用位置和任务时长仍可能使额度未用完。\n<br />\n<br />路线与后补精英巡逻队逐个创建成员，相邻成员至少间隔 0.15 秒，保留原版兵种、队伍音效和单位初始化。路线巡逻保持原版编队跟随，行走目标取已经验证的玩家所在层；后补巡逻使用当前交战目标。前方点位必须对所有有效队员不可见，距每名队员（包括 BOT）至少 35 米，并在主路线上领先 30–120 米。前方点位不合适时，允许改用已经验证的附近遮挡点：距每名队员至少 20 米、距最近队员不超过 60 米，也可以位于侧面或后方。没有合适点位则延后剩余成员。出生安全区限制和有限遭遇额度继续生效；巡逻队全员创建完成后才扣除这一队的额度。\n<br />\n<br />额外巡逻、遭遇后补和回收补投均在生成前检查通行。候选点必须存在从敌人位置到当前玩家实际所在导航层的完整路线。地形和门连接由原生寻路决定，HCM 不再额外检查门状态或开门权限。通常的额外遭遇优先使用前方约 60 米处的遮挡点；回收补投需要重新选点时优先尝试附近候选，已有可用的共用点位仍会复用。附近点必须对所有有效队员不可见、距每人至少 20 米、距最近队员不超过 60 米。检查未完成或不通过时不会先生成敌人试路。编队展开后的每个位置还必须能走回已验证的集结点；实际生成前重新确认路线有效性、玩家位置、距离和视野。延迟补投请求在原版队列真正创建单位时再次检查。\n<br />\n<br />选点共用一项异步寻路和一条可检查有效性的路线，每秒最多启动一次新查询。候选表最多保留两个原生前方点、两个原生附近点和四个局部导航点；原生附近点优先考虑玩家所在楼层。局部采样在玩家实际所在导航层周围检查最多八个偏移位置，交替使用 28 米和 40 米半径，全局至少间隔四秒；投影到导航面仍须通过完整通路检查。成功结果供成员复用，补投每次只展开最多八个位置，减少过大的编队范围。游戏线程不等待寻路，回收判定本身仍不做寻路。\n<br />\n<br />普通尸潮和任务事件由原版逻辑选择点位、出生门，并执行调整后的模板节奏。法庭密牢旋转楼梯事件也保留地图原有的后方入口。HCM 不为这些出生增加导航路径审批或等待。\n<br />\n<br />选档会替换全部 20 项 HCM 数值，单项修改后显示“自定义”。完全匹配旧曲线预设的保存值会迁移到新曲线的同一档位，其他自定义值和 HED 覆盖保留。修改自动保存并在下一局生效。\n<br />\n<br />到期出生器分帧执行，保留各自队列、生成顺序和完成通知。普通与协同尸潮在中央队列积压时暂缓下一波，待发波次和受临时容量限制的地图敌人计划继续保留。重复增益容量警告按次数汇总，Buff 事件池维持 300。\n<br />\n<br />已知调度巡逻的跟随者失去队长后，可通过原版警觉／仇恨方法恢复接敌一次，相邻恢复至少间隔 0.15 秒。检查复用已有感知更新，保留任务归属、玩家所有权和穿越动作保护；正在逐个回收的队伍不会被自身回收过程重新唤醒。\n<br />\n<br />[size=4][b]自动回收后方敌人[/b][/size]\n<br />\n<br />本地主机任务中，所有强度档（包括 1 档）均启用回收。已观察到参战的普通兵或精英，以及已投放的调度巡逻，距每名存活队员（包括 BOT）至少 35 米、连续 30 秒没有重新接敌后可以回收。每 5 秒采样一次，排队会延长实际等待。真实伤害重置同一段计时；移除前再次检查当前距离和原版即时视线。\n<br />\n<br />对于已参战或已投放的巡逻，移动、绕圈、路线数据缺失、巡逻标记和整个脚本事件的状态不会使其免于回收。巡逻成员逐个判断，不等待全队。原版普通兵和精英在创建时被识别，包括非必要目标的事件波次，不依赖出生来源白名单。必要任务目标、外部控制或玩家所有单位、无敌敌人、特感、Boss、队长和同伴继续受保护。标记或常驻效果本身不构成永久豁免；实际持续伤害会重置计时。\n<br />\n<br />从未参战的原生地图散怪也可回收：在线性关卡中，原生出生位置已落后于原版缓存的队尾路线进度至少 60 米，且敌人仍在该位置 12 米范围内，才进入同一套 35 米距离、不可见和 30 秒计时检查。只读取现有进度，不为敌人投影路线或寻路。尚在前方、夹在队员之间、离开原记录位置太远、开放地图或记录不明的散怪继续由原版处理。队员折返会取消回收；已回收记录在引擎完成删除前不会重新激活。\n<br />\n<br />复用原版感知调度，只保留最多 64 个已就绪单位引用的固定环形队列。回收判定不保存运动历史，不做主路线投影，不查剩余路径，不启动独立寻路，也不扫描全图。最终尝试至少间隔 0.25 秒，每秒最多四次、每次更新最多一只，并检查存活队员的即时视线。慢帧后不会集中补执行。已知巡逻的孤立跟随者仍可通过原版警觉／仇恨方法恢复接敌一次。\n<br />\n<br />回收使用原版移除和重新生成；每个原单位最多补投一次相同兵种。兼容额度合并成最多 64 人的小批次，同时最多 32 条记录、256 个待补单位。已接受的额度保留到本局结束，不再因遭遇受阻而过期；超过固定容量的额度丢弃。可生成的批次轮流补入，暂停的类别不会挡住后面的可用类别。补投请求至少间隔 0.25 秒，每秒最多四只、每次更新最多一只，全局最多一个 HCM 补投请求等待原版队列处理；批次之间不再额外等待八秒。原版调度、容量、安全区、距离、视野和生成前通路检查继续生效。失败请求保留额度，补投单位不再产生第二次补投。生命值重新初始化，随机词条可能重抽；已知的原生命倍率保留。腐烂护甲的非死亡清理处理继续生效。\n<br />\n<br />[size=4][b]精调与设置保存[/b][/size]\n<br />\n<br />安装 Havoc Enemy Director 后增加“详细调节”页。先应用 HCM 整体倍率，再由 HED 对单个字段写入精确值；原版难度和词条修正仍可能继续改变最终结果。任务战斗节点预算有一项例外：节点基础值与原版修正计算后，HCM 事件预算倍率继续调整最终预算及原版预算封顶。\n<br />\n<br />修改自动保存，在下一局开始时生效；正在运行的任务保持开局配置。DMF 开关在大厅立即生效，任务中切换则延后应用。关闭 HCM 会恢复 SoloPlay 菜单，并在后续任务中暂停 HED。\n<br />\n<br />首次使用会从旧 HCM 选择中导入仍有效的原版词条 ID，省略已移除的别名，保留原始保存值。旧版按敌种分类的倍率和自定义生成器设置不转换为原版模板修改，请从新默认值重新配置。\n<br />\n<br />英文、简体中文和繁体中文随游戏语言切换；为区分具体模板，必要处保留原版标识符。\n<br />\n<br />包 ID、版本、依赖、冲突与能力均经过校验。已选择条目的本地 Lua 在权威端执行，具备独立模块环境、资源快照和清理回调；包更新用于下一局。死灵联机一致性覆盖 JSON、Lua、资源及依赖指纹，网络不传递可执行 Lua。附带中英繁三语包规范、接口说明与完整示例。\n<br />\n<br />「DIY 管理」提供刷新加载、说明查看、包启停、导入和导出。模组仅内置「狂暴攻势」与「禁止医疗」两个模板，未解包时不出现在词条列表中。点击「解压模板DIY词条」会将模板写入 DIY 目录，覆盖同名包并立即加载；旧包保留在备份目录。模板包含「狂暴攻势」和修改后的医疗站限制。解包不会替你勾选词条，当前任务保持开局配置。\n<br />\n<br />「狂暴攻势」将敌人的常规近战攻速与动画速度提高 20%，同步命中、连击与扫击时机。仅支持本地单人/机器人房间，需要安装随附动画资源；两处尚未匹配的首领连招保留原版行为。「禁止医疗」保留开局已通电的医疗站但将次数设为 0，移除需要附近电池的医疗站及配套电池，禁止刷新医疗针剂与医疗包；其他治疗仍可使用。\n<br />\n<br />模组内置模板和 AppData 中已解压的 DIY 包是两份独立文件。Install-native-melee.cmd 会安装动画资源并更新狂暴攻势的外部包；「解压模板DIY词条」也可更新外部模板。以后仅修改 Lua 时，可在大厅刷新并于下一局生效；修改已编译动画资源则必须关闭游戏后安装。已经进行中的任务保留开局时的包快照。\n<br />\n<br />[size=4][b]使用前提[/b][/size]\n<br />\n<br />需要 Darktide Mod Loader、Darktide Mod Framework 和 SoloPlay。Realms 为可选联机依赖，Havoc Enemy Director 为可选精调扩展。其他替换同一原版模板或调度方法的模组可能冲突。\n<br />\n<br />通过 Vortex 或手动方式部署 HCM 后，关闭游戏，双击 mods/HavocConditionManager 内的 Install-native-melee.cmd，安装狂暴攻势的动画资源并更新外部词条包。安装器核对游戏文件、保留其他资源登记并备份；仅在 Vortex 中部署不会执行这一步。卸载时先运行 Uninstall-native-melee.cmd，再移除 HCM。详见 docs/Native-melee-installation.md。HCM 的其他功能不依赖这一步。\n<br />\n<br />[size=4][b]Vortex 安装[/b][/size]\n<br />\n<br />[list]\n<br />[*]关闭游戏并安装前置。使用 Install From File 导入本 ZIP，启用后选择 Deploy Mods。[/*]\n<br />[*]在 Load Order 中将 HavocConditionManager 放在 SoloPlay 后；如安装 HavocEnemyDirector，将其放在 HavocConditionManager 后。[/*]\n<br />[*]重新启动游戏，从模组选项打开浩劫词条管理器。[/*]\n<br />[/list]\n<br />[size=4][b]手动安装[/b][/size]\n<br />\n<br />[list]\n<br />[*]关闭游戏。升级时先移除旧 HavocConditionManager 安装文件夹，再解压新包；已保存设置存放在其他位置。[/*]\n<br />[*]将 ZIP 解压到 Darktide/mods，得到 mods/HavocConditionManager。[/*]\n<br />[*]在 mods/mod_load_order.txt 中单独一行填写 HavocConditionManager，排在 SoloPlay 后；可选的 HavocEnemyDirector 排在其后。[/*]\n<br />[*]重新启动游戏，从模组选项打开 HCM。[/*]\n<br />[/list]\n<br />[size=4][b]致谢[/b][/size]\n<br />\n<br />SoloPlay 与原始界面基础：deluxghost。原版游戏系统和资源：Fatshark。游戏源码参考：Aussiemon/Darktide-Source-Code。\n<br />\n<br />作者可以为 DIY 词条声明外部贴图、字体、视频、光标、图标册与已编译引擎资源。使用这些资源时，可选前置 SimpleAssets 必须排在管理器之前加载。每个词条独立保存文件，本局保留冻结副本；随附资源指南说明加载方式、本地界面清理与原生格式限制。普通词条不需要 SimpleAssets。"
