nexusDescription="[size=4][b]Description[/b][/size]\n<br />[color=#D4D4D8]You see Swagger in the Mourningstar. He beckons you over. [/color]You talk to him and he quickly backs up your user_settings.config file for you.\n<br />\n<br />[size=4][b]Main features[/b][/size]\n<br />[list]\n<br />[*]When you've got your Darktide settings exactly how you like them, back them up easily by interacting with Swagger in the Mourningstar.[/*]\n<br />[*]Animated Swagger will beckon you over, and speak to you as he backs up the file.[/*]\n<br />[*]He'll save them as [b]swagger_user_settings_backup.config[/b] in %AppData%&#92;Fatshark&#92;Darktide&#92; [/*]\n<br />[*]Doesn't interfere with other backup mods or methods.[/*]\n<br />[/list]\n<br />[b][size=4]FAQ[/size]\n<br />\n<br />Why would I want this?\n<br />[/b]Other than the joy of interacting with Swagger? Sometimes after a game update, or Steam restoring a damaged configuration, or whatever, you might find you've lost all your settings. This is one way to get them back to your previous choices without having to experiment and tinker with them all over again.\n<br />\n<br />[b]No, but why would I want [i]this[/i]?[/b]\n<br />It's just a fun and easy way to do it manually occasionally.\n<br />[b]\n<br />Does this change my user_settings.config file?[/b]\n<br />Yes. It immediately rewrites the normal config file to save your current settings, but it does not change any setting values. In other words, it will update it to your latest settings in the game and then save a backup.\n<br />\n<br />[b]How do I restore my settings if Darktide wipes them?[/b]\n<br />1. Exit Darktide\n<br />2. In File Explorer, go to [b]%AppData%&#92;Fatshark&#92;Darktide&#92;[/b]\n<br />3. Delete or move the current [b]user_settings.config[/b]\n<br />4. Rename [b]swagger_user_settings_backup.config[/b] to user_settings.config\n<br />5. Reload Darktide\n<br />\n<br />[b]Why has Swagger stopped talking to me?[/b]\n<br />Once you've backed up once, he'll return to normal until you re-enter the Mourningstar, for example after a mission.\n<br />\n<br />[b]Why didn't you make a joke about \"getting Swagger's back up\"? [/b]\n<br />It would grow tired fast."
