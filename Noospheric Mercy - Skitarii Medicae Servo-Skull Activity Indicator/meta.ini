nexusDescription="[size=4][b]Description[/b][/size]\n<br />[color=#D4D4D8][size=3]This mod will add in visual indicators that a downed player is being rescued by a Skitarii Servo-Skull or a terminal is being hacked, so you can easily redirect your attention to where it's needed the most. [/size][/color]\n<br />\n<br />[size=4][b]Main features[/b][/size]\n<br />[color=#D4D4D8][size=3]Keeps the targetting cogwheel spinning under the player until they're upright. Keeps their outline bright green so you can see that something is happening. Adds a medicae symbol above their head so it's more obvious when everything is covered in fire and crushers.[/size][/color]\n<br />\n<br />[color=#D4D4D8][size=3]This mod also sends a message to the chat indicating that the target is being looked after. This mod will take that chat from other mod users and accurately report if someone else is picking them up. If you toggle the chat off, the mod will take a best guess as to what target the outgoing skull is heading towards (if there's more than one target). It will outline the downed players in orange, until it is certain that a skull is targeting them. Permitting the chat will make this accurate between Skitarii.[/size][/color]\n<br />\n<br />[color=#D4D4D8][size=3]We also add an indicator to hacking terminals in a blue light so you can tell that something is happening from a distance[/size][/color]"
