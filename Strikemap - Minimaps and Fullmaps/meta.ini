nexusDescription="[b][u]Consider this a beta for the time being.[/u][/b]\n<br />\n<br />Adds a minimap that shows the actual level layout, not just dots on a circle. The walkable floor plan is pre-baked for all missions (including the prologue and Mortis Trials) so it works as client, no host needed.\n<br />\n<br />[b]Minimap[/b]\n<br />- shows the level geometry around you, rotates with your camera\n<br />- handles multiple floors, stuff above/below you is dimmed\n<br />- teammates, pings, objectives, medicae (with charges left), ammo/nade crates, grims/scrips\n<br />- enemy markers for hordes, elites, specials and monsters. Uses line of sight by default so it only shows what your team can see, can be changed in settings\n<br />- every enemy type can get its own icon/color if you want to go that far, theres a whole tab for it\n<br />- 5 themes, position/size/zoom/opacity settings, keybinds for toggle and zoom\n<br />\n<br />[b]Full map[/b]\n<br />Separate keybind opens the whole level. Can tilt the view which helps a lot on maps with stacked floors.\n<br />\n<br />[b]Mission debrief[/b]\n<br />The mod records your runs and shows a replay after the mission ends (can be turned off). Timeline you can scrub through, event feed (who got netted by what, who revived who), boss kills, heatmaps of where the squad went and where the kills happened, and a scoreboard with kills/damage/weakspot%/crit%/downs/pickups. You can rotate the map in 3D in this view. Keeps your last 60 runs.\n<br />\n<br />[b]Install[/b]\n<br />Extract into your mods folder, add Strikemap to mod_load_order.txt. Needs DMF.\n<br />\n<br />[b]Credits[/b]\n<br />Map data is based on navmesh dumps by FunkTheMonk (darktide-maps on github). Wouldn't exist without it.\n<br />\n<br />If a map shows nothing or something breaks, leave a comment with the mission name.\n<br />\n<br />\n<br />[u][b]Go and check out my other things [/b][/u]\n<br />[list]\n<br />[*]Blitz Augur: https://www.nexusmods.com/warhammer40kdarktide/mods/1074[/*]\n<br />[*]State Your Name: https://www.nexusmods.com/warhammer40kdarktide/mods/1068[/*]\n<br />[*]Objective Tracker: https://www.nexusmods.com/warhammer40kdarktide/mods/1035[/*]\n<br />[*]Strikemap: https://www.nexusmods.com/warhammer40kdarktide/mods/1022[/*]\n<br />[*]Thank You: https://www.nexusmods.com/warhammer40kdarktide/mods/1075[/*]\n<br />[/list]"
