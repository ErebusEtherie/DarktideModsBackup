nexusDescription="[size=4][b]Description[/b][/size]\n<br />[color=#D4D4D8]The Medicae Servo-Skull is a powerful ability for Skitarii, but its native implementation holds back its practical value. An extremely tight aim hitbox, vague target selection feedback that makes it difficult to confirm a successful lock on downed allies, and a shared blitz keybind with the Purgator Servo-Skull all lead to missed heals and misfires during high-intensity combat.\n<br />This mod solves these pain points with two complementary deployment modes, lowering the skill floor of the Medicae Servo-Skull and catering both to players who want fully automated support and those who prefer full manual targeting control.[/color]\n<br />\n<br />[size=4][b]Main features[/b][/size]\n<br />[color=#D4D4D8][b]Manual-Inject Keybind[/b][/color]\n<br />[color=#d4d4d8]Dedicated keybind for sending Medicae Servo-Skull to inject disabled ally.[/color]\n<br />\n<br />[color=#D4D4D8][b]Auto-Inject Mode (Fully Automatic)[/b]\n<br />Automatically deploys a Medicae Servo-Skull to administer an injection when you aim at a knocked down, hogtied, or netted ally. It is disabled by default during weapon actions and ability actions. Adjust the settings below to enable it if needed. This feature will not activate while you manually hold the blitz key to aim. For manual-aim auto-release functionality, configure it in the Auto-Release section.[/color]\n<br />\n<br />[color=#d4d4d8][b]Auto-Release Mode (Manual Aim + Assisted Cast)[/b][/color]\n<br />[color=#D4D4D8]Hold your blitz key to aim at a disabled ally, and the mod will automatically release the key to deploy the Medicae Servo-Skull for you.[/color]\n<br />\n<br />[size=5][b]模组简介[/b][/size]\n<br />[size=3][size=3]护教军的医疗伺服颅骨功能强大，但其原生操作体验存在多处硬伤，实战实用性大打折扣：瞄准判定范围极其狭窄，高速拉扯的战局中很难精准命中受控队友；目标选中的反馈提示模糊，瞄准后经常难以判断是否已经选定倒地队友，松开按键才发现并未成功锁定；再加上与洗罪者伺服头骨共用闪击按键，紧急救援时极易按错技能，反而贻误支援时机。\n<br />本模组针对上述痛点设计了两套互补的部署方案，大幅降低医疗伺服颅骨的使用门槛，同时兼顾「全自动」与「手动可控」两类玩家的操作习惯。[/size][/size]\n<br />\n<br />[size=5][b]主要功能[/b][/size]\n<br />[size=3]手动注射按键[/size]\n<br />[size=3]专门用于对受困队友使用医疗伺服头骨的按键。[/size]\n<br />\n<br />[size=3]自动注射模式（全自动）[/size]\n<br />[size=3]当瞄准被击倒、被束缚或被陷阱捕获的友军时，自动对其派遣医疗伺服头骨进行注射。攻击与技能动作期间默认不启用，如需启用请调整下方设置。手动按住闪击键瞄准时本功能不会生效，如需手动瞄准自动释放功能，请在自动释放设置板块中配置。\n<br />\n<br />自动释放模式（手动瞄准 + 辅助施放）\n<br />按住闪击键瞄准受控友军，模组将自动替你松开按键以部署医疗伺服头骨。[/size]\n<br />"
