nexusDescription="[center][size=6][b]PILGRIMAGE [BETA][/b][/size]\n<br />[i]The Emperor does not ask where you are going. Only that you keep walking.[/i][/center]\n<br />\n<br />Pilgrimage turns Darktide into a roguelite campaign for solo play or experimental player-hosted co-op. You chain assignments into a run, curses and boons stack mission after mission, an economy grows around both, and a warband of custom bot operatives walks the road with you.\n<br />\n<br />Choose a War Plan, assemble your companions or invite other players through Realms, survive an escalating route, draft boons that last for the pilgrimage, and spend Ordos between deployments. Failure ends the run. Victory brings permanent progress, new options, and stronger ways to shape the next one.\n<br />\n<br />[b]This is a beta.[/b] Pilgrimage is a large mod under active development, released to gather feedback. Unusual mod combinations, balance, newly added combat effects, and the new multiplayer layer still benefit from field reports.\n<br />\n<br />Feature suggestions are welcome. Ideas for custom boons, curses, shop items, bot presets, weapons, and anything else are all useful. You can post on the Nexus page, or chat with me in [url=https://discord.com/channels/1048312349867646996/1536800005510398022]the mod's thread[/url] in [url=https://discord.gg/rKYWtaDx4D]the Darktide Modding Discord[/url]. You can even send me bot designs made with NPC Look.\n<br />\n<br />[size=4][b]Experimental multiplayer through Realms[/b][/size]\n<br />\n<br />[b]Pilgrimage supports experimental multiplayer through [url=https://www.nexusmods.com/warhammer40kdarktide/mods/1223]Realms[/url].[/b] The normal solo experience remains available and does not require Realms.\n<br />\n<br />The host configures the pilgrimage in the Mourningstar as usual, then other players connect through Realms before the assignment begins. See the Realms page for its connection and network setup.\n<br />\n<br />Up to three guests can currently join the host. Guest seats correspond to bot slots 1 through 3. When a human occupies a seat, that bot slot displays [b]Bot - Off[/b] and cannot be edited, but its saved companion assignment is not erased. If the guest leaves, the original bot choice is available again.\n<br />\n<br />Every participant must use:\n<br />\n<br />[list]\n<br />[*]the same Pilgrimage release[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1223]Realms[/url][/*]\n<br />[*]SoloPlay, installed as required by Realms[/*]\n<br />[/list]\n<br />The host owns campaign progression and supplies the session's Custom Weapon Balancing and Cheat Mode settings. A guest's own preferences return after leaving.\n<br />\n<br />[b]Current limitations:[/b] players must join before the assignment begins. Mid-mission joining, reconnect recovery, host migration, and separate guest progression are not supported yet.\n<br />\n<br />[size=4][b]What it does[/b][/size]\n<br />\n<br />[b]Transformative weapon rebalance[/b]\n<br />\n<br />Pilgrimage has an optional arsenal layer, enabled by default during its own missions. It does more than raise a few numbers: selected weapon marks can be rebuilt into distinctly new weapons with their own damage model, cadence, ammunition, handling, role, and optional appearance.\n<br />\n<br />[center][img]https://staticdelivery.nexusmods.com/mods/4943/images/1167/1167-1788394167-2129550932.jpg[/img]\n<br />[i]The Graia Mk VII Vigilant Autogun becomes a four-shot Vraks Headhunter: slow, heavy, and built around deliberate weakspot kills.[/i][/center]\n<br />\n<br />[center][img]https://staticdelivery.nexusmods.com/mods/4943/images/1167/1167-1788394167-163210089.jpg[/img]\n<br />[i]The M35 Magnacore Mk III becomes a handheld Plasma Cannon: clumsy to carry, expensive to fire, and devastating on impact.[/i][/center]\n<br />\n<br />The transformed arsenal includes:\n<br />\n<br />[list]\n<br />[*][b]Vraks Headhunter[/b]: a ballistic sniper rebuilt from the Graia Mk VII Vigilant Autogun. Its four-round magazine, slow 1.8-second shot cycle, one dodge and movement penalty reward deliberate weakspot shooting. It remains an autogun.[/*]\n<br />[*][b]Handheld Plasma Cannon[/b]: a much heavier M35 Magnacore Mk III. Charged shots combine extreme direct damage with a seven-metre explosion and deep penetration, balanced by heat, ammunition cost, slow handling, and one dodge.[/*]\n<br />[*][b]Vindictor Flamer[/b]: a Zealot Flamer with a larger fuel supply, stronger flame damage, much greater stagger, burn-linked Brittleness against Flak and Carapace armour, and a chainsword shove attack that inflicts Bleed.[/*]\n<br />[*][b]Plasma Pistol[/b]: the Mk VI Bolt Pistol becomes a mobile armour-piercing sidearm with explosive impacts. Seven consecutive shots overheat it and temporarily lock out firing, without killing the wielder.[/*]\n<br />[*][b]Meltagun[/b]: a Braced Autogun becomes a short-range armour-melting beam weapon, with a brief charge, sustained discharge, heavy handling and scorching wounds.[/*]\n<br />[*][b]Autocannon[/b]: the Achlys Mk II Heavy Stubber becomes a deliberate explosive cannon, with a twelve-round magazine and heavy impacts.[/*]\n<br />[*][b]Lascannon[/b]: the Mk VI Ripper Gun becomes a charged, penetrating anti-armour weapon. A charge indicator helps you time its powerful discharge.[/*]\n<br />[*][b]Arc Cannon[/b]: the Gorgonum Mk IV Twin-Linked Heavy Stubber becomes a charged electrical weapon with six shots, electrocution and branching arcs between enemies.[/*]\n<br />[/list]\n<br />The same layer revisits existing weapons: stronger Double-Barrel shotguns with tighter spread, a magazine-consuming Grenadier Gauntlet finisher, remote detonation for Rumbler grenades, improved ranged ammunition economy, and distinct Thunder Hammer roles. Power Swords and revved chain weapons gain reusable timed activations; folding shovels can keep their folded mode. The Kickback has a two-shell magazine, higher damage and faster reload. Heavy Sword, Shredder Autopistol and Ogryn Power Maul also got small improvements.\n<br />\n<br />See [url=https://www.nexusmods.com/warhammer40kdarktide/articles/68]Weapon Rebalance and Custom Weapons[/url] for the weapon marks, mechanics and trade-offs.\n<br />\n<br />Custom weapon balancing has a separate Meat Grinder testing switch. Its transformed appearances are also a subordinate option: disabling the balance layer disables its appearances. Gameplay changes do not require Extended Weapon Customization. Exact showcase looks use EWC and compatible external addons when installed, and always yield to a player's saved weapon customization.\n<br />\n<br />Custom weapon sounds are included and enabled by default when [url=https://www.nexusmods.com/warhammer40kdarktide/mods/929]Simple Audio[/url] is installed. Disable them in the custom weapons options to use native sounds instead. Simple Audio is not required for weapon gameplay.\n<br />\n<br />[b]Pilgrimage runs[/b]\n<br />\n<br />Pick a War Plan and walk a generated route of assignments. Plans range from the short Novitiate's Vow to the five-leg Martyr's Vigil, with difficulty and enemy power escalating along the way. A failed assignment ends the pilgrimage. Runs are seeded, so the same seed produces the same road.\n<br />\n<br />Each operative now has a separate active run and boon loadout. Switching characters no longer means inheriting another operative's unfinished pilgrimage. Ordos, permanent unlocks, Penances and companion captures remain shared.\n<br />\n<br />[b]Stacking curses[/b]\n<br />\n<br />Each assignment carries a condition drawn from dozens of vanilla circumstances, Havoc and live-event rotators, and Pilgrimage originals. Curses remain active for the rest of the run, so a later assignment combines its own threat with everything endured before it.\n<br />\n<br />[b]Boons, Archetypes, Doctrines, and Legendaries[/b]\n<br />\n<br />Between assignments you draft boons from family pools and the compatible Mortis Trials catalogue, as well as custom-made boons. An Archetype shapes what the draft favours, while permanent Doctrines and one class, ability, or blitz-specific Legendary can be equipped before the run begins. An expensive Emporium purchase can open a second Legendary slot for one pilgrimage.\n<br />\n<br />The Loadout is divided into Veteran, Zealot, Psyker, Ogryn, Arbites, Hive Scum, and Battle for Tertium sections so the large Legendary catalogue remains readable. Selecting an entry lets you inspect it first. It is only slotted after you press Equip, just like the Emporium.\n<br />\n<br />Pilgrimage includes the supported base-game Legendaries and a growing catalogue of bespoke alternatives designed to transform abilities rather than merely add statistics. Marked enemies can arc damage to one another, Voice of Command can perform a full battlefield rescue, Brain Rupture can execute protected non-boss targets, Shock Mines can spread Voltaic Webs, Big Box of Hurt can release seeking impact bomblets, and Advanced Combat Doctrines can drain Capacitance at a steady weapon-independent rate. The catalogue covers the planned combat abilities and blitzes across every playable class.\n<br />\n<br />[b]The Emporium[/b]\n<br />\n<br />Ordos earned on the road buy permanent unlocks and run tools: curse rerolls and skips, emergency aid, extra bot and Doctrine slots, a temporary second Legendary slot, contracts, and Writs of Exclusion that remove selected enemy families from a pilgrimage. Hazard Pay can even enable full friendly fire for the next assignment in exchange for a larger payout.\n<br />\n<br />[b]Your warband[/b]\n<br />\n<br />Pilgrimage contains 62 companion presets across Heroes, Champions, and the Living Tithe, with up to six bots in the party. Companions are more than renamed vanilla bots. Presets combine curated classes, talents, weapons, titles, voices and fully custom looks, with Legendaries and signature passives on many higher-tier companions.\n<br />\n<br />Bundled captures provide the companions' equipment and appearances. The four stock-profile Tier 1 recruits deliberately reuse stripped-down default bots. \n<br />\n<br />A tier-grouped party picker manages the warband, and any slot can deliberately be left empty. In multiplayer, occupied guest seats temporarily suppress their matching bot slots without changing the saved roster.\n<br />\n<br />[b]Penances and permanent progression[/b]\n<br />\n<br />Twenty-nine Pilgrimage penances track your campaigns and unlock presets, War Plans, slots, boons, and account-wide rewards. They are browsable in their own terminal tab.\n<br />\n<br />Everything lives in one six-tab Mourningstar terminal: Route, Loadout, Realm, Party, Emporium, and Penances. Assign a terminal keybind in Mod Options, or use [b]/pil_terminal[/b] from anywhere in the Mourningstar or Meat Grinder.\n<br />\n<br />[size=4][b]Companion captures[/b][/size]\n<br />\n<br />You can capture any of your own Darktide characters into a companion preset. A capture includes the character profile, level, talents, weapons, cosmetics, and supported data from optional mods.\n<br />\n<br />The easiest method is the capture target and capture keybind in Pilgrimage's Mod Options. Select a preset, load the character you want to use in the Mourningstar, wait for the character to spawn, and press the capture key.\n<br />\n<br />Capture priority is:\n<br />\n<br />[list=1]\n<br />[*]Your personal capture in Darktide's user settings[/*]\n<br />[*]The capture bundled with the current Pilgrimage release[/*]\n<br />[*]The preset's curated base definition[/*]\n<br />[/list]\n<br />Your own capture always wins. Clearing it returns the preset to the bundled version. A preset without either kind of capture uses its curated base gear, which is a fallback rather than an error.\n<br />\n<br />Use [b]/pil_preset_restore &lt;preset_id&gt;[/b] to clear one personal override or [b]/pil_preset_restore_all[/b] to clear all of them. These commands remove only capture-owned layers; they do not reset party assignments, unlocks, Penances, progression, or run state.\n<br />\n<br />NPC Look outfits are stored per preset, reapplied after a bot dies and is rescued, and carried into menus and mission cutscenes where supported.\n<br />\n<br />Personality Picker captures preserve normal cross-class voices and virtual personalities. Extended Weapon Customization captures preserve melee and ranged attachments and material choices. Missing mods or missing EWC addons are skipped piece by piece, so the underlying companion and weapon remain usable.\n<br />\n<br />See the Companion Presets article for the full capture guide and technical fallback behaviour.\n<br />\n<br />[size=4][b]Requirements and installation[/b][/size]\n<br />\n<br />[b]Required for every installation[/b]\n<br />\n<br />[list]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/19]Darktide Mod Loader[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/8]Darktide Mod Framework[/url][/*]\n<br />[/list]\n<br />[list=1]\n<br />[*]Extract the archive into the Darktide [b]mods[/b] folder.[/*]\n<br />[*]The result should be [b]mods/Pilgrimage/Pilgrimage.mod[/b]. Avoid a second nested Pilgrimage folder.[/*]\n<br />[*]Keep the included [b]PilgrimageHeavyAudio[/b] and [b]PilgrimageMeltaAudio[/b] folders beside Pilgrimage. These contain sound files, not separate mods; do not add them to the load order.[/*]\n<br />[*]Add [b]Pilgrimage[/b] to [b]mods/mod_load_order.txt[/b] below [b]dmf[/b] and below any optional integration mods.[/*]\n<br />[*]Restart Darktide completely after installing or updating. A mod reload is not sufficient for every integration.[/*]\n<br />[*]Open the Pilgrimage terminal in the Mourningstar, or assign its keybind in Mod Options.[/*]\n<br />[/list]\n<br />[size=4][b]Feature dependencies and optional integrations[/b][/size]\n<br />\n<br />Only Darktide Mod Loader and Darktide Mod Framework are needed to launch Pilgrimage's core campaign. The integrations below are not all interchangeable or merely cosmetic, however. Each one is required for the feature named beside it, while Pilgrimage falls back safely when that feature's mod is absent.\n<br />\n<br />[list]\n<br />[*][b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1223]Realms[/url][/b]: required for experimental multiplayer only. Every participant needs Realms, its SoloPlay dependency, and the exact same Pilgrimage release. It is not needed for solo play.[/*]\n<br />[*][b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/929]Simple Audio[/url][/b]: required for the included custom weapon sounds only. Without it, weapons retain native fallback audio.[/*]\n<br />[*][b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1094]NPC Look[/url][/b]: required for the companions' complete custom outfits and extra cosmetic slots. Pilgrimage includes a runtime compatibility bridge for the regular Nexus version. Without NPC Look, the companions still work but fall back to their base cosmetics.[/*]\n<br />[*][b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/745]Better Bots[/url][/b]: required for the intended smart-bot experience and strongly recommended. The warband can spawn without it, but difficult War Plans are not recommended with Darktide's default bot AI.[/*]\n<br />[*][b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1123]Personality Picker[/url][/b]: required for the companions' custom voices, cross-class personalities, and virtual personalities such as Binharic-only speech. Without it, companions use safe official fallback voices.[/*]\n<br />[*][b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/277]Extended Weapon Customization[/url][/b]: required for captured weapon attachments, the exact companion weapon appearances, and Pilgrimage's transformed-weapon showcase looks. The gameplay rebalance itself does not require EWC.[/*]\n<br />[*][b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/429]Ostracized without Objection (OwO)[/url][/b]: required for the custom weapon appearances that use its EWC parts. It remains a separate download and is not bundled with Pilgrimage.[/*]\n<br />[*][b][url=https://discord.gg/rKYWtaDx4D]Syn's Edits[/url][/b]: required for the exact custom weapon appearances that use its EWC parts. It is currently acquired through the Darktide Modding Discord and is not redistributed with Pilgrimage.[/*]\n<br />[*][b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1124]Vox Filter[/url][/b]: optional. It preserves captured voice-filter pins on companions. [/*]\n<br />[/list]\n<br />Missing appearance or voice dependencies do not prevent the campaign or companion from loading. The affected outfit, voice, or weapon part simply falls back to an available alternative. Realms and SoloPlay are required on every participating machine when playing multiplayer.\n<br />\n<br />[size=4][b]Language support[/b][/size]\n<br />\n<br />Pilgrimage's Mod Options and preset-capture dropdown include complete Simplified Chinese localization. The much larger terminal, boon, doctrine, Archetype and Penance catalogues remain English for now.\n<br />\n<br />[size=4][b]Testing and debug commands[/b][/size]\n<br />\n<br />Pilgrimage includes extensive DMF commands because beta testing a campaign should not require replaying hours merely to reach one screen. Commands begin with [b]/pil_[/b]. Particularly useful ones are:\n<br />\n<br />[list]\n<br />[*][b]/pil_run_clear[/b]: abandon and reset the current run[/*]\n<br />[*][b]/pil_terminal[/b]: open the terminal in the Mourningstar or Meat Grinder[/*]\n<br />[*][b]/pil_skip[/b]: complete the current Pilgrimage assignment and advance, useful if a mission gets stuck; eligible completion rewards and Penances still count[/*]\n<br />[*][b]/pil_grant_all_penances[/b]: grant all Pilgrimage penances and their unlocks[/*]\n<br />[*][b]/pil_grant_ordos X[/b]: grant X Ordos[/*]\n<br />[*][b]/pil_test_unlock_all[/b]: temporarily expose all test content without changing permanent progression[/*]\n<br />[*][b]/pil_test_unlock_reset[/b]: restore normal progression locks[/*]\n<br />[*][b]/pil_boon_list[/b]: list boon IDs available to the in-mission test laboratory[/*]\n<br />[*][b]/pil_boon_grant &lt;boon_id&gt;[/b]: grant a boon to the local player for the current mission only[/*]\n<br />[*][b]/pil_boon_remove &lt;boon_id&gt;[/b]: remove one test-granted boon[/*]\n<br />[*][b]/pil_boon_clear[/b]: remove every test-granted boon[/*]\n<br />[*][b]/pil_preset_restore &lt;preset_id&gt;[/b]: remove one personal companion override and reveal the bundled version[/*]\n<br />[*][b]/pil_preset_restore_all[/b]: remove all personal companion overrides without touching progression[/*]\n<br />[*][b]/pil_npclook_bridge[/b]: report NPC Look compatibility status[/*]\n<br />[*][b]/pil_diagnostics on[/b]: enable diagnostic file logging for a reproduction[/*]\n<br />[*][b]/pil_status[/b]: write a broad status report to file[/*]\n<br />[/list]\n<br />There are many more specialized commands for routes, curses, Legendaries, presets, passives, missions, and performance. Type [b]/pil_[/b] into DMF's command interface to browse them.\n<br />\n<br />[size=4][b]Updating and saves[/b][/size]\n<br />\n<br />Replacing the Pilgrimage folder does [b]not[/b] erase progress, unlocks, Ordos, loadouts, party assignments, or personal captures. Darktide Mod Framework stores them in the user's settings file outside the mod folder. Bundled captures are fallbacks and never overwrite a player's version.\n<br />\n<br />When upgrading from shared runs to per-operative saves, the existing run belongs to the first operative you load after migration. Load the character you intend to resume that run with first.\n<br />\n<br />[size=4][b]Known issues and beta caveats[/b][/size]\n<br />\n<br />[list]\n<br />[*]New bespoke Legendaries and the economy are still being tuned. Damage values, prices, rewards, and multipliers may change.[/*]\n<br />[*]The weapon layer is an active beta. Exact breakpoints can vary with rolls, perks, blessings, talents, difficulty, and future Darktide patches.[/*]\n<br />[*][b]Dark Communion can fail to play its scripted cutscenes or finish after its final objectives. Other missions may also suffer scripted progression stalls.[/b] If your Pilgrimage gets stuck, use [b]/pil_skip[/b] to count the current assignment as completed and advance. It grants normal Pilgrimage completion rewards and Penances whose requirements you met. In multiplayer, the host should use it. On the final assignment it completes the run; if you remain in the level, use [b]/pil_leave[/b] to leave.[/*]\n<br />[*]Rumbler remote detonation can still use the original bash animation. It detonates your grenades and does not perform a melee attack.[/*]\n<br />[*]The transformed-weapon showcase appearances require the corresponding parts to exist in the user's EWC catalogue, so make sure to grab EWC and all of its listed addons. Missing visual parts do not disable the gameplay rebalance.[/*]\n<br />[/list]\n<br />[size=4][b]Feedback wanted[/b][/size]\n<br />\n<br />This beta exists to learn from players: multiplayer stability, difficulty by War Plan, Ordos earn rates and prices, favourite and least favourite curses and boons, companion behaviour, mod compatibility, and anything that crashes.\n<br />\n<br />Post on the Nexus page, use the Bugs tab, or find me in [url=https://discord.com/channels/1048312349867646996/1536800005510398022]the mod's thread[/url] in [url=https://discord.gg/rKYWtaDx4D]the Darktide Modding Discord[/url]. For a crash, include the crash GUID, your Pilgrimage version, whether the session was solo or multiplayer, and the relevant part of the Darktide console log. For NPC Look problems, the output of [b]/pil_npclook_bridge[/b] is also useful.\n<br />\n<br />[size=4][b]Permissions[/b][/size]\n<br />\n<br />Free to use in load orders. Translations, forks, and code reuse are welcome with credit. Please do not reupload this mod while this page is maintained. If the page is abandoned, permission is granted in advance to fix and republish it with credit.\n<br />"
