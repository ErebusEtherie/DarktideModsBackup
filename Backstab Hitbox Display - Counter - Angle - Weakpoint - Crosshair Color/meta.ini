nexusDescription="[size=4][b]Description[/b][/size]\n<br />[color=#D4D4D8]\"[b]Skill issue bro.[/b]\" Yeah whatever.[/color]\n<br />[color=#D4D4D8]\"Did I actually land that backstab or not?\" so here is a mod that gives you clarity on it.[/color]\n<br />[color=#D4D4D8]You can also disable, or set render distance if you feel it's too much \"cheating\".[/color]\n<br />\n<br />[left][b][size=4]Main features summary[/size][/b][/left]\n<br />[left]\n<br />[b]・Backstab notifier + combo counter[/b]\n<br />[b]・Backstab cones[/b]\n<br />[b]・Head weakspot marker[/b]\n<br />[b]・Toggleable hide enemy info behind walls (Line-of-sight check)[/b][/left]\n<br />[left][b]・Filter based on Boss, Elites/Ogryns/Specialists, Trash mobs[/b]\n<br />[b]・Custom Backstab crosshair color[/b][/left]\n<br />\n<br />\n<br />[size=4][b]Media[/b][/size]\n<br />\n<br />[center][youtube]4r1lWftRgTU[/youtube][/center]\n<br />[center][/center]\n<br />[left][b][size=4]Main features[/size][/b][/left]\n<br />[center][line]\n<br />[size=4][b]Backstab Counter[/b][/size][/center]\n<br />[center][/center]\n<br />[center][img width=200,height=200]https://staticdelivery.nexusmods.com/mods/4943/images/934/934-1782357653-1941691822.png[/img][/center]\n<br />[center][b]Normal Backstab (Did not Kill, Did not hit Weakpoint)[/b][/center]\n<br />[center][b][color=#e69138]Orange BACKSTAB[/color][/b][/center]\n<br />[center][b]====================================================[/b][/center]\n<br />[center][/center]\n<br />[center][img width=200,height=200]https://staticdelivery.nexusmods.com/mods/4943/images/934/934-1782357663-1721039063.png[/img][/center]\n<br />[center][b]Weakpoint + Backstab (Did not Kill, Hit Weakpoint)[/b][/center]\n<br />[center][b][color=#e69138]Orange BACKSTAB+[/color][/b][/center]\n<br />[center][b]==================================================== [/b][/center]\n<br />[center][/center]\n<br />[center][img width=200,height=200]https://staticdelivery.nexusmods.com/mods/4943/images/934/934-1782357810-210406260.png[/img][/center]\n<br />[center][b]Weakpoint + Backstab + Kill (Killed and Hit Weakpoint)[/b][/center]\n<br />[center][b][color=#ff0000]RED BACKSTAB+[/color][/b][/center]\n<br />[center][line]\n<br />[size=4][b]Backstab Angle Cone[/b][/size][/center]\n<br />[center][size=4][b]Head Weakspot Hitbox Sphere [/b][/size][/center]\n<br />[center][/center]\n<br />[center][size=4][b][img width=360,height=200]https://staticdelivery.nexusmods.com/mods/4943/images/934/934-1782542993-1073359884.jpg[/img][/b][/size][/center]\n<br />[center][size=3][b]Two red cones visible, Above and Below the enemy.[/b][/size][/center]\n<br />[center][size=3][b]Head weakspot sphere.[/b][/size][/center]\n<br />[center][line]\n<br />[b][size=4]Backstab Crosshair Custom Color[/size][/b][/center]\n<br />[center][/center]\n<br />[center][b][img width=100,height=100]https://staticdelivery.nexusmods.com/mods/4943/images/934/934-1782543135-1312955165.png[/img][/b][/center]\n<br />[center][b](Sample Image: Backstab Crosshair Color [color=#ff00ff]Magenta[/color])[/b][/center]\n<br />[center][/center]\n<br />[center][line]\n<br />[b][size=4]Mod Configurable[/size][/b][/center]\n<br />[center][/center]\n<br />[center][b][img width=420,height=200]https://staticdelivery.nexusmods.com/mods/4943/images/934/934-1782358454-429797809.png[/img][/b][/center]\n<br />[line]\n<br />[b][size=4]Main installation[/size][/b] \n<br />\n<br />With Vortex (recommended)\n<br />  1. Install Darktide Mod Loader and Darktide Mod Framework, and run the mod loader's toggle/setup so mods are enabled.\n<br />  2. Click \"Mod Manager Download\" (or \"Download with Vortex\") on this page and let Vortex deploy it.\n<br />  3. Make sure Backstab Hitbox Display is enabled in your mod list and present in mod_load_order.txt.\n<br />  4. Launch the game with mods enabled. Configure everything under Settings → Mod Options → Backstab Hitbox Display.\n<br />\n<br />  Manual install\n<br />  1. Install DML + DMF and enable mods (run toggle_darktide_mods.bat in your Darktide folder if you haven't).\n<br />  2. Download the mod and extract the BackstabHitboxDisplay folder into:\n<br />  …&#92;steamapps&#92;common&#92;Warhammer 40,000 DARKTIDE&#92;mods&#92;\n<br />  3. Open …&#92;Warhammer 40,000 DARKTIDE&#92;mods&#92;mod_load_order.txt and add a line:\n<br />  BackstabHitboxDisplay\n<br />  4. Launch with mods enabled and tweak settings in the mod menu.\n<br />\n<br />[size=4][b]Requirements[/b][/size]\n<br />[color=#D4D4D8]・ Darktide Mod Loader (DML)[/color]\n<br />[color=#D4D4D8]・ Darktide Mod Framework (DMF)[/color]\n<br />\n<br />[color=#D4D4D8][size=4][b]Credits[/b][/size][/color]\n<br />[color=#D4D4D8][size=3]Other mods displayed in the video:[/size][/color]\n<br />[color=#D4D4D8]1. Healthbars - https://www.nexusmods.com/warhammer40kdarktide/mods/16[/color]\n<br />[color=#D4D4D8]2. Kill Tracker - https://www.nexusmods.com/warhammer40kdarktide/mods/143[/color]\n<br />[color=#D4D4D8]3. Debuff Indicator - https://www.nexusmods.com/warhammer40kdarktide/mods/137[/color]\n<br />\n<br />[color=#D4D4D8][size=4][b]Report Issue[/b][/size][/color]\n<br />[color=#D4D4D8]https://github.com/zrovihr/darktide-backstab-info/issues[/color]"
