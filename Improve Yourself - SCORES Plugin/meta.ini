nexusDescription="[color=#ff7700][size=5][font=Impact]IMPORTANT: THIS IS A PLUGIN FOR SCORES[/font][/size][/color]\n<br />[b][size=4]Improve Yourself does not work as a standalone scoreboard.[/size][/b]\n<br />[size=4]You must install and enable [/size][url=https://www.nexusmods.com/warhammer40kdarktide/mods/872][size=4]Scores 1.1[/size][/url][size=4] or newer first. Scores collects the statistics, saves your match history and provides the underlying scoreboard. Improve Yourself turns that data into something Hadron might consider marginally less disappointing.[/size]\n<br />\n<br />[b]Check out my other Mods:[/b]\n<br />[list]\n<br />[*][b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1165]ServeMeSkull[/url] - [/b]Additional keybindings &amp; quick-deploy for all skulls[/*]\n<br />[*][b][url=https://www.nexusmods.com/games/warhammer40kdarktide/mods/1162]I Purge Thy Name[/url][/b] - Reduce player name clutter during missions &amp; more[/*]\n<br />[/list][color=#ff7700][size=6][font=Impact]WHAT DOES IMPROVE YOURSELF DO?[/font][/size][/color]\n<br />[color=#d4d4d8]Raw numbers can tell you that you dealt 58,520 damage.[/color]\n<br />\n<br />[color=#d4d4d8][img]https://staticdelivery.nexusmods.com/mods/4943/images/1176/1176-1786550947-488260635.jpg[/img][/color]\n<br />\n<br />[b][color=#d4d4d8]Improve Yourself tries to answer the more useful questions:[/color][/b]\n<br />[list]\n<br />[*][color=#d4d4d8][color=#D4D4D8]How much did you contribute compared with the squad?[/color][/color][/*]\n<br />[*][color=#d4d4d8]Did you achieve the goals appropriate for your role?[/color][/*]\n<br />[*][color=#d4d4d8]Where did you perform well?[/color][/*]\n<br />[*][color=#d4d4d8]Where can you improve?[/color][/*]\n<br />[*][color=#d4d4d8]What, precisely, reduced your health to an administratively inconvenient level?[/color]\n<br />[/*]\n<br />[/list][color=#d4d4d8]The plugin replaces rows of numbers with compact graphs, comparison bars, pie charts, goals and role-oriented feedback.[/color]\n<br />\n<br />[b][color=#d4d4d8]It works across:[/color][/b]\n<br />[list]\n<br />[*][color=#D4D4D8]The live Tactical Overlay[/color][/*]\n<br />[*]The Victory Board at the end of a mission[/*]\n<br />[*]Saved matches in Scores History[/*]\n<br />[/list][color=#d4d4d8]You can choose independently whether Tactical and Victory use the regular Scores display or the Improve Yourself boards. History lets you switch between numbers and bars without leaving the selected match.[/color]\n<br />\n<br />[color=#ff7700][size=6][font=Impact]PERFORMANCE CATEGORIES[/font][/size][/color]\n<br />[color=#d4d4d8]Your results are organized into four sections:[/color]\n<br />\n<br />[color=#f6b26b][font=Impact][size=5]DEFENSE[/size][/font][/color]\n<br />[color=#d4d4d8]See your Damage Taken contribution, blocked attacks, downs, disables and deaths.[/color]\n<br />\n<br />[color=#d4d4d8]Improve Yourself also adds a detailed Damage Taken breakdown:[/color]\n<br />[list]\n<br />[*][color=#d4d4d8]Ranged Damage[/color][/*]\n<br />[*]Melee Damage[/*]\n<br />[*]Area of Effect[/*]\n<br />[*]Other Damage[/*]\n<br />[/list][color=#d4d4d8]Source labels help identify whether the damage came from gunners, Poxwalkers, Poxbursters, ground effects or something the available game data could not classify more precisely.[/color]\n<br />\n<br />[font=Courier New][b][i][color=#00ffff]For defensive statistics, Hadron advises: lower is better. Heroically absorbing every attack with your face is not a recognized combat role.[/color][/i][/b][/font]\n<br />\n<br />[color=#f6b26b][size=5][font=Impact]OFFENSE[/font][/size][/color]\n<br />[color=#d4d4d8]Damage Total is displayed as a pie chart showing your share of the squad’s damage.[/color]\n<br />\n<br />[color=#d4d4d8]Additional bars can show:[/color]\n<br />[list]\n<br />[*][color=#d4d4d8]Weakspot hits[/color][/*]\n<br />[*][color=#d4d4d8]Melee kills[/color][/*]\n<br />[*][color=#d4d4d8]Ranged kills[/color][/*]\n<br />[*][color=#d4d4d8]Swarmers[/color][/*]\n<br />[*][color=#d4d4d8]Elites[/color][/*]\n<br />[*][color=#d4d4d8]Specials[/color][/*]\n<br />[*][color=#d4d4d8]Boss damage[/color][/*]\n<br />[/list][color=#f6b26b][size=5][font=Impact]COMBAT QUALITY[/font][/size][/color]\n<br />[color=#d4d4d8]Compare statistics such as:[/color]\n<br />[list]\n<br />[*][color=#d4d4d8]Weakspot-hit percentage[/color][/*]\n<br />[*][color=#d4d4d8]Critical-hit percentage[/color][/*]\n<br />[*][color=#d4d4d8]Ranged accuracy[/color][/*]\n<br />[/list][color=#d4d4d8]Each comparison shows the best squad result, your result and the lowest result without burying you under another wall of numbers.[/color]\n<br />\n<br />[color=#f6b26b][size=5][font=Impact]TEAMPLAY[/font][/size][/color]\n<br />[color=#d4d4d8]Review contributions such as:[/color]\n<br />[list]\n<br />[*][color=#d4d4d8]Coherency[/color][/*]\n<br />[*][color=#d4d4d8]Saves[/color][/*]\n<br />[*][color=#d4d4d8]Revives[/color][/*]\n<br />[*][color=#d4d4d8]Ammo contribution[/color][/*]\n<br />[*][color=#d4d4d8]Health stations[/color][/*]\n<br />[*][color=#d4d4d8]Objectives[/color][/*]\n<br />[*][color=#d4d4d8]Currency[/color][/*]\n<br />[/list][color=#d4d4d8][img]https://staticdelivery.nexusmods.com/mods/4943/images/1176/1176-1786550951-1572468151.jpg[/img][/color]\n<br />\n<br />[color=#ff7700][size=6][font=Impact]GOALS &amp; ROLES[/font][/size][/color]\n<br />[color=#d4d4d8]Improve Yourself includes six configurable playstyle roles:[/color]\n<br />[list]\n<br />[*][color=#d4d4d8]Generalist[/color][/*]\n<br />[*][color=#d4d4d8]Melee Anchor[/color][/*]\n<br />[*][color=#d4d4d8]Horde Control[/color][/*]\n<br />[*][color=#d4d4d8]Ranged Specialist[/color][/*]\n<br />[*][color=#d4d4d8]Elite &amp; Boss Killer[/color][/*]\n<br />[*][color=#d4d4d8]Support &amp; Control[/color][/*]\n<br />[/list][color=#d4d4d8]Each role has its own recommended goals, and every goal can be customized.[/color]\n<br />[list]\n<br />[*][color=#d4d4d8][color=#d4d4d8]Goals represent your intended share of the squad total. [/color][/color][/*]\n<br />[*][color=#d4d4d8][color=#d4d4d8]In a four-player team, 25% usually represents an equal contribution, although different roles may reasonably aim higher or lower for particular statistics.[/color][/color][/*]\n<br />[*][color=#d4d4d8][color=#d4d4d8]Your configured goal appears directly on the graph. The result bar shows how close you came—or how efficiently you exceeded Hadron’s expectations.[/color][/color][/*]\n<br />[/list][color=#00ffff][font=Courier New]Hadron: The preset goals were divined from the Machine Spirit, not tailored to your particular collection of deficiencies. Adjust them yourself. Complaining that the Omnissiah has miscalibrated your performance expectations by using the defaults would be ... unwise.[/font][/color]\n<br />\n<br />[color=#f6b26b][size=5][font=Impact]Color schemes[/font][/size][/color]\n<br />\n<br />[color=#d4d4d8]Two color modes are available:[/color]\n<br />[list]\n<br />[*][color=#d4d4d8]Goal Oriented: colors your results according to whether you reached your configured goals.[/color][/*]\n<br />[*][color=#d4d4d8]Team Comparison: colors your results according to your position within the squad.[/color][/*]\n<br />[/list][color=#d4d4d8]Other players remain neutral so the board stays focused on your own performance.[/color]\n<br />\n<br />[color=#00ffff][font=Courier New]Gold is reserved for a team-best result. The Omnissiah approves of efficient use of pigments.[/font][/color]\n<br />\n<br />[color=#ff7700][size=6][font=Impact]SCORES INTEGRATION[/font][/size][/color]\n<br />[color=#d4d4d8]Improve Yourself respects the statistics enabled in Scores.[/color]\n<br />\n<br />[color=#d4d4d8]If a metric is disabled in Scores:[/color]\n<br />[list]\n<br />[*][color=#d4d4d8]Its graph or counter is hidden.[/color][/*]\n<br />[*][color=#d4d4d8]The remaining layout automatically recenters.[/color][/*]\n<br />[*][color=#d4d4d8]It is excluded from goals, praise and role evaluation.[/color][/*]\n<br />[/list][color=#d4d4d8]When Split Kill Tiers is disabled in Scores, the Swarmer, Elite and Special bars are hidden together.[/color]\n<br />\n<br />[color=#d4d4d8][i][b]Please note that Scores only saves datasets that were enabled during the match. Enabling one later cannot restore missing information in an older History entry. Improve Yourself displays NO DATA when an enabled statistic was not recorded, while a valid zero-event result appears as --.[/b][/i][/color]\n<br />\n<br />[color=#d4d4d8]Improve Yourself does not create a separate match-history archive, delete saved matches or overwrite your Scores settings.[/color]\n<br />\n<br />[color=#f6b26b][size=5][font=Impact]REQUIREMENTS[/font][/size][/color]\n<br />[list]\n<br />[*][color=#d4d4d8]Darktide Mod Framework[/color][/*]\n<br />[*][color=#d4d4d8]Scores 1.1 or newer[/color][/*]\n<br />[*][color=#d4d4d8]Improve Yourself loaded after Scores[/color][/*]\n<br />[/list][color=#d4d4d8][b]Do not run Scores and Scoreboard II together.[/b][/color]\n<br />[color=#d4d4d8]Improve Yourself is an independent plugin for Scores. It uses Scores’ runtime data and mod interfaces but does not redistribute Scores files.[/color]\n<br />\n<br />[color=#ff7700][size=6][font=Impact]INSTALLATION[/font][/size][/color]\n<br />[list]\n<br />[*]Install using vortex[/*]\n<br />[*]or put in your mods folder and add to launch order.[/*]\n<br />[*]Make sure you have [url=https://www.nexusmods.com/warhammer40kdarktide/mods/872]Scores 1.1[/url] installed and it is before IY in mod load order[/*]\n<br />[/list][color=#ff7700][size=6][font=Impact]SHOUT OUTS[/font][/size][/color]\n<br />Thanks to the u84n for [b]Scores[/b], who made an amazing, lightweight framework to build for. \n<br />\n<br />Additional thanks to the Darktide Mod Framework maintainers and the wider Darktide modding community for making small acts of interface heresy possible.\n<br />\n<br />[i][b]AI Disclaimer[/b]\n<br />AI tools assisted with coding and documentation. All features were manually reviewed, tested in-game, and refined based on actual gameplay before release. While the header-image on the mod page was partially created and modified with AI, all ingame screenshots are taken directly from the game.[/i]\n<br />"
