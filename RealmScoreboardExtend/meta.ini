nexusDescription="[b]Description[/b]\n<br />RealmScoreboardExtend is an independent extension for Darktide’s scoreboard system that upgrades the in-mission, end-screen, and history scoreboards without replacing the base scoreboard logic. It improves player list reliability, makes match history updates more robust, and improves readability and practicality in multi-player sessions by adding better identity handling, paging, and optional LoadoutMonitor display rows.\n<br />\n<br />[b]Installation instructions[/b]\n<br />1. Exit the game.\n<br />2. Extract RealmScoreboardExtend into the game mods folder.\n<br />3. Open mod_load_order.txt and load scoreboard, LoadoutMonitor, and related scoreboard plugins before RealmScoreboardExtend.\n<br />4. Remove/disable ScoreboardRoster and RealmsScoreboard8 (do not run both together).\n<br />5. Start the game and check the mod options for RealmScoreboardExtend to confirm expected settings.\n<br />6. If updating, overwrite only the RealmScoreboardExtend folder and keep your existing settings/history.\n<br />\n<br />[b]Main features[/b]\n<br />- Supports 1–12 players per page (default 8) for mission, end-screen, and history scoreboards.\n<br />- Configurable paging controls (PageUp / PageDown) and automatic UI scaling.\n<br />- Optional LoadoutMonitor rows: weapon, perks, blessings, and profile snapshot display.\n<br />- Fixes dropped/merged entries caused by duplicate names or temporary missing player IDs (including Realms slot-based identity conflicts).\n<br />- Fixes stale history-list behavior after mission save; prevents duplicate list entries from repeated same-second saves.\n<br />- Adds diagnostics: /rse_status, /rse_next, /rse_prev (/sr_* aliases retained).\n<br />- Supports English and Simplified Chinese UI text; preserves UTF-8 player and plugin text.\n<br />\n<br />[b]Requirements[/b]\n<br />- Required: scoreboard mod.\n<br />- Recommended: LoadoutMonitor (for equipment/perk/blessing rows).\n<br />- Compatible with common scoreboard helper mods/plugins, but load order must follow your current scoreboard stack.\n<br />- No external tools or game file edits are required.\n<br />\n<br />[b]Shout outs[/b]\n<br />Thanks to the Darktide scoreboard modding ecosystem, especially the base scoreboard and LoadoutMonitor communities, for their foundations and compatibility support, and to all players who reported edge-case identity and history issues that helped guide these fixes."
