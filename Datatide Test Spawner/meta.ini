nexusDescription="Spawn into Solo Play missions then cycle to the desired test, spawn them in, fight them and see how your build compares to others. This is meant to test weapons in combination with talent tree builds to see how quickly and safely they can deal with certain enemy groups.\n<br />\n<br />Current features include\n<br />[list]\n<br />[*]Teleport player to start location\n<br />[*]Spawn in large groups of enemies\n<br />[*]Handle player invisibility during test setup time\n<br />[*]Despawn all other units on map and disable enemy spawns for the remainder of the mission (reload map to reenable spawns)\n<br />[*]Reset the player character and apply buffs automatically using 'Testing Utilities' mod\n<br />[*]Track player loadout, kills, time, damage taken, among other statistics\n<br />[*]Make player invulnerable for the remainder of the mission to avoid reloading maps on failed attempts\n<br />[*]Failing the test where the player would have died (options for how player death and Until Death are handled)\n<br />[*]Reset Scoreboard with each test to leverage real time data\n<br />[*]Save tests to the test_data folder inside the datatide mod folder\n<br />[*]Format data for quick entry into the Datatide Spreadsheet\n<br />[/list]\n<br />[url=https://docs.google.com/spreadsheets/d/1gZUYH3qgCDUaBCTKI9AAw7u56cE7YzbhoeWOsqYAiRw/edit?usp=sharing]Blank Datatide Spreadsheet﻿[/url]﻿﻿\n<br />Here is the blank Datatide spreadsheet link. Make a copy of the sheet to edit and add data. Simply copy past data without any time stamps from your mods/DatatideTestSpawner/test_data folder into the Datatide Spreadsheet and leaderboards will automatically update.\n<br />\n<br />I know there will be interest in creating and saving custom tests so it's something I am looking into, but no promises. The mod.data file contains a table of tests which can be added to or edited if you would like to create custom tests in the mean time. There are also position at cursor and code map name utilities included to help with that process.\n<br />\n<br />I have not tested this mod as thoroughly as I'd have like, but I haven't heard of any bugs from those I've given it out to. Please leave any feedback in posts here or find me on the Darktide Modding Discord. I am always open to suggestions as I am a novice at writing code. Any feedback helps :) I've probably also made some typos in the mod or in this description :p lmk"
