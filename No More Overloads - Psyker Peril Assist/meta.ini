nexusDescription="[center][b][size=6][color=#EBC4FF]FEATURES[/color][/size][/b][/center]\n<br />[b][size=4][color=#D46BFF]AUTOMATIC INPUT BLOCKING[/color][/size][/b]\n<br />Can block only the peril overload triggering actions of a weapon/blitz, and only while the overload would be unrecoverable. Each category has its own toggle. Queued inputs are re-checked when the game consumes them, so nothing slips through the gap. Blocking engages before the Warp Unbound ends. Accounts for server/client side misalignment and scales with your ping to ensure accuracy. A held cast is concluded early just before Warp Unbound expires. Input blocking covers all peril generating actions from the following:\n<br />\n<br />[list]\n<br />[*][b]Force Staffs[/b][/*]\n<br />[*][b]Blitzes[/b][/*]\n<br />[*][b]Force Swords[/b][/*]\n<br />[*][b]Force Greatswords[/b][/*]\n<br />[*][b]Duelling Swords[/b][/*]\n<br />[*][b]Laspistols[/b][/*]\n<br />[*][b]Plasma Guns[/b] (for all classes)[/*]\n<br />[*][b]Crystalline Will[/b] (off by default)[/*]\n<br />[/list]\n<br />[size=4][b][color=#D46BFF]AUTOMATIC QUELLING[/color][/b][/size]\n<br />Can hold your Reload key to quell peril while considered UNSAFE for a customisable duration. Deliberately does not trigger during Warp Unbound.\n<br />\n<br />[list]\n<br />[*][b]Auto fire before unsafe[/b]: automatically fires a charging staff just before peril reaches UNSAFE.[/*]\n<br />[*][b]Interrupt on player action[/b]: can stop quelling if another action is used.[/*]\n<br />[*][b]Extra quell hold[/b]: can keep quelling for 0-5s after UNSAFE clears. Recommended is 0-0.5 seconds, depending on quell speed.[/*]\n<br />[*][b][color=#ff0000]PLEASE NOTE[/color][/b]: Being stunned at 100% peril can still overload you. It is not possible to block a stun, and accounting for this would massively nerf the mod's capabilities. I'm afraid this is the one git gud caveat. On the upside, the Automatic Ability Use will still trigger if it's off cooldown!😅[/*]\n<br />[/list]\n<br />[size=4][b][color=#D46BFF]AUTOMATIC ABILITY USE[/color][/b][/size]\n<br />Can fire Psykinetic's Wrath, Venting Shriek or Scrier's Gaze for you with customisable settings.\n<br />\n<br />[list]\n<br />[*][b]Reactive [/b]mode (default) : fires the instant an overload triggers. [b]Proactive[/b] mode : fires as soon as the ability is off cooldown, waiting only for your current cast to finish.[/*]\n<br />[*][b]Minimum peril threshold[/b]: can hold [b]Proactive[/b] mode back until peril reaches a set percentage (0-100). Doesn't affect [b]Reactive [/b]mode.[/*]\n<br />[*][b]Cooldown tolerance[/b]: can be adjusted so it counts as SAFE while your ability is ready within 0-3s. Increase if you want to scream a little bit...[/*]\n<br />[/list]\n<br />[size=4][b][color=#D46BFF]SAFE / UNSAFE INDICATOR[/color][/b][/size]\n<br />Can show an on-screen warning below your peril percentage if a cast would trigger an overload normally.\n<br />\n<br />[list]\n<br />[*]UNSAFE shows only when an overload would be unrecoverable, not when peril is merely high.[/*]\n<br />[*]SAFE can show in situations where you can use peril abilities freely.[/*]\n<br />[*]Wording adjustable via presets.[/*]\n<br />[*]RGB per state, positioning, font size adjustable.[/*]\n<br />[/list]\n<br />[size=4][b][color=#D46BFF]LANGUAGES[/color][/b][/size]\n<br />Mod Options in 12 languages: English, Deutsch, Español, Français, Italiano, Polski, Русский, 日本語, 한국어, Português (Brasil), 简体中文, 繁體中文.\n<br />\n<br />[list]\n<br />[*]Game terms are pulled from Darktide's own strings, so they match Fatshark's wording in your language.[/*]\n<br />[*]Every setting shows its default value in the tooltip.[/*]\n<br />[/list]\n<br />[center][b][size=6][color=#EBC4FF]INSTALLATION[/color][/size][/b][/center]\n<br />[size=4][b][color=#D46BFF]GUIDE[/color][/b][/size]\n<br />Installation is automatic via Vortex or your mod manager. If you find input blocking isn't working correctly, move No More Overloads to the bottom of your load order.\n<br />\n<br />[size=4][b][color=#D46BFF]REQUIREMENTS[/color][/b][/size]\n<br />[list]\n<br />[*]Darktide Mod Framework (DMF)[/*]\n<br />[*]Darktide Mod Loader (DML)[/*]\n<br />[/list]"
