nexusDescription="\n<br />[left]Allows weapons to be customized and built from the games pool of weapon parts.[/left]\n<br />[left]Makes flashlights available for most ranged weapons and adds a laser pointer.[/left]\n<br />[left]Makes various sights and reflex sights available for most ranged weapons and adds zoomed scopes.[/left]\n<br />[left]Shows unwielded weapons on the back of the characters.[/left]\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />[left][b][color=#00ff00][size=4]Rebuild:[/size][/color][/b][/left]\n<br />[left][size=3]Version 3.0+ is a complete rebuild for better performance and more features.[/size][/left]\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />[left][b][color=#dd7e6b][size=4]Note:[/size][/color][/b][/left]\n<br />[left]This mod is client-side-only.[/left]\n<br />[left]Other player will not see your customized weapons.[/left]\n<br />[left]Synchronizing the weapons between clients is currently not feasible.[/left]\n<br />[left]At this time there is no point asking for this as a feature.[/left]\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />[center][size=4][b][size=6]Features[/size][/b][/size][/center]\n<br />[right]-[/right]\n<br />[center][size=5]﻿[b]Weapo[b][b]n Customization[/b][/b][/b][/size][/center]\n<br />[center][size=4]\n<br />Customize weapons using the pool of weapon parts that darktide has to offer under the hood.[/size][/center]\n<br />[center]-[/center]\n<br />[img]https://i.imgur.com/rxMoSNp.png[/img]\n<br />[right]﻿-[/right]\n<br />[center][size=5][b]Visual Weapon Sway[/b][/size][/center]\n<br />[center][size=4]\n<br />Gives ranged weapons a stronger visual sway when rotating.[/size][/center]\n<br />[center]-[/center]\n<br />[img]https://i.imgur.com/jv9AZKC.gif[/img]\n<br />[right]-[/right]\n<br />[center][b][size=5]Weapon Depth of Field[/size]\n<br />[/b][/center]\n<br />[center][size=4]A camera effect that gives ranged weapons some more depth.[/size][/center]\n<br />[center]-[/center]\n<br />[img]https://i.imgur.com/VADfDyt.png[/img]\n<br />[right]-[/right]\n<br />[center][b][size=5]Sights / Scopes[/size][/b][/center]\n<br />[center][size=4]﻿Unlocks various sights and reflex sights for most ranged weapons.\n<br />﻿Adds functionality for zoomed scopes, adds three zoomed scopes.[/size][/center]\n<br />[center]-[/center]\n<br />[img]https://i.imgur.com/P0DpnB1.png[/img]\n<br />[right]-[/right]\n<br />[center][size=5][b][b]Flashlights / Laser Pointer[/b][/b][/size][/center]\n<br />[center][size=4][b]\n<br />Flashlights[/b][/size][/center]\n<br />[center]\n<br />[size=4]Offers a selection of flashlights with different characteristics that can be equipped to almost any gun.\n<br />﻿Flashlights / Laser Pointer replace the weapons original special attack.[/size][/center]\n<br />[center][size=4][b]Laser Pointer[/b][/size][/center]\n<br />[center][size=4]A Laser Pointer / Flashlight combination is available for almost any gun.[/size][/center]\n<br />[center][s][size=4][b]Battery System[/b][/size][/s][/center]\n<br />[center][s][size=4]\n<br />The modded flashlights operate on recycled spare batteries.\n<br />﻿They're not the most reliable ones.\n<br />﻿Batteries recharge after a while but the lower their charge the weaker the light they produce.[/size][/s][/center]\n<br />[center]-[/center]\n<br />[center]\n<br />\n<br />[img]https://i.imgur.com/CfeC0XM.png[/img][/center]\n<br />[center]\n<br />\n<br />\n<br />[right]-[/right]\n<br />[/center]\n<br />[center][size=5][b][b]Crouch Animation[/b][/b][/size][/center]\n<br />[center][size=4]Alternative stance when crouching.[/size][/center]\n<br />[center]-[/center]\n<br />[img]https://i.imgur.com/4BEpcah.gif[/img]\n<br />[right]-[/right]\n<br />[center][size=5][b]Randomization[/b][/size][/center]\n<br />[center][size=4]Items in the store, on other players and rewards after a mission are randomized weapons.[/size][/center]\n<br />[center][size=4]-[/size][/center]\n<br />[img]https://i.imgur.com/9eZFQNj.png[/img]\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />[left][b][size=4]Visible Equipment[/size][/b][/left]\n<br />[right][size=3]-[/size][/right]\n<br />[left][size=3][url=https://www.nexusmods.com/warhammer40kdarktide/mods/852]Visible Equipment[/url] is now a seperate mod.[/size][/left]\n<br />[right][size=3]-[/size][/right]\n<br />[right][size=3]-[/size][/right]\n<br />[right][size=3]-[/size][/right]\n<br />[b][size=4]Known Plugins[/size][/b]\n<br />[right]-[/right]\n<br />[left]Coming soon ...[/left]\n<br />\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />[b][size=4]Requirements[/size][/b]\n<br />[right][size=4]-[/size][/right]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/409]MasterItems Community Patch[/url]\n<br />[right]-[/right]\n<br />[left][url=https://www.nexusmods.com/warhammer40kdarktide/mods/853]Visual Loadout Customization Community Patch[/url][/left]\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />\n<br />[b][size=4]Languages[/size][/b]\n<br />[right][size=4]-[/size][/right]\n<br />- English\n<br />[right]-[/right]\n<br />[s]- German[/s]\n<br />[right]-[/right]\n<br />[s]- Russian[/s]\n<br />[right]-[/right]\n<br />- Chinese\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />[b][size=4]Thanks to[/size][/b]\n<br />[right][size=4]-[/size][/right]\n<br />- xsSplater ( russian translation )\n<br />[right]-[/right]\n<br />- deluxghost ( chinese translation )\n<br />\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />[right]-[/right]\n<br />[b]Changelog EWC Base Additions[/b]\n<br />[right][b]-[/b][/right]\n<br />[left][b]1.04[/b][/left]\n<br />[right]-[/right]\n<br />[left]- Properly integrated arc rifle\n<br />[/left]\n<br />[right]-[/right]\n<br />[left]- Properly integrated phosphor pistol[/left]\n<br />[right]-[/right]\n<br />[left][b]1.03[/b][/left]\n<br />[right]-[/right]\n<br />