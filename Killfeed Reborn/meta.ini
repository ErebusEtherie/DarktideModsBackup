nexusDescription="This is a combat-feed replacement with Kill Messages related to the damage type used to kill a target and Death Messages picked based on what target killed you. I wanted this to be as customizable as I could make it to the point that it started to feel personal because it is. From the basic mod settings to the color customization for it all. This is my creation, but it is your mod.\n<br />\n<br />Basically (I can't say that because its not basic but oh well) how I have done it is I've classified every damage_profile that the player can do in the background with 2-3 damage types... You get a kill, the mod registers the kill and the damage_profle, looks up that profiles damage type, rolls a chance die to determine what damage type pool it picks a phrase from, then builds you a message with a phrase from that pool.\n<br />\n<br />There's also the coloring additions that in my opinion are a great quality of life addition. The \"Killer Colors\" pictured above are synced with your name in chat, in the subtitles (if you use them), and other player/bots names over their heads in addition to that of the combat_feed. That really helps tie this all together and make it feel like more of a QOL update when it is just a mod.\n<br />\n<br />If you want to contribute a phrase (well anything really) for one of the damage types, I will list them bellow or you can reach out. If you want your phrase in the public release, I require two things and still that is not a guarantee that I will include it.\n<br />1. Your phrase is grammatically correct.\n<br />2. Character count of the phrase alone is 31 or less, spaces included.\n<br />\n<br />General kill message structure: &lt;Player Name&gt; , &lt;Phrase&gt; , &lt;optional determiner&gt; , &lt;Target&gt;\n<br />Phrase Pools:\n<br />Generic: MELEE , RANGED\n<br />Specific: ARC , BLEED , BLUNT , BURN , EXPLOSIVE , SHARP , TOXIN , WARP\n<br />Special: FUNNY (This pool does not imply any specific damage type and serves only to get a laugh)\n<br />"
