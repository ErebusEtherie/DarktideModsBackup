nexusDescription="Color Coded Healthbars (Standalone)[b]A comprehensive enemy health visualization mod for Warhammer 40,000: Darktide\n<br />This will be my last mod on darktide\n<br />\n<br />NOTES ON HOW THIS MOD WORKS:\n<br />\n<br />BARS ARE SPAWNED WITH THE UNIT SO IF YOU JOIN MID MISSION YOU WONT HAVE BARS UNTIL YOU ARE PRESENT FOR THE UNITS TO SPAWN\n<br />\n<br />BARS GO AWAY WHEN YOU OPEN SETTINGS MENU PLEASE CONFIGURE WHAT YOU NEED IN MEAT GRINDER THEN PLAY \n<br />\n<br />WHEN YOU ARE DOING SETUPS AND CONFIGURING THE MOD GO INTO MEAT GRINDER AND KEEP KILLING THE UNITS THAT YOU CHANGE TO SPAWN THEM AGAIN TO GET THE BAR BACK\n<br />\n<br />you might have to turn off hide full health enemies if you want to always see the bar\n<br />[/b]\n<br />[line]\n<br />🎯 OverviewColor Coded Healthbars provides advanced enemy health visualization with intelligent priority systems, customizable colors, and enhanced visual features. No external dependencies required - works as a complete standalone mod.\n<br />✨ Key Features🎨 [b]Smart Color Coding[/b]\n<br />[list]\n<br />[*][b]Elite Enemies[/b]: Separate colors for ranged (Dark Orange) vs melee (Orange) elites[/*]\n<br />[*][b]Special Enemies[/b]: Distinct colors for snipers (Pink) vs disablers (Purple)[/*]\n<br />[*][b]Monsters[/b]: High-visibility red for maximum threat awareness[/*]\n<br />[*][b]Captains[/b]: Purple for easy identification[/*]\n<br />[*][b]Horde/Roamer[/b]: Configurable gray tones (optional)[/*]\n<br />[/list][s]🧠 [b]Intelligent Priority System[/b][/s]\n<br />[list]\n<br />[*][s][b]Smart Filtering[/b]: Shows only the most dangerous enemies (max 3-20 configurable)[/s][/*]\n<br />[*][s][b]Threat Prioritization[/b]: Monsters &gt; Specials &gt; Elites &gt; Others[/s][/*]\n<br />[*][s][b]Distance Optimization[/b]: Prioritizes closer threats when equal priority[/s][/*]\n<br />[*][s][b]Performance Friendly[/b]: Prevents screen clutter and maintains smooth gameplay[/s][/*]\n<br />[/list]👁️ [b]Enhanced Visibility[/b]\n<br />[list]\n<br />[*][b]Enemy Names[/b]: Display localized enemy names above healthbars[/*]\n<br />[*][b]Tag Indicators[/b]: Shows [TAGGED], [VET], and [DOG] markers for team coordination[/*]\n<br />[*][b]Health Indicator[/b]: Precise white line showing exact current HP position[/*]\n<br />[*][b]Border Options[/b]: Customizable borders with tag-based color coding[/*]\n<br />[*][b]Health Gradients[/b]: Dynamic color shifts from green (full) to red (critical)[/*]\n<br />[/list]🛠️ [b]Extensive Customization[/b]\n<br />[list]\n<br />[*][b]Visual Settings[/b]: Bar size, text size, positioning, transparency[/*]\n<br />[*][b]Color Controls[/b]: Full RGB customization for all enemy types[/*]\n<br />[*][b]Display Options[/b]: Hide full-health enemies, range limits, fade animations[/*]\n<br />[*][b]Performance Tuning[/b]: Adjustable update intervals and display limits[/*]\n<br />[/list]\n<br />[line]\n<br />🚀 InstallationRequirements\n<br />[list]\n<br />[*][b]Darktide Mod Framework (DMF)[/b] - Latest version[/*]\n<br />[*][b]No other dependencies required![/b][/*]\n<br />[/list][line]\n<br />⚙️ Configuration GuideBasic Setup\n<br />[list=1]\n<br />[*][b]Enable Enemy Types[/b]: Choose which enemies show healthbars (Elite/Special/Monster recommended)[/*]\n<br />[*][b]Set Display Range[/b]: Adjust max distance (30-50m recommended for performance)[/*]\n<br />[*][b]Configure Priority System[/b]: Set max healthbars shown (8 default, 3-20 range)[/*]\n<br />[/list]Visual Customization\n<br />[list]\n<br />[*][b]Bar Dimensions[/b]: Width (60-300px), Height (3-20px)[/*]\n<br />[*][b]Text Settings[/b]: Size (12-40px), positioning, shadow/outline options[/*]\n<br />[*][b]Color Schemes[/b]: Full RGB control for each enemy subcategory[/*]\n<br />[*][b]Enhancement Options[/b]: Borders, gradients, animations[/*]\n<br />[/list]Advanced Features\n<br />[list]\n<br />[*][b]Tag Integration[/b]: Enable tag indicators for team coordination[/*]\n<br />[*][b]Health Precision[/b]: Show exact HP position with white indicator line[/*]\n<br />[*][b]Performance Optimization[/b]: Hide full-health enemies, distance culling[/*]\n<br />[/list][line]\n<br />[list]\n<br />ChangelogFixedFixed a crash (`self.super`) that could occur on enemy death by resolving the`HealthExtension` class lazily instead of via `require()` at mod load time.Numeric sliders (bar border thickness, background opacity, gradient intensity,width/height) no longer snap to whole numbers — added `decimals_number = 2`where appropriate.`max_healthbars_shown` and `priority_system` settings were defined and loadedbut never actually enforced — they're now wired up (see Added).End-cap plates were being dynamically re-tinted to the breed/health colorevery frame, which made them blend invisibly into the bar at high health.They're now a fixed bone/steel tint so they stay visible regardless of bar color.Enemy name text had conflicting alignment fields (`horizontal_alignment` /`vertical_alignment` together with `text_horizontal_alignment` /`text_vertical_alignment`), causing it to render off-center. Reconciledagainst the engine's own vanilla boss-name text style.Name backdrop plate was a single oversized flat black slab; resized to hugthe name text instead of dwarfing it.AddedPriority/cap system: `max_healthbars_shown` now actually caps the numberof healthbars rendered per frame, hiding the lowest-priority/farthestmarkers beyond the limit. Priority tiers (when `priority_system` isenabled): Monster &gt; Special &gt; Captain &gt; Elite &gt; Roamer &gt; Horde &gt; Other.Industrial bar style (new default `bar_corner_style` option): reuses thevanilla boss/monster health bar texture for the fill, adds metal end-capplates flush against the bar, 75/50/25% threshold tick markers, and 7explicit segment dividers across the bar.Critical health pulse: subtle pulsing red overlay on the bar fill whenhealth drops below 25%.Breed-tinted border rim (dimmed version of the breed color) instead of aflat black outline/no outline.Dark backdrop plate + thin breed-colored trim lines behind the enemy namefor readability over bright backgrounds, with a toggle-aware show/hide pathfor names-only mode.ChangedDefault visual settings tuned for a less obtrusive HUD look: bar borderthickness 1 → 2, background opacity 180 → 200, bar style standard → capped→ industrial, text outline disabled → enabled.Default bar/text geometry updated to match the author's preferred layout:Health Bar Width: 120 → 71Health Bar Height: 6 → 3Enemy Name Text Size: 20 → 12Text Vertical Offset: 8 → -2Health Bar Vertical Offset: 0 → 10[/list]"
