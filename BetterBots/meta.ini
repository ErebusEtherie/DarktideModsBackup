nexusDescription="[size=4][b]BetterBots — Smarter bots for Darktide Solo Play[/b][/size]\n<br />\n<br />Vanilla Solo Play bots leave most of their tools unused. The game already gives them a way to fire abilities and use player-like inputs, but only a small part of that system is active by default.\n<br />\n<br />BetterBots opens that system back up and adds the missing decision logic around it. The aim is simple: bots should use the abilities, grenades, blitzes, weapons, and pickups they already have in ways that make Solo Play less frustrating.\n<br />\n<br />[b]Solo Play only.[/b] Darktide uses dedicated servers for public and matched games. Gameplay mods only affect locally hosted missions through [url=https://www.nexusmods.com/warhammer40kdarktide/mods/176]Solo Play[/url]. BetterBots does [b]not[/b] command bots in public matchmaking, public Havoc, or private duo lobbies with server-side bots.\n<br />\n<br />[size=3][b]The short version[/b][/size]\n<br />\n<br />[list]\n<br />[*]Bots use combat abilities instead of holding them all mission.[/*]\n<br />[*]Bots throw grenades and blitzes, including Psyker powers, Zealot knives, Arbites tools, and Ogryn rocks.[/*]\n<br />[*]Bots revive more intelligently, free netted allies, prioritize disablers when someone is pinned or grabbed, and use defensive tools before committing to danger.[/*]\n<br />[*]Bots ping elites and specials, push poxbursters, avoid sleeping daemonhosts, and stop chasing distant specials quite so eagerly.[/*]\n<br />[*]Bots carry books, respond to tagged pickups and limited command-wheel calls, and leave scarce ammo and healing for humans first.[/*]\n<br />[*]Bot profiles give you a class-diverse squad instead of the default all-veteran lineup.[/*]\n<br />[*]Almost everything new can be toggled or tuned in the mod settings.[/*]\n<br />[/list]\n<br />[size=3][b]What changes in-game[/b][/size]\n<br />\n<br />[b]Abilities and blitzes[/b]\n<br />\n<br />Bots can use the full combat-ability set for Veteran, Zealot, Psyker, Ogryn, Arbites, and Hive Scum. The same goes for the grenade/blitz slot: frags, kraks, smoke, fire, shock grenades, Ogryn rocks and clusters, Zealot knives, Psyker Assail/Smite/Chain Lightning, Arbites whistle/mine, and the Hive Scum tools.\n<br />\n<br />The important bit is that they do not just fire everything on cooldown. Abilities have per-class rules: shouts get used under pressure, charges are aimed toward useful targets or rescues, shields and relics are treated as defensive tools, and team cooldowns are staggered so three bots do not spend overlapping abilities at the same moment.\n<br />\n<br />[b]Combat behavior[/b]\n<br />\n<br />BetterBots also patches several smaller behaviors that matter in actual missions:\n<br />\n<br />[list]\n<br />[*]melee attacks are biased toward light/heavy/special choices that fit the target[/*]\n<br />[*]many weapon specials are used deliberately, including power weapons, chain weapons, thunder hammers, force swords, Ogryn shovels/clubs/pickaxes, rippergun bayonets, and supported shotgun special shells[/*]\n<br />[*]staff charged attacks, sustained-fire weapons, and close-range ranged weapons behave more sensibly[/*]\n<br />[*]poxbursters are pushed at close range instead of being shot beside the player[/*]\n<br />[*]daemonhosts, barrels, ledges, and hazards get extra safety handling[/*]\n<br />[*]the Arbites Cyber-Mastiff gets smarter target tags[/*]\n<br />[/list]\n<br />[b]Resources and team play[/b]\n<br />\n<br />Bots can carry tomes and scriptures, pick up tagged items, deploy crates when the team can actually use them, and defer healing/ammo to humans first. If you call [font=Courier New]Need Ammo[/font] or [font=Courier New]Need Health[/font] while a bot is carrying the matching crate, that bot will drop it right away instead of waiting for a quiet moment. If you want stricter resource behavior, settings can require a human tag before bots use health stations or before they proactively take ammo, grenade refills, books, crates, and stims. [font=Courier New]For the Emperor[/font] still makes the bots a little more aggressive for a short window.\n<br />\n<br />This is conservative on purpose. I would rather have bots miss a marginal pickup than take the medicae charge you needed.\n<br />\n<br />[b]Bot profiles[/b]\n<br />\n<br />With [url=https://www.nexusmods.com/warhammer40kdarktide/mods/725]Tertium 6[/url], BetterBots can run class-diverse bot squads with bot-optimized loadouts, talents, blessings, and curios. The built-in BetterBots profiles cover the original four classes; DLC-class bots come from your own Tertium 6 profiles. The defaults are meant to be durable, low-maintenance builds that bots can actually pilot.\n<br />\n<br />Advanced users can edit BetterBots profiles manually. The guide is here: [url=https://github.com/hummat/BetterBots/blob/main/docs/bot/custom-profiles.md]Custom Bot Profiles[/url]. It is source editing, not an in-game editor or preset browser, so copy exact strings from the reference tables if you go down that road.\n<br />\n<br />[size=3][b]Settings[/b][/size]\n<br />\n<br />BetterBots is not trying to decide the one correct way to play Solo Play. The settings let you tune the broad behavior of the bots and disable pieces you dislike.\n<br />\n<br />[list]\n<br />[*]behavior presets: Testing, Aggressive, Balanced, Conservative[/*]\n<br />[*]toggles for ability groups, grenades/blitzes, melee/ranged behavior, weapon specials, daemonhost safety, poxburster safety, healing deferral, ping-only health-station use, ping-only pickup use, grimoire pickup, and debug logging[/*]\n<br />[*]sliders for sprint range, chase range, ammo reserve rules, melee horde bias, player-tag response, close-melee danger, peril thresholds, and human-likeness timing[/*]\n<br />[*]profile options for bot class selection, weapon quality, survivability tier, and incoming damage reduction[/*]\n<br />[/list]\n<br />[size=3][b]Latest update[/b][/size]\n<br />\n<br />[b]v1.2.3[/b]\n<br />\n<br />[list]\n<br />[*]Fixed two Ogryn animation crashes reported on Nexus: one after a Poxburster launched a bot during Rock use, and one when Gunlugger stance collided with the grenade slot.[/*]\n<br />[*]Combat abilities and grenade throws now wait for each other instead of trying to take the same slot at once. Forced unarmed states can also interrupt a grenade lock, as the game expects.[/*]\n<br />[*]Bots now let go of the grenade slot when they start reviving someone or picking something up. That collision has the same shape as the Poxburster one and happens a lot more often, so it is my best guess for anyone who was crashing every mission.[/*]\n<br />[*]Added a backstop. If a bot animation still ends up somewhere the game does not expect, BetterBots logs a warning instead of taking the whole run down with it.[/*]\n<br />[*]Checked across four Solo Play missions on Damnation with Ogryn bots running Rock and Point-Blank Barrage: no crashes, no errors, and the two abilities correctly waiting for each other. I could not get a Poxburster to launch a bot on command, though, so the original crash is fixed by reasoning rather than by reproduction. If you still hit it, please send me the log.[/*]\n<br />[/list]\n<br />[b]v1.2.2[/b]\n<br />\n<br />[list]\n<br />[*]Fixed the game-update safe-hook spam reported on Nexus when bot pocketable/resource pickup support was active. The failing path was the bot pocketable-pickup update, which could read engine userdata like an ordinary Lua table after Darktide 1.12.1.[/*]\n<br />[*]Bots carrying med or ammo crates now answer [font=Courier New]Need Health[/font] / [font=Courier New]Need Ammo[/font] by dropping the matching crate when combat is quiet. If enemies are already close, they keep fighting instead of starting a vulnerable deploy sequence.[/*]\n<br />[*]Hardened several hot paths around missing engine extensions, stale pickup/healing reservations, unsafe target-facing reads, and reload/packaging edge cases. Mostly boring work. Good.[/*]\n<br />[*]Validated in a fresh Solo Play run after the fix: no BetterBots errors, no old safe-hook signature, and the pocketable-pickup path ran through a full mission segment without spamming the console.[/*]\n<br />[/list]\n<br />[b]v1.2.1[/b]\n<br />\n<br />[list]\n<br />[*]Fixed close-range guns — shotguns, the Rumbler, and other close-range families — staying out when enemies are already in melee range. There is a new [i]immediate melee pressure cutoff[/i] slider (default 2.5m, range 1–6m) if that is too tight for your setup.[/*]\n<br />[*]Retuned Arbites Remote Detonation so bots spend it when the mastiff is in a real cluster — 5 enemies, 3 elites/specials, or any monster within 5m of the dog — instead of wasting it on one elite or holding because the dog drifted away from the bot's current target.[/*]\n<br />[*]Added a crash guard for the vanilla [font=Courier New]suppression.lua:344 UnitApi node failed[/font] crash MFL87 reported on Nexus. The guarded case is an attacker unit missing the [font=Courier New]enemy_aim_target_03[/font] node during minion suppression.[/*]\n<br />[*]Hardened mod cold boot and hot reload: cached [font=Courier New]hook_require[/font] installers replay correctly across reloads, and the ability metadata patch survives a Lua state reset without re-warning.[/*]\n<br />[/list]\n<br />[b]v1.2.0[/b]\n<br />\n<br />[list]\n<br />[*]New tag-required pickup mode. Turn it on and bots only pick up items you have tagged, instead of hoovering everything in reach. Off by default — the original \"grab opportunistically\" behavior still works.[/*]\n<br />[*]New bot compensation controls. The base game silently buffs bots on coop and expedition (extra HP, toughness, an extra wound, stun immunity above Malice). The mod now lets you toggle the buff off or pick a different tier, so you can run a real squad of \"no-buff\" bots if you want the harder fight.[/*]\n<br />[*]Fixed bots interacting with medicaes and downed allies from way too far away. Both paths now respect the game's interaction distance, the same one humans are held to.[/*]\n<br />[*]Fixed several smart-tag pickup edge cases — tag orders from non-owning bots no longer get lost, owners route to the correct target, and Solo Play tag sessions are detected properly.[/*]\n<br />[*]Tightened mule-pickup visibility so bots stop trying to fetch items they cannot actually reach.[/*]\n<br />[/list]\n<br />[size=3][b]Requirements[/b][/size]\n<br />\n<br />[list]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/19]Darktide Mod Loader[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/8]Darktide Mod Framework (DMF)[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/176]Solo Play[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/725]Tertium 6[/url] is recommended for class-diverse bots[/*]\n<br />[/list]\n<br />[b]Tertium 5 note:[/b] Tertium 5 can crash on Arbites and Hive Scum profiles. Use [url=https://www.nexusmods.com/warhammer40kdarktide/mods/725]Tertium 6[/url] if you want all current classes.\n<br />\n<br />[size=3][b]Common questions[/b][/size]\n<br />\n<br />[b]Does this work in public matches, public Havoc, or private duo?[/b]\n<br />No. Those bots run on Fatshark's dedicated servers, even when the lobby is private or starts with empty slots. BetterBots needs a locally hosted Solo Play mission.\n<br />\n<br />[b]Does this add rewards or progression to Solo Play?[/b]\n<br />No. BetterBots changes bot behavior. Rewards, progression, and backend access are separate from this mod.\n<br />\n<br />[b]Do I need multiple leveled characters?[/b]\n<br />No. BetterBots ships bot-optimized profiles for the original classes, and Tertium 6 can use your own characters as bots if you prefer that setup.\n<br />\n<br />[b]Can I get multiple built-in loadouts per class?[/b]\n<br />Not through the in-game UI right now. Manual profile editing is documented, but a proper profile manager is future-work territory.\n<br />\n<br />[size=3][b]Install[/b][/size]\n<br />\n<br />[list=1]\n<br />[*]Extract [font=Courier New]BetterBots.zip[/font] into your Darktide [font=Courier New]mods/[/font] folder.[/*]\n<br />[*]Add [font=Courier New]BetterBots[/font] to [font=Courier New]mods/mod_load_order.txt[/font] below [font=Courier New]dmf[/font].[/*]\n<br />[*]Re-patch mods.[/*]\n<br />[*]Start a Solo Play mission and check for [font=Courier New]BetterBots loaded[/font] in chat.[/*]\n<br />[/list]\n<br />Darktide disables mods after game updates. If the mod suddenly stops loading after a patch, re-run the mod toggle/patch script first.\n<br />\n<br />[size=3][b]Known limits[/b][/size]\n<br />\n<br />[list]\n<br />[*]Hive Scum support is implemented but not validated by me in-game because I do not own the DLC. Reports are useful.[/*]\n<br />[*]Item-style abilities such as Zealot relic, Psyker Force Field, Arbites Cyber-Mastiff, and Hive Scum Stimm Supply use wield/use/unwield sequences. Darktide patches can break those paths until the mod is updated.[/*]\n<br />[*]Bots are still bots. They do not animation-cancel, dodge, aim, or manage risk like a strong human player. The goal is better Solo Play support, not human-level play.[/*]\n<br />[/list]\n<br />[size=3][b]Bug reports and source[/b][/size]\n<br />\n<br />If something breaks, the most useful report is: what happened, your bot lineup, whether you were in Solo Play, and the relevant [font=Courier New]bb-log summary[/font] / [font=Courier New]bb-log warnings[/font] output if you can grab it.\n<br />\n<br />[url=https://github.com/hummat/BetterBots]Source on GitHub[/url] — MIT License\n<br />[url=https://github.com/hummat/BetterBots/issues]Issue tracker[/url] — bug reports and feature requests\n<br />"
