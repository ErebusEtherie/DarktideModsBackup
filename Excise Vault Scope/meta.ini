nexusDescription="[b][color=#e69138]Mid-Mission Objective Encounter:[/color] [color=#6aa84f]Servitor Colony Cypher-Ident Extraction[/color]\n<br />\n<br />In the mid-event, players must plant three interrogators and then fix each as they fail. This mod highlights where to plant them when you walk into the event zone. It highlights each broken one red as it happens. It then highlights the security door when you can leave.[/b]\n<br />\n<br />[b][color=#e69138]Final Objective Encounter: [/color][color=#6aa84f]Contagion Sample Retrieval and Pneumatic Transfer[/color][/b]\n<br />\n<br />In the final event of Excise Vault, players must identify the correct vaults, open containers to locate Moebian Pox Zetaphyte-13 strain samples, then carry the retrieved luggable contagion caskets (vacuum capsules) to the central pneumatic conveyor.\n<br />\n<br />The mod highlights the location of the caskets and whether its on the upper or lower floor. They can be numbered to countdown as each is slotted. Once slotted, the markers disappear. Once all three are done, the mod highlights the control for the pneumatic conveyor and then the exit door to help you escape without delay.\n<br />\n<br />[b][color=#e69138]How to get the [/color][color=#ffff00]Quick Work [/color][color=#e69138]penance ([i]tried and tested![/i]) [/color][/b]\n<br />[list]\n<br />[*]Turn on the mod's Countdown option. Set the markers to Large. [/*]\n<br />[*]Line up the caskets near each slot. They'll all say \"3\".[/*]\n<br />[*]As soon as one is slotted, the other two will say \"2\", signalling for the final two caskets to be slotted immediately.[/*]\n<br />[/list]"
