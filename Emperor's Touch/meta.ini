nexusDescription="[size=5]Emperor's Touch[/size]\n<br />\n<br />[size=4]WARNING: IF THE GAME CRASHES, YOUR TOYS MAY KEEP RUNNING. BE CAREFUL, ESPECIALLY WITH DURATION 0 (INFINITE) PRESETS [/size]\n<br />\n<br />[size=4]Description[/size]\n<br />\n<br />Simple Lovense integration for Darktide. First, you define simple preset toy actions, then attach them to different trigger event scenarios. I've included a large list of actions that i thought would be useful, but I havent had time to extensively test the triggers, so please let me know if any of them do not work as expected.\n<br />\n<br />[size=4]Installation instructions[/size]\n<br />\n<br />1. Extract the `EmperorsTouch` folder into your `Warhammer 40,000 DARKTIDE/mods/` directory.\n<br />2. Add `EmperorsTouch` to your `mods/mod_load_order.txt`.\n<br />3. Install **Lovense Remote** for Windows on the same PC, pair your toy(s), and allow third-party apps to control your toy. I have included step by step images for how to achieve this for your convenience.\n<br />[img]https://i.imgur.com/CnR27kw.png[/img]\n<br />4. Launch the game. The mod finds your toys automatically on startup. If it doesnt, or you didnt link before launching the game, go to the toys page (R10 by default) and use the \"Get Toys\" button.\n<br />\n<br />[size=4]Main features[/size]\n<br />\n<br />- Game hook based commands:\n<br />  - Continuous: Health Level, Peril Level. The intensity scales with the value, with a per-toy Invert option (e.g. stronger as you get hurt)\n<br />  - Combat events: Health Damage Taken, Toughness Broken (full break), Elite/Special Killed, Ability Used, Backstab Warning\n<br />  - Disabler grabs: Trapper net, Hound pounce, Mutant grab, Chaos Spawn grab, Beast of Nurgle swallow\n<br />  - Squad &amp; mission: Knocked Down, Player Death, Mission Start, Boss Spawned, Hacking Complete, Mission Victory, Mission Defeat\n<br />- *Preset Editor (default F9): create named presets with sliders for every simple Lovense action. Test any preset on any toy directly from the editor.\n<br />- Assignment menu (default F10): pick a toy, then assign a preset to each hook from dropdowns.\n<br />- Safety: a panic keybind (default F11) stops all toys instantly; everything halts automatically at mission end; continuous output should wind down if its source disappears (death, overload, downed). WARNING: IF THE GAME CRASHES, YOUR TOYS MAY KEEP RUNNING. BE CAREFUL, ESPECIALLY WITH DURATION 0 (INFINITE) PRESETS\n<br />\n<br />[size=4]Requirements[/size]\n<br />\n<br />- [url=https://www.lovense.com/app/remote]Lovense Remote[/url] (Windows app) running on the same PC as the game. The mod talks to the app's local API at `127-0-0-1.lovense.club:30010`. Other apps are not supported due to dml and dmf api limitations.\n<br />- At least one Lovense device paired to the app.\n<br />- if you need one, i have an affiliate link if you want to purchase one. [url=https://www.lovense.com/r/9u02j5]Lovense Store Page[/url]\n<br />\n<br />\n<br />[size=5]USING WITH INTIFACE / BUTTPLUG.IO (NON-LOVENSE HARDWARE)[/size]\n<br />\n<br />The mod normally talks to Lovense Remote. To use any other hardware supported by buttplug.io, you run the included bridge app alongside the game. The bridge translates the mod's commands into the Buttplug protocol.\n<br />\n<br />You will need Intiface Central, free from intiface.com/central.\n<br />\n<br />Setup:\n<br />\n<br />1. Download the EmperorsTouchBridge zip from the files section and extract it anywhere.\n<br />\n<br />2. Start Intiface Central, press its Start Server button, and connect your device(s). They should appear in Intiface's Devices tab. Leave Intiface running.\n<br />\n<br />3. Open the EmperorsTouchBridge folder you extracted and run EmperorsTouchBridge.exe. A small window opens. Make sure the \"Intiface / buttplug.io\" box is checked (it is by default, and the address field should read ws://127.0.0.1:12345 unless you changed the port in Intiface). Press Start. The log should say it connected to Intiface and list your devices as it finds them.\n<br />\n<br />4. In the game, open Mod Options, go to Emperor's Touch, and set Toy Backend to Local Bridge.\n<br />\n<br />5. Open the toys menu (default F10) and press Get Toys. Your devices should appear. Assign presets to hooks as normal.\n<br />\n<br />Leave both Intiface and the bridge window open while you play. The bridge window's log shows every command the game sends, so if something isn't working, look there first.\n<br />\n<br />If your antivirus complains about the exe, the zip includes the full source (bridge.py) which you can read or run directly with Python instead: pip install aiohttp buttplug-py, then python bridge.py."
