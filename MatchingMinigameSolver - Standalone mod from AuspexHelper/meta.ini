nexusDescription="[b]IF YOU HAVE AuspexHelper mod, this mod is not necessary, it is already included in the mega mod.[/b]\n<br />\n<br />Highlights the expeditions' 2x2 matching symbols decode minigame, found when attempting to open chests and decode objectives in Expeditions' open-world maps. This mod is a standalone release from [url=https://www.nexusmods.com/warhammer40kdarktide/mods/757]AuspexHelper[/url]. If you already have [url=https://www.nexusmods.com/warhammer40kdarktide/mods/757]AuspexHelper[/url], you do not need to download this mod; it is already included in it. This mod does not include the autosolver/arrow assist from AuspexHelper; it ONLY highlights them.\n<br />\n<br />\n<br />[img]https://staticdelivery.nexusmods.com/mods/4943/images/764/764-1773771320-752557537.png[/img]\n<br />\n<br />[b]Installation:[/b]\n<br />[list]\n<br />[*]Extract into: ..&#92;Steam&#92;steamapps&#92;common&#92;Warhammer 40,000 DARKTIDE&#92;mods\n<br />[*]Folder path should be: ...&#92;mods&#92;MatchingMinigameSolver\n<br />[*]Ensure Darktide Mod Framework (DMF) is installed\n<br />[*]Add MatchingMinigameSolver in your mod load order, ideally below other UI mods, but not necessary in most cases\n<br />[*]Launch the game, open the mod menu, and enable Auspex Helper in mod options if it's not already enabled\n<br />[/list]\n<br />\n<br />[b]Compatibility / Limitations:[/b]\n<br />[list]\n<br />[*]If another mod hooks the same scanner/minigame UI or input flow, behavior can conflict\n<br />[/list]\n<br />[b]Changelog:[/b]\n<br />[list]\n<br />[*]1.0.0 - Initial release\n<br />[/list]\n<br />[b]Bug Report:[/b]\n<br />[list]\n<br />[*]Attach latest log from: ..&#92;AppData&#92;Roaming&#92;Fatshark&#92;Darktide&#92;console_logs\n<br />[*]Include the Script Error section if one exists\n<br />[*]Include reproduction steps if it's a weird bug to reproduce\n<br />[*]Add screenshot/video when possible\n<br />[*]To open AppData quickly: type %appdata% in Windows search and press Enter\n<br />[/list]"
