nexusDescription="[size=4][b]Description\n<br />[/b][/size]\n<br />[b][color=#ffb000]S[/color][/b]imple[b] [color=#ffb000]M[/color][/b]od[b] [color=#ffb000]O[/color][/b]bject[b] [color=#ffb000]G[/color][/b]arbage[b] [color=#ffb000]C[/color][/b][color=#ffb000][b]leaner[/b][/color]\n<br />\n<br />[color=#D4D4D8]SMOG Cleaner attempts to lower memory strain and reduce the chance of Lua VM out-of-memory errors.[/color]\n<br />\n<br />[color=#D4D4D8]It helps reduce Lua heap pressure by running Lua garbage collection when needed, clearing unused objects.[/color]\n<br />\n<br />[color=#00ff00][size=2][b]NEW![/b][/size][/color][color=#D4D4D8] Choose from three real-time HUDs: Analogue, Digital or Advanced Digital.\n<br />\n<br />SMOG Cleaner watches heap usage and if the heap reaches critical thresholds, it automatically runs garbage collection.\n<br />\n<br />Press [/color][color=#ffb000][b]F5[/b][/color][color=#D4D4D8] or type [b][color=#ffb000]/smog[/color][/b] in Chat to manually run garbage collection once. It will notify you of the amount cleaned.\n<br />\n<br />You can find your actual maximum Lua heap size on its mod options page.[/color]\n<br />\n<br />[i]Please note: if mods retain references to objects, that memory remains live and cannot be freed by garbage collection, so you can still run out of memory even after cleaning.[/i]\n<br />\n<br />[size=4][b]Options[/b][/size]\n<br />[list]\n<br />[*][b][color=#ffb000]Auto clean at unobtrusive times[/color][/b][/*]\n<br />[*][b][color=#ffb000]Auto clean every 10 minutes[/color][/b][/*]\n<br />[*][b][color=#ffb000]Hide automatic notifications, but not critical warnings[/color][/b][/*]\n<br />[*][color=#ffb000][b]User-defined hotkey for manual clearance[/b][/color][/*]\n<br />[*][color=#ffb000][b]User-defined hotkey for toggling/cycling HUD[/b][/color][/*]\n<br />[*][color=#ffb000][b]Adjust screen location of HUD and notifications[/b][/color][/*]\n<br />[*][color=#ffb000][b]Optional HUD with d[/b][b]igital, analogue or advanced digital appearance[/b][/color][/*]\n<br />[/list]\n<br />[size=4][b]Main features[/b][/size]\n<br />[list]\n<br />[*]Automatic cleaning at critical Lua heap levels, with aggressive cleaning at higher levels.[/*]\n<br />[*][color=#D4D4D8]Manual Lua garbage collection with [color=#ffb000]/smog [/color]or user-defined hotkey ([/color][color=#ffb000]F5[/color][color=#D4D4D8] is default)[/color][/*]\n<br />[*][color=#ffb000]F5[/color][color=#D4D4D8] also clears mod notifications (for when they stack up and appear noisily five-at-a-time)[/color][/*]\n<br />[*][color=#D4D4D8]Cycle through HUDs and toggle on/off with [/color][color=#ffb000]F8[/color][color=#D4D4D8] (as default).[/color][/*]\n<br />[*][color=#D4D4D8]Auto-cleaning at convenient times, like mission start.[/color][/*]\n<br />[*][color=#D4D4D8]Choose auto-cleaning every 10 minutes if wanted.[/color][/*]\n<br />[*][color=#D4D4D8]Option to mute the automatic notifications.[/color][/*]\n<br />[*][color=#D4D4D8]Shows your max heap size in mod's options page.[/color][/*]\n<br />[/list]\n<br />[b][size=4]Analogue SMOG Meter[/size][/b]\n<br />[list]\n<br />[*]The SMOG meter works in missions and in the Mourningstar. It shows how full the lua heap is in real time.[/*]\n<br />[*]The colour changes between six stages (green through to red) for a quick glance reading.[/*]\n<br />[*]The needle shows visually how full the heap is, alongside the actual percentage figure.[/*]\n<br />[*]The arc goes from 0 to 100%. A full red arc would be your lua heap maxed out at 100%.[/*]\n<br />[*]To see the actual values, run a garbage collection with F5 (or chosen hotkey) and see the numbers in the notification.[/*]\n<br />[/list][size=4][b]Digital SMOG HUD[/b][/size]\n<br />[list]\n<br />[*]Displays how full the Lua heap is as a percentage.[/*]\n<br />[*]Shows the heap’s current memory usage in MB.[/*]\n<br />[*]Displays your current FPS (frames per second).[/*]\n<br />[/list][b][size=4]Advanced Digital SMOG HUD[/size][/b]\n<br />[list]\n<br />[*]Displays how full the Lua heap is as a percentage, along with its current memory usage in MB. [/*]\n<br />[*]Shows Lua growth, the session peak, and how much of the game’s total memory is being used by Lua. [/*]\n<br />[*]Displays the game’s total memory usage in GB, its current growth rate, and the highest level reached during the session. [/*]\n<br />[*]Shows your current FPS (frames per second). [/*]\n<br />[*]Indicates whether current memory pressure is coming mainly from Lua, the game generally, both, or neither.[/*]\n<br />[/list][size=4][b]Requirements[/b][/size]\n<br />[color=#D4D4D8]Requires Darktide Mod Loader and Darktide Mod Framework.[/color]"
