nexusDescription="[b]AutoBlitz[/b] will automatically throw your selected blitz as soon as you swap to it, as fast as the game will allow.\n<br />\n<br />This mod is also available on [url=https://github.com/CATBIRDS/AutoBlitz]GitHub[/url].\n<br />\n<br />[b]Features:[/b]\n<br />[list]\n<br />[*]Automatically throws blitzes\n<br />[*]Selection between overhand or underhand throwing\n<br />[*]Minimum blitz threshold option, allowing auto-throw only when at/above a certain amount of ammunition\n<br />[*]Can be set to ignore interrupting actions (e.g. aiming/weapon swap), guaranteeing the throw\n<br />[*]Per-blitz settings\n<br />[/list]\n<br />[b]Settings:\n<br />[/b][i]Allow Player Override\n<br />[/i]When this setting is enabled, the automatic throw can be interrupted immediately by aiming, or by swapping weapons. This allows easy selection of auto-throwing or manual throwing without needing to disable auto-throw entirely. If this setting is disabled, grenade throws [b]cannot be interrupted by the player[/b].\n<br />\n<br />[i]Auto-Throw Keybind:[/i] Pressing this keybind will equip and throw the current grenade according to its mod settings. \n<br />When set, this keybind [u]must be pressed[/u] to automatically throw grenades - other inputs to equip grenades will [i]not[/i] trigger automatic throwing.\n<br />When unset, any inputs which equip grenades will trigger automatic throwing, provided that grenade is enabled by mod settings.\n<br />\n<br />[i]On/Off\n<br />[/i]Each blitz can be set to be thrown automatically (modified further by the below settings), or ignored by the mod. If [i]Off[/i], other settings are ignored for the blitz.\n<br />\n<br />[i]Throw Type\n<br />[/i]Select between Underhand or Overhand. This selection is per-blitz.\n<br />\n<br />[i]Minimum Grenades\n<br />[/i]This value determines the minimum required ammunition in order to trigger an automatic throw. This selection is per-blitz.\n<br />\n<br />The Arbitrator's Remote Detonation has some special settings and usage considerations, detailed below.\n<br />[b]Remote Detonation Exclusive Settings:[/b]\n<br />[i]Require Minimum Enemy Count:[/i] When enabled, Remote Detonation will require a minimum number of enemies within the detonation radius in order to be triggered. These are set by the \"Total\" settings below:\n<br />[list]\n<br />[*][i]Total Enemies[/i] (total number of enemies of any kind)\n<br />[*][i]Total Elites[/i]\n<br />[*][i]Total Specialists[/i]\n<br />[*][i]Total Bosses[/i]\n<br />[/list]The mod only requires that ANY of these thresholds are met to allow detonation, subject to restrictions set by other settings.\n<br />\n<br />[i]Allow Detonation Near Sleeping Daemonhosts:[/i] Disabled by default. When disabled, Remote Detonation will not be triggered automatically if a sleeping Daemonhost is within the detonation radius. This only applies to automatic detonations (it will not prevent a manual detonation, including via the Auto-Throw keybind), and does not apply to active/aggro'd Daemonhosts.\n<br />\n<br />[i]Require Pounce:[/i] The dog must pounce an enemy in order to automatically trigger Remote Detonation, in addition to any other conditions.\n<br />[i]Require Tag:[/i] This setting only applies when Require Pounce is enabled. When Require Tag is enabled, there must be an active dog command tag present when the pounce occurs in order to trigger Remote Detonation.\n<br />\n<br />[i]Cooldown:[/i] Number of seconds the mod will wait before attempting another automatic detonation.\n<br />\n<br />[b]NOTE:[/b] If neither Require Pounce nor Require Minimum Enemy Count are enabled, Remote Detonation will trigger as soon as the Cooldown, Minimum Charges, and Allow Detonation Near Sleeping Daemonhosts requirements are met.\n<br />\n<br />\n<br />By default this mod will only automatically throw a single blitz per swap, and will only throw upon swapping to the blitz (for example, if you pick up a grenade which puts your ammunition total above the [i]Minimum Grenades[/i] setting while already having that grenade equipped, it will not be automatically thrown until you next swap to it).\n<br />\n<br />If you would like to throw multiple blitzes from a single input, you should install [url=https://www.nexusmods.com/warhammer40kdarktide/mods/80]AfterBlitz[/url], which synergizes with this mod's behavior. If AfterBlitz is set to \"Re-Equip Blitz\", this mod will continuously throw grenades upon swapping until it is either cancelled by the player, or does not have enough ammunition to meet the[i] Minimum Grenades[/i] setting.\n<br />\n<br />\n<br />[b]Known Issues:[/b]\n<br />Ogryn's [i]Big Friendly Rock[/i] blitz may sometimes not be cancelled by aiming regardless of the [i]Allow Player Override[/i] setting, depending on input timing. This is because this blitz has some unique uninterruptible animations, and this is not something the mod can currently override. Swapping weapons to cancel the auto-throw will still work if the [i]Allow Player Override[/i] setting is enabled.\n<br />Arbitrator's [i]Voltaic Shock Mine[/i] has similar issues with cancellation specifically when Throw Type is set to Overhand, and Remote Detonation cannot be cancelled once triggered.\n<br />\n<br />[b]Note:[/b] Psyker blitzes and Zealot's Throwing Knives are not impacted by this mod, and there are no plans to change this.\n<br />\n<br />Chinese localization provided by jcyl2023."
