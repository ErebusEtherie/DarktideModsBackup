nexusDescription="[size=4][b][color=#ff0000]Known Issues[/color][/b][/size]\n<br />CleanKills may cause access violation crash. This bug is innate to their mod, but CWaH can exacerbate the issue with some of the custom buffs.\n<br />Dark communion doesnt play the cutscene. Appears to be a singleplayer bug that affects solo play as well.\n<br />\n<br />[color=#ff0000]ALL PLAYERS MUST BE ON THE SAME REALMS AND CWaH VERSION[/color]\n<br />\n<br />\n<br />NOTE FOR 1.4.0 - A new custom buffs API has been added. The custom buffs that were originally bundled in with the mod install is now an optional addon mod. Simply install it as you would any other mod.\n<br />\n<br />MOD AUTHORS: You can take a look at CwahBuffs as an example for what buff add-ons would look like.\n<br />\n<br />\n<br />[size=4][b]Description[/b][/size]\n<br />[size=3][color=#D4D4D8]Beta preview of Chaos Wastes at home. Expect lots of bugs and crashes. [/color][/size]\n<br />\n<br />[size=3][color=#D4D4D8]Very very unstable right now. Testing takes a long time and is quite hard, so I want as many people trying it as I can[/color][/size]\n<br />\n<br />[size=4][b]Installation instructions[/b][/size]\n<br />[size=3][color=#D4D4D8]Install like any other mod. To launch-&gt;Check mod settings page. There exists a key to open a menu from which you can launch runs, view available buffs, and when in mission, see what buffs you've picked.[/color][/size]\n<br />\n<br />[size=4][b]Main features[/b][/size]\n<br />[color=#D4D4D8]Selectable buffs. Randomly generated chained missions. Buffs carry over to chained missions[/color]\n<br />\n<br />The default settings for giving buffs is not really balanced, but gives them at a pretty good amount for difficulties a step above what you are comfortable true soloing. Crank them up or down depending on how you prefer your experience. By default they award them when the mission objective advances, which can be wildly inconsistent between different maps. You can add more triggers in the settings.\n<br />\n<br />If you find a buff to be too powerful or misaligned with your vision of the game, every single custom or non custom buff can be disabled in the same menu you start runs from, but in the second tab.\n<br />\n<br />[size=4][b]Reporting Bugs[/b][/size]\n<br />Please provide a log as well as what you were doing before the bug. This can be found usually at %appdata%/Fatshark/Darktide/console_logs/ for steam users on windows.\n<br />Xbox users will have it in a different spot, but i do not know where.\n<br />\n<br />If you are having trouble connecting through realms, try without cwah first and ask for support in their threads. once youve gotten connected there, the process should be the same here with cwah. Only instad of starting from solo play, you start from the cwah menu\n<br />\n<br />[size=4][b]Requirements[/b][/size]\n<br />Realms Server (Beta)\n<br />\n<br />[size=4][b]Shout outs[/b][/size]\n<br />[size=3][color=#D4D4D8]Vermintide 2[/color][/size]\n<br />\n<br />[color=#D4D4D8]Check out [url=https://www.nexusmods.com/warhammer40kdarktide/mods/1167]Pilgrimage[/url][/color] as well: they've done something similar with quite a bit more polish at the moment\n<br />\n<br />Authors Notes:\n<br />For those who are wondering which will be maintained between mine and PILGRIMAGE: We will both continue to update independently. We are simply sharing information as we discover it. I believe the mod author for PILGRIMAGE aims to provide a more well balanced experience that stays closer to the difficulty of the game, while i am looking to ball out and give something closer to a looping roguelike where you get strong enough to blow everything up.\n<br />\n<br />Most of my time currently has been primarily focused on reverse engineering the networking stack to see if i can get P2P networking working. I have no estimates on how long this will take or if its even really feasible.\n<br />\n<br />\n<br />\n<br />I don't need it, but if you want to support me, here is my ko-fi: [url=https://ko-fi.com/augentism]https://ko-fi.com/augentism[/url]\n<br />I will not stop you from subscribing if you really want to, but i morally disagree with subscriptions."
