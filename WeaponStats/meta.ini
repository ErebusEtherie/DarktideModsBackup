nexusDescription="Weapon Stats shows detailed stats for any weapon, computed using the game's own damage\n<br />calculation so the numbers reflect the relevant traits and perks.\n<br />\n<br />Shows in ESC menu, Inventory menu and with optional configurable trigger key.\n<br />\n<br />If you have any issues, please use the [url=https://github.com/deathbeam/darktide-mods]GitHub\n<br />issue tracker[/url], but posting here is fine too. You can also view the full source there and\n<br />submit pull requests with changes.\n<br />\n<br />[b]Features:[/b]\n<br />[list]\n<br />[*]Per-attack damage breakdown with base damage, impact, and inner-explosion/sticky-tick totals folded into the hit[/*]\n<br />[*]Armor Damage Modifiers (ADM) table showing attack and impact multipliers against every armor type, with crit variants and near-to-far falloff for ranged weapons[/*]\n<br />[*]Cleave values, backstab bonus, and finesse/crit multipliers (weakspot, crit, crit+weakspot) with crit chance modifiers and crit string counts[/*]\n<br />[*]Attack speed and fire rate derived from chain times and weapon handling time scales[/*]\n<br />[*]Mobility stats including dodge distance, effective dodge count, stamina, block/push costs, and sprint speed[/*]\n<br />[*]Attack pattern overview showing the light/heavy/special/secondary chain flow for each weapon[/*]\n<br />[*]Ranged weapon specifics like pellet count, spread, falloff range, and suppression[/*]\n<br />[*]Stagger category, damage type, and special flags (ignores stagger reduction, shield, hitzone multiplier, push)[/*]\n<br />[*]Special active attack variants (e.g. power sword revved hits) grouped separately from standard attacks[/*]\n<br />[*]Opens from ESC menu, the Inventory screen for the currently previewed weapon, or a configurable hotkey[/*]\n<br />[/list]\n<br />[b]All stats mods by me:[/b]\n<br />[list]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1093]CharacterStats[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/661]CombatStats[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/1054]EnemyStats[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/999]WeaponStats[/url][/*]\n<br />[/list]"
