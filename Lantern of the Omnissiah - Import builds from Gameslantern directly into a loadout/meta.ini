nexusDescription="[size=5]Import and export [/size][size=5]GamesLantern.com builds[/size]\n<br />\n<br />Copy any build URL from [url=https://darktide.gameslantern.com/builds?sort=relevant]GamesLantern.com[/url], click the + button on your preset bar, confirm the popup, and the talents will be applied to a new preset. \n<br />\n<br />Trigger Re-check Clipboard from the legend bar at the bottom of the Talents view to overwrite an existing profile\n<br />\n<br />Integrates with LoadoutNames to incorporate the build title \n<br />\n<br />Lantern icons on the equipment page will outline the recommended weapons/curios in a tooltip\n<br />\n<br />Nodes you cannot afford yet, or vary from will be outlined in orange.\n<br />\n<br />You can also export your current build/weapons/curios to Gameslantern.\n<br />\n<br />[list=1]\n<br />[*]Use the toggle in the settings to copy the bookmarklet [img]https://staticdelivery.nexusmods.com/mods/4943/images/882/882-1784735722-1684158976.png[/img][/*]\n<br />[*]Create a bookmarklet in your browser, and paste the clipboard contents into the URL field (not the address bar). Put the bookmarklet on the favourites bar [img]https://staticdelivery.nexusmods.com/mods/4943/images/882/882-1784735821-704488742.png[/img][/*]\n<br />[*]Click on the yellow Lantern icon in the bottom right of the screen for the build [img]https://staticdelivery.nexusmods.com/mods/4943/images/882/882-1784735443-1795151202.png[/img][/*]\n<br />[*]Got to Gameslantern's website and click on the bookmarklet to import into Gameslantern.[/*]\n<br />[/list]\n<br />\n<br />If you're logged in, it'll create an editable build for you. If you're not logged in, it'll create a read only version.\n<br />\n<br />[size=5][b]Copy from Social Tab[/b][/size]\n<br />\n<br />[list=1]\n<br />[*]Click on the yellow lantern when viewing someone else's build[img]https://staticdelivery.nexusmods.com/mods/4943/images/882/882-1784735443-1795151202.png[/img][/*]\n<br />[*]Return to a valid character of yours and click on the + and select 'Import'[img]https://staticdelivery.nexusmods.com/mods/4943/images/882/882-1784997437-2064480507.png[/img][/*]\n<br />[/list]"
