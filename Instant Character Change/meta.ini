nexusDescription="[list]\n<br />[*]Adds an operative panel to the Esc menu on the Mourningstar — click a character to switch [b]instantly[/b], without reloading.[/*]\n<br />[*]Works in the Psykhanium(Meat Grinder) too: you respawn as the new class on the spot.[/*]\n<br />[*]Panel position and size are configurable in the mod options.[/*]\n<br />[/list][size=4][color=#cc0000]Note[/color]: on the Mourningstar your character model is not reloaded — you keep walking around as the old operative until the next loading screen. The switch itself has already happened: inventory, talents, Party Finder and the next mission all use the new character.[/size]\n<br />\n<br />\n<br />- Extract folder \"InstantCharacterChange\" to \"Warhammer 40,000 DARKTIDE&#92;mods\"\n<br />- Add \"InstantCharacterChange\" to \"mod_load_order.txt\" "
