nexusDescription="[b]Features:[/b]\n<br />[list]\n<br />[*]Disables smoke VFX effects from smoke grenades (optional toggle).[/*]\n<br />[*]Spawns decal at the grenade's impact point to show its radius (optional toggle).[/*]\n<br />[*]The radius decal automatically disappears after the grenade's effect duration.[/*]\n<br />[*]Color customization: freely adjust the decal color in the mod options.[/*]\n<br />[*]Optional \"pulse\" effect on the radius decal during the last seconds before it disappears.[/*]\n<br />[*]Automatically handles grenade upgrades (e.g., Veteran's improved grenades with extended duration).[/*]\n<br />[/list]\n<br />[youtube]mlHYXseCrP8[/youtube]\n<br />\n<br />\n<br />[b]I am grateful to these people:\n<br />-grasmann (for modding tips)\n<br />-Wobin (for modding tips)\n<br />-EbonChaos (for help with tests)\n<br />-Dragonatorrr (for help with tests)\n<br />[/b]\n<br />\n<br />\n<br />\n<br />[center]You can support me on the Ko-Fi platform and thus speed up the release of new mods :)\n<br />[url=https://ko-fi.com/I2I21QM6CT]\n<br />[img]https://storage.ko-fi.com/cdn/kofi6.png?v=6[/img]\n<br />[/url][b][url=https://www.buymeacoffee.com/TMMTeam][/url][/b][/center]\n<br />"
