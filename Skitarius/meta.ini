nexusDescription="[quote]﻿Flesh is fallible, but ritual honours the Machine Spirit.\n<br />﻿  ﻿- The Warnings of the Cult Mechanicus[/quote]\n<br />[b]Skitarius[/b] is a mod that allows you to execute custom sequences of actions, with a multitude of additional features.\n<br />[color=orange]It is recommended you read (or at least skim) this description page to ensure you understand how the mod works before using it.[/color]\n<br />This mod is also available on [url=https://github.com/CATBIRDS/Skitarius]GitHub[/url].\n<br />\n<br />[center][img]https://clan.fastly.steamstatic.com/images//38365286/a65c70af1027202631df9d22270d8a366b72f32d.png[/img][/center]\n<br />\n<br />[center][b][size=6]QUICK-START GUIDE[/size][/b][/center]\n<br />\n<br />“Sequences” within this mod are a series of actions that the mod will perform on your behalf. Up to 12 Steps (actions) can be included in a single melee weapon sequence, while ranged weapon sequences have a single Step (action).\n<br />Sequences are unique for each weapon/keybind combination. This means that pressing the same keybind on different weapons can result in different sequences.\n<br />\n<br />In general, when setting up a weapon the following settings should always be altered in the following order:\n<br />[list=1]\n<br />[*]Select the desired weapon, using either the “Weapon Selection” drop-down menu, or the “JUMP TO CURRENT/GLOBAL” setting[/*]\n<br />[*]Select the desired keybind[/*]\n<br />[*]Modify the sequence; this sequence will be executed when the selected keybind is pressed/held while the selected weapon is equipped [/*]\n<br />[/list][center][color=orange]For more information on specific settings/selections, see the [b]Settings Glossary[/b] below this section.[/color][/center]\n<br />\n<br />Below are some examples to demonstrate the basic functionality and setup of sequences for both melee and ranged weapons:\n<br />\n<br />[b]Enabling Chained Heavy Attacks[/b]:\n<br />[center][img]https://i.imgur.com/8KqbvY7.png[/img][/center]\n<br />Within the [i]Melee Weapons[/i] section of the mod’s settings:\n<br />[list=1]\n<br />[*]Select the desired Weapon (in this example, the Catachan Mk. I “Devil’s Claw” Sword)[/*]\n<br />[*]Select the desired Keybind (in this example, “Primary Action”) [/*]\n<br />[*]Set Step One of the sequence to “Heavy Attack”[/*]\n<br />[/list]This will result in the following behavior:\n<br />When the Catachan Mk. I “Devil’s Claw” Sword is equipped, and the “Primary Action” keybind (by default Left Mouse) is held, the mod will perform Heavy Attacks. This behavior can be applied to any melee weapon with any keybind by replacing the example selections with the desired alternative weapon/keybind.\n<br />\n<br />[b]Enabling Automatic Ranged Fire With ADS Fire Delay[/b]:\n<br />[center][img]https://i.imgur.com/cALlpeQ.png[/img][/center]\n<br />Within the [i]Ranged Weapons[/i] section of the mod’s settings:\n<br />[list=1]\n<br />[*]Select the desired Weapon (in this example, the Zarona Mk. IIa Quickdraw Revolver) [/*]\n<br />[*]Select the desired Keybind (in this example, “Primary Action”) [/*]\n<br />[*]Select the desired Automatic Fire sequence (in this example, “Standard”)[/*]\n<br />[*]Set the ADS Attack Delay (ms) to the desired value (in this example, 500ms)[/*]\n<br />[/list]This will result in the following behavior:\n<br />When the Zarona Mk. IIa Quickdraw Revolver is equipped, and the “Primary Action” keybind (by default Left Mouse) is held, the mod will fire continuously. When aiming down sights, each shot in this continuous fire will be separated by a delay of 500 milliseconds.\n<br />As before, this behavior can be applied to any ranged weapon with any keybind by replacing the example selections with the desired alternative weapon/keybind.\n<br />\n<br />[b]Example Empowered Combo (Relic Blade Mk. II)[/b]:\n<br />[center][img]https://i.imgur.com/TCf4Sfq.png[/img][/center]\n<br />[center][img]https://i.imgur.com/yLMHTT1.png[/img][/center]\n<br />Within the [i]Melee Weapons[/i] section of the mod’s settings:\n<br />[list=1]\n<br />[*]Select the Munitorum Mk. II Relic Blade [/*]\n<br />[*]Select the “Primary Action” Keybind [/*]\n<br />[*]Set Step One through Step Six as shown[/*]\n<br />[/list]This will result in the following behavior:\n<br />When the Munitorum Mk. II Relic Blade is equipped and the “Primary Action” Keybind (by default Left Mouse) is held, the mod will iterate through the six defined Steps, starting over at Step One when it completes Step Six. The first step is “Special Action”, which will trigger the weapon’s special action (in this case, empowering the Relic Blade). By default, the “Special Action” step is skipped if the weapon has a special state, and that special state is already active. In this example, this means that as long as the Relic Blade is empowered, any “Special Action” steps are skipped.\n<br />\n<br />To simplify:\n<br />[list]\n<br />[*]If the Relic Blade is not empowered and not on cooldown, the mod will empower it upon completion of any step (due to each step being followed by a “Special Action” step).[/*]\n<br />[*]While empowered or on cooldown, the mod will perform in order: Push Follow-Up → Light Attack → Heavy Attack, skipping any “Special Action” steps.[/*]\n<br />[/list]\n<br />\n<br />[center][img]https://clan.fastly.steamstatic.com/images//38365286/a65c70af1027202631df9d22270d8a366b72f32d.png[/img][/center]\n<br />\n<br />[center][b][size=6]SETTINGS GLOSSARY[/size][/b][/center]\n<br />\n<br />\n<br />[color=darkorange][b][size=5]MOD SETTINGS[/size][/b][/color]\n<br />\n<br />[b]Enable Sequence Indicator[/b]: Enables/Disables a visual indicator for the mod. This indicator will show whether or not the mod is currently attempting to perform a sequence.\n<br />[b]Sequence Indicator Style[/b]: Selects the indicator type, from three options (shown below).\n<br />[list]\n<br />[*]Color - Colors the indicator when a sequence is active, with the indicator being black and white while inactive[/*]\n<br />[*]Icon - Changes the indicator’s icon depending on the current sequence state, without altering color[/*]\n<br />[*]Icon + Color - Changes the indicator’s icon and color depending on the current sequence state[/*]\n<br />[/list]\n<br />[center][img]https://i.imgur.com/SZRx2ht.png[/img][/center]\n<br />\n<br />[b]Sequence Indicator Size[/b]: Size of the indicator’s height/width, in pixels.\n<br />[b]Enable/Disable Mod (Held)[/b]: When this keybind is held, the mod will be disabled. When released, the mod is re-enabled.\n<br />[b]Enable/Disable Mod (Toggle)[/b]: When this keybind is pressed, the mod will be disabled. It will remain disabled until this keybind is pressed again.\n<br />[b]Overload Protection[/b]: When enabled, the mod will avoid triggering Perils of the Warp; it will refuse to perform actions that would generate peril if doing so would result in death. This setting does NOT prevent any manual actions from being performed, and will not prevent player deaths caused by manual actions.\n<br />[b]Halt On Manual Interrupt[/b]: When enabled, any interruptions selected in the “Manual Interruptions” setting will immediately end any currently active sequence.\n<br />[b]Manual Interruptions[/b]: Determines which of the following actions should be considered an interruption for the “Halt on Manual Interrupt” setting.\n<br />[list]\n<br />[*]Sprint[/*]\n<br />[*]Attacking[/*]\n<br />[*]Block[/*]\n<br />[*]Attacking/Block[/*]\n<br />[*]Sprint/Attacking/Blocking[/*]\n<br />[/list][color=darkorange][b][size=5]KEYBINDINGS[/size][/b][/color]\n<br />\n<br />[b]Maintain Keybind Status On Weapon Swap[/b]:\n<br />[b]Keybind One/Two/Three/Four (Held)[/b]: The selected keybind will trigger sequences when it is held. The sequence will halt if the keybind is released. If multiple keybinds are held simultaneously, the most recently held bind will take priority.\n<br />[b]Keybind One/Two/Three/Four (Toggle)[/b]: The selected keybind will trigger sequences when it is pressed. The sequence will halt if the keybind is pressed again. If multiple keybinds are pressed, the most recently pressed bind will take priority.\n<br />[color=gray][i]NOTE: Mouse buttons (Left Mouse and Right Mouse, specifically) [u]should not be used[/u] for Keybind settings due to a bug in DMF which prevents them from being saved/stored properly. If it is desired to use Left Mouse Button for a Keybind, the “Keybind Selection” setting in either the “MELEE WEAPONS” settings or “RANGED WEAPONS” settings should be set to “Primary Action”.[/i][/color]\n<br />\n<br />[color=darkorange][b][size=5]MELEE WEAPONS[/size][/b][/color]\n<br />\n<br />[b]Action On Stun[/b]: Determines what actions should be taken by the mod when the player is stunned. Stuns can include being hit by enemy attacks, being grabbed, or certain forced stuns such as the recoil from charged Thunder Hammer strikes.\n<br />[list]\n<br />[*]None - The mod will ignore stuns and proceed as normal[/*]\n<br />[*]Reset Sequence - The mod will move to Step One of the current sequence before continuing [/*]\n<br />[*]Halt Sequence - The mod will end the current sequence[/*]\n<br />[/list][b]JUMP TO CURRENT/GLOBAL[/b]: Although this is a Yes/No type setting, it functions as a button. If the “Weapon Selection” setting already has the currently equipped weapon selected, clicking this setting will change the Weapon Selection to “Global”. If the currently equipped weapon is not selected, clicking this setting will select it.\n<br />[b]Weapon Selection[/b]: This setting determines which weapon is selected for editing sequences. Each weapon has unique sequences, so changing the selected weapon will also update sequence-related settings to match that weapon’s settings.\n<br />If “GLOBAL” is selected, the edited sequences will apply to all weapons which do not already have a sequence defined for the given keybind selection.\n<br />[b]Keybind Selection[/b]: This setting determines which keybind is selected for editing sequences. Similar to the “Weapon Selection” setting, each keybind has its own unique sequence. This setting’s dropdown options include:\n<br />[list]\n<br />[*]Primary Action - Edits the sequence corresponding to the Primary Action keybind. This is a Held keybind corresponding to the input set in Darktide’s vanilla keybindings for “Primary Action”, by default Left Mouse. [/*]\n<br />[*]Keybind One/Two/Three/Four (Held) - Edits the sequence corresponding to the keybind set in the selected Keybind setting[/*]\n<br />[*]Keybind One/Two/Three/Four (Toggle) - Edits the sequence corresponding to the keybind set in the selected Keybind setting [/*]\n<br />[/list][b]Heavy Buff Modifier[/b]: This setting will modify how long heavy attacks are held, depending on the selected buff. If the currently selected weapon does not have the selected buff available, this setting will not do anything.\n<br />[list]\n<br />[*]None - Heavy attacks are not modified, and will be released as soon as possible[/*]\n<br />[*]Thrust/Crowbar (Max Stacks: 3) - Heavy attacks will be until the desired stacks of the Thrust blessing or the Crowbar’s innate Thrust mechanic are reached[/*]\n<br />[*]Slow and Steady (Max Stacks: 3) - Heavy attacks will be held until the desired stacks of the Slow and Steady blessing are reached[/*]\n<br />[*]Crunch! (Max Stacks: 4) - Heavy attacks will be held until the desired stacks of the Crunch! Ogryn talent are reached  [/*]\n<br />[/list][b]Heavy Buff Stacks[/b]: This setting determines the number of stacks needed to release a heavy attack. If Heavy Buff Modifier is set to “None” or the currently selected weapon does not have the selected buff available, this setting will not do anything.\n<br />[b]Special Required For Heavy Modifier[/b]: If enabled, the Heavy Buff Modifier will not apply unless the weapon’s special state is active. If the weapon does not have an activated special state, this setting does nothing. This setting also does not apply to weapons with chargeable special attacks, such as the Mechanicus Power Sword.\n<br />[b]Buff Stacks (Special Attacks)[/b]: This setting functions the same as the “Heavy Buff Stacks” setting, but only applies when the weapon’s special state is active - this allows for setting different buff stack requirements depending on the weapon’s special state.\n<br />[i][color=gray]NOTE: For the Mechanicus Power Sword, Arc Maul, and Dual Shivs, this setting has additional functionality. This setting will limit usage of the special action via sequences based on the number of remaining charges. In order to initiate a special action, the number of available throwing knives (for Dual Shivs) or Charges (for Mechanicus Power Sword/Arc Maul) must be equal to or higher than this setting.\n<br />For example, if there is 1 throwing knife/sword charge available, and this setting is set to 2, sequences will not be allowed to initiate special actions until available knives/charges reaches 2 or higher.\n<br />Manual usage of special actions is never prevented.[/color][/i]\n<br />\n<br />[b]Always Activate Special Actions[/b]: By default, “Special Action” steps will only trigger special actions if the weapon is not currently in its special state. Similarly, “Special Action (Inverted)” steps will only trigger special actions if the weapon is currently in its special state. If this setting is enabled, either of these steps will always trigger the special action, regardless of the current special state.\n<br />[b]Force Heavies When Special Active[/b]: If enabled, the mod will ignore the current sequence while the weapon’s special state is active and will instead perform Heavy Attacks until either the sequence is halted, or the special state is deactivated.\n<br />[b]Hold Heavies During Sprint/Slide[/b]: If enabled and the player is either sprinting or sliding, the mod will force any heavy attacks to be held as long as possible. This setting is primarily intended to allow for extended sprinting/sliding using the Combat Blade or Relic Blade, and similar weapons which have special sprinting states during held heavy attacks.\n<br />[b]Cycle Point[/b]: When an active sequence ends, it will return to the step specified by this setting. If this setting is set to “Halt Sequence Upon Completion”, the sequence will halt rather than continuing once it has finished.\n<br />[b]Step One/Two/Three/Four/etc.[/b]: This setting determines the action taken by the mod for each step of the current sequence being edited. Specific step details are found below:\n<br />[list]\n<br />[*]None - The mod will skip this step.[/*]\n<br />[*]Light Attack - The mod will perform a light attack. [/*]\n<br />[*]Heavy Attack - The mod will perform a heavy attack, holding the attack for the minimum required duration unless modified by other settings. [/*]\n<br />[*]Special Action - The mod will perform the weapon’s special action; this step is skipped if the special action is currently active (e.g. empowered Relic Blade, or “Brittle Mode” Bone Saw). [/*]\n<br />[*]Special Action (Heavy Attack) - The mod will perform a special heavy attack; if the current weapon is incapable of a heavy special attack, the standard special action will be performed instead. [/*]\n<br />[*]Special Action (Inverted) - The mod will perform the weapon’s special action; this step is skipped if the special state is currently inactive (e.g. unpowered Relic Blade, or “Chem Mode” Bone Saw). [/*]\n<br />[*]Block - The mod will perform a block; this action will initiate and then release the block (it will not hold/maintain the blocking state). [/*]\n<br />[*]Push - The mod will perform a push. [/*]\n<br />[*]Push Follow-Up - The mod will perform a push, immediately followed by the follow-up push attack. [/*]\n<br />[*]Swap Weapon - The mod will swap to the player’s ranged weapon, then back to the player’s melee weapon. A 200ms delay is added to this swap to prevent abuse as per Fatshark’s modding guidelines.[/*]\n<br />[/list][b]RESET MELEE WEAPON[/b]: Although this is a Yes/No type setting, it functions as a button. Clicking this setting will reset ALL sequences across all keybinds for the currently selected melee weapon.\n<br />[b]RESET ALL (MELEE WEAPONS)[/b]: Although this is a Yes/No type setting, it functions as a button. Clicking this setting will reset ALL sequences across all keybinds for ALL melee weapons.\n<br />\n<br />[color=darkorange][b][size=5]RANGED WEAPONS[/size][/b][/color]\n<br />\n<br />[b]Always Auto-Release Charges[/b]: If enabled, ranged weapons capable of being charged will always fire upon reaching the charge percentage selected in the “Global Charge Threshold %” setting. If the currently selected weapon cannot be charged, this setting does not do anything.\n<br />[b]Global Charge Threshold %[/b]: If “Always Auto-Release Charges” is enabled, and the currently selected weapon is capable of being charged, the mod will fire when the selected charge percentage is reached.\n<br />[b]JUMP TO CURRENT/GLOBAL[/b]: Although this is a Yes/No type setting, it functions as a button. If the “Weapon Selection” setting already has the currently equipped weapon selected, clicking this setting will change the Weapon Selection to “Global”. If the currently equipped weapon is not selected, clicking this setting will select it.\n<br />[b]Weapon Selection[/b]: This setting determines which weapon is selected for editing sequences. Each weapon has unique sequences, so changing the selected weapon will also update sequence-related settings to match that weapon’s settings.\n<br />If “GLOBAL” is selected, the edited sequences will apply to all weapons which do not already have a sequence defined for the given keybind selection.\n<br />[b]Keybind Selection[/b]: This setting determines which keybind is selected for editing sequences. Similar to the “Weapon Selection” setting, each keybind has its own unique sequence. This setting’s dropdown options include:\n<br />[list]\n<br />[*]Primary Action - Edits the sequence corresponding to the Primary Action keybind. This is a Held keybind corresponding to the input set in Darktide’s vanilla keybindings for “Primary Action”, by default Left Mouse.[/*]\n<br />[*]Keybind One/Two/Three/Four (Held) - Edits the sequence corresponding to the keybind set in the selected Keybind setting [/*]\n<br />[*]Keybind One/Two/Three/Four (Toggle) - Edits the sequence corresponding to the keybind set in the selected Keybind setting [/*]\n<br />[/list][b]Automatic Fire[/b]: When the selected keybind is active, the selected action will be performed by the mod.\n<br />[list]\n<br />[*]None - The mod will not do anything. [/*]\n<br />[*]Standard - The mod will fire as rapidly as possible, unless modified by the “ADS Attack Delay” or “Hipfire Attack Delay” settings. [/*]\n<br />[*]Charged - The mod will fire charged attacks, charged to the percentage specified in the “Weapon Charge Threshold %” setting. If the currently selected weapon cannot charge attacks, this selection will function identically to the “Standard” selection. [/*]\n<br />[*]Special Action - The mod will perform special actions. [/*]\n<br />[*]Special Action (Charged) - The mod will perform special actions, held until they become “charged” or “heavy” (e.g. Helbore heavy melee attacks). If the currently selected weapon cannot charge special actions, this selection will function identically to the “Special Action” selection. [/*]\n<br />[*]Special + Standard - The mod will fire as rapidly as possible, if the weapon’s special state is active (e.g. Combat Shotguns with a special shell loaded, or weapons with a flashlight turned on). If the weapon’s special state is not active, the mod will activate the special state before attempting to fire. If the weapon does not have an “active” special state, this selection will function identically to the “Standard” selection.[/*]\n<br />[/list][b]Weapon Charge Threshold %[/b]: This threshold will determine the charge percentage needed to fire if the “Automatic Fire” selection is set to “Charged”. If “Always Auto-Release Charges” setting is enabled, the lower percentage between the “Global Charge Threshold” and “Weapon Charge Threshold” will be used.\n<br />[b]ADS/Hipfire Filter[/b]: This setting will limit the activation of the selected Automatic Fire option depending on whether or not the currently selected weapon is aimed/braced.\n<br />[list]\n<br />[*]ADS and Hipfire - The mod will perform the Automatic Fire selection regardless of whether or not the weapon is aimed/braced.[/*]\n<br />[*]ADS Only - The mod will only perform the Automatic Fire selection if the weapon is aimed/braced.  [/*]\n<br />[*]Hipfire Only - The mod will only perform the Automatic Fire selection if the weapon is not aimed/braced.[/*]\n<br />[/list][b]ADS Attack Delay (ms)[/b]: Each firing action will be delayed by this many milliseconds when the currently selected weapon is aimed/braced.\n<br />[b]Hipfire Attack Delay (ms)[/b]: Each firing action will be delayed by this many milliseconds when the currently selected weapon is not aimed/braced.\n<br />[color=gray][i]Note: Certain ranged weapons, primarily automatic-fire weapons, have a “minimum delay” which applies to individual shots. If the Attack Delay is set below a weapon’s minimum delay, the game will forcibly delay the next shot by the weapon’s minimum delay instead. This minimum delay varies between weapons.\n<br />For example, the Agripinaa Mk. I Infantry Autogun has a minimum delay of approximately 100 milliseconds; setting an Attack Delay of 50ms will result in an actual per-shot delay of 100ms.[/i][/color]\n<br />\n<br />[b]RESET RANGED WEAPON[/b]: Although this is a Yes/No type setting, it functions as a button. Clicking this setting will reset ALL sequences across all keybinds for the currently selected ranged weapon.\n<br />[b]RESET ALL (RANGED WEAPONS)[/b]: Although this is a Yes/No type setting, it functions as a button. Clicking this setting will reset ALL sequences across all keybinds for ALL ranged weapons.\n<br />\n<br />[center][img]https://clan.fastly.steamstatic.com/images//38365286/a65c70af1027202631df9d22270d8a366b72f32d.png[/img][/center]\n<br />"
