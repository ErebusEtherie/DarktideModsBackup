nexusDescription="[*][b]do not ping a target that is already in your tag list filter\n<br />ok so it can be buggy with arb and prio swaps i would recommend if you want prio swaps to change the cool down timer to 1 sec and if not, up the timer to 10+[/b]\n<br />[b]\n<br />Enemy Filter Modes:[/b]\n<br />[list]\n<br />[*][b]All Enemies[/b] - Tags everything (original behavior)[/*]\n<br />[*][b]Priority Only[/b] - Only tags dangerous specials (flamers, snipers, gunners, etc.)[/*]\n<br />[*][b]Specials + Elites[/b] - Tags specials and elite enemies[/*]\n<br />[*][b]Custom Filter[/b] - Individual toggles for each enemy type[/*]\n<br />[/list][/*]\n<br />[*][b]Priority Targeting System:[/b]\n<br />[list]\n<br />[*]Automatically switches to higher priority targets[/*]\n<br />[*]Priority order: Bosses &gt; Specials &gt; Elites &gt; Basic enemies[/*]\n<br />[*]Prevents switching from high-priority to low-priority targets[/*]\n<br />[/list][/*]\n<br />[*][b]Individual Enemy Controls:[/b]\n<br />[list]\n<br />[*]Granular control over which specific enemy types to tag[/*]\n<br />[*]Organized by threat level (specials, elites, basic)[/*]\n<br />[*]Easy to customize based on your playstyle[/*]\n<br />[/list][/*]\n<br />[*][b]Debug Mode:[/b]\n<br />[list]\n<br />[*]Shows tagged enemy names in chat[/*]\n<br />[*]Helpful for testing and configuration[/*]\n<br />[/list]AutoPing Changelog\n<br />Localization fixes\n<br />Added missing localization entry for `tag_renegade_plasma_gunner` (was rendering as the literal unresolved key `&lt;tag_renegade_plasma_gunner&gt;` in the mod menu).\n<br />Fixed `priority_chaos_ogryn_houndmaster`: de/fr/ru/zh-cn were untranslated copies of the English text  now properly translated.\n<br />Fixed `priority_chaos_armored_hound`: de/fr/ru/zh-cn were untranslated copies of the English text  now properly translated.\n<br />Fixed `priority_renegade_plasma_gunner`: de/fr/ru were untranslated, and zh-cn was incorrectly copy-pasted from the Laz Gunner entry — now corrected.\n<br />Fixed `tag_chaos_armored_hound`: de/fr/ru/zh-cn left the word \"Armored\" untranslated  now fully translated.\n<br />Fixed `tag_chaos_ogryn_houndmaster`: de/fr/ru/zh-cn were untranslated copies of the English text now properly translated.\n<br />Verified all 26 supported breeds have complete `priority_&lt;breed&gt;` and `tag_&lt;breed&gt;` entries across en/de/fr/ru/zh-cn.\n<br />Tagging architecture rewrite\n<br />Replaced the `InputService._get` input-simulation hook with direct calls into `smart_tag_system` (`unit_tag_id`, `trigger_tag_interaction`, `set_contextual_unit_tag`)  mirrors how the game's own `HudElementSmartTagging._handle_selected_unit` tags a unit.\n<br />Removed the `pending_priority_switch` queue, its artificial delay, and the manual `cancel_tag` step. Retagging a unit now happens immediately and is handled natively by the smart tag system instead of being staged across multiple `mod.update` ticks.\n<br />Removed the now-unused `tag` flag and the simulated-keypress code path entirely.\n<br />Companion attack tags now fire immediately after the main tag succeeds instead of being queued.\n<br />Bug fix: priority switching never triggered\n<br />Priority-switch detection was nested inside the same `cooldown &lt;= 0` gate as normal tagging. Since tagging a unit immediately sets `cooldown` to the full `cd` setting, the switch branch was unreachable in practice  a higher-priority enemy could never interrupt an existing tag.\n<br />Fixed by moving the cooldown check so it only gates \"tag a fresh target\" behavior; priority-switch evaluation now runs every frame regardless of cooldown, so higher-priority targets (lower priority number) can interrupt an existing tag as intended.[/*]\n<br />"
