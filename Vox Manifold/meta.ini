nexusDescription="Vox Manifold is a dependency library for Warhammer 40,000: Darktide mods. \n<br />\n<br />It replicates small amounts of per-player state across a party over the game's Immaterium presence channel, the same backend service the game uses to share havoc status and character data. All delivery is relayed through Fatshark's servers, so there is no peer-to-peer connection, and nothing to configure.\n<br />\n<br />On its own it does nothing. It stays inert until a mod registers with it, and it is listed as a requirement by any mod that depends on it. If another mod directed you here, install it and leave it enabled; no further setup is needed. A debug logging option is included for diagnosing connection issues.\n<br />\n<br />For mod authors, Vox Manifold provides a compact API to publish a state payload and read each party member's payload, along with a capability record that reports which members run a given mod and at what version. Note this is more like a noticeboard of data, rather than any direct communication between clients. Come chat in the modder's [url=https://discord.gg/rKYWtaDx4D]discord [/url]if you want any adjustments to the library\n<br />\n<br />See the API at [url=https://github.com/Wobin/VoxManifold]Github[/url]"
