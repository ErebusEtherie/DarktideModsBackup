nexusDescription="[size=5][b]Ritual Danger Zones[/b][/size]\n<br />Turn every active Heinous Ritual into a clear danger zone. Warning markers on the ground, an on-screen alert with the distance, a marker on the daemonhost, and a countdown to completion.\n<br />\n<br />[size=4][b]Features[/b][/size]\n<br />[list]\n<br />[*]Two warning markers on the ground ahead of the ritual, amber then red. Each one clears once your team has passed it.[/*]\n<br />[*]An on-screen alert with the distance to the ritual, the countdown, and an arrow pointing toward the daemonhost when it is off-screen.[/*]\n<br />[*]A location marker with distance. Pick the icon: the plain skull, or the game's own Heinous Rituals icon.[/*]\n<br />[*]A completion countdown, with status for filling, contested, and near-complete.[/*]\n<br />[*]Optional rings around the ritual site. Off by default.[/*]\n<br />[/list][size=4][b]Options[/b]:[/size] \n<br />[list]\n<br />[*]Ground markers: toggle, size, depth, and a color for each of the two.[/*]\n<br />[*]Alert: toggle, size, text color, direction arrow, countdown.[/*]\n<br />[*]Marker: toggle, icon, size, through-walls, distance, edge arrow.[/*]\n<br />[*]Text size for the marker and alert labels.[/*]\n<br />[*]The optional rings around the ritual site.[/*]\n<br />[/list][size=4][b]Requirements[/b][/size]\n<br />[list]\n<br />[*][i]Darktide Mod Loader[/i][/*]\n<br />[*]Darktide Mod Framework (DMF)[/*]\n<br />[/list][size=4][b]Installation[/b][/size]\n<br />[list]\n<br />[*][i][b]Vortex (recommended):[/b] use the \"Mod Manager Download\" button, or download and install the archive. [/i][/*]\n<br />[*][b]Manual:[/b] extract the [i]RitualDangerZones[/i] folder into your Darktide [i]mods[/i] folder and add [i]RitualDangerZones[/i] to [i]mods/mod_load_order.txt[/i].[/*]\n<br />[/list][size=4][b]Credits[/b][/size]\n<br />[list]\n<br />[*][i][b]LAUR3HTE[/b], [url=https://www.nexusmods.com/warhammer40kdarktide/mods/687]https://www.nexusmods.com/warhammer40kdarktide/mods/687[/url], ritual detection logic, used with permission per its Nexus terms. [/i][/*]\n<br />[*][b]LeicaSimile[/b], [url=https://www.nexusmods.com/warhammer40kdarktide/mods/440]https://www.nexusmods.com/warhammer40kdarktide/mods/440[/url], the decal ring technique. Uses the base-game decal via public engine APIs; no Danger Zone assets or code are included.[/*]\n<br />[/list]"
