nexusDescription="[size=4][b]Description[/b][/size]\n<br />\n<br />So you finished the Tech Remnants penance, but Salvage got you like 🤬?\n<br />\n<br />This is the mod for you! Always head to your next nearest item of salvage until you've got them all.\n<br />\n<br />It always highlights the nearest salvage to you so you can track them down in short order! \n<br />\n<br />It also shows the distance to the next item of salvage and the counter shows how many are left in the zone still to find.\n<br />\n<br />[list]\n<br />[*]Highlights your closest salvage pick-up.[/*]\n<br />[*]The counter shows how many remain in the current zone.[/*]\n<br />[*]Type [b][color=#ff7700]/s[/color][/b] in Chat to skip the currently highlighted salvage item (for when it's clipped into the scenery and can't be picked up).[/*]\n<br />[*]Last Sanctuary Warning: reminds you that the final zone won't contain salvage to ensure you spend everything.[/*]\n<br />[/list]\n<br />[b][size=4]Helps with this penance:[/size][/b]\n<br />\n<br />[img]https://raw.githubusercontent.com/xxBellatrixx/Darktide_Mods/main/protrader.png[/img]\n<br />"
