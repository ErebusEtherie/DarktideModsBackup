nexusDescription="[b][color=#ff0000][size=4]BIG UPDATE(09.08.2026 ADDED NEW INGAME Ui, MOD UPDATE WITHOUT RESTARTING THE GAME FROM SERVER, MORE STATS!)[/size][/color][/b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/993][size=4]Giant update dropped for online scoreboard. [/size][b][size=4]ADDED NEW INGAME Ui, MOD UPDATE WITHOUT RESTARTING THE GAME FROM SERVER, MORE STATS![/size][/b] [/url]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/993][size=4][color=#ff0000][b]БОЛЬШОЕ ОБНОВЛЕНИЕ (09.08.2026 ДОБАВЛЕН НОВЫЙ ИГРОВОЙ ИНТЕРФЕЙС, ОБНОВЛЕНИЕ МОДОВ БЕЗ ПЕРЕЗАПУСКА ИГРЫ С СЕРВЕРА, БОЛЬШЕ СТАТИСТИКИ!)[/b][/color]. ДОБАВЛЕН НОВЫЙ ИГРОВОЙ ИНТЕРФЕЙС, ОБНОВЛЕНИЕ МОДОВ БЕЗ ПЕРЕЗАПУСКА ИГРЫ С СЕРВЕРА, БОЛЬШЕ СТАТИСТИКИ![/size] [/url]\n<br />[size=4][url=https://www.nexusmods.com/warhammer40kdarktide/mods/993][/url][/size]\n<br />\n<br />[b]Your servo-skull finally pulls its weight.[/b]\n<br />\n<br />Servo-Skull Commander is a quality of life mod for the Skitarii class. It turns your servo-skull companion into a proactive battle partner: the skull picks dangerous enemies in your field of view and attacks them on its own, so you can keep your hands on your gun instead of tagging targets every few seconds.\n<br />\n<br />Everything the mod does is something you could already do yourself with the tag key. It simply does it for you, at the right moment, with smarter target selection.\n<br />\n<br />[b][size=6]🆕 New in this version(09.08.2026)[/size]\n<br />[/b][size=5]* ADDED DOG SUPPORT\n<br />* REQUESTED BURSTER PROTECTION\n<br />* REQUESTED DH PROTECTION\n<br />* QOL SUPPORT[/size]\n<br />\n<br />[size=6][b]🆕 New in this version[/b][/size]\n<br />\n<br />[list]\n<br />[*][b]Teammate-safe Poxbursters[/b] — the forbidden radius now protects your whole team, not just you. The moment any ally steps too close to a marked burster, the skull bails off it by the fastest route (ignoring shield and smoke) and switches to another elite or special, so nothing explodes in a teammate's face.[/*]\n<br />[*][b]Aim-switch[/b] — turn it on and the skull tags whatever your crosshair is pointed at, [i]ignoring the priority table and the view cone entirely[/i]. Point at an enemy and it gets marked, full stop.[/*]\n<br />[*][b]Ignore unalerted enemies[/b] — a new checkbox that stops the skull from dragging sleeping patrols and ambient mobs into a fight you meant to skip.[/*]\n<br />[*][b]Disabler gate override[/b] — a new checkbox that acts as an automatic panic mode just for trappers and hounds in range: the charge gate is bypassed so those disablers always get shot.[/*]\n<br />[*][b]Split threat sliders[/b] — hound (far), trapper (far), mutant, sniper and bomber are now separate sliders instead of shared ones. Set any of them to 0 to never target that enemy (for example, ignore mutants completely).[/*]\n<br />[/list]\n<br />[size=6][b]A personal priority for every enemy type[/b][/size]\n<br />\n<br />The heart of the mod is a threat table that you tune to your own playstyle. Every enemy category has its own priority slider from 0 to 100, where 100 means \"kill this first\" and 0 means \"never touch this at all\". When several enemies are around, the skull attacks the one with the highest priority, and among equal threats it picks the closest one.\n<br />\n<br />The categories are not just flat lists, they understand context:\n<br />\n<br />[list]\n<br />[*]Hounds, trappers and flamers are three fully independent categories. Each one has its own priority slider AND its own threat distance slider. You can tell the skull that a trapper is deadly the moment its net can reach you, that a hound matters only when it is close enough to pounce, and that a flamer deserves attention at exactly the range you fear. Outside their threat distance, hounds and trappers get their own separate far-range sliders, and a distant flamer counts as an ordinary special.[/*]\n<br />[*]Mutants have a fully independent slider of their own. Set it to 0 and the skull never touches them, no fallback, no exceptions.[/*]\n<br />[*]Shotgunners are rated by their own effective range: inside it they use their high priority, outside it they are treated like regular gunners. That range is adjustable.[/*]\n<br />[*]Gunners, ogryn reapers and plasma gunners each have a separate slider, so you can tell the skull that plasma hurts more than a stub gun.[/*]\n<br />[*]Snipers and bombers ignore the general distance limit completely, and each of the two has its own slider. If one exists somewhere far away, the skull can still be sent after it — or set either slider to 0 and that threat is never targeted at all.[/*]\n<br />[*]Elites have two sliders: one for elites near you and one for elites far away. By default distant elites are ignored so the skull does not waste time on a crusher across the map.[/*]\n<br />[*]Poxbursters have a forbidden radius around you. Inside it the skull will never shoot one, no matter what, so nothing explodes in your face. Beyond that radius they get their own priority. Both the radius and the priority are yours to set, and a separate hard switch can forbid shooting Poxbursters entirely.[/*]\n<br />[*]The forbidden radius can protect your teammates too (on by default): while ANY living ally stands inside it, the burster is off the target list. And if the skull is already attacking a Poxburster when someone steps into the radius, the mod instantly switches it to the best other elite or special — skipping the force field and smoke checks for that one emergency switch, so it happens as fast as possible. Nothing explodes in your teammates' faces either.[/*]\n<br />[*]Bosses and captains have their own slider, and anything special that does not fit the categories above has a catch-all one.[/*]\n<br />[*]Sleeping daemonhosts are never targeted, period. The mod refuses to wake one up for you.[/*]\n<br />[/list]\n<br />On top of the priorities, the skull is loyal to its current target: a separate \"target hold time\" setting decides how many seconds it stays on the current enemy before it is allowed to switch to a higher-priority one that just appeared. If the target dies or leaves range, switching is instant. Set the hold time high and the skull commits hard, set it to zero and it always chases the biggest threat.\n<br />\n<br />Your crosshair can outrank the whole table: with the optional aim-switch, whatever enemy you are aiming at instantly becomes the skull's target — no double-tag needed. This is a pure manual-style override, so priority, the view cone, the distance limit and even the shield/smoke checks and the Poxburster forbidden radius are all set aside — point at it and it gets marked. While you keep aiming at it the skull stays on it; look away and the priority table (with all its safety checks) takes over again.\n<br />\n<br />And if you like playing quietly, an optional \"ignore unalerted enemies\" filter keeps the skull from acquiring enemies that have not noticed anyone yet — no more dragging sleeping patrols and ambient mobs into a fight you meant to walk past. The target the skull is already fighting is never dropped because of this, and deliberately aiming at a sleeping enemy still works: intent beats the filter.\n<br />\n<br />[size=6][b]Attack cone from a narrow beam to full 360 degrees[/b][/size]\n<br />\n<br />You decide how far the skull is allowed to look for new targets. The attack cone follows your camera: at 120 degrees the skull picks only enemies roughly on your screen, exactly the ones you can actually see. Narrow it down and the skull becomes a surgical tool that works only where you are looking. Widen it all the way to 360 degrees and the skull guards your back too, attacking threats behind you that you have not even noticed yet.\n<br />\n<br />One important comfort detail: the cone only filters NEW targets. An enemy the skull is already attacking stays its target even if you turn away, so spinning around in melee does not make the skull constantly drop and re-acquire targets.\n<br />\n<br />[size=6][b]It refuses to waste shots[/b][/size]\n<br />\n<br />The skull will not be ordered against targets it cannot actually hurt:\n<br />\n<br />[list]\n<br />[*]Psyker force fields are fully respected. The order is skipped whenever a shield or dome is involved in any way: the line between the skull and the target crosses one, the target stands inside a dome, or the skull itself floats inside one. The skull's shots cannot penetrate fields and do not work inside domes either, so all of these orders would be wasted. This works for automatic orders and can also guard your manual ones.[/*]\n<br />[*]Veteran smoke clouds are respected too. The servo-skull genuinely cannot see or shoot through smoke, so the mod skips targets when a smoke cloud sits on the skull-to-target line or the skull is standing in one. Guards both automatic and manual orders, on by default.[/*]\n<br />[*]Honest about what does NOT block: pox gas, toxic clouds, Nurgle slime and flamer fire pools do not stop the skull's shots at all (they only deal damage, and the game already shields your skull from their effect), so the mod deliberately does not gate on them. It will not stop the skull firing into gas where the shots actually land.[/*]\n<br />[*]Line of sight is always required for automatic orders: the skull never tags enemies hidden behind walls and level geometry, so no charge is ever burned on a target it cannot reach.[/*]\n<br />[*]In every case the debug mode will honestly tell you in chat which target was skipped and why.[/*]\n<br />[/list]\n<br />[size=6][b]Charge gate: automation that respects your resources[/b][/size]\n<br />\n<br />If you run the improved tagging talent, attack orders interact with your combat ability reserve. The mod lets you draw a hard line the automation may never cross. You set the reserve you want to keep, as whole charges plus a fine-grained percent on top, and while your reserve is below that line the auto-attack simply pauses and waits. Your emergency charges stay yours: the skull will never burn the ability you were saving for the moment everything goes wrong. Manual orders are not affected, you can always order the skull yourself.\n<br />\n<br />One exception you can opt into: the disabler override. While a trapper is inside its net distance or a hound inside its leap distance, the gate is bypassed and the skull keeps firing at them even at zero charges — an automatic mini panic mode for exactly the enemies that end runs. Only the gate is bypassed; priorities and all the shot-wasting checks still apply.\n<br />\n<br />[size=6][b]Panic mode: everything now, charges be damned[/b][/size]\n<br />\n<br />When it all goes wrong at once, one key throws the charge gate out the window. Press the panic key and the skull attacks flat out, ignoring the reserve entirely — it keeps ordering even at zero charges and zero percent. Everything else still applies: it still respects priorities, force fields, smoke and line of sight, it just stops holding anything back.\n<br />\n<br />Two ways to run it, your choice:\n<br />\n<br />[list]\n<br />[*]Until pressed again: one press turns panic on and it stays on until you press the key a second time. Good for a horde that will not end.[/*]\n<br />[*]For a set time: one press runs panic for a number of seconds you pick, from 10 to 120, then it switches off by itself. Pressing again during that window ends it early.[/*]\n<br />[/list]\n<br />The chat tells you when panic turns on and off, so you always know the gate is open.\n<br />\n<br />[size=6][b]Your hands always win[/b][/size]\n<br />\n<br />The automation is built around one rule: the player is the commander, the mod is just a sergeant.\n<br />\n<br />[list]\n<br />[*]The moment you mark a target manually, the mod goes silent for a configurable number of seconds and lets your order play out. Default is two seconds, you can stretch it up to ten if you like to micromanage.[/*]\n<br />[*]This pause can be disabled entirely if you want the automation to keep working alongside your own orders.[/*]\n<br />[*]Your manual orders can also be protected from yourself: optional guards downgrade an order to a regular ping when the skull is busy hacking or healing, or when the target hides behind a force field, and a chat message tells you exactly why. Each guard is a separate toggle.[/*]\n<br />[/list]\n<br />[size=6][b]Medicae skull helpers[/b][/size]\n<br />\n<br />Rescuing teammates with the heal order becomes painless:\n<br />\n<br />[list]\n<br />[*]Downed allies get a bright green outline, visible through walls, while you play Skitarii.[/*]\n<br />[*]While you hold the blitz, your view gently turns toward the nearest ally who needs help, at a speed you choose, and only within an aim-snap cone you set — so a closer ally behind you never spins your camera around; you rez the one you are facing.[/*]\n<br />[*]Auto-launch: the moment your aim locks onto a valid ally, the skull flies out by itself and the whole order completes on its own. You never have to release the key at the right time, and you never lose an order to releasing it a split second too early. One launch per key press, so you always stay in control.[/*]\n<br />[*]No wasted skulls: while the first skull is busy reviving an ally, the mod refuses to even start aiming a second order. The moment the skull finishes and returns to your side, ordering works again. This protection is a separate toggle if you prefer the vanilla behavior.[/*]\n<br />[/list]\n<br />[size=6][b]Everything is a setting[/b][/size]\n<br />\n<br />There is no hidden behavior in this mod. Every single feature is a toggle or a slider in the options menu:\n<br />\n<br />[list]\n<br />[*]Auto-attack on and off, plus a keybind to flip it mid-mission[/*]\n<br />[*]Aim-switch: the enemy under your crosshair instantly becomes the skull's target, ignoring priority and cone[/*]\n<br />[*]Unalerted-enemy filter so the skull never starts fights you were avoiding[/*]\n<br />[*]How often the order on the current target is refreshed, from a fast 0.2 seconds to a lazy 2.2[/*]\n<br />[*]Target hold time before switching, from instant to 15 seconds[/*]\n<br />[*]Maximum engagement distance, from 15 up to 150 meters[/*]\n<br />[*]Attack cone width, from 30 to a full 360 degrees[/*]\n<br />[*]Force field and smoke checks, each separate for automatic and manual orders (automatic orders always require line of sight through walls)[/*]\n<br />[*]The whole charge gate: on, off, charges, percent, plus the disabler override for trappers and hounds in range[/*]\n<br />[*]Panic mode: its own key, either \"until pressed again\" or \"for 10-120 seconds\"[/*]\n<br />[*]Manual order pause: on, off, duration[/*]\n<br />[*]Chat notifications for downgraded orders[/*]\n<br />[*]Heal helpers: outline, aim assist with its turn speed and aim-snap cone, auto-launch, second-order protection, each independent[/*]\n<br />[*]Seventeen priority sliders, six distance sliders, a hard \"never target Poxbursters\" switch and teammate protection for the forbidden radius in the threat table[/*]\n<br />[*]A training area toggle and a debug mode that narrates every decision in chat[/*]\n<br />[/list]\n<br />Turn everything off and the mod does nothing at all. Turn on only the outline and it is a tiny UI helper. Turn on everything and the skull becomes the most disciplined teammate you have ever had.\n<br />\n<br />[size=6][b]Fair play[/b][/size]\n<br />\n<br />The mod does not change damage, cooldowns, abilities or enemy behavior. It sends the same companion orders a player sends with the tag key, at a human-like rate, only to targets you could see and mark yourself. It is client side only, teammates do not need it.\n<br />\n<br />[size=6][b]Requirements[/b][/size]\n<br />\n<br />[list]\n<br />[*]Darktide Mod Framework and Darktide Mod Loader[/*]\n<br />[*]A character of the Skitarii class with the servo-skull companion\n<br />\n<br />[/*]\n<br />[/list][b]Ваш сервочереп наконец приносит пользу.[/b]\n<br />\n<br />Servo-Skull Commander - это мод удобства для класса Скитарий. Он превращает сервочереп в активного боевого напарника: череп сам выбирает опасных врагов в вашем поле зрения и атакует их, а вы держите руки на оружии вместо того, чтобы каждые несколько секунд помечать цели.\n<br />\n<br />Всё, что делает мод, вы и так могли делать сами клавишей метки. Мод просто делает это за вас, в нужный момент и с умным выбором цели.\n<br />\n<br />[size=6][b]🆕 Новое в этой версии[/b][/size]\n<br />\n<br />[list]\n<br />[*][b]Взрывуны безопасны для команды[/b] — запретный радиус теперь защищает всю команду, а не только вас. Как только любой союзник подходит слишком близко к помеченному взрывуну, череп мгновенно бросает его кратчайшим путём (игнорируя щит и дым) и переключается на другую элиту или специалиста — чтобы ничего не рвануло в лицо тиммейту.[/*]\n<br />[*][b]Переключение по прицелу[/b] — включите, и череп метит того, на кого направлен прицел, [i]полностью игнорируя таблицу приоритетов и конус обзора[/i]. Навёл на врага — пометилось, точка.[/*]\n<br />[*][b]Игнор непотревоженных врагов[/b] — новая галочка, которая не даёт черепу втягивать в бой спящие патрули и фоновых мобов, мимо которых вы хотели пройти.[/*]\n<br />[*][b]Обход гейта для дизейблеров[/b] — новая галочка, работающая как автоматический паник-режим только для трапперов и собак в радиусе: гейт по зарядам обходится, и по этим дизейблерам всегда стреляют.[/*]\n<br />[*][b]Раздельные ползунки угроз[/b] — собака (далеко), траппер (далеко), мутант, снайпер и бомбер теперь отдельные ползунки вместо общих. Поставьте любому из них 0, чтобы не целиться в этого врага вообще (например, полностью игнорировать мутантов).[/*]\n<br />[/list]\n<br />[size=6][b]Личный приоритет для каждого типа врагов[/b][/size]\n<br />\n<br />Сердце мода: таблица угроз, которую вы настраиваете под свой стиль игры. У каждой категории врагов свой ползунок приоритета от 0 до 100, где 100 значит «убивать первым», а 0 значит «не трогать никогда». Когда врагов несколько, череп атакует цель с наивысшим приоритетом, а при равной угрозе выбирает ближайшую.\n<br />\n<br />Категории понимают контекст, а не просто перечисляют врагов:\n<br />\n<br />[list]\n<br />[*]Собаки, трапперы и огнемётчики: три полностью независимые категории. У каждой свой ползунок приоритета И свой ползунок дистанции угрозы. Можно объяснить черепу, что траппер смертелен ровно с той дистанции, куда добивает его сеть, собака важна только на расстоянии прыжка, а огнемётчик заслуживает внимания именно на той дальности, которой вы боитесь. Вне своей дистанции у собак и трапперов теперь собственные отдельные ползунки дальнего приоритета, а дальний огнемётчик считается обычным специалистом.[/*]\n<br />[*]У мутантов полностью независимый собственный ползунок. Поставьте 0, и череп их не тронет никогда — без запасных приоритетов и исключений.[/*]\n<br />[*]Шотганнеры оцениваются по своей эффективной дистанции: внутри неё у них высокий приоритет, за её пределами они приравниваются к обычным пулемётчикам. Дистанция регулируется.[/*]\n<br />[*]У пулемётчиков, Жнецов и плазмоганов отдельные ползунки, так что можно объяснить черепу, что плазма больнее стаббера.[/*]\n<br />[*]Снайперы и бомберы полностью игнорируют общий лимит дальности, и у каждой из двух категорий свой ползунок. Если такой враг есть где-то далеко, черепа всё равно можно отправить за ним — или поставьте любому из них 0, и эта угроза не атакуется вообще.[/*]\n<br />[*]У элиты два ползунка: элита рядом и элита вдалеке. По умолчанию дальняя элита игнорируется, чтобы череп не тратил время на крашера через всю карту.[/*]\n<br />[*]У взрывунов есть запретный радиус вокруг вас. Внутри него череп не выстрелит по взрывуну никогда, чтобы ничего не рвануло вам в лицо. За пределами радиуса у них собственный приоритет. И радиус, и приоритет в ваших руках, а отдельный жёсткий выключатель запрещает стрельбу по взрывунам полностью.[/*]\n<br />[*]Запретный радиус может защищать и союзников (включено по умолчанию): пока ЛЮБОЙ живой тиммейт стоит внутри него, взрывун вычеркнут из списка целей. А если череп уже атакует взрывуна, когда кто-то вошёл в радиус, мод мгновенно переключает его на лучшую другую элиту или специалиста — пропуская для этого аварийного переключения проверки силового поля и дыма, чтобы оно произошло как можно быстрее. В лицо тиммейтам тоже ничего не рванёт.[/*]\n<br />[*]Боссы и капитаны получили свой ползунок, а для специалистов, не попавших ни в одну категорию, есть общий.[/*]\n<br />[*]Спящие демонхосты не атакуются никогда. Будить его вместо вас мод отказывается.[/*]\n<br />[/list]\n<br />Поверх приоритетов череп верен текущей цели: отдельная настройка «время удержания цели» решает, сколько секунд он держится за текущего врага, прежде чем ему разрешат переключиться на более приоритетного. Если цель умерла или ушла из зоны действия, переключение мгновенное. Поставьте большое время, и череп будет добивать выбранное, поставьте ноль, и он всегда будет гнаться за самой большой угрозой.\n<br />\n<br />Ваш прицел может быть главнее всей таблицы: с опциональным авто-переключением по прицелу враг под перекрестием мгновенно становится целью черепа — двойная метка не нужна. Это чистый ручной оверрайд, поэтому приоритет, конус обзора, лимит дистанции и даже проверки щита/дыма и запретный радиус взрывунов отбрасываются — навёл, и пометилось. Пока вы держите его под прицелом, череп держит его; отвели взгляд — снова командует таблица приоритетов (со всеми своими проверками).\n<br />\n<br />А для любителей тихого прохождения есть фильтр «игнорировать непотревоженных врагов»: череп не берёт в цели тех, кто ещё никого не заметил, — и больше не втягивает в бой спящие патрули и фоновых мобов, мимо которых вы собирались пройти. Цель, с которой череп уже дерётся, из-за этого не сбрасывается, а осознанное наведение прицела на спящего врага фильтр обходит: намерение важнее.\n<br />\n<br />[size=6][b]Конус атаки: от узкого луча до полных 360 градусов[/b][/size]\n<br />\n<br />Вы сами решаете, как далеко черепу позволено искать новые цели. Конус атаки следует за вашей камерой: при 120 градусах череп берёт только врагов примерно на вашем экране, тех, кого вы реально видите. Сузьте конус, и череп станет хирургическим инструментом, работающим только там, куда вы смотрите. Раскройте до 360 градусов, и череп начнёт прикрывать вам спину, атакуя угрозы позади, которые вы ещё даже не заметили.\n<br />\n<br />Важная деталь для комфорта: конус фильтрует только НОВЫЕ цели. Враг, которого череп уже атакует, остаётся его целью, даже если вы отвернулись. Поэтому вращение в ближнем бою не заставляет черепа бесконечно бросать и заново искать цели.\n<br />\n<br />[size=6][b]Череп не тратит выстрелы впустую[/b][/size]\n<br />\n<br />Приказы не уходят на цели, которым череп не может навредить:\n<br />\n<br />[list]\n<br />[*]Силовые поля псайкеров уважаются полностью. Приказ пропускается всегда, когда стенка или купол замешаны хоть как-то: линия между черепом и целью пересекает поле, цель стоит внутри купола, или сам череп парит внутри купола. Выстрелы черепа поля не пробивают и внутри куполов тоже не работают, так что любой такой приказ был бы потрачен впустую. Это работает для автоматических приказов и может страховать ручные.[/*]\n<br />[*]Дым ветерана тоже учитывается. Сервочереп по-настоящему не видит и не стреляет сквозь дым, поэтому мод пропускает цели, когда облако дыма на линии череп→цель или сам череп стоит в дыму. Страхует и авто-, и ручные приказы, включено по умолчанию.[/*]\n<br />[*]Прямая видимость для авто-приказов обязательна всегда: череп не помечает врагов за стенами и геометрией уровня, поэтому заряд никогда не тратится на недостижимую цель.[/*]\n<br />[*]Честно о том, что НЕ блокирует: pox-газ, токсичные облака, слизь Нургла и огненные лужи флеймеров выстрелы черепа не останавливают (они только наносят урон, и сам череп игра из их эффекта уже исключает), поэтому мод намеренно на них не реагирует. Он не станет мешать черепу стрелять в газ, где выстрелы реально долетают.[/*]\n<br />[*]В любом случае отладочный режим честно напишет в чат, какая цель пропущена и почему.[/*]\n<br />[/list]\n<br />[size=6][b]Гейт по заряду: автоматика уважает ваши ресурсы[/b][/size]\n<br />\n<br />Если вы играете с талантом улучшенной метки, приказы атаки связаны с запасом вашей боевой способности. Мод позволяет провести жёсткую черту, которую автоматика не пересечёт никогда. Вы задаёте запас, который хотите сохранить: целые заряды плюс точный процент сверху. Пока ваш запас ниже этой черты, авто-атака просто ставится на паузу и ждёт. Неприкосновенный запас остаётся вашим: череп не сожжёт способность, которую вы берегли на случай, когда всё пойдёт не так. Ручных приказов это не касается, сами вы можете приказывать всегда.\n<br />\n<br />Одно исключение по вашему выбору: обход гейта для дизейблеров. Пока траппер в пределах дистанции сети или собака в пределах дистанции прыжка, гейт обходится, и череп продолжает стрелять по ним даже при нуле зарядов — автоматический мини паник-режим ровно для тех врагов, которые заканчивают забеги. Обходится только гейт: приоритеты и все проверки бесполезных выстрелов продолжают действовать.\n<br />\n<br />[size=6][b]Паник-режим: всё и сразу, заряды побоку[/b][/size]\n<br />\n<br />Когда всё пошло не так одновременно, одна клавиша выбрасывает гейт по зарядам в окно. Нажмите клавишу паники — и череп атакует на полную, полностью игнорируя запас: он приказывает даже при нуле зарядов и нуле процентов. Всё остальное продолжает действовать: приоритеты, силовые поля, дым и прямая видимость по-прежнему учитываются, череп просто перестаёт что-либо беречь.\n<br />\n<br />Два способа на выбор:\n<br />\n<br />[list]\n<br />[*]До повторного нажатия: одно нажатие включает панику, и она держится, пока вы не нажмёте клавишу второй раз. Для орды, которой нет конца.[/*]\n<br />[*]На заданное время: одно нажатие запускает панику на выбранное число секунд, от 10 до 120, затем она выключается сама. Повторное нажатие в это время завершает её досрочно.[/*]\n<br />[/list]\n<br />Чат сообщает, когда паника включилась и выключилась, так что вы всегда знаете, что гейт открыт.\n<br />\n<br />[size=6][b]Ваши руки всегда главнее[/b][/size]\n<br />\n<br />Автоматика построена вокруг одного правила: командир здесь игрок, мод только сержант.\n<br />\n<br />[list]\n<br />[*]В момент, когда вы помечаете цель вручную, мод замолкает на настраиваемое число секунд и даёт вашему приказу отработать. По умолчанию две секунды, любителям микроконтроля можно растянуть до десяти.[/*]\n<br />[*]Эту паузу можно и вовсе отключить, если хотите, чтобы автоматика работала параллельно с вашими приказами.[/*]\n<br />[*]Ручные приказы можно защитить и от вас самих: опциональные предохранители понижают приказ до обычной метки, когда череп занят взломом или лечением, или когда цель прячется за силовым полем, а сообщение в чате объяснит, почему именно. Каждый предохранитель включается отдельно.[/*]\n<br />[/list]\n<br />[size=6][b]Помощь лечащему черепу[/b][/size]\n<br />\n<br />Спасать союзников приказом лечения теперь просто:\n<br />\n<br />[list]\n<br />[*]Павшие союзники подсвечиваются ярко-зелёным силуэтом, видимым сквозь стены.[/*]\n<br />[*]Пока вы держите блиц, прицел плавно доворачивается к ближайшему союзнику, которому нужна помощь, со скоростью на ваш вкус и только в пределах заданного вами конуса доворота — более близкий союзник за спиной не развернёт вам камеру, поднимаете того, на кого смотрите.[/*]\n<br />[*]Авто-запуск: как только прицел сошёлся на союзнике, череп улетает сам, и весь приказ завершается без вашего участия. Не нужно ловить момент отжатия клавиши, и приказ больше не теряется из-за отпущенной чуть раньше кнопки. Один запуск за одно нажатие, контроль всегда у вас.[/*]\n<br />[*]Никаких потраченных черепов: пока первый череп занят воскрешением союзника, мод не даст даже начать прицеливание второго приказа. Как только череп закончит и вернётся к вам, приказы снова работают. Эта защита отключается отдельной галочкой, если вам привычнее поведение игры.[/*]\n<br />[/list]\n<br />[size=6][b]Здесь настраивается всё[/b][/size]\n<br />\n<br />В моде нет скрытого поведения. Каждая функция это переключатель или ползунок в меню настроек:\n<br />\n<br />[list]\n<br />[*]Авто-атака: вкл и выкл, плюс горячая клавиша прямо в миссии[/*]\n<br />[*]Авто-переключение по прицелу: враг под перекрестием мгновенно становится целью черепа, игнорируя приоритет и конус[/*]\n<br />[*]Фильтр непотревоженных врагов, чтобы череп не начинал бои, которых вы избегали[/*]\n<br />[*]Частота обновления приказа по текущей цели: от бодрых 0.2 секунды до ленивых 2.2[/*]\n<br />[*]Время удержания цели перед переключением: от мгновенного до 15 секунд[/*]\n<br />[*]Максимальная дальность атаки: от 15 до 150 метров[/*]\n<br />[*]Ширина конуса атаки: от 30 до полных 360 градусов[/*]\n<br />[*]Проверки силовых полей и дыма, отдельно для авто и ручных приказов (авто-приказы всегда требуют прямой видимости сквозь стены)[/*]\n<br />[*]Весь гейт по зарядам: вкл, выкл, заряды, процент, плюс обход гейта для трапперов и собак рядом[/*]\n<br />[*]Паник-режим: своя клавиша, режим «до повторного нажатия» или «на 10–120 секунд»[/*]\n<br />[*]Пауза после ручного приказа: вкл, выкл, длительность[/*]\n<br />[*]Уведомления в чате о пониженных приказах[/*]\n<br />[*]Помощь лечению: подсветка, доворот прицела с его скоростью и конусом, авто-запуск, защита от второго приказа, всё независимо[/*]\n<br />[*]Семнадцать ползунков приоритетов, шесть ползунков дистанций, жёсткий выключатель взрывунов и защита союзников в запретном радиусе — всё в таблице угроз[/*]\n<br />[*]Переключатель для тренировочных зон и отладочный режим, который комментирует каждое решение в чате[/*]\n<br />[/list]\n<br />Выключите всё, и мод не делает ничего. Включите одну подсветку, и это крошечный помощник интерфейса. Включите всё, и череп станет самым дисциплинированным тиммейтом в вашей жизни.\n<br />\n<br />[size=6][b]Честная игра[/b][/size]\n<br />\n<br />Мод не меняет урон, перезарядки, способности или поведение врагов. Он отправляет те же приказы компаньону, что и игрок клавишей метки, с человеческой частотой и только по целям, которые вы могли бы увидеть и пометить сами. Мод полностью клиентский, союзникам он не нужен.\n<br />\n<br />[size=6][b]Требования[/b][/size]\n<br />\n<br />[list]\n<br />[*]Darktide Mod Framework и Darktide Mod Loader[/*]\n<br />[*]Персонаж класса Скитарий с компаньоном-сервочерепом[/*]\n<br />[/list]"
