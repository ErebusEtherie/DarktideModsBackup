nexusDescription="[size=5][color=#ff0000][b]BIG UPDATE(15.08.2026 ADDED NEW INGAME FULLYY CUSTOMIZED TAB MENU Ui, FIXED MEMORY LEAK, MORE STATS!)[/b][url=https://www.nexusmods.com/warhammer40kdarktide/mods/993]Giant update dropped for online scoreboard. [b]ADDED NEW INGAME TAB MENU Ui, FIXED MEMORY LEAK, MORE STATS![/b][/url][/color]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/993][b]БОЛЬШОЕ ОБНОВЛЕНИЕ (15.08.2026 ДОБАВЛЕН НОВЫЙ ИГРОВОЙ ИНТЕРФЕЙС ТАБ В ИГРЕ, ПОЛНОСТЬЮ НАСТРАИВАЕМЫЙ, ПОФИКШЕНА УТЕЧКА ПАМЯТИ)[/b]. [b]ДОБАВЛЕН НОВЫЙ ИГРОВОЙ ИНТЕРФЕЙС ТАБ В ИГРЕ, ПОЛНОСТЬЮ НАСТРАИВАЕМЫЙ, ПОФИКШЕНА УТЕЧКА ПАМЯТИ[/b][/url][/size]\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/993] [/url]\n<br />[size=4][url=https://www.nexusmods.com/warhammer40kdarktide/mods/993][/url][/size]\n<br />\n<br />[b]Your servo-skull finally pulls its weight. And your cyber-mastiff finally hunts what it can actually kill.[/b]\n<br />\n<br />Servo-Skull &amp; Hound Commander (formerly Servo-Skull Commander) is a quality of life mod for the Skitarii and Adeptus Arbites classes. It turns your companion into a proactive battle partner: the Skitarii servo-skull picks dangerous enemies in your field of view and shoots them on its own, and the Arbites cyber-mastiff is sent after exactly the targets a dog is good at killing — so you can keep your hands on your gun instead of tagging targets every few seconds.\n<br />\n<br />Everything the mod does is something you could already do yourself with the tag key. It simply does it for you, at the right moment, with smarter target selection.\n<br />\n<br />[size=6][b]🆕 New in this version[/b][/size]\n<br />\n<br />[list]\n<br />[*][b]Cyber-Mastiff command[/b] — the whole automation now drives the Adeptus Arbites cyber-mastiff too: same double-tag orders, its own settings tab. Arbites orders are free (no charge cost), so there is no charge gate to think about — the dog just hunts.[/*]\n<br />[*][b]Two companions, two tabs, two priority tables[/b] — the settings are reorganized into per-companion sections, and the servo-skull and the mastiff each have a fully independent threat table. Tune one class without ever touching the other.[/*]\n<br />[*][b]A dog-aware threat table[/b] — the mastiff pins human-sized shooters and specials to the ground and shreds them, but hounds, mutants, ogryn-sized elites and the Houndmaster it can only kick once, leap away from and re-approach. Those default to 0: no more minutes of theatre against targets the dog cannot actually kill.[/*]\n<br />[*][b]Teammate rescue[/b] — the moment any enemy is holding an ally (hound, mutant, trapper net, Chaos Spawn, Beast of Nurgle), that exact enemy becomes the dog's top-priority target. The game only auto-saves the dog's owner; the mod extends it to the whole team.[/*]\n<br />[*][b]Manual target lock[/b] — an enemy YOU order the dog at stays its target until it dies. No more being re-routed onto something \"better\" mid-run.[/*]\n<br />[*][b]One-press attack order key[/b] — orders your companion at the crosshair target, for both classes, with all the mod's safety guards. No double-tag, no Skitarii UI Fix needed alongside.[/*]\n<br />[*][b]Execution Order support[/b] — enemies marked by the Arbites keystone get their own high priority: the dog farms your keystone procs for you.[/*]\n<br />[*][b]Close-combat mode key[/b] — one press leashes the dog to a short radius with 360-degree awareness for tense brawls; press again to release it back to hunting.[/*]\n<br />[*][b]Bleed hand-off[/b] — a victim that will bleed out on its own is released early; the dog moves to the next target instead of watching it die.[/*]\n<br />[*][b]Attack an awakened Daemonhost (opt-in)[/b] — a new slider lets the companion join the fight once a Daemonhost is already awake. Sleeping ones remain untouchable, always.[/*]\n<br />[*][b]Auto-Detonation on bosses (opt-in)[/b] — with the Detonation blitz equipped, the mod can press it at the exact moment the mastiff is physically on a boss, and always keeps a reserve charge for you.[/*]\n<br />[*][b]Smoke and force-field guards now default OFF[/b] — the game fixed the servo-skull refusing to shoot through smoke and allied force fields. Existing profiles are switched off once automatically; the settings stay available in case a patch breaks the fix again.[/*]\n<br />[/list]\n<br />[size=6][b]⚠️ Upgrading from Servo-Skull Commander[/b][/size]\n<br />\n<br />The mod has been renamed, and the folder name matters to the loader:\n<br />\n<br />[list=1]\n<br />[*]Delete the old mods/ServoSkullCommander folder completely.[/*]\n<br />[*]Install this version so it sits in mods/ServoSkullHoundCommander.[/*]\n<br />[*]In mod_load_order.txt, replace the ServoSkullCommander line with ServoSkullHoundCommander.[/*]\n<br />[/list]\n<br />A leftover old folder or a stale load-order line means the game keeps loading the old skull-only version — or nothing at all.\n<br />\n<br />Your saved settings are migrated automatically: on first launch the mod copies your whole old Servo-Skull Commander profile into the new one (a chat message confirms it). The migrated values keep driving the servo-skull exactly as before; the mastiff starts from its new, dog-aware defaults — a one-time chat notice on first launch reminds you to look its tab over.\n<br />\n<br />[size=6][b]How the settings are organized[/b][/size]\n<br />\n<br />Nine collapsible sections, and they read like tabs: [b]Auto-attack — common[/b] (what applies to both companions), [b]Servo-skull[/b] (its envelope, its shot checks, its full threat table), [b]Cyber-Mastiff[/b] (everything dog), then Daemonhost protection, the charge gate, panic mode, manual orders, and the two Medicae groups. Fresh installs start with every section collapsed, so the options page opens as a short list instead of a wall of sliders.\n<br />\n<br />The common section holds: the master auto-attack toggle and its mid-mission hotkey, the one-press attack order key, the aim-switch override (whatever your crosshair is on instantly becomes the companion's target, ignoring the whole table), the unalerted-enemy filter (never start fights you were sneaking past), teammate Poxburster protection, a training-area toggle and a debug mode that narrates every decision in chat.\n<br />\n<br />[size=6][b]The servo-skull: a personal priority for every enemy type[/b][/size]\n<br />\n<br />The heart of the skull tab is a threat table that you tune to your own playstyle. Every enemy category has its own priority slider from 0 to 100, where 100 means \"kill this first\". When several enemies are around, the skull attacks the one with the highest priority, and among equal threats it picks the closest one. A zeroed slider means never for hounds, trappers, mutants, snipers, bombers, Poxbursters and bosses; zeroed gunners, shotgunners, plasma, reapers and flamers instead fall back to the generic elite / other-special sliders (this is the skull table's historical behavior — zero those too if you want true silence; the mastiff's table has no such fallbacks).\n<br />\n<br />The categories are not just flat lists, they understand context:\n<br />\n<br />[list]\n<br />[*]Hounds, trappers and flamers are three fully independent categories. Each one has its own priority slider AND its own threat distance slider. You can tell the skull that a trapper is deadly the moment its net can reach you, that a hound matters only when it is close enough to pounce, and that a flamer deserves attention at exactly the range you fear. Outside their threat distance, hounds and trappers get their own separate far-range sliders, and a distant flamer counts as an ordinary special.[/*]\n<br />[*]Mutants have a fully independent slider of their own. Set it to 0 and the skull never touches them, no fallback, no exceptions.[/*]\n<br />[*]Shotgunners are rated by their own effective range: inside it they use their high priority, outside it they are treated like regular gunners. That range is adjustable.[/*]\n<br />[*]Gunners, ogryn reapers and plasma gunners each have a separate slider, so you can tell the skull that plasma hurts more than a stub gun.[/*]\n<br />[*]Snipers and bombers are exempt from your distance slider (up to a built-in ~90 m ceiling for new targets), and each of the two has its own priority slider.[/*]\n<br />[*]Elites have two sliders: one for elites near you and one for elites far away. By default distant elites are ignored so the skull does not waste time on a crusher across the map.[/*]\n<br />[*]Poxbursters have a forbidden radius around you. Inside it the skull will never shoot one, no matter what, so nothing explodes in your face. Beyond that radius they get their own priority, and a separate hard switch can forbid shooting Poxbursters entirely.[/*]\n<br />[*]The forbidden radius protects your teammates too (on by default): while ANY living ally stands inside it, the burster is off the target list — and if the skull is already attacking one when someone steps in, the mod instantly switches it to the best other target.[/*]\n<br />[*]Bosses and captains have their own slider, and anything special that does not fit the categories above has a catch-all one.[/*]\n<br />[*]Sleeping daemonhosts are never targeted, period. The mod refuses to wake one up for you.[/*]\n<br />[/list]\n<br />On top of the priorities, the skull is loyal to its current target: a \"target hold time\" setting decides how many seconds it stays on the current enemy before it may switch to a higher-priority one that just appeared. If the target dies or leaves range, switching is instant.\n<br />\n<br />The skull's engagement envelope is its own: max distance (damage falls off heavily past 15 m), an attack cone from a 30-degree beam to full 360 (the cone only filters NEW targets — an enemy the skull is already fighting is never dropped for leaving it), and its re-order cadence.\n<br />\n<br />[b]It refuses to waste shots.[/b] Line of sight is always required for automatic skull orders — no charge is ever burned on a target behind a wall. The force-field and smoke guards still exist but are now OFF by default: the game has fixed the skull refusing to shoot through smoke and allied force fields, so the checks are kept only as a fallback should a future patch break that fix (existing profiles are switched off once automatically). Honest about what never blocked anything: pox gas, toxic clouds and fire pools do not stop the skull's shots, so the mod deliberately does not gate on them.\n<br />\n<br />[size=6][b]The cyber-mastiff: same brain, different animal[/b][/size]\n<br />\n<br />For the Adeptus Arbites, the mod commands the cyber-mastiff through exactly the same double-tag as the servo-skull, and everything in the common section applies to the dog as well. It also has an on/off switch of its own — as does the skull — so a player of both classes can automate one companion and drive the other by hand. Three skull rules do NOT carry over: Arbites orders are free, so the charge gate never applies; force field and smoke checks never apply, because the dog runs around obstacles instead of shooting through them; and the dog cannot revive anyone.\n<br />\n<br />The difference is the animal. The dog is a melee pouncer, not a gun: enemies it can pin to the ground — all human-sized shooters and specials — it shreds. Hounds, mutants and ogryn-sized foes it can only kick once, leap away from, wait 1.5 seconds and approach again. That is why the mastiff has its own complete threat table, independent of the skull's:\n<br />\n<br />[list]\n<br />[*][b]Trappers — its signature kill.[/b] A pin both silences and shreds them; bite it down before the net flies. The far-range slider defaults higher than the skull's (60): hunting trappers down before they ever reach net range — door camping included — is what the mastiff does best.[/*]\n<br />[*][b]Snipers, bombers, flamers, shotgunners, gunners, plasma, human-sized elites, specials[/b] — each with its own priority slider; trappers, flamers, shotgunners and elites also get close/far threat distances, and snipers and bombers get their hunt distances. All pinnable, all prime dog food.[/*]\n<br />[*][b]Hounds — default 0 (never).[/b] The mastiff cannot pin a hound: kick, leap away, repeat — easily 40–60 seconds of theatre per hound while real threats shoot at you, and an order at a hound mid-leap whiffs outright. The one exception is built in: a hound actually ON a teammate is a rescue target and gets attacked regardless of this slider.[/*]\n<br />[*][b]Mutants — default 0 (never).[/b] One kick per re-approach, scraps of damage. A mutant actually carrying a teammate is a rescue target regardless of the slider — the kick's heavy stagger knocks the grab loose.[/*]\n<br />[*][b]Reapers — default 0 (never).[/b] The dog can only scratch an ogryn; it will \"fight\" one Reaper for minutes. The kicks do keep interrupting its shooting, so if you value the stunlock, raise this consciously.[/*]\n<br />[*][b]Ogryn elites (Crusher / Bulwark) — default 0 (never).[/b] Same story. Human-sized elites (Ragers, Maulers) are pinned and shredded and use their own sliders.[/*]\n<br />[*][b]Houndmaster — default 0, and leave it there.[/b] Against the Houndmaster the pounce deals ZERO damage — the dog is simply shoved off, and the boss even gains 10 seconds of stagger immunity from it. A strictly wasted order.[/*]\n<br />[*][b]Bosses / captains — default 30.[/b] On a Plague Ogryn, Chaos Spawn or Beast of Nurgle the mastiff latches on for about 1.5 seconds of monster-grade bites — decent. Captains and the Twins it only kicks once and bounces off.[/*]\n<br />[*][b]Poxbursters[/b] — the dog's own forbidden radius and never-switch (these only come into play if you turn off \"targets the game keeps it away from\" below, which excludes bursters entirely). A detail worth knowing: the dog's kick on a burster deals zero damage — a safe knockback that cannot detonate it.[/*]\n<br />[*][b]Execution Order marks (default 90).[/b] With the Arbites keystone, enemies carrying its kill mark outrank the breed tables — including breeds the dog normally ignores. Killing a mark procs the whole keystone package, and the mastiff's pounce on a mark has its own bonus on top. Inert without the keystone; rescue and Daemonhost protection still outrank marks.[/*]\n<br />[/list]\n<br />In the dog's table, 0 genuinely means never — a zeroed category cannot sneak back in through a generic fallback. And when two threats tie on priority, the dog picks the one closest to itself, not to you: it is the one doing the running, and after it finishes a far target it eats the pack standing next to it instead of trotting back to an identical enemy at your feet.\n<br />\n<br />The dog also gets its own engagement envelope, because a runner is not a floater: its own leash (default 25 m keeps it a bodyguard; up to 100 m makes it a hunter), its own wider view cone (180 degrees by default — flanks matter), and its own re-order cadence and hold time. Re-orders are polite: while the dog is already ON its target — pinning it or biting point-blank — the mod stops re-tagging entirely (no marker and voice-line spam for the lobby), with one quiet refresh before the game's 25-second order tag would lapse.\n<br />\n<br />[size=6][b]Rescues and licensed hunts[/b][/size]\n<br />\n<br />For automatic picks, three things — and only three — may reach beyond the dog's leash: rescues, snipers and bombers. (Your own orders and the aim-switch override are your business and ignore the leash entirely.)\n<br />\n<br />[list]\n<br />[*][b]Rescuing held teammates (on by default).[/b] The moment ANY enemy is holding an ally — a hound on top of them, a mutant carrying them, a trapper whose net landed, a Chaos Spawn or Beast of Nurgle eating them — that exact enemy becomes the dog's top-priority target, bypassing the view cone, the hold timer and even the pause after your manual order. Knock it off, kill it, back to eating rangers. This is precisely the one moment hounds and mutants ARE worth the mastiff's time, which is why their own sliders can stay at 0. The rescue priority defaults to 100 and wins any tie, and rescues are allowed up to their own distance (default 40 m) even beyond the leash, because a mutant carries its victim away fast. Daemonhosts are never a rescue target unless you opt into fighting awakened ones.[/*]\n<br />[*][b]Sniper hunt (default 40 m).[/b] Snipers are worth a run: the mastiff shreds them before they even step out of their doorway, and from a good position it can leap absurd distances. The view cone still applies.[/*]\n<br />[*][b]Bomber hunt (default 80 m).[/b] A bomber is a target regardless of where it sits — behind doors, in that hole nobody can jump into — because its grenades arrive anywhere and the mastiff is the one party member who can go eat it. Bombers ignore the view cone entirely.[/*]\n<br />[/list]\n<br />[size=6][b]It refuses to waste runs[/b][/size]\n<br />\n<br />The same philosophy as the skull's shot checks, translated into dog:\n<br />\n<br />[list]\n<br />[*][b]Camera line of sight (on by default).[/b] Ordinary enemies are only auto-ordered when you can actually see them: no more sending the dog three corners deep after a shooter you physically cannot see yet. The professional hunts stay: snipers, trappers and bombers may skip line of sight (a separate toggle — turn it off if marks through walls and floors bother you or look suspicious to teammates), and rescue targets and Execution Order marks are always exempt.[/*]\n<br />[*][b]Drop the unseen current target (on by default).[/b] A target that ran a floor below or two corners deep is released after about 2.5 seconds out of sight, and the next order goes to something you can actually see. Fresh orders get a travel grace; pins, rescues, Execution Order marks and (while their exemption is on) the hunt specials are never dropped.[/*]\n<br />[*][b]Navmesh reachability (on by default).[/b] Before ordering, the target's position is checked against the navigation mesh with the exact probe the dog's own movement uses. The server never refuses an unreachable order — the dog would just park until the order expires. This skips enemies perched where the dog genuinely cannot stand.[/*]\n<br />[*][b]Targets the game keeps it away from (on by default).[/b] The game's own mastiff targeting deliberately ignores a few breeds — Poxbursters, gunships, hazards. A whistle order bypasses that filter, so the mod re-applies it.[/*]\n<br />[*][b]Pins are sacred (on by default).[/b] While YOUR mastiff has an enemy pinned, the mod will not re-order it onto a merely higher-priority target — a pin holds until the victim dies, and a re-order would release it; among the automatic behaviors, only a teammate rescue or the bleed hand-off may end it early (your own orders and the aim switch remain your business). Enemies already pinned by ANOTHER player's mastiff are skipped entirely: only one dog can pin a given enemy.[/*]\n<br />[*][b]Bleed hand-off (on by default).[/b] With a bleed source (the Arbites dog-bleed talent, your weapon blessings), a victim at or below a health threshold with enough bleed stacks will die on its own — the dog is released for the next target instead of watching it expire. Bosses and captains are never judged \"doomed\", and the dying victim is excluded from the re-pick.[/*]\n<br />[/list]\n<br />[size=6][b]Your orders are law[/b][/size]\n<br />\n<br />[list]\n<br />[*][b]The attack order key.[/b] One press orders your companion — skull or mastiff — at the enemy under your crosshair, with all manual-order guards applied. Works with auto-attack on or off. Built in so this mod does not need Skitarii UI Fix's order key: theirs is Skitarii-only, this one also drives the mastiff — and if you run both bound to the same key, this mod automatically yields the skull order to Skitarii UI Fix, so a single press never fires twice.[/*]\n<br />[*][b]Manual target lock (on by default).[/b] When YOU order the mastiff at an enemy — double-tag or the order key — that enemy stays the dog's target until it is dead. The priority table, the aim switch and the bleed hand-off all wait. A new manual order replaces the lock, and double-pressing the order key at empty space releases it (a single missed press does nothing). Three exceptions act on their own: a teammate rescue borrows the dog (the lock resumes if the enemy is still alive), a target pinned by another player's mastiff is dropped, and the Daemonhost guard still applies. Poxbursters are never locked.[/*]\n<br />[*][b]Close-combat mode key.[/b] For tense fights: while active, the mastiff's leash AND the sniper/bomber hunt distances all clamp to a short radius (default 10 m) and the view cone opens to 360 degrees — the dog brawls around you instead of leaving on hunts. Teammate rescue keeps its full reach. Resets to off at the start of each mission.[/*]\n<br />[*][b]The classic pause[/b]: any manual order silences the automation for a configurable few seconds, and optional guards can downgrade your own risky double-taps (busy skull, force field, smoke, a Poxburster inside your safety radius) to a harmless ping, with a chat message explaining why.[/*]\n<br />[/list]\n<br />[size=6][b]Auto-Detonation on bosses (opt-in)[/b][/size]\n<br />\n<br />Off by default, because detonation charges are precious (2 charges, 50 seconds each). If you run the Detonation blitz and turn this on, the mod presses it automatically at the exact moment the mastiff is physically ON a boss — latched onto a Plague Ogryn, Chaos Spawn or Beast of Nurgle, or biting point-blank. The blast is centred on the dog, so that window is where it hurts most. It works whether the dog got there by auto-attack or by your manual order — and it is not blind:\n<br />\n<br />[list]\n<br />[*]Never on Daemonhosts.[/*]\n<br />[*]It respects a charge reserve (default: keep 1 — one charge always stays yours for a manual moment; 0 lets the mod spend everything).[/*]\n<br />[*]It never fires while you are holding the blitz key yourself, and it has a 3-second internal cooldown.[/*]\n<br />[*]A local chat message announces every auto-detonation, so a sudden bang is never a mystery.[/*]\n<br />[*]A separate toggle (off by default) extends it to captains and the Twins — off because the dog cannot latch onto them: the on-target window is a fraction of a second and a void shield cuts the blast further.[/*]\n<br />[/list]\n<br />[size=6][b]Charge gate: automation that respects your resources[/b][/size]\n<br />\n<br />If you run the improved tagging talent, attack orders interact with your combat ability reserve. The mod lets you draw a hard line the automation may never cross: whole charges plus a fine-grained percent, and while your reserve is below that line the auto-attack simply pauses. Your emergency charges stay yours. The reserve goes up to five whole charges for extra-charge builds, and picking more charges than your talents grant is harmless — the threshold clamps to your live maximum. An opt-in disabler override bypasses the gate while a trapper is inside net range or a hound inside leap range: an automatic mini panic mode for exactly the enemies that end runs.\n<br />\n<br />None of this applies to the Arbites: mastiff orders are free. And for everything else there is the panic key — press it and the skull attacks flat out, ignoring the reserve entirely, either until pressed again or for a set number of seconds. Chat tells you when panic turns on and off.\n<br />\n<br />[size=6][b]Daemonhost protection[/b][/size]\n<br />\n<br />A dedicated group, separate from the boss/captain priority, covering all three paths an order can take: the priority table, the aim-switch override, and your own double-tap.\n<br />\n<br />[list]\n<br />[*][b]Never auto-order onto a Daemonhost (on by default).[/b] Daemonhosts are excluded from every automatic order path, including the aim-switch that otherwise ignores the whole table.[/*]\n<br />[*][b]Attack an AWAKENED Daemonhost (new, default 0 = never).[/b] Set the slider above 0 and a Daemonhost that is already awake — somebody triggered it anyway — becomes a regular target with that priority, for BOTH companions, and the aim-switch works on it too. A sleeping Daemonhost is still never targeted, and the check fails safe: any unreadable state counts as sleeping. A Daemonhost holding a teammate then also counts as a rescue target for the mastiff. Note the mastiff cannot pin a Daemonhost — one bite and it bounces off — so this slider mostly matters for the skull.[/*]\n<br />[*][b]Block manual orders (on by default).[/b] Your own double-tap on a Daemonhost becomes a regular ping. This is the one order that cannot be taken back.[/*]\n<br />[*][b]Keep the companion busy (on by default)[/b] — the actual fix for \"someone woke the Daemonhost and my skull started shooting it\". An ordered target pins the companion; the game's own target selection only gets a say while the companion has NO order. So while a Daemonhost is inside the watch radius and nothing in your priority table qualifies, the mod orders the companion onto the nearest ordinary alerted enemy — never a Daemonhost, never a Poxburster — purely to keep that window shut.[/*]\n<br />[*][b]The fine print is adjustable:[/b] the watch radius, reacting to sleeping Daemonhosts too (for sneaking past), a full-stop mode that silences automation entirely near one, a separate re-order interval for the keep-busy orders, an optional charge-gate override for them, and a chat message when the protection engages.[/*]\n<br />[/list]\n<br />[size=6][b]Medicae skull helpers[/b][/size]\n<br />\n<br />Rescuing teammates with the heal order becomes painless:\n<br />\n<br />[list]\n<br />[*]Downed allies get a bright green outline, visible through walls. It works for the Arbites too — the mastiff cannot revive anyone, but knowing who is down is still useful. Allies the heal order is not allowed to reach are not outlined, so the highlight never promises a revive the mod will refuse.[/*]\n<br />[*]While you hold the blitz, your view gently turns toward the nearest ally who needs help, at a speed you choose, and only within an aim-snap cone you set — so a closer ally behind you never spins your camera around.[/*]\n<br />[*]Auto-launch: the moment your aim locks onto a valid ally, the skull flies out by itself. One launch per key press, so you always stay in control.[/*]\n<br />[*]No wasted skulls: while the first skull is busy reviving, the mod refuses to even start aiming a second order.[/*]\n<br />[*]Per-class revive priorities: when several allies are down, the heal order picks the class with the highest priority and uses distance only to break ties. All sliders start at 50, which reproduces the classic behaviour exactly.[/*]\n<br />[*]Bot handling: \"Revive bots only when no player is down\" (on by default), plus a hard \"Never revive bots\" switch. If a preferred ally cannot be locked on at all, the order un-stalls after about 1.5 seconds and moves on.[/*]\n<br />[/list]\n<br />[size=6][b]Everything is a setting[/b][/size]\n<br />\n<br />There is no hidden behavior in this mod: over 120 toggles, sliders and keybinds across nine collapsible sections — per-companion switches under a master toggle, two full threat tables, every distance and every guard, four keybinds (auto-attack toggle, attack order, close-combat mode, panic), chat notices for everything the mod blocks or fires, and a debug mode that narrates every decision in chat. Turn everything off and the mod does nothing at all. Turn on only the outline and it is a tiny UI helper. Turn on everything and your companion becomes the most disciplined teammate you have ever had.\n<br />\n<br />[size=6][b]Fair play[/b][/size]\n<br />\n<br />The mod does not change damage, cooldowns, abilities or enemy behavior. It sends the same companion orders a player sends with the tag key, at a human-like rate, only to targets you could see and mark yourself — plus one optional press of your own Detonation blitz. Everything it reads — enemy positions, who is holding which ally, which enemy is pinned or marked — is information the game already replicates to your client for its own HUD and gameplay. It is client side only, teammates do not need it.\n<br />\n<br />[size=6][b]Requirements[/b][/size]\n<br />\n<br />[list]\n<br />[*]Darktide Mod Framework and Darktide Mod Loader[/*]\n<br />[*]A character of the Skitarii class (servo-skull) or the Adeptus Arbites class (cyber-mastiff)[/*]\n<br />[/list]\n<br />\n<br />[b]Ваш сервочереп наконец отрабатывает своё. А ваш кибермастиф наконец охотится на тех, кого реально может убить.[/b]\n<br />\n<br />Servo-Skull &amp; Hound Commander (бывший Servo-Skull Commander) — QoL-мод для классов Скитарий и Адептус Арбитрес. Он превращает компаньона в деятельного боевого напарника: сервочереп Скитария сам выбирает опасных врагов в вашем поле зрения и стреляет по ним, а кибермастиф Арбитра отправляется ровно за теми целями, которых пёс умеет убивать, — а вы держите руки на оружии, вместо того чтобы каждые несколько секунд ставить метки.\n<br />\n<br />Всё, что делает мод, вы могли бы сделать и сами клавишей метки. Он просто делает это за вас, в нужный момент и с более умным выбором цели.\n<br />\n<br />[size=6][b]🆕 Новое в этой версии[/b][/size]\n<br />\n<br />[list]\n<br />[*][b]Командование кибермастифом[/b] — вся автоматика теперь работает и для мастифа Арбитра: те же приказы двойной меткой, своя вкладка настроек. Приказы Арбитра бесплатны (не тратят заряды), так что гейт зарядов ему не нужен — пёс просто охотится.[/*]\n<br />[*][b]Два компаньона, две вкладки, две таблицы приоритетов[/b] — настройки реорганизованы в секции по компаньонам, и у черепа с мастифом полностью независимые таблицы угроз. Настраивайте один класс, не трогая другой.[/*]\n<br />[*][b]Таблица угроз, понимающая пса[/b] — человекоразмерных стрелков и специалистов мастиф прижимает к земле и рвёт, а собак, мутантов, элиту огрин-размера и Псаря может лишь раз пнуть, отпрыгнуть и заходить заново. Они по умолчанию на нуле: больше никаких минут цирка против целей, которых псу не убить.[/*]\n<br />[*][b]Спасение союзников[/b] — как только ЛЮБОЙ враг держит союзника (собака сверху, мутант несёт, сеть траппера, порождение Хаоса, зверь Нургла), именно этот враг становится целью пса с высшим приоритетом. Игра спасает так только хозяина пса; мод распространяет это на всю команду.[/*]\n<br />[*][b]Фиксация ручной цели[/b] — враг, на которого пса послали ВЫ, остаётся его целью, пока не умрёт. Больше никаких переключений на цель «получше» на полпути.[/*]\n<br />[*][b]Клавиша приказа одним нажатием[/b] — приказывает компаньону атаковать врага под прицелом, для обоих классов, со всеми защитами мода. Без двойной метки и без нужды в Skitarii UI Fix рядом.[/*]\n<br />[*][b]Поддержка Execution Order[/b] — враги с меткой кейстоуна Арбитра получают свой высокий приоритет: пёс фармит проки кейстоуна за вас.[/*]\n<br />[*][b]Клавиша режима ближнего боя[/b] — одно нажатие зажимает поводок пса до короткого радиуса с обзором 360° для жарких свалок; повторное — отпускает обратно на охоту.[/*]\n<br />[*][b]Передача кровотечению[/b] — жертву, которая и так истечёт кровью, пёс бросает заранее и идёт к следующей цели, а не смотрит, как она умирает.[/*]\n<br />[*][b]Атака разбуженного демонхоста (опционально)[/b] — новый ползунок разрешает компаньону вступить в бой, когда демонхост уже разбужен. Спящие — неприкосновенны всегда.[/*]\n<br />[*][b]Авто-подрыв на боссах (опционально)[/b] — с блицем «Подрыв» мод может нажать его ровно в момент, когда мастиф физически на боссе, и всегда бережёт вам запасной заряд.[/*]\n<br />[*][b]Проверки дыма и силовых полей теперь ВЫКЛ по умолчанию[/b] — игра починила отказ черепа стрелять сквозь дым и союзные поля. Старые профили переключаются автоматически один раз; настройки остаются на случай, если патч снова всё сломает.[/*]\n<br />[/list]\n<br />[size=6][b]⚠️ Обновление с Servo-Skull Commander[/b][/size]\n<br />\n<br />Мод переименован, а имя папки важно для лоадера:\n<br />\n<br />[list=1]\n<br />[*]Полностью удалите старую папку mods/ServoSkullCommander.[/*]\n<br />[*]Установите эту версию так, чтобы она лежала в mods/ServoSkullHoundCommander.[/*]\n<br />[*]В mod_load_order.txt замените строку ServoSkullCommander на ServoSkullHoundCommander.[/*]\n<br />[/list]\n<br />Оставшаяся старая папка или несвежая строка в load order означают, что игра грузит старую версию без пса — или вообще ничего.\n<br />\n<br />Сохранённые настройки переносятся автоматически: при первом запуске мод копирует весь ваш старый профиль Servo-Skull Commander в новый (сообщение в чате это подтвердит). Перенесённые значения продолжают управлять сервочерепом как раньше; мастиф стартует с новых, пёсьих дефолтов — одноразовое сообщение при первом запуске напомнит заглянуть в его вкладку.\n<br />\n<br />[size=6][b]Как организованы настройки[/b][/size]\n<br />\n<br />Девять сворачиваемых секций, читаются как вкладки: [b]Авто-атака — общее[/b] (что действует на обоих), [b]Сервочереп[/b] (его конверт, его проверки выстрела, его полная таблица угроз), [b]Кибермастиф[/b] (всё пёсье), дальше защита от демонхостов, гейт зарядов, паник-режим, ручные приказы и две группы Медикэ. У свежей установки все секции свёрнуты — страница настроек открывается коротким списком, а не стеной ползунков.\n<br />\n<br />В общей секции: главный тумблер авто-атаки и его клавиша, клавиша приказа одним нажатием, оверрайд по прицелу (враг под прицелом мгновенно становится целью компаньона, минуя всю таблицу), фильтр непотревоженных (не начинать бой, мимо которого вы крались), защита союзников от взрывунов, тумблер тренировочных зон и режим отладки, проговаривающий каждое решение в чат.\n<br />\n<br />[size=6][b]Сервочереп: персональный приоритет каждому типу врага[/b][/size]\n<br />\n<br />Сердце вкладки черепа — таблица угроз, которую вы настраиваете под свой стиль. У каждой категории врагов свой ползунок приоритета от 0 до 100, где 100 — «убивать первым». Когда врагов несколько, череп атакует самого приоритетного, а при равенстве — ближайшего. Ноль означает «никогда» для собак, трапперов, мутантов, снайперов, бомберов, взрывунов и боссов; обнулённые пулемётчики, шотганнеры, плазма, Жнецы и огнемётчики вместо этого падают в общие ползунки элиты / прочих специалистов (историческое поведение черепной таблицы — обнулите и их, если нужна полная тишина; в таблице мастифа таких фолбэков нет).\n<br />\n<br />Категории — не плоские списки, они понимают контекст:\n<br />\n<br />[list]\n<br />[*]Собаки, трапперы и огнемётчики — три полностью независимые категории, у каждой свой ползунок приоритета И своя дистанция угрозы. Можно сказать черепу, что траппер смертелен, как только его сеть достаёт до вас, что собака важна только на дистанции прыжка, а огнемётчик заслуживает внимания ровно на той дальности, которой вы боитесь. Вне своей дистанции собаки и трапперы получают отдельные «дальние» ползунки, а дальний огнемётчик считается обычным специалистом.[/*]\n<br />[*]У мутантов свой независимый ползунок. Поставьте 0 — и череп их не тронет, без фолбэков и исключений.[/*]\n<br />[*]Шотганнеры оцениваются по своей эффективной дистанции: внутри неё — высокий приоритет, дальше — как обычные пулемётчики. Дистанция настраивается.[/*]\n<br />[*]Пулемётчики, огрины-Жнецы и плазмоганы — по отдельному ползунку: плазма больнее стаббера, и мод это знает.[/*]\n<br />[*]Снайперы и бомберы освобождены от вашего лимита дистанции (до встроенного потолка ~90 м для новых целей), и у каждого свой ползунок приоритета.[/*]\n<br />[*]У элиты два ползунка: рядом и далеко. По умолчанию дальняя элита игнорируется — череп не тратит время на крашера через всю карту.[/*]\n<br />[*]У взрывунов запретный радиус вокруг вас: внутри него череп никогда не выстрелит по взрывуну. Дальше радиуса у них свой приоритет, а отдельный жёсткий выключатель может запретить их совсем.[/*]\n<br />[*]Запретный радиус защищает и союзников (вкл. по умолчанию): пока ЛЮБОЙ живой союзник внутри, взрывун вне списка целей — а если череп уже стреляет по взрывуну и кто-то вошёл в радиус, мод мгновенно переключает его на лучшую другую цель.[/*]\n<br />[*]У боссов и капитанов свой ползунок, у прочих специалистов — общий.[/*]\n<br />[*]Спящие демонхосты не атакуются никогда, точка. Мод отказывается будить их за вас.[/*]\n<br />[/list]\n<br />Поверх приоритетов череп верен текущей цели: «время удержания» решает, сколько секунд он держится за неё, прежде чем ему можно переключиться на более приоритетную. На мёртвую или ушедшую цель переключение мгновенно.\n<br />\n<br />Конверт вовлечения у черепа свой: макс. дистанция (урон сильно падает после 15 м), конус атаки от узкого луча в 30° до полных 360° (конус фильтрует только НОВЫЕ цели — уже атакуемый враг не бросается), и частота переприказов.\n<br />\n<br />[b]Он отказывается тратить выстрелы.[/b] Прямая видимость для авто-приказов черепа обязательна всегда — ни один заряд не сгорит по цели за стеной. Проверки силовых полей и дыма остались, но теперь ВЫКЛ по умолчанию: игра починила отказ черепа стрелять сквозь дым и союзные поля, так что проверки хранятся как страховка на случай нового бага (старые профили переключаются автоматически один раз). Честно о том, что и не мешало никогда: pox-газ, токсичные облака и лужи огня выстрелов не блокируют, и мод сознательно на них не смотрит.\n<br />\n<br />[size=6][b]Кибермастиф: тот же мозг, другой зверь[/b][/size]\n<br />\n<br />Мастифом Арбитра мод командует ровно той же двойной меткой, что и черепом, и вся общая секция действует на пса. У него есть и собственный выключатель — как и у черепа — так что игрок за оба класса может автоматизировать одного компаньона и управлять другим вручную. Три правила черепа на пса НЕ переносятся: приказы Арбитра бесплатны, поэтому гейт зарядов не применяется; проверки поля и дыма не применяются никогда — пёс оббегает препятствия, а не стреляет сквозь них; и воскрешать он не умеет.\n<br />\n<br />Разница — в звере. Пёс — это прыжок и клыки, а не ствол: врагов, которых он может прижать к земле — всех человекоразмерных стрелков и специалистов — он рвёт на части. Собак, мутантов и огрин-размерных он может лишь раз пнуть, отпрыгнуть, подождать 1.5 секунды и зайти снова. Поэтому у мастифа своя полная таблица угроз, независимая от черепной:\n<br />\n<br />[list]\n<br />[*][b]Трапперы — его фирменное блюдо.[/b] Прижим и затыкает, и рвёт; загрызть, пока трап не прилетел. «Дальний» ползунок по умолчанию выше черепного (60): выцеплять трапперов до того, как они выйдут на дистанцию сети — включая караул у дверей, — то, что мастиф умеет лучше всего.[/*]\n<br />[*][b]Снайперы, бомберы, огнемётчики, шотганнеры, пулемётчики, плазма, человекоразмерная элита, специалисты[/b] — у каждого свой ползунок приоритета; у трапперов, огнемётчиков, шотганнеров и элиты вдобавок дистанции угрозы «ближе/дальше», у снайперов и бомберов — дистанции охоты. Все прижимаемы, все — отличный корм.[/*]\n<br />[*][b]Собаки — по умолчанию 0 (никогда).[/b] Прижать собаку мастиф не может: пнул, отпрыгнул, повторил — легко 40–60 секунд цирка на одну собаку, пока настоящие угрозы стреляют по вам, а приказ по собаке в прыжке вообще уходит в молоко. Исключение встроено: собака, сидящая НА союзнике, — цель спасения независимо от ползунка.[/*]\n<br />[*][b]Мутанты — по умолчанию 0 (никогда).[/b] Один пинок за заход, крохи урона. Мутант, несущий союзника, — цель спасения независимо от ползунка: тяжёлый стаггер пинка выбивает захват.[/*]\n<br />[*][b]Жнецы — по умолчанию 0 (никогда).[/b] Огрина пёс может только царапать; одного Жнеца он «грызёт» минутами. Пинки правда не дают ему стрелять — цените станлок, поднимайте осознанно.[/*]\n<br />[*][b]Элита-огрины (Крашер / Булварк) — по умолчанию 0 (никогда).[/b] Та же история. Человекоразмерную элиту (буйные, маулеры) пёс прижимает и рвёт — у неё свои ползунки.[/*]\n<br />[*][b]Псарь — по умолчанию 0, и оставьте так.[/b] По Псарю прыжок наносит НОЛЬ урона — пса просто отшвыривает, а босс ещё и получает 10 секунд иммунитета к стаггеру. Приказ впустую в чистом виде.[/*]\n<br />[*][b]Боссы / капитаны — по умолчанию 30.[/b] На чумном огрине, порождении Хаоса и звере Нургла мастиф повисает на ~1.5 секунды монстро-укусов — прилично. Капитанов и близнецов лишь раз пинает и отлетает.[/*]\n<br />[*][b]Взрывуны[/b] — свой запретный радиус и свой жёсткий выключатель (они вступают в игру, только если выключить «цели, от которых пса держит игра» ниже — тот фильтр исключает взрывунов целиком). Полезная деталь: пинок пса по взрывуну наносит ноль урона — безопасный отброс, подорвать им нельзя.[/*]\n<br />[*][b]Метки Execution Order (по умолчанию 90).[/b] С кейстоуном Арбитра враги с его меткой убийства стоят выше таблиц пород — включая тех, кого пёс обычно игнорирует. Убийство метки запускает весь пакет кейстоуна, а прыжок пса по метке имеет ещё и свой бонус. Без кейстоуна опция бездействует; спасение и защита от демонхостов всё равно важнее.[/*]\n<br />[/list]\n<br />В таблице пса 0 действительно значит «никогда» — обнулённая категория не пролезет обратно через общий фолбэк. А при равном приоритете пёс выбирает цель, ближайшую к СЕБЕ, а не к вам: бегает-то он — доел дальнюю цель и съедает стоящую рядом пачку, вместо того чтобы трусить назад к такому же врагу у ваших ног.\n<br />\n<br />Конверт вовлечения у пса тоже свой, потому что бегун — не летун: свой поводок (дефолт 25 м — телохранитель; до 100 м — охотник), свой более широкий конус (180° — фланги важны), свои частота переприказов и время удержания. Переприказы вежливы: пока пёс уже НА цели — прижимает или грызёт вплотную — мод вообще перестаёт переставить метку (без спама маркером и репликой свистка на всё лобби), с одним тихим обновлением до истечения игрового 25-секундного тега приказа.\n<br />\n<br />[size=6][b]Спасения и лицензированная охота[/b][/size]\n<br />\n<br />Из автоматических целей за пределы поводка пса могут выходить только три вещи: спасения, снайперы и бомберы. (Ваши собственные приказы и прицел-оверрайд — ваше дело, поводок они игнорируют.)\n<br />\n<br />[list]\n<br />[*][b]Спасение схваченных союзников (вкл. по умолчанию).[/b] Как только ЛЮБОЙ враг держит союзника — собака сверху, мутант несёт, сеть траппера накрыла, порождение или зверь Нургла жрёт — именно этот враг становится целью пса с высшим приоритетом, в обход конуса, таймера удержания и даже паузы после вашего ручного приказа. Сбить, загрызть, вернуться жрать стрелков. Это ровно тот единственный момент, когда собаки и мутанты СТОЯТ времени мастифа — потому их ползунки и могут оставаться на нуле. Приоритет спасения по умолчанию 100 и выигрывает любую ничью, а дистанция спасения (дефолт 40 м) действует даже за пределами поводка — мутант утаскивает жертву быстро. Демонхост целью спасения не бывает, если только вы не включили атаку разбуженных.[/*]\n<br />[*][b]Охота на снайперов (дефолт 40 м).[/b] Снайперы стоят пробежки: мастиф рвёт их до того, как они выйдут из своей двери, а с удачной позиции прыгает на неприличные дистанции. Конус обзора действует.[/*]\n<br />[*][b]Охота на бомберов (дефолт 80 м).[/b] Бомбер — цель независимо от того, где засел: за дверьми, вооон в той дырке, куда никому не допрыгнуть — его гранаты прилетают отовсюду, а мастиф единственный в отряде, кто может сбегать его сожрать. Бомберы полностью игнорируют конус обзора.[/*]\n<br />[/list]\n<br />[size=6][b]Он отказывается тратить пробежки[/b][/size]\n<br />\n<br />Та же философия, что у проверок выстрела черепа, в переводе на пёсий:\n<br />\n<br />[list]\n<br />[*][b]Прямая видимость с камеры (вкл. по умолчанию).[/b] Обычные враги авто-приказываются, только когда вы их реально видите: больше никаких отправок пса за три поворота по стрелку, которого вы физически ещё не видите. Профессиональная охота остаётся: снайперы, трапперы и бомберы могут без прямой видимости (отдельный чекбокс — выключите, если метки сквозь стены и полы вас смущают или выглядят подозрительно для сокомандников), а цели спасения и метки Execution Order — исключение всегда.[/*]\n<br />[*][b]Бросать невидимую текущую цель (вкл. по умолчанию).[/b] Цель, убежавшую этажом ниже или за два поворота, пёс отпускает примерно через 2.5 секунды вне видимости, и следующий приказ идёт по тому, кого вы видите. У свежих приказов есть грейс на дорогу; прижатые, спасаемые, метки Execution Order и (при включённом исключении) спецы охоты не бросаются никогда.[/*]\n<br />[*][b]Достижимость по навмешу (вкл. по умолчанию).[/b] Перед приказом позиция цели проверяется по навигационной сетке тем же зондом, каким ходит сам пёс. Сервер не отклоняет приказ по недостижимой цели — пёс просто стоял бы, пока приказ не истечёт. Проверка пропускает врагов в местах, где псу физически не встать.[/*]\n<br />[*][b]Цели, от которых пса держит игра (вкл. по умолчанию).[/b] Собственный выбор целей мастифа игнорирует несколько типов — взрывунов, ганшипы, хазарды. Приказ свистком этот фильтр обходит, мод возвращает его на место.[/*]\n<br />[*][b]Прижим священен (вкл. по умолчанию).[/b] Пока ВАШ мастиф прижимает врага, мод не переприкажет его на просто более приоритетную цель — прижим держится до смерти жертвы, а переприказ его снимает; из автоматики сорвать пса могут только спасение союзника или передача кровотечению (ваши собственные приказы и прицел-оверрайд — ваше дело). Враги, прижатые ЧУЖИМ мастифом, пропускаются целиком: прижать врага может только один пёс.[/*]\n<br />[*][b]Передача кровотечению (вкл. по умолчанию).[/b] С источником кровотечения (пёсий талант Арбитра, ваши благословения оружия) жертва на пороге ХП с достаточными стаками умрёт сама — пёс освобождается под следующую цель, а не смотрит, как она истекает. Боссы и капитаны «обречёнными» не считаются никогда, а умирающая жертва исключается из перевыбора.[/*]\n<br />[/list]\n<br />[size=6][b]Ваши приказы — закон[/b][/size]\n<br />\n<br />[list]\n<br />[*][b]Клавиша приказа атаки.[/b] Одно нажатие приказывает компаньону — черепу или мастифу — атаковать врага под прицелом, со всеми защитами ручного приказа. Работает при включённой и выключенной авто-атаке. Встроена, чтобы рядом с модом не требовалась кнопка из Skitarii UI Fix: та работает только у Скитария, эта командует и мастифом — а если оба мода назначены на одну клавишу, этот мод автоматически уступает приказ черепа Skitarii UI Fix, и одно нажатие никогда не срабатывает дважды.[/*]\n<br />[*][b]Фиксация ручной цели (вкл. по умолчанию).[/b] Когда ВЫ приказываете мастифу — двойной меткой или клавишей приказа — этот враг остаётся его целью, пока не умрёт. Таблица приоритетов, прицел-оверрайд и передача кровотечению ждут. Новый ручной приказ заменяет фиксацию, а двойное нажатие клавиши приказа в пустоту снимает её (одиночный промах не делает ничего). Три исключения работают сами: спасение союзника одалживает пса (фиксация возобновится, если враг жив), цель, прижатую чужим мастифом, пёс бросает, и защита от демонхостов продолжает действовать. Взрывуны не фиксируются никогда.[/*]\n<br />[*][b]Клавиша режима ближнего боя.[/b] Для жарких свалок: пока активен, поводок пса И дистанции охоты на снайперов/бомберов зажимаются до короткого радиуса (дефолт 10 м), а конус раскрывается до 360° — пёс дерётся вокруг вас, а не убегает на охоту. Спасение союзников сохраняет полную дальность. В начале каждой миссии режим выключен.[/*]\n<br />[*][b]Классическая пауза[/b]: любой ручной приказ замолкает автоматику на настраиваемые секунды, а опциональные защиты понижают ваши же рискованные двойные метки (занятый череп, поле, дым, взрывун в радиусе безопасности) до безобидной метки — с сообщением в чате, почему.[/*]\n<br />[/list]\n<br />[size=6][b]Авто-подрыв на боссах (опционально)[/b][/size]\n<br />\n<br />По умолчанию выкл., потому что заряды подрыва дороги (2 заряда по 50 секунд). Если у вас блиц «Подрыв» и вы включили опцию, мод нажимает его сам ровно в момент, когда мастиф физически НА боссе — повис на чумном огрине, порождении Хаоса или звере Нургла, либо грызёт вплотную. Взрыв центрируется на псе, и это окно — где он больнее всего. Работает и после авто-приказа, и после вашего ручного — и не бездумно:\n<br />\n<br />[list]\n<br />[*]Никогда по демонхостам.[/*]\n<br />[*]Уважает резерв зарядов (дефолт: беречь 1 — один заряд всегда ваш для ручного момента; 0 разрешает моду тратить всё).[/*]\n<br />[*]Не срабатывает, пока вы сами держите клавишу блица, и имеет внутренний кулдаун 3 секунды.[/*]\n<br />[*]Каждый авто-подрыв объявляется локальным сообщением в чате — внезапный взрыв не останется загадкой.[/*]\n<br />[*]Отдельный тумблер (выкл. по умолчанию) распространяет его на капитанов и близнецов — выключен, потому что на них пёс не повисает: окно «на цели» — доли секунды, а войд-щит дополнительно режет взрыв.[/*]\n<br />[/list]\n<br />[size=6][b]Гейт зарядов: автоматика, уважающая ваши ресурсы[/b][/size]\n<br />\n<br />С талантом улучшенной метки приказы атаки тратят заряд боевой способности. Мод позволяет провести жёсткую черту, которую автоматика не пересечёт: целые заряды плюс точный процент сверху — пока запас ниже черты, авто-атака просто ждёт. Ваши аварийные заряды остаются вашими. Резерв — до пяти зарядов для билдов с доп. зарядами, а выбор большего, чем дают таланты, безвреден: порог ограничивается реальным максимумом. Опциональный оверрайд по дизейблерам обходит гейт, пока траппер в дистанции сети или собака в дистанции прыжка, — автоматическая мини-паника ровно против тех, кто заканчивает забеги.\n<br />\n<br />К Арбитру всё это не относится: приказы мастифа бесплатны. А на всё остальное есть клавиша паники — нажали, и череп атакует на всю, полностью игнорируя резерв: до повторного нажатия или на заданное время. Чат сообщает о включении и выключении.\n<br />\n<br />[size=6][b]Защита от демонхостов[/b][/size]\n<br />\n<br />Отдельная группа, независимая от приоритета боссов, покрывающая все три пути приказа: таблицу приоритетов, прицел-оверрайд и вашу собственную двойную метку.\n<br />\n<br />[list]\n<br />[*][b]Никогда не приказывать авто-атаку по демонхосту (вкл. по умолчанию).[/b] Демонхосты исключены из всех автоматических путей, включая прицел-оверрайд, который иначе игнорирует всю таблицу.[/*]\n<br />[*][b]Атаковать РАЗБУЖЕННОГО демонхоста (новое, дефолт 0 = никогда).[/b] Поставьте ползунок выше 0 — и уже разбуженный демонхост (его всё равно кто-то потревожил) становится обычной целью с этим приоритетом для ОБОИХ компаньонов, и прицел-оверрайд на нём тоже работает. Спящий по-прежнему не атакуется никогда, причём проверка ошибается в безопасную сторону: любое нечитаемое состояние считается сном. Демонхост, схвативший союзника, тогда считается и целью спасения для пса. Учтите: мастиф демонхоста не прижимает — один укус и отлетает, так что ползунок в основном для черепа.[/*]\n<br />[*][b]Блокировать ручные приказы (вкл. по умолчанию).[/b] Ваша двойная метка по демонхосту становится обычной меткой. Это единственный приказ, который нельзя отменить.[/*]\n<br />[*][b]Занимать компаньона (вкл. по умолчанию)[/b] — настоящее решение проблемы «кто-то разбудил демонхоста, и мой череп начал по нему стрелять». Отданный приказ прибивает компаньона к цели; собственный выбор целей игры срабатывает, только пока приказа НЕТ. Поэтому пока демонхост в радиусе наблюдения и в вашей таблице нет подходящей цели, мод приказывает компаньону атаковать ближайшего обычного потревоженного врага — никогда демонхоста и никогда взрывуна — только чтобы закрыть это окно.[/*]\n<br />[*][b]Мелкий шрифт настраивается:[/b] радиус наблюдения, реакция и на спящих (для прокрадывания), режим полной остановки автоматики рядом с демонхостом, отдельный интервал переприказов «занять», опциональный обход гейта для них и сообщение в чат при срабатывании защиты.[/*]\n<br />[/list]\n<br />[size=6][b]Помощники Медикэ-черепа[/b][/size]\n<br />\n<br />Спасение команды приказом лечения становится безболезненным:\n<br />\n<br />[list]\n<br />[*]Павшие союзники подсвечиваются ярко-зелёным силуэтом сквозь стены. Работает и у Арбитра — мастиф не воскрешает, но знать, кто упал, всё равно полезно. Союзники, до которых приказу лечения запрещено доходить, не подсвечиваются — подсветка не обещает воскрешения, от которого мод откажется.[/*]\n<br />[*]Пока вы держите блиц, прицел мягко доворачивается к ближайшему нуждающемуся союзнику — со скоростью и в конусе, которые вы задаёте, так что более близкий союзник за спиной не крутанёт вам камеру.[/*]\n<br />[*]Авто-запуск: как только прицел захватил валидного союзника, череп улетает сам. Один запуск за одно нажатие — контроль всегда у вас.[/*]\n<br />[*]Без потраченных впустую черепов: пока первый череп занят воскрешением, мод не даст даже начать прицеливание второго приказа.[/*]\n<br />[*]Приоритеты воскрешения по классам: когда упало несколько союзников, приказ выбирает класс с наибольшим приоритетом, а дистанция решает только при равенстве. Все ползунки стартуют с 50 — это в точности классическое поведение.[/*]\n<br />[*]Работа с ботами: «Воскрешать ботов только если нет упавших игроков» (вкл. по умолчанию) плюс жёсткий «Никогда не воскрешать ботов». Если приоритетного союзника вообще нельзя захватить прицелом, приказ отлипает через ~1.5 секунды и переходит к следующему.[/*]\n<br />[/list]\n<br />[size=6][b]Всё — настройка[/b][/size]\n<br />\n<br />В моде нет скрытого поведения: больше 120 тумблеров, ползунков и клавиш в девяти сворачиваемых секциях — пер-компаньонные выключатели под общим тумблером, две полные таблицы угроз, каждая дистанция и каждая защита, четыре клавиши (тумблер авто-атаки, приказ атаки, ближний бой, паника), чат-уведомления обо всём, что мод заблокировал или нажал, и режим отладки, проговаривающий каждое решение. Выключите всё — мод не делает ничего. Включите только подсветку — это крошечный UI-помощник. Включите всё — и ваш компаньон станет самым дисциплинированным тиммейтом в вашей жизни.\n<br />\n<br />[size=6][b]Честная игра[/b][/size]\n<br />\n<br />Мод не меняет урон, кулдауны, способности и поведение врагов. Он отправляет те же приказы компаньону, что игрок отправляет клавишей метки, с человеческой частотой и только по целям, которые вы могли бы увидеть и пометить сами, — плюс одно опциональное нажатие вашего же блица «Подрыв». Всё, что он читает — позиции врагов, кто кого держит, кто прижат и кто помечен, — игра и так реплицирует на ваш клиент для собственного HUD и геймплея. Мод полностью клиентский, тиммейтам он не нужен.\n<br />\n<br />[size=6][b]Требования[/b][/size]\n<br />\n<br />[list]\n<br />[*]Darktide Mod Framework и Darktide Mod Loader[/*]\n<br />[*]Персонаж класса Скитарий (сервочереп) или Адептус Арбитрес (кибермастиф)[/*]\n<br />[/list]"
