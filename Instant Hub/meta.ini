nexusDescription="[b]Instant Hub[/b]\n<br />\n<br />Instant Hub reduces transition times to the Mourningstar and the Psykanium / Meat Grinder by loading local game resources before Darktide's normal destination loaders need them.\n<br />\n<br />[b]How It Works[/b]\n<br />\n<br />Darktide loading consists of two broad parts: loading local packages from storage into memory, and backend, host, matchmaking, and network synchronization. Instant Hub moves much of the local package work into idle time and keeps selected resources warm. It cannot remove the network or server-side portion of a transition, so some loading time always remains.\n<br />\n<br />For the Mourningstar, the mod can preload the level, views and UI, HUD, game mode, player and companion breeds, and the selected operative's weapons, abilities, cosmetics, voice, particle, and decal resources. The active Mourningstar theme is loaded when Darktide identifies the destination's circumstance.\n<br />\n<br />The Meat Grinder preload normally starts after the Mourningstar has entered gameplay, but can also start when enabled during gameplay or when Meat Grinder is selected. It covers the level, default theme, mission views, HUD, game mode, and breed resources. Enabled caches are retained across gameplay transitions and released when their owning option is disabled, the mod is disabled or unloaded, or the game returns to the title state.\n<br />\n<br />When the selected operative or loadout changes, Instant Hub keeps shared profile packages and replaces only the resources that differ. The Mourningstar cache is independent and remains warm when switching between operatives while Mourningstar Caching is enabled.\n<br />\n<br />[b]Options[/b]\n<br />\n<br />- Mourningstar Caching: Keeps hub resources warm for faster returns after missions. Uses roughly 500 MB-1 GB of additional memory, plus current operative resources when applicable.\n<br />- Preload Hub at Character Select: Starts Mourningstar preloading after backend sync and loads the selected operative after the base hub preload completes.\n<br />- Preload Psykanium / Meat Grinder: Preloads and retains Meat Grinder resources, normally after the first Mourningstar load.\n<br />- Show Notifications: Controls status messages only and does not change loading behavior.\n<br />\n<br />Instant Hub trades memory and background I/O for shorter destination transitions. Disable Mourningstar or Psykanium caching if missions begin to stutter or the game runs out of memory.\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />\n<br />"
