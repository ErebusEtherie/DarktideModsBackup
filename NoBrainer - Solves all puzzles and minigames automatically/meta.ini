nexusDescription="[b]NoBrainer[/b] is a minigame assistant for Darktide. It highlights correct solutions and can automatically solve or assist with all minigames: Decode Symbols, Decode Search, Auspex Scan, Train Balance, Tree Drill, Frequency Matching. Each feature can be toggled individually so you can pick just the help you want. Performance is a priority, the mod adds negligible overhead.\n<br />\n<br />For each auto-solver, there is a mod option to set the speed between 1–5, where 1 is the average human solve speed and 5 is really fast. Default values are set to \"human\" speeds, but set them to values which suits you. \n<br />\n<br />Do not forget to disable other mods that solve or help in minigames as they will conflict with this mod. Check the changelog for update information!\n<br />\n<br />[b]Check changelog for latest updates[/b]\n<br />\n<br />\n<br />[b]CREDITS:[/b]\n<br />[list]\n<br />[*]Darktide Mod Framework (DMF) team for the modding infrastructure[/*]\n<br />[*]Aussiemon for his work with [url=https://github.com/Aussiemon/Darktide-Source-Code]source code[/url].[/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/757]Auspexhelper[/url] made by [url=https://www.nexusmods.com/profile/LAUR3HTE]LAUR3HTE[/url] inspired me to make this mod. Since Auspexhelper was not working or had severe performance issues I felt I had to fix them. Auspexhelper was never finished. My intention at first was just to create a functional version of Auspexhelper for myself. As the project grew larger I realized I had replaced the original code entirely and that NoBrainer was now a unique mod of its own. While we are on the subject of [url=https://www.nexusmods.com/profile/LAUR3HTE]LAUR3HTE[/url]. Look at the mods he/she created and you will realize what kind of potential LAUR3HTE has! I genuinely think he/she is the most talented mod maker of Darktide - on a completely different level than most of us. [/*]\n<br />[*][url=https://forums.nexusmods.com/profile/194277069-syuantsai/]SyuanTsai[/url] for making a traditional chinese translation which was added in 2.0.7.[/*]\n<br />[/list]"
