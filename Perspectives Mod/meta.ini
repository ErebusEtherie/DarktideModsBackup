nexusDescription="[b]Requires Darktide Mod Framework version 23.10.04 or later.[/b]\n<br />\n<br />Want to roam the hub in first person? Or play missions in third person? With this mod, you can change your default perspective and easily switch perspectives at the push of a button. You can also tell the mod to automatically switch perspectives when switching weapons, sprinting, using a charge/dash ability, etc.\n<br />\n<br />[b]You'll probably want some additional mods![/b]\n<br />Aiming effectively in 3rd person isn't really feasible; however, even attempting it is basically going to require my other mod [url=https://www.nexusmods.com/warhammer40kdarktide/mods/110]DynamicCrosshair[/url]﻿. By default, the crosshair is not indicative of where your character is actually aiming due to the fact that camera is offset from the center. This is solved by DynamicCrosshair, but will still generally be a bit clunky to aim with, particularly against close targets. This is an unavoidable fact of geometry. Alternatively, you can make aiming temporarily switch back to first-person.\n<br />\n<br />This mod includes a setting to fall back to a certain crosshair when using 3rd person perspective when there would otherwise be no crosshair. I highly recommend getting [url=https://www.nexusmods.com/warhammer40kdarktide/mods/253]Crosshair Remap Continued by deluxghost and unifyh[/url] if you want more configurability in that regard, as it allows you to select specific crosshairs for each weapon type. Additionally, Crosshair Remap contains modded crosshair templates; as long as Crosshair Remap is higher in the load order than Perspectives, Perspectives will also include those custom crosshairs as options for its 3rd person crosshair fallback setting.\n<br />\n<br />Spectating other players in 3rd person is a much better experience if you also get my other mod [url=https://www.nexusmods.com/warhammer40kdarktide/mods/115/]LookAround[/url]﻿.\n<br />\n<br />---\n<br />\n<br />Disclaimer:\n<br />Honestly playing the game in 3rd person is not great! Darktide was clearly designed to be played in first person, and this mod doesn't actually change any gameplay, so it's not a particularly polished experience. That said, it's still totally doable if you strongly prefer third person. Moving around in the hub in 1st person is similarly a little wonky. Again, this mod does not change gameplay, so you still move the same way you used to, just now in first person. You'll know what I mean when you try it.\n<br />\n<br />h/t [url=https://www.nexusmods.com/profile/wobin]wobin[/url] for the slab shield auto-switch\n<br />Simplified Chinese localization by [url=https://www.nexusmods.com/users/127776653]deluxghost[/url]\n<br />\n<br />[url=https://ko-fi.com/itsalxl][img]https://ko-fi.com/img/githubbutton_sm.svg[/img][/url]\n<br />\n<br />Source: [url=https://github.com/ItsAlxl/darktide-mods/tree/main/Perspectives]GitHub[/url]"
