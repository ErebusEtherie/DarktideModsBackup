nexusDescription="[b]Keep the heretics in sight—even when your strike team has other ideas.[/b]\n<br />Ever had an Ogryn fill your entire screen just as a Trapper lines up a net? Has a loyal Cyber-Mastiff decided that the best place to stand is directly inside your camera? Get Out of the Way makes nearby allies and supported companions fade as they approach your view, keeping the battlefield visible without changing gameplay.\n<br />\n<br />[b]Full transparency distance (m)[/b] — Default: 1\n<br />Allies and enabled companions become fully transparent at this distance or closer.\n<br />\n<br />[b]Fade start distance (m)[/b] — Default: 5\n<br />Allies and enabled companions begin fading when they enter this distance.\n<br />\n<br />[b]Vertical fade range (m)[/b] — Default: 5\n<br />Controls how far above or below the camera a unit may be and still fade.\n<br />\n<br />[b]Fade my Cyber-Mastiff[/b] — Default: On\n<br />Allows your own Cyber-Mastiff to fade.\n<br />\n<br />[b]Fade my Servo-Skull[/b] — Default: On\n<br />Allows your own Servo-Skull to fade.\n<br />\n<br />[b]Fade Ogryns only[/b] — Default: Off\n<br />When enabled, only allied Ogryn player characters fade. Allied companions are excluded, while your own companions continue to follow their individual settings.\n<br />\n<br />[b]Fade allied Cyber-Mastiffs[/b] — Default: On\n<br />Allows Cyber-Mastiffs owned by other players to fade.\n<br />\n<br />[b]Fade allied Servo-Skulls[/b] — Default: On\n<br />Allows Servo-Skulls owned by other players to fade.\n<br />\n<br />[b]Keep rescue targets visible[/b] — Default: On\n<br />Uses each eligible ally's native Darktide fade profile while they need rescuing, keeping them visible up close.\n<br />When an eligible ally—including bot teammates—is knocked down, netted, hanging from a ledge, or hogtied, they temporarily use Darktide's default fade distances. Your configured distances return after the rescue. If Fade Ogryns only is enabled, this applies only to Ogryns; non-Ogryn allies remain untouched.\n<br />\n<br />[b]Keep allies visible while holding support items[/b] — Default: On\n<br />While you are actively holding an Ammo Crate, Medical Crate, or one of the four standard Stims, eligible allied players temporarily use their own native Darktide fade profile. Switching back to another item immediately restores your configured fade distances, unless the ally still needs rescuing.\n<br />\n<br />[b]Prevent Own Player Fade[/b] — Default: Off\n<br />Keeps your own character fully visible instead of fading near the camera. Especially useful with third-person camera mods.\n<br />\n<br />[b]Important[/b]\n<br />This is a visual-only mod. It does not remove units, collision, hitboxes, or friendly bodies from the line of fire. A transparent Ogryn is still, very much, an Ogryn.\n<br />\n<br />[b]Credits[/b]\n<br />Original mod by WMA.\n<br />[url=https://www.nexusmods.com/warhammer40kdarktide/mods/416]https://www.nexusmods.com/warhammer40kdarktide/mods/416[/url]"
