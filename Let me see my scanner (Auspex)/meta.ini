nexusDescription="[b]Let Me See My Scanner[/b]\n<br />\n<br />Hides or fades your HUD when you use the auspex scanner so you can actually see what you're scanning. Only affects your own scanner, not other players.\n<br />\n<br />[b]What it does[/b]\n<br />\n<br />When you pull out your auspex, it automatically hides or fades stuff like your crosshair, stamina bar, ability icons, and buff bars. You can adjust how transparent things get and enable smooth fade transitions if you want. Text elements get completely hidden to prevent ghosting.\n<br />\n<br />[b]Settings[/b]\n<br />\n<br />- Transparency Amount: How see-through the HUD gets (0-1, default 0.3)\n<br />- Smooth Fade: Makes things fade in/out smoothly instead of instantly\n<br />- Fade Duration: How long the fade takes (0.05-2 seconds)\n<br />- Caption Opacity: How visible subtitles are while scanning (0-1)\n<br />[b]\n<br />Installation[/b]\n<br />\n<br />1. Install Darktide Mod Framework\n<br />2. Drop this mod in your mods folder\n<br />3. Configure in the mod menu\n<br />\n<br />Let me know any issues!\n<br />Thank you,\n<br />Maddy\n<br />\n<br />If you like my work, please donate!\n<br />[url=https://ko-fi.com/indicabunny]https://ko-fi.com/indicabunny[/url]"
