nexusDescription="[color=#d4d4d8][font=Arial Black][b][size=6][u]Custom Character Bots[/u][/size][/b][/font][/color]\n<br />[heading][color=#D4D4D8][size=5][u]Description[/u][/size][/color][/heading]\n<br />[color=#D4D4D8]Custom Character Bots replaces Darktide's default Solo Play bots with your own saved operatives. Instead of generic bot profiles, the mod loads characters from your account, caches them in the Charachter Select Screen, and swaps them into bot slots. When used with BetterBots, CCB supplies the character profiles while BetterBots handles all combat AI.[/color]\n<br />\n<br />[line]\n<br />[color=#D4D4D8][size=5][u][b]Installation[/b][/u][/size]\n<br />Requirements[/color]\n<br />\n<br />[list]\n<br />[*][color=#D4D4D8][url=https://www.nexusmods.com/warhammer40kdarktide/mods/19]Darktide Mod Loader[/url][/color][/*]\n<br />[*][color=#D4D4D8][url=https://www.nexusmods.com/warhammer40kdarktide/mods/8]Darktide Mod Framework (DMF)[/url][/color][/*]\n<br />[*][color=#D4D4D8][url=https://www.nexusmods.com/warhammer40kdarktide/mods/176]Solo Play[/url][/color][/*]\n<br />[*][color=#d4d4d8][url=https://www.nexusmods.com/warhammer40kdarktide/mods/745]BetterBots[/url][url=https://www.nexusmods.com/warhammer40kdarktide/mods/745][/url][/color][/*]\n<br />[*][b][color=#d4d4d8]Optional:[/color][/b] [url=https://www.nexusmods.com/warhammer40kdarktide/mods/183][/url][color=#ff7700][url=https://www.nexusmods.com/warhammer40kdarktide/mods/183]Tertium 4/[/url]5[/color][color=#d4d4d8] or [url=https://www.nexusmods.com/warhammer40kdarktide/mods/725]Tertium 6[/url][/color][/*]\n<br />[/list][color=#D4D4D8]Install with [b]Vortex[/b], or manually copy the[/color]\n<br />\n<br />[code]CustomCharacterBots[/code][color=#D4D4D8]folder into your Darktide[/color]\n<br />\n<br />[code]mods[/code][color=#D4D4D8]directory.\n<br />[b]Recommended load order:[/b][/color]\n<br />\n<br />[code]BetterBots\n<br />Tertium4Or5\n<br />CustomCharacterBots[/code][color=#D4D4D8]If you are not using Tertium, simply omit it. Keep Custom Character Bots below BetterBots so it can replace bot profiles after other mods initialise.[/color]\n<br />\n<br />[line]\n<br />[color=#D4D4D8][size=5][b][u]Main Features[/u][/b][/size][/color]\n<br />[list]\n<br />[*]Replaces Solo Play bots with your own saved characters.[/*]\n<br />[*]Automatically caches characters from character select, the Mourningstar, and other profile-service-ready screens.[/*]\n<br />[*]Supports up to three custom bot replacements.[/*]\n<br />[*]BetterBots plugin mode for improved AI behavior.[/*]\n<br />[*]Experimental player-like behavior and behavior learning, safely gated behind optional settings.[/*]\n<br />[*]Saved weapon loadout compatibility when not using BetterBots plugin mode.[/*]\n<br />[*]Host-only replacement for maximum stability.[/*]\n<br />[*]Optional bot voice and status callouts.[/*]\n<br />[*]Compatibility with Tertium 4/5 and Tertium 6.[/*]\n<br />[/list][u][color=#D4D4D8][size=5][b]Chat Commands[/b][/size][/color][/u]\n<br />[code]/ccb_profiles[/code][color=#D4D4D8]Lists all cached saved characters.[/color]\n<br />\n<br />[code]/ccb_status[/code][color=#D4D4D8]Displays CCB, BetterBots and Tertium compatibility status.[/color]\n<br />\n<br />[code]/ccb_bots[/code][color=#D4D4D8]Shows which active bots are supplied by CCB.[/color]\n<br />\n<br />[code]/ccb_reset[/code][color=#D4D4D8]Resets the bot replacement counter.[/color]\n<br />\n<br />[code]/ccb_debug[/code][color=#D4D4D8]Exports detailed debug information.[/color]\n<br />\n<br />[line]\n<br />[color=#D4D4D8][size=4][b][u]Requirements &amp; Notes[/u][/b][/size]\n<br />Custom Character Bots is designed primarily for [b]Solo Play[/b] and [b]locally hosted[/b] sessions. Public matchmaking uses Fatshark's dedicated servers, so bot profile replacement is currently expected to work only when you are the host.\n<br />For the best experience, install [b]BetterBots[/b] and leave [b]BetterBots Plugin Mode[/b] enabled. This allows BetterBots to control movement, combat, revives and abilities while CCB focuses solely on providing your custom characters.[/color]\n<br />\n<br />[line]\n<br />[color=#D4D4D8][size=5][b][u]Credits[/u][/b][/size]\n<br />Special thanks to:[/color]\n<br />\n<br />[list]\n<br />[*][color=#D4D4D8]The Darktide Mod Loader community[/color][/*]\n<br />[*][color=#D4D4D8]The Darktide Mod Framework community[/color][/*]\n<br />[*][color=#D4D4D8][b]hummat[/b] and all BetterBots contributors[/color][/*]\n<br />[*][color=#D4D4D8][b]Aussiemon[/b] for the public Darktide Lua script reference[/color][/*]\n<br />[*][color=#D4D4D8]Everyone who tested the mod and helped shape its development[/color][/*]\n<br />[/list]"
