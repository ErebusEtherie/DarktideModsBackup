nexusDescription="[center][b][color=#660000]Me Securum Facio[/color][/b][/center]\n<br />[heading]Reliable actions, responsive movement and configurable input protection[/heading]\n<br />MeSecurumFacio is an independently designed and independently written quality-of-life mod for Warhammer 40,000: Darktide.\n<br />Its purpose is to make player intentions more dependable when actions are interrupted, delayed or rejected by short combat-state transitions. It combines action recovery, movement controls and conservative safety features in one configurable package.\n<br />The entire implementation was created from scratch in Lua by [b]Eduardo do Carmo[/b], also known as [b]TioKill[/b] and [b]sicarios[/b] in Darktide. It is not a fork, port, modified copy or redistribution of another mod.\n<br />\n<br />[line]\n<br />[heading]Main features[/heading]\n<br />Action recovery\n<br />MeSecurumFacio can remember eligible inputs that Darktide was temporarily unable to execute and retry them when the player returns to a valid state.\n<br />Supported action categories include:\n<br />[list]\n<br />[*]Combat ability activation[/*]\n<br />[*]Weapon special actions[/*]\n<br />[*]Reload attempts[/*]\n<br />[*]Weapon changes[/*]\n<br />[*]Blitz selection[/*]\n<br />[*]Selected equipment transitions[/*]\n<br />[/list]The system uses short and controlled retry windows. It does not continuously force actions, create automated combat sequences or play the game for the user.\n<br />Weapon-change queue\n<br />Weapon changes made during short action restrictions can be retained and processed when the transition becomes valid.\n<br />You can configure:\n<br />[list]\n<br />[*]Whether weapon changes are queued[/*]\n<br />[*]The maximum number of queued selections[/*]\n<br />[*]Whether quick Blitz selections are included[/*]\n<br />[/list]The queue is deliberately limited to avoid stale or unexpected inputs.\n<br />Ability intent recovery\n<br />When enabled, a combat ability input can be remembered briefly if activation was rejected because the character was still completing another action.\n<br />Additional controls can prevent undesirable input conflicts, including:\n<br />[list]\n<br />[*]Ignoring repeated ability inputs while the ability is already active[/*]\n<br />[*]Ignoring sprint requests during ability activation[/*]\n<br />[*]Preventing held ability input from being treated as repeated activation attempts[/*]\n<br />[/list]This feature cannot override cooldowns, disabled states, server validation or class-specific restrictions.\n<br />Special-action and reload recovery\n<br />The mod can preserve valid special-action and reload intentions through short action transitions.\n<br />Priority controls are available for situations where multiple actions share related states:\n<br />[list]\n<br />[*]Block can take priority over a melee special action[/*]\n<br />[*]Aim-down-sights can take priority over a ranged special action[/*]\n<br />[/list]These options help avoid an automatic retry selecting an action that no longer matches the player’s immediate intention.\n<br />[line]\n<br />[heading]Movement Flow[/heading]\n<br />MeSecurumFacio includes an original movement-control layer designed to make sprint, dodge, slide, crouch and vault inputs more consistent.\n<br />Sprint styles\n<br />The Mod Options menu provides several sprint behaviors:\n<br />[list]\n<br />[*][b]Persistent:[/b] Keeps sprint intent active through compatible movement transitions.[/*]\n<br />[*][b]Always:[/b] Automatically requests sprint whenever its conditions are satisfied.[/*]\n<br />[*][b]Toggle:[/b] Press the sprint key to enable or disable sprint intent.[/*]\n<br />[*][b]Hold:[/b] Sprint only while the sprint key is held.[/*]\n<br />[*][b]Hold-to-Walk:[/b] Sprint is the normal forward movement state; hold the configured input to walk.[/*]\n<br />[*][b]Off:[/b] Disables MeSecurumFacio’s sprint processing.[/*]\n<br />[*][b]Custom:[/b] Allows individual advanced movement options to be configured manually.[/*]\n<br />[/list]Persistent is the recommended starting mode for most players.\n<br />Advanced sprint controls\n<br />Custom controls include:\n<br />[list]\n<br />[*]Keep sprint intent during compatible transitions[/*]\n<br />[*]Sprint while moving forward[/*]\n<br />[*]Use the sprint key as an intent toggle[/*]\n<br />[*]Sprint only while the key is held[/*]\n<br />[*]Sprint by default with a hold-to-walk behavior[/*]\n<br />[*]Convert the dodge input into a slide while sprinting[/*]\n<br />[*]Pause automatic sprint requests when stamina needs to recover[/*]\n<br />[/list]Dodge and slide controls\n<br />Optional movement refinements include:\n<br />[list]\n<br />[*]Shared-key filtering for jump and dodge[/*]\n<br />[*]Allowing dodge while sprinting[/*]\n<br />[*]Converting a second dodge tap into a slide[/*]\n<br />[*]Holding dodge to continue into a slide[/*]\n<br />[*]Controlled held-input repetition[/*]\n<br />[/list]All movement options remain subject to Darktide’s normal stamina, state, collision and server rules.\n<br />Crouch and vault behavior\n<br />The mod also provides:\n<br />[list]\n<br />[*]A configurable smart crouch toggle[/*]\n<br />[*]Optional vault continuation while airborne[/*]\n<br />[/list]These options are intended to reduce awkward input transitions without removing the game’s movement restrictions.\n<br />[line]\n<br />[heading]Edge Safety[/heading]\n<br />MeSecurumFacio includes configurable, conservative checks intended to reduce accidental movement toward dangerous drops.\n<br />Available checks include:\n<br />[list]\n<br />[*]Jump edge checks[/*]\n<br />[*]Dodge edge checks[/*]\n<br />[*]Dash edge checks[/*]\n<br />[*]Optional safety notification[/*]\n<br />[*]Configurable jump and dodge check distance[/*]\n<br />[*]Configurable dash check distance[/*]\n<br />[*]Configurable dangerous-drop threshold[/*]\n<br />[/list]The safety system is intentionally fail-safe. When the mod cannot obtain enough reliable information about the terrain, it should avoid making aggressive movement corrections.\n<br />Edge Safety is assistance, not a guarantee. Darktide’s terrain, moving geometry, latency, abilities and server-authoritative movement can produce situations that a client-side Lua mod cannot predict.\n<br />The mod does not provide noclip, teleportation, collision removal or immunity to falls.\n<br />[line]\n<br />[heading]Enemy collision and mobility limitations[/heading]\n<br />MeSecurumFacio does not remove enemy collision and does not force the player through enemies.\n<br />Being physically surrounded or pinned by enemies is part of Darktide’s gameplay and is controlled by the game and server. The mod can improve how eligible movement inputs are interpreted, but it cannot safely bypass server-authoritative collision or reposition the character illegally.\n<br />[line]\n<br />[heading]Configuration[/heading]\n<br />Every gameplay feature can be enabled, disabled or adjusted through Darktide Mod Framework’s Mod Options menu.\n<br />The menu is organized into clear sections:\n<br />[list]\n<br />[*]General[/*]\n<br />[*]Action Flow[/*]\n<br />[*]Movement Flow[/*]\n<br />[*]Edge Safety[/*]\n<br />[*]Diagnostics[/*]\n<br />[/list]Presets provide a quick starting point, while advanced controls allow each behavior to be adjusted separately.\n<br />If you are unsure where to begin, use the recommended defaults and change only the behaviors you personally want.\n<br />Runtime status\n<br />The configuration menu includes a runtime-status action that reports the current state of the mod and its active systems. This can help when diagnosing configuration or compatibility problems.\n<br />Diagnostics\n<br />Optional diagnostic messages are available for:\n<br />[list]\n<br />[*]Edge-check failures[/*]\n<br />[*]Ability recovery[/*]\n<br />[*]Weapon-action recovery[/*]\n<br />[*]Equipment recovery[/*]\n<br />[*]Movement processing[/*]\n<br />[/list]Diagnostic logging is disabled during normal use unless explicitly enabled. It is primarily intended for bug reports and troubleshooting.\n<br />[line]\n<br />[heading]Languages[/heading]\n<br />English is the primary and fallback language.\n<br />The Mod Options menu includes complete localization support for:\n<br />[list]\n<br />[*]English[/*]\n<br />[*]Brazilian Portuguese[/*]\n<br />[*]Spanish[/*]\n<br />[*]French[/*]\n<br />[*]Simplified Chinese[/*]\n<br />[*]Traditional Chinese[/*]\n<br />[*]Japanese[/*]\n<br />[*]Korean[/*]\n<br />[*]Russian[/*]\n<br />[*]German[/*]\n<br />[/list]The language can be selected directly from the mod menu. Reloading the menu or restarting the game may be necessary after changing languages.\n<br />If you find a translation that is unclear or unnatural, please report the exact option and language so it can be reviewed.\n<br />[line]\n<br />[heading]Installation[/heading]\n<br />Vortex\n<br />[list=1]\n<br />[*]Download the main archive.[/*]\n<br />[*]Install it through Vortex.[/*]\n<br />[*]Enable and deploy the mod.[/*]\n<br />[*]Confirm that the resulting folder is named\n<br />[code]MeSecurumFacio[/code].[/*]\n<br />[*]Launch Darktide through your normal modded setup.[/*]\n<br />[*]Open Mod Options and configure MeSecurumFacio.[/*]\n<br />[/list]Manual installation\n<br />[list=1]\n<br />[*]Install Darktide Mod Loader.[/*]\n<br />[*]Install Darktide Mod Framework.[/*]\n<br />[*]Extract the\n<br />[code]MeSecurumFacio[/code]folder into:\n<br />[code]Warhammer 40,000 DARKTIDE/mods/[/code][/*]\n<br />[*]Add\n<br />[code]MeSecurumFacio[/code]to\n<br />[code]mod_load_order.txt[/code].[/*]\n<br />[*]Start the game and open the Mod Options menu.[/*]\n<br />[/list]Do not place an additional nested\n<br />[code]MeSecurumFacio[/code]folder inside the main mod directory.\n<br />[line]\n<br />[heading]Requirements[/heading]\n<br />[list]\n<br />[*]Warhammer 40,000: Darktide[/*]\n<br />[*]Darktide Mod Loader[/*]\n<br />[*]Darktide Mod Framework[/*]\n<br />[/list]Vortex is optional and is only used as an installation manager.\n<br />[line]\n<br />[heading]Compatibility[/heading]\n<br />MeSecurumFacio is a client-side quality-of-life mod.\n<br />It does not intentionally modify:\n<br />[list]\n<br />[*]Damage[/*]\n<br />[*]Enemy health[/*]\n<br />[*]Weapon statistics[/*]\n<br />[*]Cooldowns[/*]\n<br />[*]Mission rewards[/*]\n<br />[*]Item acquisition[/*]\n<br />[*]Server-authoritative gameplay rules[/*]\n<br />[/list]Mods that intercept the same input, sprint, dodge, jump, reload, ability or weapon-selection functions may conflict with MeSecurumFacio. When troubleshooting, disable overlapping movement or action-recovery mods first.\n<br />[line]\n<br />[heading]Original development and conceptual inspiration[/heading]\n<br />MeSecurumFacio is a [b]100% independently authored implementation[/b].\n<br />The idea was developed after observing the purpose and user-facing behavior of the Guarantee series by [b]KamiUnitY[/b], including:\n<br />[list]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/331]Guarantee Weapon Swap[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/336]Guarantee Ability Activation[/url][/*]\n<br />[*][url=https://www.nexusmods.com/warhammer40kdarktide/mods/351]Guarantee Special Action[/url][/*]\n<br />[/list]Those mods demonstrated a useful quality-of-life objective: helping intended actions survive short gameplay interruptions.\n<br />No source code, internal tables, assets, localization text or implementation details from those mods were copied, imported or redistributed. MeSecurumFacio’s architecture, naming, configuration system, recovery logic, movement integration, safety features and localization were developed independently.\n<br />This is not a replacement release, continuation or derivative distribution of KamiUnitY’s work. The Guarantee series is acknowledged here as conceptual inspiration and as part of the Darktide modding context.\n<br />The human-readable Lua files are included in the mod package. Any developer with a specific authorship or implementation concern is welcome to inspect the code and contact me with the relevant details.\n<br />[line]\n<br />[heading]Credits and acknowledgements[/heading]\n<br />Created by:\n<br />[b]Eduardo do Carmo[/b]\n<br />[b]TioKill[/b]\n<br />[b]sicarios in Darktide[/b]\n<br />Special thanks to my friends [b]Chio[/b] and [b]Potty[/b], whose conversations and suggestions helped inspire the creation of this mod.\n<br />Conceptual acknowledgement to [b]KamiUnitY[/b] for the Guarantee series and its contribution to Darktide’s quality-of-life modding ecosystem.\n<br />Thanks to the Darktide Mod Loader and Darktide Mod Framework developers, and to the wider Darktide modding community for the tools and documentation that make client-side mods possible.\n<br />[line]\n<br />[heading]Bug reports[/heading]\n<br />When reporting a problem, please include:\n<br />[list]\n<br />[*]MeSecurumFacio version[/*]\n<br />[*]Darktide Mod Framework version[/*]\n<br />[*]Selected sprint style[/*]\n<br />[*]Relevant enabled options[/*]\n<br />[*]Character class and ability[/*]\n<br />[*]Whether the problem occurred in the Psykhanium or a live mission[/*]\n<br />[*]Steps required to reproduce it[/*]\n<br />[*]Relevant log lines with diagnostic logging enabled[/*]\n<br />[/list]Please distinguish between a repeatable mod error and a movement request rejected by normal game or server rules.\n<br />[line]\n<br />[heading]Final note[/heading]\n<br />MeSecurumFacio is designed to preserve player intention—not to automate gameplay.\n<br />Every system is configurable, optional and limited by Darktide’s normal rules. The goal is a cleaner and more dependable control experience while keeping the game’s combat, movement and challenge intact.\n<br />"
